
<div class="admin-topbar">
  <div class="admin-search">
    <span>🔍</span>
    <input
      id="adminGlobalSearch"
      placeholder="Search AnyBike admin — customer, bike, buyer, invoice, container..."
    >
  </div>

  <div class="admin-actions">
    <button
      class="admin-bell"
      type="button"
      onclick="toggleAdminNotifications()"
      aria-label="Admin notifications"
    >
      🔔
      <span class="admin-bell-count" id="adminNotificationCount">0</span>
    </button>

    <details class="admin-profile-menu">
      <summary class="admin-profile">
        Andy Gifford
        <span aria-hidden="true">⌄</span>
      </summary>

      <div class="admin-profile-dropdown">
        <div class="admin-profile-dropdown-head">
          <strong>Andy Gifford</strong>
          <small>AnyBike Admin</small>
        </div>

        <a href="/admin-dashboard.html">Admin Dashboard</a>
        <a href="/customer-dashboard.html" target="_blank" rel="noopener">
          Open Customer Site
        </a>

        <button
          type="button"
          class="admin-logout-button"
          onclick="(async function(){
            try{
              if(typeof sb !== 'undefined' && sb?.auth){
                await sb.auth.signOut();
              }
            }catch(error){
              console.warn('Admin logout failed',error);
            }

            window.location.href='/';
          })()"
        >
          Log Out
        </button>
      </div>
    </details>
  </div>

  <div class="admin-notification-panel" id="adminNotificationPanel">
    <div class="admin-notification-head">
      <strong>Admin Notifications</strong>
      <small id="adminNotificationStatus">Live</small>
    </div>

    <div class="admin-notification-list" id="adminNotificationList">
      <div class="admin-notification-item">
        <strong>No notifications yet</strong>
        <small>Admin alerts will appear here.</small>
      </div>
    </div>
  </div>
</div>

<style>
.admin-profile-menu{
  position:relative;
}

.admin-profile-menu summary{
  list-style:none;
}

.admin-profile-menu summary::-webkit-details-marker{
  display:none;
}

.admin-profile{
  display:flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
  user-select:none;
}

.admin-profile-dropdown{
  position:absolute;
  top:calc(100% + 12px);
  right:0;
  width:230px;
  padding:10px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:16px;
  background:#111;
  box-shadow:0 22px 60px rgba(0,0,0,.55);
  z-index:9999;
}

.admin-profile-dropdown-head{
  display:grid;
  gap:3px;
  padding:10px 11px 12px;
  border-bottom:1px solid rgba(255,255,255,.10);
  margin-bottom:6px;
}

.admin-profile-dropdown-head small{
  color:#999;
}

.admin-profile-dropdown a,
.admin-logout-button{
  width:100%;
  display:block;
  padding:11px 12px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#fff;
  text-align:left;
  text-decoration:none;
  font-weight:800;
  cursor:pointer;
}

.admin-profile-dropdown a:hover,
.admin-logout-button:hover{
  background:#1d1d1d;
}

.admin-logout-button{
  color:#ff6b70;
  border-top:1px solid rgba(255,255,255,.10);
  border-radius:0 0 10px 10px;
  margin-top:6px;
}
</style>
