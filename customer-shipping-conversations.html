<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shipping Conversations | AnyBike</title><meta name="robots" content="noindex,nofollow"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="/public-header.css?v=12006"><style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:Arial,Helvetica,sans-serif}.wrap{width:min(96vw,1500px);margin:auto;padding:30px 0 70px}.layout{display:grid;grid-template-columns:340px 1fr;gap:14px}.card{background:#111;border:1px solid #292929;border-radius:16px;padding:16px}.thread{padding:13px;border:1px solid #2b2b2b;border-radius:11px;margin-bottom:8px;cursor:pointer}.thread.active{border-color:#ed1c24}.thread small{display:block;margin-top:6px;color:#aaa}.messages{min-height:430px;max-height:none;overflow:visible;display:flex;flex-direction:column;gap:10px}.msg{max-width:78%;padding:12px 14px;border-radius:12px;background:#222}.msg.Customer{align-self:flex-start;background:#fff;color:#111;border:1px solid #ddd} .msg.Customer small{color:#666}.msg.AnyBike{align-self:flex-start;background:#ed1c24;color:#fff;border:1px solid #ed1c24}.msg b{display:block;margin-bottom:6px}.msg small{display:block;margin-top:7px;color:#aaa}.composer{display:flex;gap:8px;margin-top:12px}textarea{flex:1;min-height:80px;background:#080808;color:#fff;border:1px solid #333;border-radius:10px;padding:10px}.btn{background:#ed1c24;color:#fff;border:0;border-radius:999px;padding:10px 16px;font-weight:900;cursor:pointer}@media(max-width:800px){.layout{grid-template-columns:1fr}.messages{min-height:320px}}
.messages .msg{align-self:flex-start;max-width:min(100%,900px);width:fit-content;min-width:200px;overflow-wrap:anywhere} .messages{align-items:flex-start}</style></head><body><div id="publicHeader"></div><div class="wrap"><h1>Shipping Conversations</h1><p style="color:#aaa">Your conversations with shipping companies introduced by AnyBike.</p><div class="layout"><div class="card"><div id="threads"></div></div><div class="card"><h2 id="title">Select a conversation</h2><div style="margin-bottom:12px;display:flex;gap:10px;align-items:center"><small id="liveState" style="color:#aaa">Checking replies…</small><button type="button" class="btn" id="refreshMessages" style="background:#333">Refresh messages</button></div><div id="linkedPurchases" style="display:none;margin:0 0 14px;padding:12px;border:1px solid #333;border-radius:10px;background:#0b0b0b"></div><div id="messages" class="messages"></div><div class="composer"><textarea id="reply" placeholder="Write a reply…"></textarea><button class="btn" id="send">Send</button></div><div id="status"></div></div></div></div><script src="/public-header.js?v=12006"></script><script>
const sb=supabase.createClient("https://tuehtnezhdnkqbbhttgp.supabase.co","sb_publishable_mrkBKDxEPVmdj2n7gPWsbg_l4CShtcK");let current=null,list=[];
async function load(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href="/customer-login.html?return="+encodeURIComponent(location.pathname+location.search);return}const {data,error}=await sb.rpc("customer_get_shipping_conversations_v1");if(error){threads.textContent="Unable to load conversations. Please refresh or contact AnyBike.";return}list=data||[];threads.innerHTML=list.map(x=>'<div class="thread" data-id="'+x.id+'"><b>'+esc(x.shipper_name)+'</b><small>'+esc(x.destination_country)+' · '+esc(x.status)+'</small></div>').join("")||'<p>No shipping conversations yet.</p>';threads.querySelectorAll(".thread").forEach(el=>el.onclick=()=>open(Number(el.dataset.id)));const wanted=Number(new URLSearchParams(location.search).get("conversation")||0);if(wanted&&list.some(x=>Number(x.id)===wanted)){open(wanted)}else if(list.length){open(Number(list[0].id))}}
async function open(id,quiet=false){
  if(!list.some(x=>Number(x.id)===id))return;
  current=id;
  document.querySelectorAll(".thread").forEach(x=>x.classList.toggle("active",Number(x.dataset.id)===id));
  const t=list.find(x=>Number(x.id)===id);
  title.textContent=t?t.shipper_name+" · "+t.destination_country:"Shipping Conversation";
  if(t && Array.isArray(t.linked_purchases) && t.linked_purchases.length){
    linkedPurchases.style.display="block";
    linkedPurchases.innerHTML='<strong style="display:block;margin-bottom:6px">Linked AnyBike purchases</strong>'+t.linked_purchases.map(p=>'<div>'+esc(p.deal_number)+' — '+esc(p.motorcycle)+' — Reg: '+esc(p.registration||"not recorded")+'</div>').join("");
  }else{linkedPurchases.style.display="none";linkedPurchases.innerHTML="";}
  if(!quiet) messages.innerHTML='<div style="color:#999">Loading conversation…</div>';
  if(!quiet) status.textContent="";
  const {data,error}=await sb.rpc("customer_get_shipping_messages_v1",{p_enquiry_id:id});
  if(error){
    messages.innerHTML='<div style="color:#ff8a8f">Conversation could not be loaded.</div>';
    status.textContent=error.message||"Conversation could not be loaded.";
    return;
  }
  liveState.textContent="Last checked "+new Date().toLocaleTimeString()+" · "+(data||[]).length+" messages";
  messages.innerHTML=(data||[]).length
    ? (data||[]).map(m=>'<div class="msg '+m.sender_type+'"><b>'+esc(m.sender_name||m.sender_type)+'</b>'+esc(m.message)+'<small>'+new Date(m.created_at).toLocaleString()+'</small></div>').join("")
    : '<div style="color:#999">No messages have been added to this conversation yet.</div>';
  if(!quiet) messages.scrollTop=messages.scrollHeight;
}
send.onclick=async()=>{if(!current||!reply.value.trim())return;send.disabled=true;const {data,error}=await sb.functions.invoke("send-shipping-conversation-message",{body:{enquiry_id:current,message:reply.value.trim(),mode:"customer"}});send.disabled=false;if(error||data?.error){status.textContent=data?.error||error.message;return}reply.value="";await open(current)}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}refreshMessages.onclick=load;load();setInterval(()=>{if(current&&!document.hidden)load()},5000);</script></body></html>
