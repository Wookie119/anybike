<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Motorcycle Brand Guide | AnyBike</title>
<meta name="description" content="Explore UK motorcycles by manufacturer, popular models and motorcycles currently available through AnyBike.">
<meta name="robots" content="index,follow">
<link rel="canonical" id="canonicalLink" href="https://www.anybike.co.uk/motorcycle-brand.html">
<link rel="stylesheet" href="/public-header.css?v=12021">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--red:#ed1c24;--bg:#080808;--panel:#111;--line:rgba(255,255,255,.12);--muted:#aaa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,Helvetica,sans-serif}a{color:inherit;text-decoration:none}
main{width:min(1500px,94vw);margin:auto;padding:52px 0 70px}.eyebrow{color:var(--red);font-weight:950;text-transform:uppercase;letter-spacing:.12em;font-size:12px}
h1{font-size:clamp(40px,6vw,72px);margin:8px 0 12px;line-height:.98}p{color:var(--muted);line-height:1.55}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:24px}
.card{display:block;border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:18px}.card:hover{border-color:var(--red)}.card strong{font-size:20px}.card span{display:block;color:#aaa;margin-top:7px}
.stock{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:18px}.bike{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#111}.bike img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#eee}.copy{padding:16px}.copy h3{margin:0 0 8px}.price{font-size:22px;font-weight:950;margin-top:9px}.section{margin-top:42px}.btn{display:inline-block;margin-top:18px;background:var(--red);padding:12px 16px;border-radius:999px;font-weight:950}
</style>
</head>
<body>
<header id="publicHeader"></header>
<main>
  <div class="eyebrow">AnyBike Manufacturer Guide</div>
  <h1 id="title">Motorcycle brand</h1>
  <p id="intro">Explore models and motorcycles currently available from this manufacturer in the United Kingdom.</p>
  <div id="models" class="grid"></div>
  <section class="section"><h2>Motorcycles currently available</h2><div id="stock" class="stock"></div><a id="allStock" class="btn" href="/available-stock.html">View all stock</a></section>
</main>
<script>
const sb=supabase.createClient("https://tuehtnezhdnkqbbhttgp.supabase.co","sb_publishable_mrkBKDxEPVmdj2n7gPWsbg_l4CShtcK");
const params=new URLSearchParams(location.search);const make=(params.get("make")||"").trim();
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(v){return window.AnyBikeCurrency?.formatGBP?window.AnyBikeCurrency.formatGBP(v):"£"+Number(v||0).toLocaleString("en-GB")}
async function load(){
 if(!make){document.getElementById("title").textContent="Motorcycle manufacturers";return}
 document.title=make+" Motorcycles from the UK | AnyBike";
 document.querySelector('meta[name="description"]').content="Explore "+make+" motorcycles, models and current UK stock available through AnyBike.";
 document.getElementById("canonicalLink").href="https://www.anybike.co.uk/motorcycle-brand.html?make="+encodeURIComponent(make);
 document.getElementById("title").textContent=make+" Motorcycles";
 document.getElementById("intro").textContent="Explore "+make+" models attracting buyer interest and motorcycles currently available in the United Kingdom.";
 document.getElementById("allStock").href="/available-stock.html?make="+encodeURIComponent(make);
 const {data,error}=await sb.from("public_available_stock").select("id,make,model,variant,year,mileage,price_gbp,image_url").eq("make",make).order("year",{ascending:false}).limit(80);
 if(error)throw error; const rows=data||[];
 const models=[...new Set(rows.map(x=>x.model).filter(Boolean))].sort();
 document.getElementById("models").innerHTML=models.length?models.map(model=>'<a class="card" href="/motorcycle-model.html?make='+encodeURIComponent(make)+'&model='+encodeURIComponent(model)+'"><strong>'+esc(model)+'</strong><span>View '+esc(make)+' '+esc(model)+' guide →</span></a>').join(""):'<div class="card"><strong>Model pages are building</strong><span>AnyBike will add models as stock and demand data grows.</span></div>';
 document.getElementById("stock").innerHTML=rows.slice(0,12).map(b=>'<a class="bike" href="/bike-details.html?id='+encodeURIComponent(b.id)+'"><img src="'+esc((b.image_url||"/anybike-logo-new.jpg").replace("{resize}","w800"))+'" onerror="this.src=\'/anybike-logo-new.jpg\'"><div class="copy"><h3>'+esc([b.year,b.make,b.model,b.variant].filter(Boolean).join(" "))+'</h3><div>'+esc(b.mileage?Number(b.mileage).toLocaleString("en-GB")+" miles":"Mileage on request")+'</div><div class="price" data-price-gbp="'+esc(b.price_gbp)+'">'+esc(money(b.price_gbp))+'</div></div></a>').join("");
}
load().catch(e=>{document.getElementById("models").innerHTML='<div class="card">Could not load this manufacturer.</div>'});
</script>
<script src="/public-header.js?v=12021"></script>
</body></html>
