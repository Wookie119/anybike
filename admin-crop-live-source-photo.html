<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMW Photo Crop | AnyBike Admin</title><meta name="robots" content="noindex"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin.js?v=12001"></script><style>body{background:#080808;color:white;font:16px Arial;margin:0}main{max-width:1150px;margin:24px auto;padding:20px}a,button{color:white;border:1px solid #555;background:#242424;border-radius:8px;padding:12px 16px;cursor:pointer;display:inline-block;text-decoration:none}button.red{background:#ed1c24;border-color:#ed1c24}canvas{width:100%;height:auto;touch-action:none;cursor:crosshair;background:#161616}.photo{border:1px solid #444;padding:10px;border-radius:9px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}#status{padding:12px 0}</style></head><body><main><a href="/admin-live-source-hub.html">← Live Source Hub</a><h1>Crop approved BMW photo</h1><p>Drag a box around the area you want to KEEP. Exclude the unwanted lettering. This saves one new approved photograph and preserves the original.</p><div class="photo"><canvas id="cv"></canvas></div><div class="actions"><button id="reset">Reset selection</button><button class="red" id="save" disabled>Save cropped photo</button><a target="_blank" rel="noopener" id="original">Open current photo ↗</a></div><p id="status">Loading photo…</p></main><script>
const id=Number(new URLSearchParams(location.search).get('item')),cv=document.getElementById('cv'),ctx=cv.getContext('2d'),st=document.getElementById('status');let client,img,selection,point;
const draw=()=>{if(!img)return;ctx.drawImage(img,0,0,cv.width,cv.height);if(selection){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,cv.width,cv.height);ctx.clearRect(selection.x,selection.y,selection.w,selection.h);ctx.drawImage(img,selection.x,selection.y,selection.w,selection.h,selection.x,selection.y,selection.w,selection.h);ctx.strokeStyle='#ed1c24';ctx.lineWidth=4;ctx.strokeRect(selection.x,selection.y,selection.w,selection.h);}};
const position=e=>{const r=cv.getBoundingClientRect();return{x:Math.max(0,Math.min(cv.width,(e.clientX-r.left)*cv.width/r.width)),y:Math.max(0,Math.min(cv.height,(e.clientY-r.top)*cv.height/r.height))};};
cv.addEventListener('pointerdown',e=>{if(!img)return;point=position(e);cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!point)return;const p=position(e);selection={x:Math.min(point.x,p.x),y:Math.min(point.y,p.y),w:Math.abs(point.x-p.x),h:Math.abs(point.y-p.y)};draw();});
cv.addEventListener('pointerup',()=>{point=null;draw();});
document.getElementById('reset').onclick=()=>{selection=null;draw();};
async function call(body){const r=await client.functions.invoke('admin-crop-live-source-photo',{body:{item_id:id,...body}});if(r.error)throw r.error;if(r.data?.error)throw Error(r.data.error);return r.data;}
async function display(url){const photo=new Image();photo.crossOrigin='anonymous';photo.onload=()=>{img=photo;cv.width=photo.naturalWidth;cv.height=photo.naturalHeight;selection=null;draw();st.textContent='Drag on the photo to keep the motorcycle and exclude the wording.';document.getElementById('save').disabled=false;};photo.onerror=()=>st.textContent='Image access blocked; the original has not changed.';photo.src=url;document.getElementById('original').href=url;}
async function init(){try{client=getAdminSupabaseClient();const r=await call({action:'read'});await display(r.url);}catch(e){st.textContent='Could not open approved photo: '+e.message;}}init();
document.getElementById('save').onclick=async()=>{if(!selection||selection.w<100||selection.h<100){st.textContent='Select the area to keep first.';return;}const out=document.createElement('canvas');out.width=Math.floor(selection.w);out.height=Math.floor(selection.h);out.getContext('2d').drawImage(img,selection.x,selection.y,selection.w,selection.h,0,0,out.width,out.height);if(!confirm('Save this crop as the buyer-facing photograph? Original stays stored.'))return;const b=document.getElementById('save');b.disabled=true;st.textContent='Saving photo…';try{const r=await call({action:'save',image:out.toDataURL('image/jpeg',.88)});await display(r.url);st.textContent='Crop saved successfully ✓';}catch(e){st.textContent='Save failed: '+e.message;}finally{b.disabled=false;}};
</script></body></html>
