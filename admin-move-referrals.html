<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Move Motorcycles Referrals | AnyBike Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{background:#090909;color:#fff;font:14px Arial}main{max-width:1500px;margin:auto;padding:24px}a{color:white}.panel{background:#151515;border:1px solid #444;border-radius:12px;padding:18px;overflow:auto}input{padding:12px;width:min(580px,100%);background:#111;border:1px solid #555;color:white;border-radius:8px}table{width:100%;border-collapse:collapse;min-width:760px}td,th{padding:13px;border-bottom:1px solid #333;text-align:left}.muted{color:#bbb}.tag{color:#8be4a8}</style></head><body><main><a href="/admin-trade-auction-recipients.html">← Dealer Admin</a><h1>Move Motorcycles · Dealer Referrals</h1><p class="muted">Dealerships that have explicitly requested an introduction. This list does not create Move accounts or send messages.</p><input id="search" type="search" placeholder="Search dealership or dealer number…"><p id="status" role="status">Loading referrals…</p><div class="panel"><table><thead><tr><th>Dealership</th><th>Contact email</th><th>Telephone</th><th>Requested</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>(async()=>{const sb=supabase.createClient('https://tuehtnezhdnkqbbhttgp.supabase.co','sb_publishable_mrkBKDxEPVmdj2n7gPWsbg_l4CShtcK',{auth:{storageKey:'anybike-admin-auth',persistSession:true,autoRefreshToken:true}});const rows=document.getElementById('rows'),status=document.getElementById('status'),input=document.getElementById('search');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));const {data,error}=await sb.rpc('admin_list_move_dealer_referrals_v1');if(error){status.textContent='Admin permission required or referrals unavailable: '+error.message;return;}const records=data||[];function render(){const q=input.value.trim().toLowerCase();const list=records.filter(x=>(x.dealer_name+' '+x.dealer_id).toLowerCase().includes(q));status.textContent=list.length+' referral(s)';rows.innerHTML=list.map(x=>'<tr><td><strong>'+esc(x.dealer_name)+'</strong><div class="muted">Dealer #'+Number(x.dealer_id)+'</div></td><td>'+esc(x.contact_email||'—')+'</td><td>'+esc(x.contact_phone||'—')+'</td><td>'+esc(new Date(x.requested_at).toLocaleString('en-GB'))+'</td><td class="tag">'+esc(x.referral_status)+'</td></tr>').join('')||'<tr><td colspan="5">No requests found.</td></tr>';}input.addEventListener('input',render);render();})();</script></body></html>
