<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Verify your email | AnyBike</title>
<style>body{background:#0d0d0e;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px;box-sizing:border-box}main{max-width:520px;width:100%;padding:34px;border:1px solid #333;border-radius:18px;background:#171717;text-align:center}h1{font-size:29px}p{line-height:1.55;color:#ccc}a.button{display:inline-block;background:#ed1c24;color:white;text-decoration:none;padding:14px 24px;border-radius:10px;font-weight:bold}.brand{font-weight:900;color:#fff;font-size:25px;letter-spacing:-1px}.brand span{color:#ed1c24}</style></head><body><main><div class="brand">Any<span>Bike</span></div><h1 id="heading">Verifying your email…</h1><p id="detail">Please wait while we securely confirm your AnyBike account.</p><a id="continue" class="button" href="/customer-dashboard.html" hidden>Continue to AnyBike</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async function(){
const heading=document.getElementById('heading'),detail=document.getElementById('detail'),button=document.getElementById('continue');
const params=new URLSearchParams(location.search);
const token=params.get('token_hash');
history.replaceState({},'',location.pathname);
if(!token){heading.textContent='Verification link unavailable';detail.textContent='This link is incomplete. Please request a fresh verification link from AnyBike.';return;}
try{
const sb=supabase.createClient('https://tuehtnezhdnkqbbhttgp.supabase.co','sb_publishable_mrkBKDxEPVmdj2n7gPWsbg_l4CShtcK');
const {data,error}=await sb.auth.verifyOtp({token_hash:token,type:'magiclink'});
if(error)throw error;
heading.textContent='Email verified';detail.textContent='Thank you. Your AnyBike account is ready to continue.';button.hidden=false;
}catch(e){heading.textContent='Link expired or already used';detail.textContent='Please request a new verification link from AnyBike. For your security, each link can only be used once.';}
})();
</script></body></html>
