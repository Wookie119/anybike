<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Universal Leads | AnyBike Admin</title>
<meta name="robots" content="noindex,nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --red:#ed1c24;
  --bg:#050505;
  --panel:#111;
  --panel2:#181818;
  --line:rgba(255,255,255,.12);
  --text:#fff;
  --muted:#aaa;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:#050505 !important;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  background-image:none !important;
}

body::before,
body::after{
  display:none !important;
  content:none !important;
}

.admin-layout{
  display:grid;
  grid-template-columns:260px minmax(0,1fr);
  min-height:100vh;
  width:100%;
  background:#050505;
}

#adminSidebar{
  background:#070707;
  border-right:1px solid var(--line);
  min-height:100vh;
  position:sticky;
  top:0;
  align-self:start;
  overflow:auto;
}

.main{
  padding:18px 22px;
  width:100%;
  max-width:none;
  margin:0;
  background:#050505;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  margin-bottom:22px;
}

h1{
  margin:0;
  font-size:30px;
  line-height:1.1;
}

.muted{
  color:var(--muted);
}

button{
  border:none;
  border-radius:12px;
  background:var(--red);
  color:#fff;
  padding:11px 16px;
  font-weight:900;
  cursor:pointer;
}

button.secondary{
  background:#292929;
}

button.green{
  background:#007a35;
}

button.amber{
  background:#9a6900;
}

input,
select,
textarea{
  width:100%;
  border-radius:10px;
  border:1px solid var(--line);
  background:#0b0b0b;
  color:#fff;
  padding:10px;
  font-size:14px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;
  margin-bottom:20px;
}

.card{
  background:#111;
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  min-height:110px;
}

.card strong{
  display:block;
  font-size:32px;
  margin-top:10px;
}

.controls{
  display:grid;
  grid-template-columns:1.3fr 1fr 1fr 1fr;
  gap:10px;
  margin-bottom:18px;
}

.lead{
  background:#111;
  border:1px solid var(--line);
  border-radius:18px;
  margin-bottom:14px;
  overflow:hidden;
}

.lead-head{
  display:grid;
  grid-template-columns:1.5fr 1fr 1fr 1fr 120px;
  gap:14px;
  align-items:center;
  padding:16px;
  cursor:pointer;
}

.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:999px;
  background:#252525;
  font-size:12px;
  font-weight:900;
}

.badge.red{
  background:var(--red);
}

.lead-body{
  display:none;
  border-top:1px solid var(--line);
  padding:16px;
  background:#0b0b0b;
}

.lead.open .lead-body{
  display:block;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:14px;
}

.section{
  background:#181818;
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
}

.section h3{
  margin:0 0 12px;
}

.stage-actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:12px;
}

.timeline{
  margin-top:12px;
  border-left:3px solid var(--red);
  padding-left:12px;
}

.timeline-item{
  margin-bottom:12px;
  color:#ddd;
}

.timeline-item small{
  display:block;
  color:var(--muted);
}

@media(max-width:900px){
.admin-layout{
  display:grid;
  grid-template-columns:220px minmax(0,1fr);


  #adminSidebar{
    display:none;
  }

  .controls,
  .lead-head{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>
<div class="admin-layout">
  <aside id="adminSidebar"></aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Universal Lead Pipeline</h1>
        <div class="muted">One lead system for Sales, Buying, Logistics, Global Buyers and Message Centre</div>
      </div>
      <button onclick="openNewLead()">+ New Lead</button>
    </div>

    <div class="cards">
      <div class="card">Total Leads<strong id="totalLeads">0</strong></div>
      <div class="card">New Leads<strong id="newLeads">0</strong></div>
      <div class="card">Waiting Customer<strong id="waitingCustomer">0</strong></div>
      <div class="card">Operations<strong id="operationsCount">0</strong></div>
      <div class="card">Completed<strong id="completedCount">0</strong></div>
    </div>

    <div class="controls">
      <input id="searchBox" placeholder="Search customer, bike, subject..." oninput="renderLeads()">
      <select id="departmentFilter" onchange="renderLeads()">
        <option value="">All Departments</option>
        <option>Bike Sales</option>
        <option>Buying Team</option>
        <option>Logistics</option>
        <option>Finance</option>
        <option>Message Centre</option>
      </select>
      <select id="managerFilter" onchange="renderLeads()">
        <option value="">All Lead Managers</option>
        <option>Sean Byrne</option>
        <option>Andy Gifford</option>
        <option>Sophie Gifford</option>
        <option>Cat Byrne</option>
      </select>
      <select id="statusFilter" onchange="renderLeads()">
        <option value="">All Stages</option>
      </select>
    </div>

    <div id="leadList"></div>
  </main>
</div>

<script>
const SUPABASE_URL = "https://tuehtnezhdnkqbbhttgp.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_mrkBKDxEPVmdj2n7gPWsbg_l4CShtcK";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STAFF = ["Sean Byrne","Andy Gifford","Sophie Gifford","Cat Byrne"];

const STAGES = [
  "New Lead",
  "Contact Made",
  "Requirements Confirmed",
  "Research / Availability",
  "Proposal / Offer Sent",
  "Negotiating",
  "Waiting Customer Decision",
  "Confirmed",
  "Payment Stage",
  "Operations",
  "Shipping / Delivery",
  "Completed",
  "Closed",
  "Lost",
  "Save For Later"
];

let allLeads = [];
let timelineMap = {};

function esc(v){
  return String(v || "").replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c];
  });
}

function setupStageFilter(){
  const sel = document.getElementById("statusFilter");
  STAGES.forEach(s=>{
    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = s;
    sel.appendChild(opt);
  });
}

async function loadAdminShell(){
  try{
    const res = await fetch("admin-sidebar.html?v=3000");
    const html = await res.text();
    const sidebar = document.getElementById("adminSidebar");
    if(sidebar){ sidebar.innerHTML = html; }
    if(typeof setupAdminFolders === "function"){ setupAdminFolders(); }
  }catch(e){}
}

async function loadLeads(){
  const {data,error} = await sb
    .from("anybike_leads")
    .select("*")
    .order("updated_at",{ascending:false});

  if(error){
    document.getElementById("leadList").innerHTML =
      `<div class="card">Error loading leads: ${esc(error.message)}</div>`;
    return;
  }

  allLeads = data || [];
  await loadTimelines();
  renderCards();
  renderLeads();
}

async function loadTimelines(){
  if(!allLeads.length){
    timelineMap = {};
    return;
  }

  const ids = allLeads.map(l=>l.id);

  const {data,error} = await sb
    .from("anybike_lead_timeline")
    .select("*")
    .in("lead_id",ids)
    .order("created_at",{ascending:false});

  timelineMap = {};

  if(!error && data){
    data.forEach(t=>{
      if(!timelineMap[t.lead_id]) timelineMap[t.lead_id] = [];
      timelineMap[t.lead_id].push(t);
    });
  }
}

function renderCards(){
  document.getElementById("totalLeads").textContent = allLeads.length;
  document.getElementById("newLeads").textContent = allLeads.filter(l=>l.status==="New Lead").length;
  document.getElementById("waitingCustomer").textContent = allLeads.filter(l=>l.status==="Waiting Customer Decision").length;
  document.getElementById("operationsCount").textContent = allLeads.filter(l=>l.status==="Operations").length;
  document.getElementById("completedCount").textContent = allLeads.filter(l=>l.status==="Completed").length;
}

function renderLeads(){
  const q = document.getElementById("searchBox").value.toLowerCase().trim();
  const dep = document.getElementById("departmentFilter").value;
  const manager = document.getElementById("managerFilter").value;
  const status = document.getElementById("statusFilter").value;

  let leads = allLeads.filter(l=>{
    const blob = [
      l.subject,l.customer_name,l.customer_email,l.make,l.model,l.country,l.department,l.lead_manager,l.status
    ].join(" ").toLowerCase();

    if(q && !blob.includes(q)) return false;
    if(dep && l.department !== dep) return false;
    if(manager && l.lead_manager !== manager) return false;
    if(status && l.status !== status) return false;
    return true;
  });

  const box = document.getElementById("leadList");

  if(!leads.length){
    box.innerHTML = `<div class="card">No leads found.</div>`;
    return;
  }

  box.innerHTML = leads.map(l=>leadHtml(l)).join("");
}

function leadHtml(l){
  const bike = [l.make,l.model,l.bike_year].filter(Boolean).join(" ");
  const timelines = timelineMap[l.id] || [];

  return `
  <div class="lead" id="lead-${l.id}">
    <div class="lead-head" onclick="toggleLead(${l.id})">
      <div>
        <strong>${esc(l.subject)}</strong><br>
        <span class="muted">${esc(l.customer_name || l.customer_email || "No customer attached")}</span>
      </div>
      <div>
        <span class="badge red">${esc(l.department)}</span>
      </div>
      <div>
        <strong>${esc(l.lead_manager || "Unassigned")}</strong><br>
        <span class="muted">Lead Manager</span>
      </div>
      <div>
        <span class="badge">${esc(l.status)}</span><br>
        <span class="muted">${esc(bike || l.lead_type)}</span>
      </div>
      <button class="secondary" onclick="event.stopPropagation(); toggleLead(${l.id})">Open</button>
    </div>

    <div class="lead-body">
      <div class="grid">
        <div class="section">
          <h3>Lead Ownership</h3>
          <label>Lead Manager</label>
          <select id="manager-${l.id}">
            ${STAFF.map(s=>`<option ${l.lead_manager===s?"selected":""}>${s}</option>`).join("")}
          </select>

          <label>Supporting Staff</label>
          ${STAFF.map(s=>`
            <label style="display:block;margin-top:8px;">
              <input type="checkbox" style="width:auto;" id="support-${l.id}-${s.replaceAll(" ","-")}" ${(l.supporting_staff||[]).includes(s)?"checked":""}>
              ${s}
            </label>
          `).join("")}

          <button style="margin-top:12px;" onclick="saveOwnership(${l.id})">Save Ownership</button>
        </div>

        <div class="section">
          <h3>Pipeline Stage</h3>
          <select id="status-${l.id}">
            ${STAGES.map(s=>`<option ${l.status===s?"selected":""}>${s}</option>`).join("")}
          </select>

          <button style="margin-top:10px;" onclick="saveStatus(${l.id})">Save Stage</button>

          <div class="stage-actions" style="margin-top:12px;">
            <button class="green" onclick="completeStage(${l.id})">Complete</button>
            <button class="amber" onclick="skipStage(${l.id})">Skip</button>
            <button class="secondary" onclick="moveBack(${l.id})">Back</button>
          </div>
        </div>

        <div class="section">
          <h3>Customer / Subject</h3>
          <p><strong>${esc(l.customer_name || "-")}</strong></p>
          <p>${esc(l.customer_email || "")}</p>
          <p>${esc(l.customer_phone || "")}</p>
          <p>${esc([l.city,l.region,l.country].filter(Boolean).join(", "))}</p>
          <p class="muted">${esc(l.message || "")}</p>
        </div>

        <div class="section">
          <h3>Internal Notes</h3>
          <textarea id="notes-${l.id}" rows="8">${esc(l.internal_notes || "")}</textarea>
          <button style="margin-top:10px;" onclick="saveNotes(${l.id})">Save Notes</button>
        </div>
      </div>

      <div class="section" style="margin-top:14px;">
        <h3>Timeline</h3>
        <div class="timeline">
          ${
            timelines.length
            ? timelines.map(t=>`
              <div class="timeline-item">
                <small>${new Date(t.created_at).toLocaleString()}</small>
                <strong>${esc(t.event_type || "Update")}</strong><br>
                ${esc(t.event_text || "")}
                ${t.created_by ? `<br><span class="muted">By ${esc(t.created_by)}</span>` : ""}
              </div>
            `).join("")
            : `<div class="muted">No timeline yet.</div>`
          }
        </div>
      </div>
    </div>
  </div>`;
}

function toggleLead(id){
  const el = document.getElementById("lead-"+id);
  if(el) el.classList.toggle("open");
}

function getLead(id){
  return allLeads.find(l=>Number(l.id)===Number(id));
}

async function addTimeline(leadId,type,text,by){
  await sb.from("anybike_lead_timeline").insert({
    lead_id:leadId,
    event_type:type,
    event_text:text,
    created_by:by || "Admin"
  });
}

async function saveOwnership(id){
  const lead = getLead(id);
  const manager = document.getElementById("manager-"+id).value;

  const support = STAFF.filter(s=>{
    const box = document.getElementById("support-"+id+"-"+s.replaceAll(" ","-"));
    return box && box.checked;
  });

  const {error} = await sb
    .from("anybike_leads")
    .update({
      lead_manager:manager,
      supporting_staff:support,
      updated_at:new Date().toISOString()
    })
    .eq("id",id);

  if(error){ alert(error.message); return; }

  await addTimeline(id,"Ownership Updated",`Lead Manager set to ${manager}. Supporting Staff: ${support.join(", ") || "None"}`,"Admin");
  await loadLeads();
  openLeadAgain(id);
}

async function saveStatus(id){
  const lead = getLead(id);
  const oldStatus = lead.status;
  const newStatus = document.getElementById("status-"+id).value;

  const {error} = await sb
    .from("anybike_leads")
    .update({
      status:newStatus,
      updated_at:new Date().toISOString()
    })
    .eq("id",id);

  if(error){ alert(error.message); return; }

  await addTimeline(id,"Stage Changed",`${oldStatus} → ${newStatus}`,"Admin");
  await loadLeads();
  openLeadAgain(id);
}

async function completeStage(id){
  const lead = getLead(id);
  const current = STAGES.indexOf(lead.status);
  const next = STAGES[Math.min(current + 1, STAGES.length - 1)];

  const {error} = await sb
    .from("anybike_leads")
    .update({
      status:next,
      updated_at:new Date().toISOString()
    })
    .eq("id",id);

  if(error){ alert(error.message); return; }

  await addTimeline(id,"Stage Completed",`${lead.status} completed. Moved to ${next}`,"Admin");
  await loadLeads();
  openLeadAgain(id);
}

async function skipStage(id){
  const lead = getLead(id);
  const current = STAGES.indexOf(lead.status);
  const skipped = lead.status;
  const next = STAGES[Math.min(current + 1, STAGES.length - 1)];
  const skippedStages = lead.skipped_stages || [];

  if(!skippedStages.includes(skipped)){
    skippedStages.push(skipped);
  }

  const {error} = await sb
    .from("anybike_leads")
    .update({
      status:next,
      skipped_stages:skippedStages,
      updated_at:new Date().toISOString()
    })
    .eq("id",id);

  if(error){ alert(error.message); return; }

  await addTimeline(id,"Stage Skipped",`${skipped} skipped. Moved to ${next}`,"Admin");
  await loadLeads();
  openLeadAgain(id);
}

async function moveBack(id){
  const lead = getLead(id);
  const current = STAGES.indexOf(lead.status);
  const prev = STAGES[Math.max(current - 1, 0)];

  const {error} = await sb
    .from("anybike_leads")
    .update({
      status:prev,
      updated_at:new Date().toISOString()
    })
    .eq("id",id);

  if(error){ alert(error.message); return; }

  await addTimeline(id,"Moved Back",`${lead.status} → ${prev}`,"Admin");
  await loadLeads();
  openLeadAgain(id);
}

async function saveNotes(id){
  const notes = document.getElementById("notes-"+id).value;

  const {error} = await sb
    .from("anybike_leads")
    .update({
      internal_notes:notes,
      updated_at:new Date().toISOString()
    })
    .eq("id",id);

  if(error){ alert(error.message); return; }

  await addTimeline(id,"Notes Updated","Internal notes updated.","Admin");
  await loadLeads();
  openLeadAgain(id);
}

function openLeadAgain(id){
  setTimeout(()=>{
    const el = document.getElementById("lead-"+id);
    if(el){
      el.classList.add("open");
      el.scrollIntoView({behavior:"smooth",block:"center"});
    }
  },100);
}

async function openNewLead(){
  const subject = prompt("Lead subject?");
  if(!subject) return;

  const {data,error} = await sb
    .from("anybike_leads")
    .insert({
      subject:subject,
      lead_type:"Manual",
      department:"Message Centre",
      status:"New Lead",
      lead_manager:"Sean Byrne"
    })
    .select()
    .single();

  if(error){ alert(error.message); return; }

  await addTimeline(data.id,"Lead Created","Manual lead created.","Admin");
  await addTimeline(data.id,"Automatically Assigned","Assigned to Sean Byrne.","System");

  await loadLeads();
  openLeadAgain(data.id);
}

setupStageFilter();
loadAdminShell();
loadLeads();
</script>

<script src="admin.js?v=3000"></script>
</body>
</html>
