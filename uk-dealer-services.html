<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>UK Dealer Services | AnyBike</title>
<style>body{margin:0;background:#0d0d0e;color:#eee;font:16px Arial,sans-serif}header{border-bottom:3px solid #cb202b;padding:20px max(20px,calc((100vw - 820px)/2));font-weight:800;font-size:27px}header b{color:#e22a34}main{max-width:820px;margin:35px auto;padding:0 22px}h1{font-size:29px;margin:0 0 10px}p{color:#bbb;line-height:1.5}.option{display:flex;gap:13px;align-items:start;background:#19191b;border:1px solid #3b3b3e;border-radius:10px;padding:17px;margin:10px 0;cursor:pointer}.option input{height:20px;width:20px;accent-color:#da202c;flex:none}.option strong{display:block;font-size:16px}.option small{display:block;color:#ccc;margin-top:6px;line-height:1.45}button{background:#bc1f2b;color:#fff;border:0;padding:14px 24px;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px}button:disabled{opacity:.5;cursor:default}#status{margin:15px 0;color:#9fe3a3}a{color:#ddd}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><header><b>Any</b>Bike · UK Trade</header><main><h1>How can AnyBike help your dealership?</h1><p>Select as many services as you like. Your answers help us offer relevant opportunities without unnecessary messages.</p><div id="choices"></div><button id="send" disabled>Submit my interests</button><div id="status" role="status">Checking your dealer account…</div><p style="font-size:13px">Submitting your interests does not list motorcycles or change your account permissions.</p></main>
<script>
const sb=supabase.createClient('https://tuehtnezhdnkqbbhttgp.supabase.co','sb_publishable_mrkBKDxEPVmdj2n7gPWsbg_l4CShtcK');
const choices=[['buy','Buy motorcycles from UK dealers','See UK trade buying opportunities.'],['trade_sell','Offer motorcycles to the trade','Offer your motorcycles to other UK dealers.'],['underwrite','Request underwriting','Invite confidential trade offers on motorcycles.'],['source','Source motorcycles','Ask AnyBike to help you find motorcycles.'],['transport','Motorcycle collection and delivery','Ask about UK motorcycle transport.'],['vat_export_stock','List VAT-qualifying stock for international buyers','Would you like to list VAT-qualifying motorcycles to AnyBike international trade users? Your dealership name will not be shown. Nothing is published without your agreement.'],['browsing','Just looking around for now','Explore AnyBike without any further commitment.']];
const selected=new Set(),host=document.getElementById('choices'),button=document.getElementById('send'),status=document.getElementById('status');
for(const [key,title,desc] of choices){const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type='checkbox';input.value=key;input.onchange=()=>{input.checked?selected.add(key):selected.delete(key);button.disabled=selected.size===0};const inner=document.createElement('span'),strong=document.createElement('strong'),small=document.createElement('small');strong.textContent=title;small.textContent=desc;inner.append(strong,small);label.append(input,inner);host.append(label)}
(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){status.innerHTML='Please <a href="/customer-login.html?return=%2Fuk-dealer-services.html">sign in to your AnyBike dealer account</a> to complete this form.';return}const {data,error}=await sb.rpc('dealer_service_questionnaire_v1');if(error){status.textContent=error.message;return}for(const input of host.querySelectorAll('input')){input.checked=(data.interests||[]).includes(input.value);if(input.checked)selected.add(input.value)}button.disabled=selected.size===0;status.textContent=data.submitted_at?'You can update your previously submitted choices.':'Ready — choose the services that interest you.'})();
button.onclick=async()=>{button.disabled=true;status.textContent='Submitting…';const {error}=await sb.rpc('dealer_service_questionnaire_v1',{p_interests:[...selected]});status.textContent=error?'Could not submit: '+error.message:'✓ Thank you. Your interests have been sent to AnyBike.';button.disabled=selected.size===0};
</script></body></html>
