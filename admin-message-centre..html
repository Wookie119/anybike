<body>
<div class="admin-shell"><div id="adminSidebar"></div><div class="admin-main"><div id="adminTopbar"></div><main class="admin-page-content message-page"><div class="page-head"><div><h1>Message Centre v3</h1><p>One communications hub for Bike Sales, Buying Team, Transport, Stock Preparation, Finance and Logistics.</p></div><button class="refresh-btn" onclick="loadThreads()">Refresh</button></div><section class="stats-grid"><div class="stat-card"><strong id="totalCount">0</strong><span>Active Messages</span></div><div class="stat-card"><strong id="newCount">0</strong><span>New</span></div><div class="stat-card"><strong id="replyCount">0</strong><span>Needs Reply</span></div><div class="stat-card"><strong id="buyingCount">0</strong><span>Buying Team</span></div></section><section class="mc-layout"><div class="panel"><div class="panel-head"><h2>Inbox</h2><div class="filters"><button class="active" onclick="setFilter('all', this)">All</button><button onclick="setFilter('New', this)">New</button><button onclick="setFilter('Needs Reply', this)">Needs Reply</button><button onclick="setFilter('Bike Enquiry', this)">Bike Sales</button><button onclick="setFilter('Sell Your Bike', this)">Buying Team</button><button onclick="setFilter('Archived', this)">Archived</button><button onclick="setFilter('Deleted', this)">Deleted</button></div><div class="search-box"><input id="searchInput" placeholder="Search name, email, bike, country, message..." oninput="renderThreads()"></div></div><div class="toolbar"><button onclick="selectAllThreads()">Select All</button><button onclick="clearSelection()">Clear</button><button onclick="archiveSelectedThreads()">Archive</button><button class="danger" onclick="deleteSelectedThreads()">Delete</button></div><div id="threadList" class="thread-list"><div class="empty">Loading messages...</div></div></div><div class="panel"><div id="workspace" class="empty">Select a message to view the conversation.</div></div></section></main></div></div>
<script src="admin.js?v=9100"></script>
<script>
const SUPABASE_URL="https://tuehtnezhdnkqbbhttgp.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_mrkBKDxEPVmdj2n7gPWsbg_l4CShtcK";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let allThreads=[];let selectedThread=null;let selectedIds=new Set();let activeFilter="all";
function safe(v){return v===null||v===undefined||v===""?"—":String(v)}
function money(v){return v?"£"+Number(v).toLocaleString("en-GB"):"—"}
function shortDate(v){if(!v)return"—";return new Date(v).toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}
function niceType(type){const raw=String(type||"").trim();const key=raw.toLowerCase().replaceAll("_"," ");const map={"bike enquiry":"Bike Enquiry","buyer question":"Bike Enquiry","sell your bike":"Sell Your Bike","sell bike":"Sell Your Bike","contact us":"Contact Us","contact":"Contact Us","multi bike request":"Multi-Bike Request","bulk buying":"Multi-Bike Request","general":"General"};return map[key]||raw||"General"}
function typeMatches(t,filter){return niceType(t.source_type).toLowerCase()===String(filter).toLowerCase()}
function setFilter(filter,btn){activeFilter=filter;selectedIds.clear();document.querySelectorAll(".filters button").forEach(b=>b.classList.remove("active"));if(btn)btn.classList.add("active");renderThreads()}
function getVisibleThreads(){const search=(document.getElementById("searchInput").value||"").toLowerCase();let rows=allThreads.slice();if(activeFilter==="all"){rows=rows.filter(t=>t.status!=="Archived"&&t.status!=="Deleted")}else if(activeFilter==="Archived"||activeFilter==="Deleted"){rows=rows.filter(t=>t.status===activeFilter)}else{rows=rows.filter(t=>t.status===activeFilter||typeMatches(t,activeFilter));rows=rows.filter(t=>t.status!=="Deleted")}if(search){rows=rows.filter(t=>[t.customer_name,t.customer_email,t.customer_phone,t.country,t.department,t.subject,t.last_message,t.bike_make,t.bike_model,t.bike_year].join(" ").toLowerCase().includes(search))}return rows}
function updateStats(){const active=allThreads.filter(t=>t.status!=="Deleted"&&t.status!=="Archived");document.getElementById("totalCount").textContent=active.length;document.getElementById("newCount").textContent=active.filter(t=>t.status==="New").length;document.getElementById("replyCount").textContent=active.filter(t=>t.status==="Needs Reply").length;document.getElementById("buyingCount").textContent=active.filter(t=>String(t.department||"").toLowerCase().includes("buying")||niceType(t.source_type)==="Sell Your Bike").length}
async function loadThreads(){const list=document.getElementById("threadList");list.innerHTML='<div class="empty">Loading messages...</div>';const{data,error}=await sb.from("message_centre_threads").select("*").order("last_message_at",{ascending:false,nullsFirst:false}).order("created_at",{ascending:false});if(error){list.innerHTML=`<div class="empty">Could not load Message Centre.<br>${safe(error.message)}</div>`;return}allThreads=data||[];selectedIds.clear();updateStats();renderThreads();const params=new URLSearchParams(window.location.search);const threadId=Number(params.get("thread"));if(threadId){openThread(threadId)}}
function renderThreads(){const list=document.getElementById("threadList");const rows=getVisibleThreads();if(!rows.length){list.innerHTML='<div class="empty">No messages found.</div>';return}list.innerHTML=rows.map(t=>{const id=Number(t.id);const active=selectedThread&&Number(selectedThread.id)===id?"active":"";const checked=selectedIds.has(id)?"checked":"";const bike=[t.bike_year,t.bike_make,t.bike_model].filter(Boolean).join(" ");const title=t.customer_name||t.customer_email||"Unknown Customer";const type=niceType(t.source_type);return`<div class="thread-card ${active}" onclick="openThread(${id})"><input type="checkbox" class="thread-check" ${checked} onclick="toggleThreadSelection(event, ${id})"><div class="thread-top"><div class="thread-title">${safe(title)}</div><div class="thread-time">${shortDate(t.last_message_at||t.created_at)}</div></div><div class="thread-meta"><span class="badge badge-red">${safe(type)}</span><span class="badge badge-orange">${safe(t.status)}</span><span class="badge">${safe(t.department)}</span><span class="badge">${safe(t.country)}</span>${bike?`<span class="badge badge-green">${safe(bike)}</span>`:""}</div><div class="thread-preview">${safe(t.last_message||t.subject||"No message preview")}</div></div>`}).join("")}
function toggleThreadSelection(event,id){event.stopPropagation();if(event.target.checked){selectedIds.add(Number(id))}else{selectedIds.delete(Number(id))}}
function selectAllThreads(){getVisibleThreads().forEach(t=>selectedIds.add(Number(t.id)));renderThreads()}
function clearSelection(){selectedIds.clear();renderThreads()}
function getSelectedIds(){return Array.from(selectedIds).filter(Boolean)}
function option(current,value){return`<option ${current===value?"selected":""}>${value}</option>`}
function getStatusOptions(t){const type=niceType(t.source_type);if(type==="Sell Your Bike")return["New","Needs Reply","Buying Team Reviewing","Negotiating Purchase","Offer Made","Offer Accepted","Collection Booked","In Stock Preparation","Published For Sale","Archived","Deleted","Closed"];if(type==="Bike Enquiry")return["New","Needs Reply","Checking Availability","Negotiating Price","Invoice Sent","Waiting Deposit","Deposit Paid","Converted To Deal","Ready For Collection","Completed","Archived","Deleted","Closed"];if(type==="Multi-Bike Request")return["New","Needs Reply","Sourcing Motorcycles","Quoting","Waiting Customer","Deal Agreed","Converted To Deal","Completed","Archived","Deleted","Closed"];return["New","Needs Reply","Replied","Waiting Customer","In Progress","Converted To Deal","Archived","Deleted","Closed"]}
async function openThread(id){selectedThread=allThreads.find(t=>Number(t.id)===Number(id));if(!selectedThread)return;renderThreads();const workspace=document.getElementById("workspace");workspace.className="workspace";workspace.innerHTML='<div class="empty">Loading conversation...</div>';const{data:messages,error}=await sb.from("message_centre_messages").select("*").eq("thread_id",id).order("created_at",{ascending:true});if(error){workspace.innerHTML=`<div class="empty">${safe(error.message)}</div>`;return}const t=selectedThread;let lead=null;if(t.related_lead_id){const{data:leadData,error:leadError}=await sb.from("anybike_leads").select("*").eq("id",t.related_lead_id).single();if(!leadError)lead=leadData}const bike=[lead?.bike_year||t.bike_year,lead?.make||t.bike_make,lead?.model||t.bike_model].filter(Boolean).join(" ");const statusOptions=getStatusOptions(t).map(s=>option(t.status,s)).join("");const photos=Array.isArray(lead?.image_urls)&&lead.image_urls.length?lead.image_urls.map(url=>`<a href="${url}" target="_blank"><img src="${url}"></a>`).join(""):"";workspace.innerHTML=`<div class="workspace-title"><div><h2>${safe(t.customer_name||lead?.name||t.customer_email||"Conversation")}</h2><p>${niceType(t.source_type)} • ${safe(t.department)} • ${safe(t.status)}</p></div></div><div class="section"><h3>Customer</h3><div class="grid"><div class="field"><span>Name</span><strong>${safe(t.customer_name||lead?.name)}</strong></div><div class="field"><span>Email</span><strong>${safe(t.customer_email||lead?.email)}</strong></div><div class="field"><span>Phone</span><strong>${safe(t.customer_phone||lead?.mobile)}</strong></div><div class="field"><span>Country</span><strong>${safe(t.country||lead?.country)}</strong></div><div class="field"><span>Postcode</span><strong>${safe(t.postcode_zip||lead?.postcode)}</strong></div><div class="field"><span>Lead Type</span><strong>${safe(lead?.lead_type||niceType(t.source_type))}</strong></div></div></div><div class="section"><h3>Motorcycle</h3>${photos?`<div class="photos">${photos}</div>`:""}<div class="grid"><div class="field"><span>Bike</span><strong>${safe(bike)}</strong></div><div class="field"><span>Registration</span><strong>${safe(lead?.registration)}</strong></div><div class="field"><span>Make</span><strong>${safe(lead?.make||t.bike_make)}</strong></div><div class="field"><span>Model</span><strong>${safe(lead?.model||t.bike_model)}</strong></div><div class="field"><span>Variant</span><strong>${safe(lead?.variant)}</strong></div><div class="field"><span>Year</span><strong>${safe(lead?.bike_year||t.bike_year)}</strong></div><div class="field"><span>Mileage</span><strong>${safe(lead?.mileage)}</strong></div><div class="field"><span>Engine CC</span><strong>${safe(lead?.engine_cc)}</strong></div><div class="field"><span>Colour</span><strong>${safe(lead?.colour)}</strong></div><div class="field"><span>Condition</span><strong>${safe(lead?.condition)}</strong></div><div class="field"><span>Service History</span><strong>${safe(lead?.service_history)}</strong></div><div class="field"><span>Owners</span><strong>${safe(lead?.owners)}</strong></div><div class="field"><span>Asking Price</span><strong>${money(lead?.asking_price)}</strong></div><div class="field"><span>Related Lead ID</span><strong>${safe(t.related_lead_id)}</strong></div></div>${lead?.notes?`<div class="field" style="margin-top:10px;"><span>Seller Notes</span><strong>${safe(lead.notes)}</strong></div>`:""}<div class="actions">${t.related_enquiry_id?`<a href="admin-enquiries.html?open=${encodeURIComponent(t.related_enquiry_id)}&focus=messages">Open Bike Sales CRM</a>`:""}${t.related_request_id?`<a href="admin-motorcycle-requests.html?request=${encodeURIComponent(t.related_request_id)}">Open Motorcycle Request</a>`:""}${t.related_lead_id?`<a href="admin-customers.html?lead=${encodeURIComponent(t.related_lead_id)}">Open Lead / Buying Team</a>`:""}${lead?`<button class="primary" onclick="alert('Add To Stock will be connected next.')">Add To Stock</button>`:""}</div></div><div class="section"><h3>Conversation</h3><div class="messages">${(messages||[]).length?messages.map(m=>`<div class="msg ${m.sender_type==="AnyBike"||m.sender_type==="Admin"?"admin":""}"><div class="msg-head"><strong>${safe(m.sender_name||m.sender_type)}</strong><span>${shortDate(m.created_at)}</span></div><div class="msg-text">${safe(m.message)}</div></div>`).join(""):'<div class="empty">No messages in this thread yet.</div>'}</div></div><div class="section reply-area"><h3>Reply / Route</h3><label>Department</label><select id="departmentSelect">${["Message Centre","Bike Sales","Buying Team","Global Trade","Transport","Stock Preparation","Finance","Logistics","Customer 360","Technical Support"].map(d=>option(t.department,d)).join("")}</select><label>Status</label><select id="statusSelect">${statusOptions}</select><label>Quick response</label><select id="quickReply" onchange="setQuickReply()"><option value="">Choose a response...</option><option value="Thank you for your enquiry. We have received your message and will come back to you shortly.">Thanks for your enquiry</option><option value="Thank you for your enquiry. We are checking availability and will confirm as soon as possible.">Checking availability</option><option value="Thank you. Please confirm your destination country and preferred shipping option so we can guide you correctly.">Confirm destination</option><option value="Thank you. Please send the makes, models, years and quantities you are interested in, and we will help build a motorcycle request for you.">Multi-bike request details</option><option value="Thank you. We can help with export, UK delivery to your freight forwarder, and shipping support depending on your requirements.">Export support</option></select><label>Reply</label><textarea id="replyBox" placeholder="Write a response..."></textarea><div class="actions"><button class="primary" onclick="sendReply()">Send Reply</button><button onclick="saveRoute()">Save Route / Status</button></div></div>`}
async function updateSelectedStatus(status){const ids=getSelectedIds();if(!ids.length){alert("Select at least one message.");return}const{error}=await sb.from("message_centre_threads").update({status,updated_at:new Date().toISOString()}).in("id",ids);if(error){alert(error.message);return}selectedIds.clear();selectedThread=null;await loadThreads()}
async function archiveSelectedThreads(){if(!confirm("Archive selected messages?"))return;await updateSelectedStatus("Archived")}
async function deleteSelectedThreads(){if(!confirm("Move selected messages to Deleted?"))return;await updateSelectedStatus("Deleted")}
function setQuickReply(){const val=document.getElementById("quickReply").value;if(val)document.getElementById("replyBox").value=val}
async function saveRoute(){if(!selectedThread)return;const department=document.getElementById("departmentSelect").value;const status=document.getElementById("statusSelect").value;const{error}=await sb.from("message_centre_threads").update({department,status,updated_at:new Date().toISOString()}).eq("id",selectedThread.id);if(error){alert(error.message);return}selectedThread.department=department;selectedThread.status=status;updateStats();renderThreads();alert("Saved")}
async function sendReply(){if(!selectedThread)return;const box=document.getElementById("replyBox");const message=box.value.trim();if(!message){alert("Write a response first.");return}const now=new Date().toISOString();const{error:msgError}=await sb.from("message_centre_messages").insert({thread_id:selectedThread.id,sender_type:"AnyBike",sender_name:"AnyBike",sender_email:"admin@anybike.co.uk",message,created_at:now});if(msgError){alert(msgError.message);return}if(selectedThread.related_enquiry_id){const{error:crmError}=await sb.from("enquiry_messages").insert({enquiry_id:selectedThread.related_enquiry_id,customer_id:selectedThread.customer_id,sender:"AnyBike",message,created_at:now});if(crmError){alert("Message Centre saved, but customer CRM message failed: "+crmError.message);return}}const{error:threadError}=await sb.from("message_centre_threads").update({last_message:message,last_message_at:now,last_sender:"AnyBike",status:"Replied",updated_at:now}).eq("id",selectedThread.id);if(threadError){alert(threadError.message);return}box.value="";await loadThreads();openThread(selectedThread.id)}
document.addEventListener("DOMContentLoaded",loadThreads);
</script>
