<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AnyBike Formal Offer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#050505;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
}

.page{
  width:min(1200px,calc(100% - 32px));
  margin:40px auto 70px;
}

.brand{
  color:#ed1c24;
  font-size:14px;
  font-weight:900;
  letter-spacing:2px;
  margin-bottom:8px;
}

h1{
  margin:0;
  font-size:42px;
  line-height:1.05;
}

.subtitle{
  margin-top:10px;
  color:#aaa;
  font-size:16px;
}

.offer-card{
  margin-top:28px;
  background:#111;
  border:1px solid #303030;
  border-top:3px solid #ed1c24;
  border-radius:18px;
  overflow:hidden;
}

.offer-head{
  padding:26px 28px;
  border-bottom:1px solid #292929;
  background:linear-gradient(135deg,#151515,#0d0d0d);
}

.offer-number{
  color:#ed1c24;
  font-size:13px;
  font-weight:900;
  letter-spacing:1.5px;
}

.offer-title{
  margin-top:8px;
  font-size:30px;
  font-weight:900;
}

.offer-status{
  display:inline-block;
  margin-top:14px;
  padding:8px 12px;
  border-radius:999px;
  background:#222;
  border:1px solid #444;
  font-size:13px;
  font-weight:900;
}

.offer-status.sent{
  background:#15351f;
  border-color:#2f9e44;
  color:#9bf0b8;
}

.offer-status.expired{
  background:#321515;
  border-color:#8d3030;
  color:#ff9b9b;
}

.content{
  padding:28px;
}

.grid{
  display:grid;
  grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);
  gap:24px;
}

.panel{
  background:#0d0d0d;
  border:1px solid #292929;
  border-radius:14px;
  overflow:hidden;
}

.panel-title{
  padding:16px 18px;
  font-size:17px;
  font-weight:900;
  border-bottom:1px solid #292929;
  background:#151515;
}

.panel-body{
  padding:20px;
}

.motorcycle{
  display:grid;
  grid-template-columns:240px 1fr;
  gap:22px;
  align-items:start;
}

.motorcycle-image{
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
  border-radius:10px;
  border:1px solid #333;
  background:#080808;
}

.motorcycle-image.placeholder{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777;
  font-weight:800;
}

.bike-title{
  font-size:27px;
  font-weight:900;
  line-height:1.15;
}

.bike-meta{
  margin-top:12px;
  color:#aaa;
  line-height:1.7;
}

.price-box{
  border:1px solid #303030;
  border-radius:12px;
  overflow:hidden;
}

.price-row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:15px 17px;
  border-bottom:1px solid #282828;
}

.price-row:last-child{
  border-bottom:0;
}

.price-row span{
  color:#aaa;
}

.price-row strong{
  text-align:right;
}

.price-row.total{
  background:#171717;
  font-size:20px;
}

.price-row.total strong{
  color:#9bf0b8;
  font-size:24px;
}

.deposit{
  margin-top:18px;
  padding:18px;
  border:1px solid #3b3b3b;
  border-radius:12px;
  background:#151515;
}

.deposit-label{
  color:#aaa;
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
}

.deposit-value{
  margin-top:5px;
  font-size:25px;
  font-weight:900;
}

.info-block{
  margin-top:18px;
}

.info-label{
  color:#888;
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:6px;
}

.info-value{
  color:#fff;
  line-height:1.6;
  white-space:pre-wrap;
}

.terms{
  margin-top:24px;
}

.trade-acceptance-box{
  margin-top:20px;
  padding:18px;
  border:1px solid #3b3b3b;
  border-radius:14px;
  background:#101010;
}
.trade-acceptance-box h3{
  margin:0 0 12px;
  font-size:17px;
}
.trade-acceptance-item{
  display:flex;
  align-items:flex-start;
  gap:10px;
  margin-top:10px;
  color:#d6d6d6;
  font-size:13px;
  line-height:1.5;
}
.trade-acceptance-item input{
  width:18px;
  height:18px;
  margin-top:2px;
  flex:0 0 auto;
  accent-color:#ed1c24;
}
.trade-acceptance-item a{
  text-decoration:underline;
  font-weight:900;
}

.actions{
  margin-top:24px;
  padding:22px;
  border-radius:14px;
  background:#151515;
  border:1px solid #333;
}

.actions h2{
  margin:0 0 8px;
  font-size:21px;
}

.actions p{
  margin:0;
  color:#aaa;
  line-height:1.6;
}

.action-buttons{
  display:flex;
  gap:12px;
  margin-top:20px;
}

button{
  border:0;
  border-radius:10px;
  padding:14px 22px;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
}

.accept{
  background:#2f9e44;
  color:#fff;
}

.decline{
  background:#292929;
  color:#fff;
  border:1px solid #444;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.notice{
  margin-top:18px;
  color:#888;
  font-size:13px;
  line-height:1.6;
}

.loading,
.error{
  padding:35px;
  text-align:center;
  border:1px solid #303030;
  border-radius:14px;
  background:#111;
}

.error{
  color:#ff9b9b;
}

.countdown{
  margin-top:18px;
  text-align:center;
  padding:13px;
  border-radius:10px;
  background:#191919;
  border:1px solid #303030;
  font-weight:900;
}

.countdown.expired{
  color:#ff9b9b;
}

.offer-status.accepted{
  background:#15351f;
  border-color:#2f9e44;
  color:#9bf0b8;
}

.offer-status.declined{
  background:#321515;
  border-color:#8d3030;
  color:#ff9b9b;
}

.decision-success{
  margin-top:24px;
  padding:22px;
  border-radius:14px;
  background:#102719;
  border:1px solid #2f9e44;
}

.decision-success h2{
  margin:0 0 8px;
  font-size:22px;
  color:#9bf0b8;
}

.decision-success p{
  margin:0;
  color:#d6eadc;
  line-height:1.6;
}

.payment-cta{
  display:inline-block;
  margin-top:18px;
  padding:14px 20px;
  border-radius:10px;
  background:#ed1c24;
  color:#fff;
  font-weight:900;
  text-decoration:none;
}

.payment-cta:hover{
  filter:brightness(1.08);
}

.decision-declined{
  margin-top:24px;
  padding:22px;
  border-radius:14px;
  background:#211313;
  border:1px solid #8d3030;
}

.decision-declined h2{
  margin:0 0 8px;
  font-size:22px;
  color:#ff9b9b;
}

.decision-declined p{
  margin:0;
  color:#ddd;
  line-height:1.6;
}

@media(max-width:800px){

  .page{
    width:min(100% - 20px,1200px);
    margin-top:20px;
  }

  h1{
    font-size:34px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .motorcycle{
    grid-template-columns:1fr;
  }

  .motorcycle-image{
    max-height:320px;
  }

  .action-buttons{
    flex-direction:column;
  }

  button{
    width:100%;
  }

  .content,
  .offer-head{
    padding:18px;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="brand">ANYBIKE FORMAL OFFER</div>

  <h1>Your AnyBike Offer</h1>

  <div class="subtitle">
    Review the motorcycle, price and terms below.
  </div>

  <div id="offerShell" class="offer-card">
    <div class="loading">
      Loading your formal offer…
    </div>
  </div>

</div>


<script>

/*
  ============================================================
  AnyBike customer-source-offer.html
  Deal 360 native formal offer route.

  IMPORTANT:
  This page deliberately does NOT use customer-offer.html
  or buyer_motorcycle_matches.
  ============================================================
*/


/* ------------------------------------------------------------
   SUPABASE
   ------------------------------------------------------------ */

const SUPABASE_URL =
  "https://tuehtnezhdnkqbbhttgp.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_mrkBKDxEPVmdj2n7gPWsbg_l4CShtcK";


/*
  If your existing public pages already define these globally,
  replace the two constants above with the same values used by
  your existing customer pages.
*/

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY);


/* ------------------------------------------------------------
   HELPERS
   ------------------------------------------------------------ */

let activeOffer = null;
let countdownTimer = null;
let activeClient = null;


function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function money(value){
  const n=Number(value||0);
  return "£"+(Number.isFinite(n)?n:0).toFixed(2);
}


function formatDate(value){

  if(!value) return "—";

  const d = new Date(value);

  if(Number.isNaN(d.getTime())){
    return "—";
  }

  return d.toLocaleString(
    "en-GB",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}


function loginUrl(){

  const returnTo =
    window.location.pathname +
    window.location.search +
    window.location.hash;

  return "/customer-login.html?return=" +
    encodeURIComponent(returnTo);
}


/* ------------------------------------------------------------
   LOAD OFFER
   ------------------------------------------------------------ */

async function loadOffer(){

  const shell =
    document.getElementById("offerShell");

  const params =
    new URLSearchParams(location.search);

  const offerId =
    Number(
      params.get("offer") ||
      params.get("id")
    );

  if(!Number.isFinite(offerId) || offerId <= 0){

    shell.innerHTML =
      `<div class="error">
        No formal offer was specified.
      </div>`;

    return;
  }


  /*
    Use the existing Supabase client if the site already
    exposes one.
  */

  let client = sb;


  /*
    If the existing site does not expose window.sb,
    load Supabase exactly as the existing customer pages do.
  */

  if(!client){

    if(
      typeof window.supabase === "undefined"
    ){

      const script =
        document.createElement("script");

      script.src =
        "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

      document.head.appendChild(script);

      await new Promise(resolve => {

        script.onload = resolve;
        script.onerror = resolve;

      });

    }

    if(
      typeof window.supabase !== "undefined"
    ){

      client =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY
        );

    }

  }


  if(!client){

    shell.innerHTML =
      `<div class="error">
        AnyBike customer connection could not be started.
      </div>`;

    return;
  }

  activeClient = client;


  try{

    let user = null;

    const sessionResult =
      await client.auth.getSession();

    user =
      sessionResult?.data?.session?.user ||
      null;


    if(!user){

      const userResult =
        await client.auth.getUser();

      user =
        userResult?.data?.user ||
        null;

    }


    if(!user){

      location.replace(loginUrl());
      return;
    }


    const result =
      await client.rpc(
        "get_my_deal_offer_detail_v1",
        {
          p_offer_id: offerId
        }
      );


    if(result.error){

      console.error(
        "Deal 360 offer load failed",
        result.error
      );

      throw result.error;
    }


    if(!result.data){

      throw new Error(
        "Formal offer was not returned."
      );

    }


    /*
      Supabase returns a single row as an array when the RPC
      is defined with RETURNS TABLE. Normalise that here so the
      rest of this original 1321-line page can continue to use
      activeOffer.offer / activeOffer.motorcycle unchanged.
    */
    activeOffer =
      Array.isArray(result.data)
        ? result.data[0]
        : result.data;

    if(!activeOffer){
      throw new Error(
        "Formal offer was not returned."
      );
    }

    renderOffer();


  }catch(error){

    console.error(error);

    shell.innerHTML =
      `<div class="error">
        <strong>This formal offer could not be loaded.</strong>
        <br><br>
        Please return to My AnyBike and try again.
      </div>`;

  }

}


/* ------------------------------------------------------------
   RENDER
   ------------------------------------------------------------ */

function renderOffer(){

  const shell =
    document.getElementById("offerShell");

  const o =
    activeOffer.offer || {};

  const bike =
    activeOffer.motorcycle || {};


  const status =
    String(o.offer_status || "");


  const expired =
    status === "Expired";


  const image =
    bike.image_url;


  const imageHtml =
    image
      ? `<img
           class="motorcycle-image"
           src="${esc(image)}"
           alt="${esc(
             [
               bike.year,
               bike.make,
               bike.model,
               bike.variant
             ].filter(Boolean).join(" ")
           )}"
         >`
      : `<div class="motorcycle-image placeholder">
           AnyBike motorcycle image
         </div>`;


  let statusClass = "";

  if(status === "Sent"){
    statusClass = "sent";
  }

  if(expired){
    statusClass = "expired";
  }

  if(status === "Accepted" || o.customer_decision === "Accepted"){
    statusClass = "accepted";
  }

  if(status === "Declined" || o.customer_decision === "Declined"){
    statusClass = "declined";
  }


  shell.innerHTML = `

    <div class="offer-head">

      <div class="offer-number">
        DEAL 360 · ${esc(o.deal_number || "")}
      </div>

      <div class="offer-title">
        ${esc(
          [
            bike.year,
            bike.make,
            bike.model,
            bike.variant
          ].filter(Boolean).join(" ")
        )}
      </div>

      <div class="offer-status ${statusClass}">
        ${esc(status)}
      </div>

    </div>


    <div class="content">

      <div class="grid">

        <div>

          <div class="panel">

            <div class="panel-title">
              Motorcycle
            </div>

            <div class="panel-body">

              <div class="motorcycle">

                <div>
                  ${imageHtml}
                </div>

                <div>

                  <div class="bike-title">
                    ${esc(
                      [
                        bike.year,
                        bike.make,
                        bike.model
                      ].filter(Boolean).join(" ")
                    )}
                  </div>

                  ${
                    bike.variant
                      ? `<div class="bike-meta">
                           ${esc(bike.variant)}
                         </div>`
                      : ""
                  }

                  <div class="bike-meta">

                    ${
                      bike.mileage != null
                        ? `<div>
                             Mileage:
                             <strong>
                               ${esc(
                                 Number(
                                   bike.mileage
                                 ).toLocaleString("en-GB")
                               )}
                             miles
                             </strong>
                           </div>`
                        : ""
                    }

                    ${
                      bike.colour
                        ? `<div>
                             Colour:
                             <strong>
                               ${esc(bike.colour)}
                             </strong>
                           </div>`
                        : ""
                    }

                    ${
                      o.deal_number
                        ? `<div>
                             AnyBike Reference:
                             <strong>
                               ${esc(o.deal_number)}
                             </strong>
                           </div>`
                        : ""
                    }

                    ${
                      bike.engine_cc
                        ? `<div>
                             Engine:
                             <strong>
                               ${esc(bike.engine_cc)}
                               cc
                             </strong>
                           </div>`
                        : ""
                    }

                  </div>

                </div>

              </div>

            </div>

          </div>


          <div class="panel terms">

            <div class="panel-title">
              Offer & Delivery
            </div>

            <div class="panel-body">

              ${
                o.sale_basis
                  ? `<div class="info-block">
                       <div class="info-label">
                         Sale Basis
                       </div>
                       <div class="info-value">
                         ${esc(o.sale_basis)}
                       </div>
                     </div>`
                  : ""
              }


              <div class="info-block">

                <div class="info-label">
                  Delivery
                </div>

                <div class="info-value">

                  ${
                    o.delivery_type
                      ? esc(o.delivery_type)
                      : "Delivery arrangements to be confirmed."
                  }

                  ${
                    o.delivery_destination
                      ? `<br><strong>
                           Destination:
                         </strong>
                         ${esc(o.delivery_destination)}`
                      : ""
                  }

                </div>

              </div>


              ${
                o.offer_terms_text
                  ? `<div class="info-block">
                       <div class="info-label">
                         Offer Terms
                       </div>
                       <div class="info-value">
                         ${esc(o.offer_terms_text)}
                       </div>
                     </div>`
                  : ""
              }


              ${
                o.payment_terms_text
                  ? `<div class="info-block">
                       <div class="info-label">
                         Payment Terms
                       </div>
                       <div class="info-value">
                         ${esc(o.payment_terms_text)}
                       </div>
                     </div>`
                  : ""
              }

            </div>

          </div>

        </div>


        <div>

          <div class="panel">

            <div class="panel-title">
              Your AnyBike Offer
            </div>

            <div class="panel-body">

              <div class="price-box">

                <div class="price-row">
                  <span>Motorcycle</span>
                  <strong>
                    ${money(o.motorcycle_price_gbp)}
                  </strong>
                </div>

                ${
                  Number(o.delivery_charge_gbp || 0) > 0
                    ? `<div class="price-row">
                         <span>Delivery</span>
                         <strong>
                           ${money(
                             o.delivery_charge_gbp
                           )}
                         </strong>
                       </div>`
                    : ""
                }

                <div class="price-row total">
                  <span>Total AnyBike Offer</span>
                  <strong>
                    ${money(o.customer_total_gbp)}
                  </strong>
                </div>

              </div>


              ${
                o.deposit_required_at_acceptance
                  ? `<div class="deposit">
                       <div class="deposit-label">
                         Deposit Due on Acceptance
                       </div>
                       <div class="deposit-value">
                         ${money(
                           o.deposit_amount_gbp
                         )}
                       </div>
                     </div>`
                  : `<div class="deposit">
                       <div class="deposit-label">
                         Deposit
                       </div>
                       <div class="deposit-value">
                         No deposit required
                       </div>
                     </div>`
              }


              <div class="info-block">

                <div class="info-label">
                  Offer Valid Until
                </div>

                <div class="info-value">
                  ${formatDate(o.offer_expires_at)}
                </div>

              </div>

              <div class="info-block">
                <div class="info-label">
                  Trade / Export Sale &amp; Inspection Basis
                </div>
                <div class="info-value">
                  This offer is made on AnyBike's trade/business sale basis. AnyBike collection checks are visual condition and handover checks only, not mechanical or engineering inspections. No separate AnyBike mechanical warranty is included unless expressly stated in this Formal Offer. If you require a mechanical assessment, request an independent third-party inspection before purchase; the cost is payable by you unless agreed otherwise in writing.
                  <br><br>
                  <a href="/trade-sales-policy.html" style="text-decoration:underline;font-weight:900">Read the Trade &amp; Export Sale Policy →</a>
                </div>
              </div>


              ${
                o.customer_decision === "Accepted" || status === "Accepted"
                  ? `<div class="countdown">
                       Offer accepted ${o.customer_decided_at ? `on ${formatDate(o.customer_decided_at)}` : ""}
                     </div>`
                  : o.customer_decision === "Declined" || status === "Declined"
                    ? `<div class="countdown expired">Offer declined</div>`
                    : `<div
                         id="offerCountdown"
                         class="countdown"
                       >
                         Calculating time remaining…
                       </div>`
              }

            </div>

          </div>


          ${
            o.customer_decision === "Accepted" || status === "Accepted"
              ? `<div class="decision-success">
                   <h2>Offer Accepted</h2>
                   <p>
                     Thank you. Your acceptance has been recorded.
                     ${o.deposit_required_at_acceptance
                       ? `The next step is your ${money(o.deposit_amount_gbp)} deposit.`
                       : `The next payment step is now available in your account.`}
                     Payment is not treated as received until AnyBike verifies it, and acceptance/payment does not by itself secure the motorcycle.
                   </p>
                   <a class="payment-cta" href="/accounts-documents.html?deal=${encodeURIComponent(o.deal_number || '')}&payment=deposit&amount=${encodeURIComponent(Number(o.deposit_amount_gbp || 0).toFixed(2))}#bank-transfer">
                     ${o.deposit_required_at_acceptance
                       ? `Pay / Report ${money(o.deposit_amount_gbp)} Deposit`
                       : `Go to Accounts & Documents`}
                   </a>
                 </div>`
              : o.customer_decision === "Declined" || status === "Declined"
                ? `<div class="decision-declined">
                     <h2>Offer Declined</h2>
                     <p>Your decision has been recorded. AnyBike can continue helping with your sourcing requirement.</p>
                   </div>`
                : `<div class="actions">
                     <h2>Your decision</h2>
                     <p>
                       Review the motorcycle and offer above. You must confirm the trade sale basis and current AnyBike legal terms before acceptance can be recorded.
                     </p>
                     <div class="trade-acceptance-box">
                       <h3>Required before acceptance</h3>
                       <label class="trade-acceptance-item">
                         <input id="acceptTerms" type="checkbox">
                         <span>I have read and agree to the <a href="/terms-and-conditions.html" target="_blank" rel="noopener">AnyBike Terms &amp; Conditions</a> (version 20 September 2026).</span>
                       </label>
                       <label class="trade-acceptance-item">
                         <input id="acceptTradePolicy" type="checkbox">
                         <span>I have read and agree to the <a href="/trade-sales-policy.html" target="_blank" rel="noopener">Trade &amp; Export Sale Policy</a> (version 20 September 2026).</span>
                       </label>
                       <label class="trade-acceptance-item">
                         <input id="acceptTradeBuyer" type="checkbox">
                         <span>I confirm that I am purchasing this motorcycle wholly or mainly for purposes relating to my trade, business, craft or profession.</span>
                       </label>
                       <label class="trade-acceptance-item">
                         <input id="acceptInspectionBasis" type="checkbox">
                         <span>I understand that AnyBike's collection/condition check is visual only and is not a mechanical or engineering inspection. If I require a mechanical assessment, I must request an independent third-party inspection before purchase and pay its cost unless agreed otherwise in writing.</span>
                       </label>
                     </div>
                     <div class="action-buttons">
                       <button id="acceptButton" class="accept" type="button" disabled>
                         Accept AnyBike Offer
                       </button>
                       <button id="declineButton" class="decline" type="button">
                         Decline Offer
                       </button>
                     </div>
                     <div class="notice">
                       Customer acceptance does not mean that payment has been received and does not by itself secure the motorcycle.
                     </div>
                   </div>`
          }

        </div>

      </div>

    </div>
  `;


  const acceptanceCheckboxes=[
    "acceptTerms",
    "acceptTradePolicy",
    "acceptTradeBuyer",
    "acceptInspectionBasis"
  ].map(function(id){ return document.getElementById(id); }).filter(Boolean);

  function syncAcceptanceButton(){
    const button=document.getElementById("acceptButton");
    if(!button){ return; }
    button.disabled=
      acceptanceCheckboxes.length !== 4 ||
      !acceptanceCheckboxes.every(function(box){ return box.checked; });
  }

  acceptanceCheckboxes.forEach(function(box){
    box.addEventListener("change",syncAcceptanceButton);
  });
  syncAcceptanceButton();

  document
    .getElementById("acceptButton")
    ?.addEventListener(
      "click",
      acceptOffer
    );


  document
    .getElementById("declineButton")
    ?.addEventListener(
      "click",
      declineOffer
    );


  if(countdownTimer){
    clearInterval(countdownTimer);
    countdownTimer = null;
  }

  if(!o.customer_decision && status === "Sent"){
    updateCountdown();
    countdownTimer = setInterval(updateCountdown,1000);
  }

}


/* ------------------------------------------------------------
   COUNTDOWN
   ------------------------------------------------------------ */

function updateCountdown(){

  const el =
    document.getElementById(
      "offerCountdown"
    );

  const expires =
    activeOffer?.offer?.offer_expires_at;


  if(!el || !expires){
    return;
  }


  const ms =
    new Date(expires).getTime()
    - Date.now();


  if(ms <= 0){

    el.textContent =
      "Offer Expired";

    el.classList.add("expired");

    return;
  }


  const days =
    Math.floor(
      ms / 86400000
    );

  const hours =
    Math.floor(
      (ms % 86400000)
      / 3600000
    );

  const minutes =
    Math.floor(
      (ms % 3600000)
      / 60000
    );

  const seconds =
    Math.floor(
      (ms % 60000)
      / 1000
    );


  if(days > 0){

    el.textContent =
      `${days}d ${hours}h ${minutes}m remaining`;

  }else{

    el.textContent =
      `${hours}h ${minutes}m ${seconds}s remaining`;

  }

}


/* ------------------------------------------------------------
   CUSTOMER ACCEPT
   ------------------------------------------------------------ */

async function acceptOffer(){

  const o =
    activeOffer?.offer;

  if(!o){
    return;
  }

  const requiredAcceptances=[
    document.getElementById("acceptTerms"),
    document.getElementById("acceptTradePolicy"),
    document.getElementById("acceptTradeBuyer"),
    document.getElementById("acceptInspectionBasis")
  ];

  if(
    requiredAcceptances.some(function(box){
      return !box || !box.checked;
    })
  ){
    alert("You must agree to the Terms & Conditions, Trade & Export Sale Policy, trade-buyer declaration and inspection basis before accepting this offer.");
    return;
  }


  if(o.offer_status !== "Sent"){
    alert("This offer is no longer available.");
    return;
  }


  if(
    o.offer_expires_at &&
    new Date(o.offer_expires_at)
      .getTime() <= Date.now()
  ){

    alert("This offer has expired.");
    return;
  }


  const confirmed =
    window.confirm(

      "Accept this AnyBike formal offer?\n\n" +

      "Motorcycle: " +
      money(o.motorcycle_price_gbp) +

      "\nDelivery: " +
      money(o.delivery_charge_gbp) +

      "\nTotal: " +
      money(o.customer_total_gbp) +

      (
        o.deposit_required_at_acceptance
          ? "\nDeposit due on acceptance: " +
            money(o.deposit_amount_gbp)
          : ""
      ) +
      "\n\nSale basis: Trade / business purchase." +
      "\nInspection basis: AnyBike visual collection/handover check unless a separate independent mechanical inspection is arranged." +
      "\nWarranty: No separate AnyBike mechanical warranty unless expressly stated in this offer." +

      "\n\n" +

      "Acceptance does not record payment and does not secure the motorcycle."

    );


  if(!confirmed){
    return;
  }


  if(!activeClient){
    alert("AnyBike customer connection is not available. Please refresh and try again.");
    return;
  }

  const acceptButton = document.getElementById("acceptButton");
  const declineButton = document.getElementById("declineButton");
  if(acceptButton) acceptButton.disabled = true;
  if(declineButton) declineButton.disabled = true;

  try{
    const result = await activeClient.rpc(
      "customer_respond_to_deal_offer_v1",
      {
        p_offer_id: Number(o.id || o.offer_id),
        p_action: "Accept",
        p_decline_reason: null
      }
    );

    if(result.error) throw result.error;

    await loadOffer();

  }catch(error){
    console.error("Deal 360 offer acceptance failed", error);
    alert(error?.message || "Your acceptance could not be recorded. Please try again.");
    if(acceptButton) acceptButton.disabled = false;
    if(declineButton) declineButton.disabled = false;
  }

}


/* ------------------------------------------------------------
   CUSTOMER DECLINE
   ------------------------------------------------------------ */

async function declineOffer(){

  const o =
    activeOffer?.offer;

  if(!o){
    return;
  }


  if(o.offer_status !== "Sent"){
    alert("This offer is no longer available.");
    return;
  }


  const reason =
    window.prompt(
      "Optional reason for declining the offer:"
    );


  if(reason === null){
    return;
  }


  if(!activeClient){
    alert("AnyBike customer connection is not available. Please refresh and try again.");
    return;
  }

  const acceptButton = document.getElementById("acceptButton");
  const declineButton = document.getElementById("declineButton");
  if(acceptButton) acceptButton.disabled = true;
  if(declineButton) declineButton.disabled = true;

  try{
    const result = await activeClient.rpc(
      "customer_respond_to_deal_offer_v1",
      {
        p_offer_id: Number(o.id || o.offer_id),
        p_action: "Decline",
        p_decline_reason: String(reason || "").trim() || null
      }
    );

    if(result.error) throw result.error;

    alert("Your decision has been recorded. AnyBike can continue helping with your sourcing requirement.");
    await loadOffer();

  }catch(error){
    console.error("Deal 360 offer decline failed", error);
    alert(error?.message || "Your decision could not be recorded. Please try again.");
    if(acceptButton) acceptButton.disabled = false;
    if(declineButton) declineButton.disabled = false;
  }

}


/* ------------------------------------------------------------
   START
   ------------------------------------------------------------ */

document.addEventListener(
  "DOMContentLoaded",
  loadOffer
);

</script>
