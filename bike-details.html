:root{
  --red:#ed1c24;
  --line:rgba(255,255,255,.13);
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#050505,#111);
  color:#fff;
  min-height:100vh;
}

.wrap{
  width:min(1560px,calc(100vw - 56px));
  max-width:none;
  margin:36px auto;
  padding:0 0 55px;
}

.back{
  color:#fff;
  text-decoration:none;
  font-weight:900;
}

.back:hover{color:var(--red)}

.layout{
  display:grid;
  grid-template-columns:minmax(0,1.18fr) minmax(420px,.82fr);
  gap:22px;
  margin-top:22px;
}

.panel{
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  border-radius:22px;
  padding:24px;
  box-shadow:0 18px 48px rgba(0,0,0,.32);
}

.imageBox{
  height:520px;
  background:linear-gradient(135deg,#151515,#242424);
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
  overflow:hidden;
}

.imageBox img.bg{
  position:absolute;
  width:75%;
  opacity:.12;
  background:#fff;
  border-radius:14px;
  padding:8px;
}

.imageBox img.real{
  width:100%;
  height:100%;
  object-fit:cover;
}

.imageText{
  position:relative;
  z-index:2;
  font-size:24px;
  font-weight:900;
  text-transform:uppercase;
}

.gallery-thumbs{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  margin-top:14px;
}

.gallery-thumb{
  position:relative;
  min-width:0;
  aspect-ratio:4/3;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.13);
  border-radius:12px;
  background:linear-gradient(135deg,#151515,#222);
}

button.gallery-thumb{
  width:100%;
  padding:0;
  cursor:pointer;
}

button.gallery-thumb:hover,
button.gallery-thumb.active{
  border-color:var(--red);
}

.gallery-thumb img.real{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.gallery-thumb.placeholder{
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:default;
}

.gallery-thumb.placeholder img{
  width:72%;
  max-height:70%;
  object-fit:contain;
  opacity:.18;
  filter:grayscale(1);
}

.gallery-count{
  margin-top:10px;
  color:#999;
  font-size:12px;
  text-align:center;
}

h1{
  font-size:clamp(34px,5vw,58px);
  margin:0 0 8px;
}

h1 span,
.price{color:var(--red)}

.variant{
  font-size:22px;
  color:#ddd;
  font-weight:800;
  margin-bottom:18px;
}

.price{
  font-size:40px;
  font-weight:950;
  margin:16px 0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin:20px 0;
}

.spec{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  padding:14px;
}

.spec span{
  display:block;
  color:#aaa;
  font-size:13px;
  margin-bottom:5px;
}

.spec strong{font-size:18px}

.actions{
  display:grid;
  gap:10px;
  margin-top:18px;
}

button,
.btn{
  border:0;
  border-radius:999px;
  padding:14px 18px;
  font-weight:900;
  font-size:16px;
  cursor:pointer;
  text-align:center;
  text-decoration:none;
  display:block;
}

.primary{
  background:var(--red);
  color:#fff;
}

.primary:hover{background:#c4161d}

.outline{
  background:transparent;
  color:#fff;
  border:2px solid rgba(255,255,255,.35);
}

.outline:hover{
  border-color:#fff;
  background:#fff;
  color:#111;
}

button:disabled{
  opacity:.62;
  cursor:not-allowed;
  transform:none;
}

.desc{
  color:#e5e5e5;
  font-size:18px;
  line-height:1.75;
  white-space:pre-wrap;
}

.bad{
  color:#ff7676;
  font-weight:900;
}

.muted{color:#ccc}

.footer{
  text-align:center;
  background:rgba(5,5,5,.95);
  border-top:1px solid rgba(255,255,255,.1);
  padding:32px 16px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  z-index:9999;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-box{
  width:100%;
  max-width:540px;
  background:#111;
  border:1px solid rgba(255,255,255,.16);
  border-radius:22px;
  padding:24px;
  position:relative;
  box-shadow:0 30px 90px rgba(0,0,0,.65);
}

.modal-close{
  position:absolute;
  right:16px;
  top:10px;
  width:auto;
  background:transparent;
  color:#fff;
  font-size:32px;
  padding:0;
}

.modal-box h2{margin:0 0 16px}

.modal-box label{
  display:block;
  margin:12px 0 6px;
  font-weight:900;
}

.modal-box input,
.modal-box select,
.modal-box textarea{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.18);
  background:#fff;
  color:#111;
  font-size:16px;
}

.modal-box textarea{
  min-height:110px;
  resize:vertical;
}

@media(max-width:1200px){
  .wrap{
    width:min(1180px,calc(100vw - 36px));
  }

  .layout{
    grid-template-columns:minmax(0,1.08fr) minmax(380px,.92fr);
  }

  .imageBox{height:460px}
}

@media(max-width:850px){
  .wrap{
    width:calc(100vw - 24px);
    margin:24px auto;
  }

  .layout{
    grid-template-columns:1fr;
    text-align:center;
  }

  .grid{grid-template-columns:1fr}
  .imageBox{height:280px}
  .gallery-thumbs{grid-template-columns:repeat(4,minmax(0,1fr))}
}

@media(max-width:520px){
  .gallery-thumbs{grid-template-columns:repeat(3,minmax(0,1fr))}
}


.trade-sale-box{
  margin-top:16px;
  padding:14px 16px;
  border:1px solid rgba(237,28,36,.28);
  border-left:3px solid var(--red);
  border-radius:12px;
  background:rgba(237,28,36,.07);
  color:#d7d7d7;
  font-size:13px;
  line-height:1.55;
}
.trade-sale-box strong{color:#fff}

.buying-context{
  margin:16px 0 0;
  padding:14px 16px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:14px;
  background:rgba(255,255,255,.04);
}
.buying-context-title{
  margin:0 0 10px;
  color:#fff;
  font-size:13px;
  font-weight:950;
  letter-spacing:.04em;
  text-transform:uppercase;
}
.buying-context-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.buying-context-item{
  min-width:0;
  padding:10px 12px;
  border:1px solid rgba(255,255,255,.09);
  border-radius:11px;
  background:rgba(0,0,0,.16);
}
.buying-context-item span{
  display:block;
  margin-bottom:4px;
  color:#999;
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
}
.buying-context-item strong{
  color:#fff;
  font-size:14px;
  line-height:1.35;
  overflow-wrap:anywhere;
}
.buying-context-note{
  margin-top:10px;
  color:#aaa;
  font-size:12px;
  line-height:1.45;
}
@media(max-width:850px){
  .buying-context-grid{grid-template-columns:1fr}
}
.description-panel h2{
  margin:0 0 14px;
  font-size:28px;
}

.purchase-details-section{
  margin-top:24px;
  padding:24px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:22px;
  background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.025));
  box-shadow:0 18px 48px rgba(0,0,0,.24);
}

.purchase-details-heading{
  margin-bottom:16px;
}

.purchase-details-heading span,
.purchase-detail-kicker{
  color:var(--red);
  font-size:11px;
  font-weight:950;
  letter-spacing:.11em;
  text-transform:uppercase;

.purchase-details-heading h2{
  margin:4px 0 0;
  font-size:28px;
}

  align-items:stretch;

.image-lightbox-prev{left:18px}
.image-lightbox-next{right:18px}

.image-lightbox-counter{

  left:50%;
  bottom:18px;

  padding:8px 12px;
  border-radius:999px;
  background:rgba(0,0,0,.55);

  font-size:13px;

    height:48px;
    border-radius:50%;
  }
  .image-lightbox-prev{left:18px}
  .image-lightbox-next{right:18px}
  .image-lightbox-counter{bottom:24px}
}

<div id="publicHeader"></div>

  <div id="content">
    <p class="muted">Loading bike details...</p>
  </div>
</main>

<div id="enquiryModal" class="modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeEnquiryModal()">×</button>

    <h2>Ask About This Bike</h2>
    <div id="enquiryContextBox"></div>

    <label>Phone / WhatsApp</label>
    <input id="enquiryPhone" placeholder="Phone / WhatsApp number">

    <label>What would you like to ask?</label>
    <select id="questionType" onchange="handleQuestionTypeChange()">
      <option value="">Select a question</option>
      <option>Availability</option>
      <option>Make an Offer</option>
      <option>Reserve This Bike</option>
      <option>More Photos / Video</option>
      <option>Export Documents</option>
      <option>I Have A UK Shipping Agent</option>
      <option>Other Question</option>

    <div id="offerBox" style="display:none">

      <input id="offerAmount" type="number" placeholder="Your offer in GBP">
    </div>

    <div id="shippingAgentBox" style="display:none">
      <label>UK shipping company / agent</label>
      <input id="buyerShippingAgent" placeholder="Company name, if known">
    </div>

    <label>Additional Notes</label>
    <textarea id="enquiryMessage" placeholder="Add any extra details"></textarea>

    <button id="sendEnquiryBtn" class="primary" onclick="submitBikeEnquiry()">Send Enquiry</button>
  </div>
</div>


<div id="imageLightbox" class="image-lightbox" aria-hidden="true">
  <button class="image-lightbox-close" type="button" onclick="closeImageLightbox()" aria-label="Close image">×</button>
  <button class="image-lightbox-nav image-lightbox-prev" type="button" onclick="moveLightbox(-1)" aria-label="Previous image">‹</button>

  <button class="image-lightbox-nav image-lightbox-next" type="button" onclick="moveLightbox(1)" aria-label="Next image">›</button>
  <div class="image-lightbox-counter" id="imageLightboxCounter"></div>
</div>

function normaliseBikeId(value){
  const id=Number(value);
  return Number.isInteger(id) && id>0 ? id : null;
}

function safeUrl(value){
  const url=String(value||"").trim();

  if(!url){
    return "";
  }

  try{
    const parsed=new URL(url,window.location.origin);

    if(!["http:","https:"].includes(parsed.protocol)){
      return "";
    }

    return parsed.href;
  }catch(error){
    return "";
  }
}

const rates={
  GBP:{symbol:"£",rate:1},
  EUR:{symbol:"€",rate:1.18},
  USD:{symbol:"$",rate:1.34},
  AUD:{symbol:"A$",rate:2.05},
  NZD:{symbol:"NZ$",rate:2.23},
  CAD:{symbol:"C$",rate:1.84},
  AED:{symbol:"د.إ",rate:4.92}
};

function currency(){
  return localStorage.getItem("anybikeCurrency") ||
    localStorage.getItem("anybike_currency") ||
    "GBP";
}

function safe(v){
  const value=v===undefined || v===null ? "" : String(v);

  return value
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function money(gbp){
  const n=Number(gbp||0);
  if(!n)return bt("priceRequest");
  const c=rates[currency()] || rates.GBP;
  return c.symbol + Math.round(n*c.rate).toLocaleString("en-GB");
}
function miles(n){return n ? Number(n).toLocaleString("en-GB")+" "+bt("mileage").toLowerCase() : bt("mileageTbc")}
function anybikePublicPrice(feedPrice){
  const n=Number(feedPrice||0);
  return n>0 ? n+ANYBIKE_PUBLIC_PRICE_ALLOWANCE_GBP : 0;
}
function anybikePriceText(feedPrice){
  const n=anybikePublicPrice(feedPrice);
  return n>0 ? money(n) : bt("priceRequest");
}

function getBuyingContext(){
  const params=new URLSearchParams(location.search);

  const destination=String(params.get("destination") || "").trim();
  const buyerType=String(params.get("buyerType") || "").trim();
  const channel=String(params.get("channel") || "").trim();

  const deliveryPoints=params
    .getAll("deliveryPoint")
    .map(v=>String(v || "").trim())
    .filter(Boolean)
    .slice(0,3);

  return {
    destination,
    buyerType,
    channel,
    deliveryPoints
  };
}

function anybikeDeliveryPriceText(){
  const context=getBuyingContext();
  const points=context.deliveryPoints || [];
  if(!points.length) return bt("deliveryAll");
  const allIncluded=points.every(point=>STANDARD_INCLUDED_DELIVERY_POINTS.has(point));
  if(allIncluded){
    if(points.length===1) return btf("deliveryOne",{point:safe(points[0])});
    return bt("deliverySelected");
  }
  return bt("deliveryOther");
}

function cleanPublicDescription(text){
  let s = String(text || "");

  // Remove seller-identifying information.
  s = s.replace(/\b[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}\b/gi, "[postcode removed]");
  s = s.replace(/\b0\d{9,10}\b/g, "[phone removed]");
  s = s.replace(/\b\+44\s?\d{9,10}\b/g, "[phone removed]");
  s = s.replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi, "[email removed]");
  s = s.replace(/https?:\/\/\S+/gi, "[link removed]");
  s = s.replace(/\b(collection only from around|collection from|located in|based in|near)\s+[^.]+\.?/gi, "");
  s = s.replace(/\b(Watford|Hertfordshire|London|Manchester|Birmingham|Bristol|Leeds|Liverpool|Glasgow|Edinburgh|Cardiff|Oxford|Cambridge|Nottingham|Sheffield|Derby|Stoke|Coventry|Southampton|Portsmouth|Reading|Milton Keynes)\b/gi, "");

  // Keep the Description about the motorcycle, not generic AnyBike/export boilerplate.
  s = s.replace(/Subject to applicable manufacturer and distributor restrictions,?\s*/gi, "");
  s = s.replace(/AnyBike can assist customers in sourcing, purchasing and exporting motorcycles from the UK\.?/gi, "");
  s = s.replace(/Motorcycle availability, specification, mileage and pricing are subject to confirmation at the time of enquiry\.?/gi, "");
  s = s.replace(/Availability and export eligibility (?:will be|are) confirmed by AnyBike before any formal offer is issued\.?/gi, "");

  // Tidy common generated wording without removing useful motorcycle facts.
  s = s.replace(/Service history:\s*Service history not provided\.?/gi, "");
  s = s.replace(/Service history not provided\.?/gi, "");
  s = s.replace(/\s+([.,;:!?])/g, "$1");
  s = s.replace(/(?:\s*\.\s*){2,}/g, ". ");
  s = s.replace(/\s{2,}/g, " ").trim();

  return s || "Further details available on request.";
}

function translateDescriptionPowertrain(text){
  const lang=bikeLang();
  if(lang==="en") return text;

  let s=String(text || "").trim();
  const replacements={
    de:[["petrol","Benzin"],["diesel","Diesel"],["electric","Elektro"],["manual transmission","Schaltgetriebe"],["automatic transmission","Automatikgetriebe"]],
    fr:[["petrol","essence"],["diesel","diesel"],["electric","électrique"],["manual transmission","boîte manuelle"],["automatic transmission","boîte automatique"]],
    es:[["petrol","gasolina"],["diesel","diésel"],["electric","eléctrico"],["manual transmission","transmisión manual"],["automatic transmission","transmisión automática"]],
    ar:[["petrol","بنزين"],["diesel","ديزل"],["electric","كهربائي"],["manual transmission","ناقل حركة يدوي"],["automatic transmission","ناقل حركة أوتوماتيكي"]],
    id:[["petrol","bensin"],["diesel","diesel"],["electric","listrik"],["manual transmission","transmisi manual"],["automatic transmission","transmisi otomatis"]],
    ms:[["petrol","petrol"],["diesel","diesel"],["electric","elektrik"],["manual transmission","transmisi manual"],["automatic transmission","transmisi automatik"]],
    zh:[["petrol","汽油"],["diesel","柴油"],["electric","电动"],["manual transmission","手动变速箱"],["automatic transmission","自动变速箱"]]
  };
  (replacements[lang] || []).forEach(([from,to])=>{
    s=s.replace(new RegExp("\\b"+from.replace(/ /g,"\\s+")+"\\b","gi"),to);
  });
  return s;
}

function localisePublicDescription(text){
  const cleaned=cleanPublicDescription(text);
  const lang=bikeLang();
  if(lang==="en") return cleaned;

  const p=BIKE_I18N[lang] || BIKE_I18N.en;
  const sentences=cleaned.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [cleaned];

  return sentences.map(sentence=>{
    const s=sentence.trim();

    let m=s.match(/^(.+?)\s+presented in\s+(.+?)\s+with\s+([\d,]+)\s+miles\.?$/i);
    if(m){
      return btf("descPresented",{subject:m[1].trim(),colour:m[2].trim(),miles:m[3]});
    }

    m=s.match(/^Powered by an?\s+(.+?)\.?$/i);
    if(m){
      return btf("descPowered",{powertrain:translateDescriptionPowertrain(m[1].trim())});
    }

    if(/^This motorcycle has had one previous owner\.?$/i.test(s)){
      return p.descOneOwner;
    }

    m=s.match(/^This motorcycle has had\s+(\d+)\s+previous owners\.?$/i);
    if(m){
      return btf("descOwners",{count:m[1]});
    }

    // Common generated wording variants.
    m=s.match(/^(.+?)\s+finished in\s+(.+?)\s+with\s+([\d,]+)\s+miles\.?$/i);
    if(m){
      return btf("descPresented",{subject:m[1].trim(),colour:m[2].trim(),miles:m[3]});
    }

    // Preserve unknown factual free text rather than inventing a translation.
    // Generated AnyBike descriptions are translated by the patterns above.
    return s;
  }).join(" ");
}

async function loadBikeImages(bikeId){
  bikeImages=[];
  activeImageIndex=0;

  try{
    const {data,error}=await sb
      .from("bike_images")
      .select("id,bike_id,image_number,storage_path,is_primary")
      .eq("bike_id",Number(bikeId))
      .order("is_primary",{ascending:false})
      .order("image_number",{ascending:true})
      .limit(MAX_GALLERY_IMAGES);

    if(error){
      console.warn("Additional bike images could not be loaded",error.message);
    }else{
      const seen=new Set();

      (data || []).forEach(function(row){
        const storagePath=String(row.storage_path || "").trim();
        if(!storagePath) return;

        const {data:publicData}=sb.storage
          .from("motorcycles")
          .getPublicUrl(storagePath);

        const url=safeUrl(publicData?.publicUrl || "");
        if(!url || seen.has(url)) return;

        seen.add(url);
        bikeImages.push({
          url,
          imageNumber:Number(row.image_number || 0),
          isPrimary:row.is_primary===true
        });
      });
    }
  }catch(error){
    console.warn("Additional bike images could not be loaded",error);
  }

  const fallback=safeUrl(bike?.image_url);
  if(fallback && !bikeImages.some(item=>item.url===fallback)){
    bikeImages.unshift({url:fallback,imageNumber:0,isPrimary:bikeImages.length===0});
  }

  bikeImages=bikeImages.slice(0,MAX_GALLERY_IMAGES);
}

function imageHTML(){
  const imageUrl=currentGalleryImageUrl();

    return `<img class="real" src="${safe(imageUrl)}" alt="${safe(bike.make)} ${safe(bike.model)}" onerror="this.parentElement.innerHTML=placeholderHTML()">`;
  }

  return placeholderHTML();

function placeholderHTML(){
  return `<img class="real" src="${placeholderImageFile}" alt="AnyBike image coming soon">`;
}

function galleryHTML(){
  const realCount=bikeImages.length;
  const slotCount=Math.min(MAX_GALLERY_IMAGES,Math.max(GALLERY_MIN_VISIBLE_SLOTS,realCount));
  const slots=[];

  for(let index=0;index<slotCount;index++){
    const item=bikeImages[index];

    if(item?.url){
      slots.push(`
        <button class="gallery-thumb ${index===activeImageIndex ? "active" : ""}" type="button" onclick="selectGalleryImage(${index},true)" aria-label="View motorcycle image ${index+1}">
          <img class="real" src="${safe(item.url)}" alt="${safe(bike.make)} ${safe(bike.model)} image ${index+1}" loading="lazy">
        </button>
      `);
    }else{
      slots.push(`
        <div class="gallery-thumb placeholder" aria-hidden="true">
          <img src="${placeholderImageFile}" alt="">
        </div>
      `);
    }
  }

  return `
    <div class="gallery-thumbs">${slots.join("")}</div>
    <div class="gallery-count">${realCount ? `${realCount} image${realCount===1 ? "" : "s"} available` : "Images will appear here when available"}</div>
  `;
}

function selectGalleryImage(index,openLarge=false){
  const next=Number(index);
  if(!Number.isInteger(next) || next<0 || next>=bikeImages.length) return;
  activeImageIndex=next;

  const box=document.querySelector(".imageBox");
  if(box){
    box.innerHTML=imageHTML();
    box.classList.add("clickable");
    box.onclick=function(){openImageLightbox(activeImageIndex)};
    box.title="Click to enlarge";
  }

  document.querySelectorAll("button.gallery-thumb").forEach(function(button,buttonIndex){
    button.classList.toggle("active",buttonIndex===activeImageIndex);
  });

  if(openLarge){
    openImageLightbox(activeImageIndex);
  }
}

function openImageLightbox(index=activeImageIndex){
  if(!bikeImages.length) return;

  const next=Number(index);
  if(Number.isInteger(next) && next>=0 && next<bikeImages.length){
    activeImageIndex=next;
  }

  const item=bikeImages[activeImageIndex];
  const url=safeUrl(item?.url || "");
  if(!url) return;

  const lightbox=document.getElementById("imageLightbox");
  const image=document.getElementById("imageLightboxImg");
  const counter=document.getElementById("imageLightboxCounter");

  if(!lightbox || !image) return;

  image.src=url;
  image.alt=`${String(bike?.make || "")} ${String(bike?.model || "")} image ${activeImageIndex+1}`.trim();

  if(counter){
    counter.textContent=`${activeImageIndex+1} / ${bikeImages.length}`;
  }

  lightbox.classList.add("open");
  lightbox.setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";
}

function closeImageLightbox(){
  const lightbox=document.getElementById("imageLightbox");
  if(!lightbox) return;

  lightbox.classList.remove("open");
  lightbox.setAttribute("aria-hidden","true");
  document.body.style.overflow="";
}

function moveLightbox(direction){
  if(!bikeImages.length) return;

  const step=Number(direction) || 0;
  activeImageIndex=(activeImageIndex + step + bikeImages.length) % bikeImages.length;
  openImageLightbox(activeImageIndex);

  document.querySelectorAll("button.gallery-thumb").forEach(function(button,buttonIndex){
    button.classList.toggle("active",buttonIndex===activeImageIndex);
  });
}

  }

  document.getElementById("enquiryPhone").value = currentProfile?.phone || "";
  document.getElementById("buyerShippingAgent").value = currentProfile?.preferred_shipping_company || "";

  const contextBox=document.getElementById("enquiryContextBox");
  if(contextBox){
    contextBox.innerHTML=buyingContextHTML();
  }

  document.getElementById("enquiryModal").style.display = "flex";
}

function closeEnquiryModal(){
  document.getElementById("enquiryModal").style.display = "none";
}

function handleQuestionTypeChange(){
  const type = document.getElementById("questionType").value;

  document.getElementById("offerBox").style.display =
    type === "Make an Offer" ? "block" : "none";

  document.getElementById("shippingAgentBox").style.display =
    type === "I Have A UK Shipping Agent" ? "block" : "none";
}

async function submitBikeEnquiry(){
  if(enquirySubmitting){
    return;
  }

  if(!currentUser){
    redirectToCustomerLogin();
    return;
  }

  if(!bike || !normaliseBikeId(bike.id)){
    alert(bt("detailsNotLoaded"));
    return;
  }

  const question_type=document.getElementById("questionType").value;
  const phone=document.getElementById("enquiryPhone").value.trim();
  const offerValue=document.getElementById("offerAmount").value;
  const offer_amount=offerValue ? Number(offerValue) : null;
  const buyer_shipping_agent=document.getElementById("buyerShippingAgent").value.trim();
  const message=document.getElementById("enquiryMessage").value.trim();
  const buyingContext=getBuyingContext();

  const allowedQuestionTypes=[
    "Availability",
    "Make an Offer",
    "Reserve This Bike",
    "More Photos / Video",
    "Export Documents",
    "I Have A UK Shipping Agent",
    "Other Question"
  ];

  if(!allowedQuestionTypes.includes(question_type)){
    alert(bt("chooseQuestion"));
    return;
  }

  const compactPhone=phone.replace(/[\s()+.-]/g,"");

  if(
    compactPhone.length<7 ||
    compactPhone.length>20 ||
    !/^\d+$/.test(compactPhone)
  ){
    alert(bt("validPhone"));
    return;
  }

  if(
    offer_amount!==null &&
    (
      !Number.isFinite(offer_amount) ||
      offer_amount<=0 ||
      offer_amount>10000000
    )
  ){
    alert(bt("validOffer"));
    return;
  }

  if(question_type==="Make an Offer" && offer_amount===null){
    alert(bt("enterOffer"));
    return;
  }

  if(buyer_shipping_agent.length>200){
    alert(bt("agentLong"));
    return;
  }

  if(message.length>5000){
    alert(bt("messageLong"));
    return;
  }

  const fingerprint=[
    currentUser.id,
    bike.id,
    question_type,
    phone.toLowerCase(),
    offer_amount ?? "",
    buyer_shipping_agent.toLowerCase(),
    buyingContext.destination.toLowerCase(),
    buyingContext.buyerType.toLowerCase(),
    buyingContext.channel.toLowerCase(),
    buyingContext.deliveryPoints.join("~").toLowerCase(),
    message.toLowerCase()
  ].join("|");

  const now=Date.now();

  if(
    fingerprint===lastEnquiryFingerprint &&
    now-lastEnquirySubmittedAt<30000
  ){
    alert(bt("alreadySent"));
    return;
  }

  enquirySubmitting=true;

  const sendButton=document.getElementById("sendEnquiryBtn");

  if(sendButton){
    sendButton.disabled=true;
    sendButton.textContent=bt("sending");
  }

  try{
    const deviceType=
      /tablet|ipad/i.test(navigator.userAgent) ? "Tablet" :
      /mobi|android|iphone/i.test(navigator.userAgent) ? "Mobile" :
      "Desktop";

    const browser=
      navigator.userAgent.includes("Edg") ? "Edge" :
      navigator.userAgent.includes("Chrome") ? "Chrome" :
      navigator.userAgent.includes("Firefox") ? "Firefox" :
      navigator.userAgent.includes("Safari") ? "Safari" :
      "Unknown";

    const contextLines=[];

    if(buyingContext.buyerType){
      contextLines.push("Buying As: " + (
        buyingContext.buyerType==="Trade"
          ? "Motorcycle Dealer / Trader"
          : buyingContext.buyerType==="Private"
            ? "Private Buyer"
            : buyingContext.buyerType
      ));
    }

    if(buyingContext.channel){
      contextLines.push("AnyBike Route: " + buyingContext.channel);
    }

    if(buyingContext.deliveryPoints.length){
      contextLines.push(
        "Selected UK Delivery / Handover: " +
        buyingContext.deliveryPoints.join(" | ")
      );
    }

    const combinedMessage=[
      ...contextLines,
      message
    ].filter(Boolean).join("\n\n");

    const {error}=await sb
      .from("bike_enquiries")
      .insert({
        customer_id:currentUser.id,
        bike_id:Number(bike.id),
        enquiry_type:"Buyer Question",
        question_type,
        offer_amount,
        buyer_shipping_agent,
        customer_email:currentUser.email,
        customer_name:currentProfile?.full_name || currentUser.email,
        customer_phone:phone,
        destination_country:
          buyingContext.destination ||
          currentProfile?.country ||
          "",
        customer_city:currentProfile?.city || "",
        customer_region:currentProfile?.region || "",
        device_type:deviceType,
        browser,
        message:combinedMessage,
        status:"New"
      });

    if(error){
      alert(bt("sendFailed")+error.message);
      return;
    }

    lastEnquiryFingerprint=fingerprint;
    lastEnquirySubmittedAt=Date.now();

    alert(bt("sent"));

    closeEnquiryModal();
    document.getElementById("questionType").value="";
    document.getElementById("offerAmount").value="";
    document.getElementById("buyerShippingAgent").value="";
    document.getElementById("enquiryMessage").value="";
    handleQuestionTypeChange();

  }finally{
    enquirySubmitting=false;

    if(sendButton){
      sendButton.disabled=false;
      sendButton.textContent=bt("send");
    }
  }
}

async function toggleWatch(){
  if(watchUpdating){
    return;
  }

  if(!currentUser){
    redirectToCustomerLogin();
    return;
  }

  if(!bike || !normaliseBikeId(bike.id)){
    return;
  }

  const btn=document.getElementById("watchBtn");
  watchUpdating=true;

  if(btn){
    btn.disabled=true;
  }

  try{
    if(watched){
      const {error}=await sb
        .from("customer_watchlist")
        .delete()
        .eq("customer_id",currentUser.id)
        .eq("bike_id",Number(bike.id));

      if(error){
        alert(error.message);
        return;
      }

      watched=false;

      if(btn){
        btn.textContent=bt("watch");
      }

      return;
    }

    const {error}=await sb
      .from("customer_watchlist")
      .insert({
        customer_id:currentUser.id,
        bike_id:Number(bike.id)
      });

    if(error){
      if(String(error.code)==="23505"){
        watched=true;

        if(btn){
          btn.textContent=bt("watched");
        }

        return;
      }

      alert(error.message);
      return;
    }

    watched=true;

    if(btn){
      btn.textContent=bt("watched");
    }

  }finally{
    watchUpdating=false;

    if(btn){
      btn.disabled=false;
    }
  }
}


function updateBackToStockLink(){
  const link=document.getElementById("backToStockLink");
  if(!link) return;

  const currentParams=new URLSearchParams(location.search);
  currentParams.delete("id");

  const target=new URL("/available-stock.html",location.origin);

  for(const [key,value] of currentParams.entries()){
    target.searchParams.append(key,value);
  }

  link.href=target.pathname + target.search;
}


window.addEventListener("anybikeCurrencyChanged", function(e){
  localStorage.setItem("anybikeCurrency",e.detail.currency || "GBP");
  localStorage.setItem("anybike_currency",e.detail.currency || "GBP");
  if(bike) render();
});

window.addEventListener("anybikeLanguageChanged", function(e){
  localStorage.setItem("anybikeLanguage",e.detail.language || "en");
  localStorage.setItem("anybike_language",e.detail.language || "en");
  applyBikeStaticLanguage();
  if(bike) render();
});

document.getElementById("enquiryModal").addEventListener("click",function(event){
  if(event.target===this && !enquirySubmitting){
    closeEnquiryModal();
  }
});

document.getElementById("imageLightbox").addEventListener("click",function(event){
  if(event.target===this){
    closeImageLightbox();
  }
});

document.addEventListener("keydown",function(event){
  const lightbox=document.getElementById("imageLightbox");
  const lightboxOpen=lightbox?.classList.contains("open");

  if(lightboxOpen){
    if(event.key==="Escape"){
      closeImageLightbox();
      return;
    }

    if(event.key==="ArrowLeft"){
      moveLightbox(-1);
      return;
    }

    if(event.key==="ArrowRight"){
      moveLightbox(1);
      return;
    }
  }

  if(event.key==="Escape" && !enquirySubmitting){
    closeEnquiryModal();
  }
});

(async function init(){
  applyBikeStaticLanguage();
  updateBackToStockLink();
  await loadUser();
  await loadBike();
})();
