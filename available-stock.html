function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g,function(char){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[char];
  });
}

function safePublicUrl(value){
  const raw = String(value || "").trim();

function lang(){
  return localStorage.getItem("anybikeLanguage") ||
    localStorage.getItem("anybike_language") ||
    "en";
}

function t(key){
  const pack = words[lang()] || words.en;
  return pack[key] || words.en[key];
}

function currency(){
  return localStorage.getItem("anybikeCurrency") ||
    localStorage.getItem("anybike_currency") ||
    "GBP";
}

function safe(value){
  return value===undefined || value===null
    ? ""
    : String(value);
}

function money(gbp){
  const amount = Number(gbp);

  if(!Number.isFinite(amount) || amount <= 0){
    return "Price on request";
  }

  const selected = rates[currency()] || rates.GBP;

  return selected.symbol +
    Math.round(amount * selected.rate)
      .toLocaleString("en-GB");
}

function miles(value){
  const mileage = Number(value);

  return Number.isFinite(mileage) && mileage > 0
    ? mileage.toLocaleString("en-GB") + " miles"
    : "Mileage TBC";
}

async function loadFilterOptions(){
  let all = [];
  const size = 1000;

  for(let from=0; from<40000; from+=size){
    const to = from + size - 1;

    const {data,error} = await sb
      .from("available_stock")
      .select("make,model,year")
      .not("make","is",null)
      .not("model","is",null)
      .range(from,to);

    if(error){
      console.error(error);
      break;
    }

    all = all.concat(data || []);

    if(!data || data.length < size) break;
  }

  filterRows = all;
  populateMakes();
  populateYears();
  populateModels();
}

function populateMakes(){
  const makes = [...new Set(filterRows.map(r=>safe(r.make)).filter(Boolean))].sort();

  document.getElementById("make").innerHTML =
    '<option value="">All Makes</option>' +
    makes.map(m=>`<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join("");
}

function populateYears(){
  const years = [...new Set(filterRows.map(r=>r.year).filter(Boolean))].sort((a,b)=>b-a);

  document.getElementById("year").innerHTML =
    '<option value="">All Years</option>' +
    years.map(y=>`<option value="${escapeHtml(y)}">${escapeHtml(y)}</option>`).join("");
}

function populateModels(){
  const selectedMake = document.getElementById("make").value;

  const models = [...new Set(
    filterRows
      .filter(r=>!selectedMake || r.make === selectedMake)
      .map(r=>safe(r.model))
      .filter(Boolean)
  )].sort();

  document.getElementById("model").innerHTML =
    '<option value="">All Models</option>' +
    models.map(m=>`<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join("");
}

function buildQuery(countType="exact"){
  let q = sb
    .from("available_stock")
    .select("id,make,model,variant,year,mileage,engine_cc,price_gbp,colour,status,image_url,created_at", { count: countType })
    .not("make","is",null)
    .not("model","is",null);

  const search = document.getElementById("search").value.trim();
  const make = document.getElementById("make").value;
  const model = document.getElementById("model").value;
  const year = document.getElementById("year").value;
  const priceRange = document.getElementById("priceRange").value;

  if(savedSearchMinYear){
    q = q.gte("year", Number(savedSearchMinYear));
  }

  if(savedSearchMaxPrice){
    q = q.lte("price_gbp", Number(savedSearchMaxPrice));
  }

  if(search){
    const cleanedSearch = search
      .replace(/[%,()]/g," ")
      .replace(/\s+/g," ")
      .trim()
      .slice(0,100);

    if(cleanedSearch){
      q = q.or(
        `make.ilike.%${cleanedSearch}%,` +
        `model.ilike.%${cleanedSearch}%,` +
        `variant.ilike.%${cleanedSearch}%,` +
        `colour.ilike.%${cleanedSearch}%`
      );
    }
  }

  if(make) q = q.eq("make", make);
  if(model) q = q.eq("model", model);
  if(year) q = q.eq("year", Number(year));

  if(priceRange){
    const [min,max] = priceRange.split("-").map(Number);
    q = q.gte("price_gbp", min).lte("price_gbp", max);
  }

  return q;
}

function applySort(q){
  const sortBy = document.getElementById("sortBy").value;

  switch(sortBy){
    case "oldest":
      return q.order("created_at",{ascending:true});

    case "price_low":
      return q.order("price_gbp",{ascending:true, nullsFirst:false});

    case "price_high":
      return q.order("price_gbp",{ascending:false, nullsFirst:false});

    case "year_new":
      return q.order("year",{ascending:false, nullsFirst:false});

    case "year_old":
      return q.order("year",{ascending:true, nullsFirst:false});

    case "mileage_low":
      return q.order("mileage",{ascending:true, nullsFirst:false});

    case "mileage_high":
      return q.order("mileage",{ascending:false, nullsFirst:false});

    case "make_az":
      return q.order("make",{ascending:true});

    case "make_za":
      return q.order("make",{ascending:false});

    case "newest":
    default:
      return q.order("created_at",{ascending:false});
  }
}

async function loadPage(page=1){
  applyLanguage();

  currentPage = Math.max(1, page);

  document.getElementById("count").textContent = t("loading");
  document.getElementById("grid").innerHTML = "";

  const from = (currentPage - 1) * PAGE_SIZE;
  const to = from + PAGE_SIZE - 1;

  const {data,error,count} = await applySort(buildQuery("exact"))
    .range(from,to);

  if(error){
    console.error(error);
    document.getElementById("count").textContent = "Stock could not be loaded.";
    return;
  }

  bikes = (data || [])
    .filter(function(row){
      return normaliseBikeId(row.id);
    })
    .map(function(row){
      return {
        id:normaliseBikeId(row.id),
        make:safe(row.make),
        model:safe(row.model),
        variant:safe(row.variant),
        year:row.year || "",
        mileage:Number(row.mileage) || 0,
        cc:row.engine_cc || "",
        price:Number(row.price_gbp) || 0,
        colour:safe(row.colour),
        status:safe(row.status) || "Available",
        image_url:safePublicUrl(row.image_url)
      };
    });

  totalRows = Number(count || 0);

  const maxPage = Math.max(1, Math.ceil(totalRows / PAGE_SIZE));
  if(currentPage > maxPage){
    currentPage = maxPage;
    return loadPage(currentPage);
  }

  updateUrl();
  render();
}

function updateUrl(){
  const url = new URL(location.href);
  url.searchParams.set("page", currentPage);
  history.replaceState(null, "", url.toString());
}

function render(){
  applyLanguage();

  const maxPage = Math.max(1, Math.ceil(totalRows / PAGE_SIZE));
  const fromItem = totalRows ? ((currentPage - 1) * PAGE_SIZE) + 1 : 0;
  const toItem = Math.min(currentPage * PAGE_SIZE, totalRows);

  document.getElementById("count").textContent =
    totalRows ? `${totalRows.toLocaleString("en-GB")} ${t("count")}` : t("noStock");

  document.getElementById("grid").innerHTML = bikes.map(cardHTML).join("");

  document.getElementById("paginationInfo").textContent =
    totalRows
      ? `${t("showing")} ${fromItem.toLocaleString("en-GB")}-${toItem.toLocaleString("en-GB")} — ${t("page")} ${currentPage.toLocaleString("en-GB")} ${t("of")} ${maxPage.toLocaleString("en-GB")}`
      : "";

  document.getElementById("jumpPage").max = maxPage;
  document.getElementById("jumpPage").value = currentPage;

  renderPagination(maxPage);
}

function renderPagination(maxPage){
  const pagination = document.getElementById("pagination");
  const buttons = [];

  buttons.push(`<button class="nav" ${currentPage===1 ? "disabled" : ""} onclick="loadPage(${currentPage-1})">${t("previous")}</button>`);

  const pages = getPageList(currentPage, maxPage);

  pages.forEach(p=>{
    if(p === "..."){
      buttons.push(`<button disabled>...</button>`);
    }else{
      buttons.push(`<button class="${p===currentPage ? "active" : ""}" onclick="loadPage(${p})">${p}</button>`);
    }
  });

  buttons.push(`<button class="nav" ${currentPage===maxPage ? "disabled" : ""} onclick="loadPage(${currentPage+1})">${t("next")}</button>`);

  pagination.innerHTML = buttons.join("");
}

function getPageList(current,total){
  const delta = 2;
  const range = [];
  const rangeWithDots = [];
  let last;

  for(let i=1;i<=total;i++){
    if(i===1 || i===total || (i>=current-delta && i<=current+delta) || i<=9){
      range.push(i);
    }
  }

  for(const i of range){
    if(last){
      if(i-last===2){
        rangeWithDots.push(last+1);
      }else if(i-last!==1){
        rangeWithDots.push("...");
      }
    }
    rangeWithDots.push(i);
    last=i;
  }

  return rangeWithDots;
}

function jumpToPage(){
  const maxPage = Math.max(1, Math.ceil(totalRows / PAGE_SIZE));
  let p = Number(document.getElementById("jumpPage").value || 1);
  if(p < 1) p = 1;
  if(p > maxPage) p = maxPage;
  loadPage(p);
}

function imageHTML(bike){
  if(bike.image_url){
    return `
      <img
        class="real-image"
        src="${escapeHtml(bike.image_url)}"
        alt="${escapeHtml(bike.make)} ${escapeHtml(bike.model)}"
        loading="lazy"
        referrerpolicy="no-referrer"
        onerror="this.outerHTML=placeholderHTML()"
      >
    `;
  }

  return placeholderHTML();
}

function placeholderHTML(){
  return `
    <div class="placeholder">
      <img class="bg-logo" src="${logoFile}" alt="">
      <div class="placeholder-text">${t("register")}<small>${t("view")}</small></div>
    </div>
  `;
}

function cardHTML(bike){
  const id = normaliseBikeId(bike.id);

  if(!id){
    return "";
  }

  const watched = isWatched(id);
  const yearText = bike.year || "Year TBC";
  const ccText = bike.cc ? `${escapeHtml(bike.cc)}cc` : "CC TBC";
  const detailsUrl =
    `/bike-details.html?id=${encodeURIComponent(id)}`;

  return `
    <article
      class="card clickable-card"
      onclick="openBikeDetails('${id}')"
    >
      ${imageHTML(bike)}

      <div class="card-body">
        <span class="badge">${escapeHtml(t("available"))}</span>

        <h2>
          ${escapeHtml(bike.make)} ${escapeHtml(bike.model)}
        </h2>

        <div class="variant">
          ${bike.variant ? escapeHtml(bike.variant) : "&nbsp;"}
        </div>

        <div class="meta">
          <div>
            ${escapeHtml(yearText)} |
            ${escapeHtml(miles(bike.mileage))} |
            ${ccText}
          </div>

          ${
            bike.colour
              ? `<div>${escapeHtml(bike.colour)}</div>`
              : ""
          }
        </div>

        <div class="price">${escapeHtml(money(bike.price))}</div>
        <div class="price-note">${escapeHtml(t("priceNote"))}</div>

        <div class="actions">
          <a
            class="view-advert"
            href="${detailsUrl}"
            onclick="event.stopPropagation();"
          >
            View Full Advert
          </a>

          <button
            class="watch ${watched ? "active" : ""}"
            data-bike-id="${id}"
            onclick="event.stopPropagation();toggleWatch('${id}',this)"
          >
            ${escapeHtml(watched ? t("watched") : t("watch"))}
          </button>
        </div>
      </div>
    </article>
  `;
}

function openBikeDetails(value){
  const id = normaliseBikeId(value);

  if(!id){
    return;
  }

  window.location.href =
    `/bike-details.html?id=${encodeURIComponent(id)}`;
}

  
function findBike(id){
  return bikes.find(b=>String(b.id)===String(id));
}


async function loadUserInfo(){
  try{
    const {data,error} = await sb.auth.getUser();

    if(error){
      console.warn("Customer session unavailable",error.message);
    }

    currentUser = data?.user || null;
  }catch(error){
    console.warn("Customer session unavailable",error);
    currentUser = null;
  }
}

async function loadWatchlist(){
  watchedBikeIds = new Set();

  if(!currentUser) return;

  const { data, error } = await sb
    .from("customer_watchlist")
    .select("bike_id")
    .eq("customer_id", currentUser.id);

  if(error){
    console.error(error);
    return;
  }

  watchedBikeIds = new Set((data || []).map(row => String(row.bike_id)));
}

function isWatched(id){
  return watchedBikeIds.has(String(id));
}

async function toggleWatch(value,button){
  const bikeId = normaliseBikeId(value);

  if(!bikeId){
    return;
  }

  if(!currentUser){
    window.location.href = getCustomerLoginUrl();
    return;
  }

  if(watchUpdatesInProgress.has(String(bikeId))){
    return;
  }

  watchUpdatesInProgress.add(String(bikeId));

  if(button){
    button.disabled = true;
  }

  try{
    if(isWatched(bikeId)){
      const {error} = await sb
        .from("customer_watchlist")
        .delete()
        .eq("customer_id",currentUser.id)
        .eq("bike_id",bikeId);

      if(error){
        alert("Could not remove from watchlist: " + error.message);
        return;
      }

      watchedBikeIds.delete(String(bikeId));

      if(button){
        button.textContent = t("watch");
        button.classList.remove("active");
      }

      return;
    }

    const {error} = await sb
      .from("customer_watchlist")
      .insert({
        customer_id:currentUser.id,
        bike_id:bikeId
      });

    if(error){
      if(String(error.code) === "23505"){
        watchedBikeIds.add(String(bikeId));

        if(button){
          button.textContent = t("watched");
          button.classList.add("active");
        }

        return;
      }

      alert("Could not add to watchlist: " + error.message);
      return;
    }

    watchedBikeIds.add(String(bikeId));

    if(button){
      button.textContent = t("watched");
      button.classList.add("active");
    }

  }finally{
    watchUpdatesInProgress.delete(String(bikeId));

    if(button){
      button.disabled = false;
    }
  }
}

let searchTimer;

document.getElementById("search").addEventListener("input",()=>{
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{ savedSearchMinYear = null; savedSearchMaxPrice = null; loadPage(1); },350);
});

["model","year","priceRange","sortBy"].forEach(id=>{
  document.getElementById(id).addEventListener("change",()=>{ savedSearchMinYear = null; savedSearchMaxPrice = null; loadPage(1); });
});

document.getElementById("make").addEventListener("change",()=>{
  populateModels();
  savedSearchMinYear = null;
  savedSearchMaxPrice = null;
  loadPage(1);
});


window.addEventListener("anybikeCurrencyChanged", function(e){
  const selected = e.detail.currency || "GBP";

  localStorage.setItem("anybikeCurrency",selected);
  localStorage.setItem("anybike_currency",selected);

  render();
});

window.addEventListener("anybikeLanguageChanged", function(e){
  const selected = e.detail.language || "en";

  localStorage.setItem("anybikeLanguage",selected);
  localStorage.setItem("anybike_language",selected);

  render();
});

(async function init(){
  const params = new URLSearchParams(window.location.search);
  const urlMake = params.get("make") || "";
  const urlSearch = params.get("search") || "";
  savedSearchMinYear = params.get("minYear") || null;
  savedSearchMaxPrice = params.get("maxPrice") || null;

  applyLanguage();
  await loadUserInfo();
  await loadWatchlist();
  await loadFilterOptions();

  if(urlMake){
    document.getElementById("make").value = urlMake;
    populateModels();
  }

  if(urlSearch){
    document.getElementById("search").value = urlSearch;
  }

  await loadPage(currentPage);
})();
