
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AnyBike Offer | AnyBike</title>
<meta name="description" content="Review your AnyBike motorcycle offer, vehicle checks and offer terms.">
<link rel="icon" href="anybike-logo-new.jpg" type="image/jpeg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="/public-header.css?v=9000">
<style>
:root{
  --red:#ed1c24;
  --red-dark:#b90f17;
  --bg:#050505;
  --panel:#101010;
  --panel2:#171717;
  --panel3:#202020;
  --line:rgba(255,255,255,.12);
  --muted:#aaa;
  --text:#fff;
  --green:#36d37e;
  --green-soft:rgba(54,211,126,.11);
  --amber:#ffb547;
  --amber-soft:rgba(255,181,71,.10);
  --shadow:0 18px 45px rgba(0,0,0,.38);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
a{color:inherit}
main{max-width:1240px;margin:0 auto;padding:30px 18px 60px}
.back-link{display:inline-flex;align-items:center;gap:7px;color:#d8d8d8;text-decoration:none;font-weight:800;margin:3px 0 18px}
.back-link:hover{color:#fff}
.offer-shell{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.offer-head{display:flex;justify-content:space-between;gap:24px;padding:28px 30px;border-bottom:1px solid var(--line);align-items:flex-start;background:linear-gradient(135deg,#111,#080808)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:900;margin-bottom:8px}
h1{font-size:31px;line-height:1.15;margin:0 0 8px;color:#fff}
.subtitle{color:var(--muted);font-size:15px}
.badge{display:inline-flex;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:900;white-space:nowrap;border:1px solid transparent}
.badge.offer{background:var(--green-soft);color:var(--green);border-color:rgba(54,211,126,.32)}
.badge.expired{background:rgba(237,28,36,.12);color:#ff6d74;border-color:rgba(237,28,36,.35)}
.offer-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(340px,.65fr);gap:0}
.left{padding:28px 30px;border-right:1px solid var(--line);background:var(--panel)}
.right{padding:28px 30px;background:#0b0b0b}
.bike-hero{display:grid;grid-template-columns:310px minmax(0,1fr);gap:24px;align-items:start}
.bike-image{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:#090909;border:1px solid var(--line);box-shadow:0 10px 28px rgba(0,0,0,.35)}
.bike-title{font-size:26px;margin:0 0 6px;color:#fff}
.bike-variant{font-size:15px;color:var(--muted);margin-bottom:18px}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}
.spec{background:var(--panel2);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:11px 12px}
.spec small{display:block;color:#8d8d8d;font-size:11px;text-transform:uppercase;font-weight:900;letter-spacing:.05em;margin-bottom:4px}
.spec strong{font-size:14px;color:#fff}
.section{margin-top:28px;padding-top:25px;border-top:1px solid var(--line)}
.section h2{font-size:20px;margin:0 0 8px;color:#fff}
.section-intro{font-size:14px;color:var(--muted);margin-bottom:16px;line-height:1.5}
.check-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.check-row{display:flex;justify-content:space-between;gap:12px;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.check-row span:first-child{font-weight:800;color:#eee}
.check-value{font-weight:900;text-align:right}
.check-clear{color:var(--green)}
.check-warn{color:var(--amber)}
.check-alert{color:#ff6d74}
.check-note{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--amber-soft)!important;color:#ffd38a!important;border:1px solid rgba(255,181,71,.25);font-size:13px;line-height:1.45}
.price-box{background:linear-gradient(135deg,rgba(237,28,36,.18),rgba(237,28,36,.08));border:1px solid rgba(237,28,36,.45);border-radius:14px;padding:20px;margin-bottom:18px}
.price-label{font-size:13px;font-weight:900;color:#ff9ca0;margin-bottom:6px;letter-spacing:.04em}
.price-total{font-size:34px;font-weight:950;color:#fff}
.price-sub{font-size:12px;color:#cfcfcf;margin-top:5px}
.breakdown{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.row{display:flex;justify-content:space-between;gap:16px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
.row:last-child{border-bottom:0}
.row span:first-child{color:#aaa}
.row strong{text-align:right;color:#fff}
.row.total{background:var(--panel2);font-size:15px}
.row.total span:first-child,.row.total strong{color:#fff;font-weight:900}
.countdown{margin:16px 0 0;padding:13px 14px;border-radius:10px;background:rgba(237,28,36,.10);color:#ffb0b4;border:1px solid rgba(237,28,36,.28);font-weight:900;text-align:center}
.countdown.expired{background:rgba(237,28,36,.16);color:#ff737a}
.terms{font-size:13px;line-height:1.58;color:#c3c3c3;white-space:pre-line;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px}
.action-box{margin-top:22px;padding-top:22px;border-top:1px solid var(--line)}
.action-title{font-weight:900;margin-bottom:7px;color:#fff;font-size:17px}
.action-copy{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:14px}
.action-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:10px;padding:13px 14px;font-weight:900;font-size:14px;cursor:pointer}
.btn.accept{background:var(--red);color:white}
.btn.accept:not([disabled]):hover{background:var(--red-dark)}
.btn.decline{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.28)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pending-note{font-size:12px;color:#8f8f8f;margin-top:10px;text-align:center}
.loading,.error{padding:55px 30px;text-align:center;color:var(--muted)}
.error{color:#ff737a}
footer{text-align:center;color:#777;font-size:12px;padding:24px 16px 38px;background:#050505}
footer strong{color:#fff;letter-spacing:.08em}
@media(max-width:900px){
  .offer-grid{grid-template-columns:1fr}.left{border-right:0;border-bottom:1px solid var(--line)}
  .bike-hero{grid-template-columns:1fr}.bike-image{max-width:540px}
}
@media(max-width:560px){
  main{padding:16px 10px 40px}.offer-head,.left,.right{padding:20px 18px}.offer-head{flex-direction:column}
  h1{font-size:25px}.specs,.check-grid,.action-buttons{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="publicHeader"></div>
<main>
  <a class="back-link" href="customer-dashboard.html#my-offers">← Back to My Offers</a>
  <div class="offer-shell" id="offerShell">
    <div class="loading">Loading your AnyBike offer...</div>
  </div>
</main>
<footer><strong>ANYBIKE.CO.UK</strong><br>UK Motorcycle Export Specialists — Worldwide sourcing and export services.</footer>
<script src="/public-header.js?v=9200"></script>
<script>
const SUPABASE_URL="https://tuehtnezhdnkqbbhttgp.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_mrkBKDxEPVmdj2n7gPWsbg_l4CShtcK";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let activeOffer=null;
let countdownTimer=null;

function esc(v){return String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));}
function money(v){const n=Number(v);return Number.isFinite(n)?new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',minimumFractionDigits:0,maximumFractionDigits:2}).format(n):'—';}
function fmtDate(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function loginUrl(){return 'customer-register.html?return='+encodeURIComponent(location.pathname+location.search+location.hash);}
function statusClass(value){
  const v=String(value||'').toLowerCase();
  if(v==='clear'||v==='verified')return 'check-clear';
  if(v.includes('alert')||v.includes('recorded')||v.includes('discrepancy')||v.includes('scrapped'))return 'check-alert';
  return 'check-warn';
}
function displayStatus(value){return value&&String(value).trim()?esc(value):'Check Required';}
function checkRow(label,value){return `<div class="check-row"><span>${esc(label)}</span><span class="check-value ${statusClass(value)}">${displayStatus(value)}</span></div>`;}

function renderOffer(data){
  activeOffer=data;
  const b=data.motorcycle||{};
  const o=data.offer||{};
  const h=data.vehicle_history||null;
  const total=Number(o.total_offer_gbp||0);
  const bikePrice=Number(o.motorcycle_price_gbp||0);
  const delivery=Number(o.delivery_charge_gbp||0);
  const advertised=Number(b.advertised_price_gbp||0);
  const expired=o.expires_at && new Date(o.expires_at).getTime()<=Date.now();
  const title=[b.make,b.model].filter(Boolean).join(' ')||'Motorcycle';
  const image=b.image_url||'/images/placeholder-bike.jpg';

  let historyHtml='';
  if(!h){
    historyHtml=`
      <div class="check-grid">
        ${checkRow('Outstanding Finance','Check Required')}
        ${checkRow('Stolen Marker','Check Required')}
        ${checkRow('Insurance Write-Off','Check Required')}
        ${checkRow('Mileage Check','Check Required')}
        ${checkRow('Scrapped Marker','Check Required')}
        ${checkRow('Import / Export Marker','Check Required')}
      </div>
      <div class="check-note"><strong>Vehicle history check required.</strong> AnyBike has not yet recorded a verified vehicle-history result for this motorcycle. No item above should be treated as clear until it has been checked.</div>`;
  }else{
    historyHtml=`
      <div class="check-grid">
        ${checkRow('Outstanding Finance',h.finance_status)}
        ${checkRow('Stolen Marker',h.stolen_status)}
        ${checkRow('Insurance Write-Off',h.writeoff_status+(h.writeoff_category?` — ${h.writeoff_category}`:''))}
        ${checkRow('Mileage Check',h.mileage_status)}
        ${checkRow('Scrapped Marker',h.scrapped_status)}
        ${checkRow('Import / Export Marker',h.import_export_status)}
      </div>
      <div class="check-note" style="background:${String(h.check_status).toLowerCase()==='clear'?'#eaf8f0':'#fff5df'};color:${String(h.check_status).toLowerCase()==='clear'?'#17623d':'#744500'}">
        <strong>Overall check: ${esc(h.check_status||'Check Required')}</strong>${h.checked_at?` · Checked ${fmtDate(h.checked_at)}`:''}${h.customer_summary?`<br>${esc(h.customer_summary)}`:''}
      </div>`;
  }

  document.getElementById('offerShell').innerHTML=`
    <div class="offer-head">
      <div><div class="eyebrow">My AnyBike Offer</div><h1>${esc(title)}</h1><div class="subtitle">Review the motorcycle, vehicle checks and complete AnyBike offer before deciding.</div></div>
      <span class="badge ${expired?'expired':'offer'}">${expired?'Offer Expired':'AnyBike Offer'}</span>
    </div>
    <div class="offer-grid">
      <section class="left">
        <div class="bike-hero">
          <img class="bike-image" src="${esc(image)}" alt="${esc(title)}" onerror="this.src='/images/placeholder-bike.jpg'">
          <div>
            <h2 class="bike-title">${esc(title)}</h2>
            <div class="bike-variant">${esc(b.variant||'')}</div>
            <div class="specs">
              <div class="spec"><small>Year</small><strong>${esc(b.year||'—')}</strong></div>
              <div class="spec"><small>Mileage</small><strong>${b.mileage!=null?Number(b.mileage).toLocaleString('en-GB')+' miles':'—'}</strong></div>
              <div class="spec"><small>Colour</small><strong>${esc(b.colour||'—')}</strong></div>
              <div class="spec"><small>VAT Status</small><strong>${esc(b.vat_status||'Unknown / Check Required')}</strong></div>
              <div class="spec"><small>Advertised Motorcycle Price</small><strong>${advertised>0?money(advertised):'—'}</strong></div>
              <div class="spec"><small>Stock Reference</small><strong>${esc(data.stock_id||'—')}</strong></div>
            </div>
          </div>
        </div>

        <div class="section">
          <h2>Vehicle History & Security Check</h2>
          <div class="section-intro">These results are specific vehicle-history indicators. “Clear” is only shown where AnyBike has a recorded verified result; it does not mean the motorcycle is guaranteed to have never had unrecorded damage or repairs.</div>
          ${historyHtml}
        </div>

        <div class="section">
          <h2>Offer Terms</h2>
          <div class="terms"><strong>Sale basis:</strong> ${esc(o.sale_basis||'—')}<br><strong>Delivery / collection:</strong> ${esc(o.delivery_type||'—')}${o.delivery_destination?`<br><strong>Destination:</strong> ${esc(o.delivery_destination)}`:''}<br><strong>Payment terms:</strong> ${esc(o.payment_terms_text||'—')}${o.terms_text?`<br><br><strong>Specific offer terms:</strong><br>${esc(o.terms_text)}`:''}</div>
        </div>
      </section>

      <aside class="right">
        <div class="price-box"><div class="price-label">TOTAL ANYBIKE OFFER</div><div class="price-total">${money(total)}</div><div class="price-sub">Your complete AnyBike offer for this transaction</div></div>
        <div class="breakdown">
          <div class="row"><span>AnyBike motorcycle price</span><strong>${money(bikePrice)}</strong></div>
          ${delivery>0?`<div class="row"><span>Delivery / agreed services</span><strong>${money(delivery)}</strong></div>`:''}
          <div class="row total"><span>Total AnyBike offer</span><strong>${money(total)}</strong></div>
          <div class="row"><span>Deposit due on acceptance</span><strong>${money(o.deposit_amount_gbp||0)}</strong></div>
          <div class="row"><span>Offer valid until</span><strong>${fmtDate(o.expires_at)}</strong></div>
        </div>
        <div class="countdown ${expired?'expired':''}" id="offerCountdown">${expired?'Offer Expired':'Calculating time remaining...'}</div>

        <div class="action-box">
          <div class="action-title">Your decision</div>
          <div class="action-copy">Review the motorcycle and offer above. Acceptance will later continue directly to the deposit/payment-method stage. The motorcycle is not treated as secured merely because this offer has been sent.</div>
          <div class="action-buttons">
            <button class="btn accept" type="button" disabled>Accept AnyBike Offer</button>
            <button class="btn decline" type="button" disabled>Decline Offer</button>
          </div>
          <div class="pending-note">Decision buttons are shown in position but are not active until the customer acceptance/decline database functions are installed.</div>
        </div>
      </aside>
    </div>`;
  updateCountdown();
}

function updateCountdown(){
  const el=document.getElementById('offerCountdown');
  const expires=activeOffer?.offer?.expires_at;
  if(!el||!expires)return;
  const ms=new Date(expires).getTime()-Date.now();
  if(ms<=0){el.textContent='Offer Expired';el.classList.add('expired');return;}
  const d=Math.floor(ms/86400000),h=Math.floor((ms%86400000)/3600000),m=Math.floor((ms%3600000)/60000),s=Math.floor((ms%60000)/1000);
  el.textContent=d>0?`${d}d ${h}h ${m}m remaining`:`${h}h ${m}m ${s}s remaining`;
}

async function init(){
  const params=new URLSearchParams(location.search);
  const matchId=Number(params.get('match')||params.get('id'));
  if(!matchId){document.getElementById('offerShell').innerHTML='<div class="error">No AnyBike offer was specified.</div>';return;}
  let user=null;
  try{const {data}=await sb.auth.getSession();user=data?.session?.user||null;if(!user){const u=await sb.auth.getUser();user=u.data?.user||null;}}catch(e){console.error(e);}
  if(!user){location.replace(loginUrl());return;}
  const {data,error}=await sb.rpc('get_my_anybike_offer_detail',{p_match_id:matchId});
  if(error){console.error(error);document.getElementById('offerShell').innerHTML=`<div class="error">This offer could not be loaded. ${esc(error.message||'')}</div>`;return;}
  renderOffer(data);
  countdownTimer=setInterval(updateCountdown,1000);
}

document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
