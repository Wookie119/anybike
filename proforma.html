
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Proforma Invoice | AnyBike</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js?v=12000"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#ececec;color:#111;font-family:Arial,Helvetica,sans-serif}.toolbar{position:sticky;top:0;z-index:5;display:flex;justify-content:center;gap:10px;padding:12px;background:#080808;border-bottom:3px solid #ed1c24}.toolbar button,.toolbar a{border:0;border-radius:9px;padding:10px 16px;background:#ed1c24;color:#fff;font-weight:900;text-decoration:none;cursor:pointer}.page{width:min(920px,calc(100% - 28px));margin:28px auto;background:#fff;box-shadow:0 16px 48px rgba(0,0,0,.2);padding:44px}.head{display:grid;grid-template-columns:1fr 1fr;gap:30px;border-bottom:3px solid #ed1c24;padding-bottom:22px}.brand{background:#080808;padding:16px 20px;width:250px;max-width:100%;border-radius:8px}.brand img{width:100%;display:block}.doc-title{text-align:right}.doc-title h1{margin:0;font-size:34px}.doc-title strong{display:block;color:#ed1c24;margin-top:5px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:28px 0}.box{border:1px solid #ddd;border-radius:8px;padding:16px}.box h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#666}.box p{margin:4px 0;line-height:1.4}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.metric{background:#f6f6f6;border:1px solid #ddd;border-radius:8px;padding:14px}.metric span{display:block;color:#666;font-size:12px}.metric strong{display:block;margin-top:5px;font-size:20px}.lines{width:100%;border-collapse:collapse;margin-top:24px}.lines th,.lines td{padding:12px;border-bottom:1px solid #ddd;text-align:left}.lines th:last-child,.lines td:last-child{text-align:right}.warning{margin:26px 0;padding:16px;border:2px solid #ed1c24;background:#fff5f5;border-radius:8px}.warning strong{display:block;color:#ed1c24;font-size:18px}.payment{margin-top:24px;border-top:2px solid #111;padding-top:20px}.payment-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.payment-ref{padding:14px;background:#f4f4f4;border-radius:8px;font-size:18px;font-weight:900}.foot{margin-top:32px;padding-top:16px;border-top:1px solid #ddd;color:#555;font-size:12px;line-height:1.5}.error{padding:30px;border:1px solid #ed1c24;background:#fff5f5;border-radius:8px}@media(max-width:700px){.page{padding:24px}.head,.meta,.payment-grid{grid-template-columns:1fr}.doc-title{text-align:left}.summary{grid-template-columns:1fr}}@media print{body{background:#fff}.toolbar{display:none}.page{width:100%;margin:0;box-shadow:none;padding:16mm}}
</style>
</head>
<body>
<div class="toolbar"><button type="button" onclick="window.print()">Print / Save PDF</button><a href="payments-invoices.html">Payments & Invoices</a></div>
<main class="page" id="document"><p>Loading Proforma…</p></main>
<script>
const params=new URLSearchParams(location.search);const invoiceId=Number(params.get("invoice")||0);const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));const money=v=>new Intl.NumberFormat("en-GB",{style:"currency",currency:"GBP"}).format(Number(v||0));
function linesHtml(lines){return (lines||[]).map(l=>`<tr><td>${esc(l.description||l.line_type||"Line")}</td><td>${esc(l.quantity??1)}</td><td>${money(l.line_total_gbp)}</td></tr>`).join("")}
async function load(){const box=document.getElementById("document");if(!invoiceId){box.innerHTML='<div class="error">No invoice was selected.</div>';return}const {data:{session}}=await sb.auth.getSession();if(!session){location.href="login.html";return}const {data,error}=await sb.rpc("get_invoice_document_v1",{p_invoice_id:invoiceId});if(error){box.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}const d=data||{};const md=d.metadata||{};const issuer=md.issuer||{};const bank=md.bank||{};const warning=md.document_warning||"NOT A VAT INVOICE";const ref=md.payment_reference||d.deal_number||"";document.title=(d.invoice_number||"Proforma")+" | AnyBike";box.innerHTML=`<section class="head"><div><div class="brand"><img src="Anybike-email-logo-white.png" alt="AnyBike"></div><p><strong>${esc(issuer.trading_name||"Anybike")}</strong><br>${esc(issuer.legal_company_name||"")}<br>${esc(issuer.business_address||"")}</p></div><div class="doc-title"><h1>PROFORMA INVOICE</h1><strong>${esc(warning)}</strong><p>${esc(d.invoice_number||"")}<br>Deal ${esc(d.deal_number||"")}<br>${d.issued_at?esc(new Date(d.issued_at).toLocaleDateString("en-GB")):""}</p></div></section><section class="meta"><div class="box"><h3>Bill To</h3><p><strong>${esc(d.business_name||d.customer_name||"")}</strong></p>${d.business_name&&d.customer_name?`<p>${esc(d.customer_name)}</p>`:""}<p>${esc(d.billing_address||"")}<br>${esc(d.billing_city||"")} ${esc(d.billing_postcode||"")}<br>${esc(d.billing_country||"")}</p><p>${esc(d.customer_email||"")}${d.customer_phone?"<br>"+esc(d.customer_phone):""}</p></div><div class="box"><h3>AnyBike</h3><p>${esc(issuer.legal_company_name||"")} trading as ${esc(issuer.trading_name||"Anybike")}</p><p>Company No. ${esc(issuer.company_number||"")}<br>VAT No. ${esc(issuer.vat_number||"")}</p><p>${esc(issuer.email||"")}<br>${esc(issuer.phone||"")}</p></div></section><table class="lines"><thead><tr><th>Description</th><th>Qty</th><th>Amount</th></tr></thead><tbody>${linesHtml(d.lines)}</tbody></table><section class="summary"><div class="metric"><span>Subtotal</span><strong>${money(d.subtotal_gbp)}</strong></div><div class="metric"><span>Delivery</span><strong>${money(d.delivery_total_gbp)}</strong></div><div class="metric"><span>Total Due</span><strong>${money(d.total_gbp)}</strong></div></section><div class="warning"><strong>PROFORMA INVOICE — ${esc(warning)}</strong><span>No VAT breakdown is shown on this Proforma. VAT treatment remains subject to the final invoice stage.</span></div><section class="payment"><h2>Bank Transfer</h2><div class="payment-grid"><div><p><strong>Account name</strong><br>${esc(bank.account_name||"")}</p><p><strong>Sort code</strong><br>${esc(bank.sort_code||"")}</p><p><strong>Account number</strong><br>${esc(bank.account_number||"")}</p></div><div><p><strong>IBAN</strong><br>${esc(bank.iban||"")}</p><p><strong>BIC / SWIFT</strong><br>${esc(bank.bic||"")}</p><div class="payment-ref">Payment reference: ${esc(ref)}</div></div></div></section><footer class="foot">Please use the Deal reference exactly when making payment. Reporting a payment to AnyBike does not itself confirm that funds have arrived, and payment does not by itself secure a motorcycle.</footer>`}
load();
</script>
</body>
</html>
