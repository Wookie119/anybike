<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnyBike Shipping Conversation</title><meta name="robots" content="noindex,nofollow"><style>*{box-sizing:border-box}body{margin:0;background:#f3f3f3;color:#111;font-family:Arial}.wrap{width:min(94vw,850px);margin:35px auto}.head,.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:22px;margin-bottom:12px}.head{background:#111;color:#fff;border-top:4px solid #ed1c24}.messages{display:flex;flex-direction:column;gap:10px;max-height:55vh;overflow:auto}.msg{max-width:80%;padding:12px 14px;border-radius:12px;background:#eee}.msg.Shipper{align-self:flex-end;background:#ffe8e8}.msg.AnyBike{border:1px solid #ed1c24}.msg b,.msg small{display:block}.msg small{color:#777;margin-top:5px}textarea{width:100%;min-height:110px;padding:12px;border:1px solid #ccc;border-radius:10px}.btn{margin-top:10px;background:#ed1c24;color:#fff;border:0;border-radius:999px;padding:12px 18px;font-weight:900;cursor:pointer}.bad{color:#b00020}</style></head><body><div class="wrap"><div class="head"><h1>AnyBike Shipping Conversation</h1><p>Buyer ↔ Shipper ↔ AnyBike</p></div><div class="card"><h2 id="title">Loading…</h2><p id="summary"></p></div><div class="card"><div class="messages" id="messages"></div><textarea id="reply" placeholder="Reply to the buyer and AnyBike…"></textarea><button class="btn" id="send">Send Reply</button><div id="status"></div></div></div><script>
const token=new URLSearchParams(location.search).get("token")||"";const endpoint="https://tuehtnezhdnkqbbhttgp.supabase.co/functions/v1/shipper-conversation";
async function call(body){const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...body,token})});return r.json()}
async function load(){const d=await call({action:"lookup"});if(d.error){title.textContent="Conversation unavailable";status.textContent=d.error;status.className="bad";send.disabled=true;return}title.textContent=d.conversation.shipper_name+" ↔ "+(d.conversation.business_name||d.conversation.buyer_name||"Buyer");summary.textContent=[d.conversation.motorcycle_details,d.conversation.destination_country,d.conversation.destination_port].filter(Boolean).join(" · ");messages.innerHTML=(d.messages||[]).map(m=>'<div class="msg '+m.sender_type+'"><b>'+esc(m.sender_name||m.sender_type)+'</b>'+esc(m.message)+'<small>'+new Date(m.created_at).toLocaleString()+'</small></div>').join("");messages.scrollTop=messages.scrollHeight}
send.onclick=async()=>{if(!reply.value.trim())return;send.disabled=true;const d=await call({action:"reply",message:reply.value.trim()});send.disabled=false;if(d.error){status.textContent=d.error;status.className="bad";return}reply.value="";status.textContent="Reply sent.";await load()}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}load();</script></body></html>
