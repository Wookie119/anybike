<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnyBike Shipping Conversation</title><meta name="robots" content="noindex,nofollow"><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial}.wrap{width:min(96vw,1400px);margin:35px auto}.head,.card{background:#111;border:1px solid #303030;border-radius:14px;padding:22px;margin-bottom:12px}.head{background:#111;color:#fff;border-top:4px solid #ed1c24}.messages{display:flex;flex-direction:column;gap:10px;min-height:180px}.msg{max-width:80%;padding:12px 14px;border-radius:12px;background:#242424;color:#fff}.msg.Shipper{align-self:flex-end;background:#050505;color:#fff;border:1px solid #444} .msg.Customer{background:#fff;color:#111} .msg.Customer small{color:#666} .msg.AnyBike{background:#ed1c24;color:#fff;border-color:#ed1c24}.msg.AnyBike{border:1px solid #ed1c24;background:#ed1c24;color:#fff}.msg b,.msg small{display:block}.msg small{color:#aaa;margin-top:5px}textarea{width:100%;min-height:110px;padding:12px;border:1px solid #444;border-radius:10px;background:#080808;color:#fff}.btn{margin-top:10px;background:#ed1c24;color:#fff;border:0;border-radius:999px;padding:12px 18px;font-weight:900;cursor:pointer}.bad{color:#b00020}</style></head><body><div class="wrap"><div class="head"><a href="https://www.anybike.co.uk/" aria-label="AnyBike website"><img src="/anybike-logo-new.jpg" alt="AnyBike" style="display:block;width:165px;max-width:100%;height:auto;mix-blend-mode:screen"></a><div style="font-size:12px;color:#aaa;margin:5px 0">AnyBike.co.uk · International Motorcycle Sourcing &amp; Export</div><h1>Shipping Conversation</h1><p>Buyer ↔ Shipper ↔ AnyBike</p></div><div class="card"><h2 id="title">Loading…</h2><p id="summary"></p><div id="linkedPurchases" style="display:none;margin-top:16px;padding:14px;border:1px solid #353535;border-radius:12px;background:#191919"><div style="font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#aaa;margin-bottom:8px">Linked AnyBike purchases</div><div id="linkedPurchaseText" style="line-height:1.65"></div></div><div id="buyerIdentity" style="display:none;margin-top:16px;padding:14px;border:1px solid #ddd;border-radius:12px;background:#fafafa"><div style="font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#777;margin-bottom:8px">AnyBike client details</div><div id="buyerIdentityText" style="line-height:1.65"></div></div></div><div class="card"><div class="messages" id="messages"></div><textarea id="reply" placeholder="Reply to the buyer and AnyBike…"></textarea><button class="btn" id="send">Send Reply</button><div id="status"></div></div></div><script>
const token=new URLSearchParams(location.search).get("token")||"";const endpoint="https://tuehtnezhdnkqbbhttgp.supabase.co/functions/v1/shipper-conversation";
async function call(body){const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...body,token})});return r.json()}
async function load(){const d=await call({action:"lookup"});if(d.error){title.textContent="Conversation unavailable";status.textContent=d.error;status.className="bad";send.disabled=true;return}title.textContent=d.conversation.shipper_name+" ↔ "+(d.conversation.business_name||d.conversation.buyer_name||"Buyer");summary.textContent=[d.conversation.motorcycle_details,d.conversation.destination_country,d.conversation.destination_port].filter(Boolean).join(" · ");if(Array.isArray(d.conversation.linked_purchases)&&d.conversation.linked_purchases.length){linkedPurchases.style.display="block";linkedPurchaseText.innerHTML=d.conversation.linked_purchases.map(p=>"<div><strong>"+esc(p.deal_number)+"</strong> — "+esc(p.motorcycle)+" — Reg: "+esc(p.registration||"not recorded")+"</div>").join("");}
const parts=[];if(d.conversation.business_name)parts.push("<strong>Business:</strong> "+esc(d.conversation.business_name));if(d.conversation.buyer_name)parts.push("<strong>Contact:</strong> "+esc(d.conversation.buyer_name));if(d.conversation.business_country)parts.push("<strong>Country:</strong> "+esc(d.conversation.business_country));if(d.conversation.buyer_email)parts.push("<strong>Email:</strong> "+esc(d.conversation.buyer_email));if(d.conversation.buyer_phone)parts.push("<strong>Phone:</strong> "+esc(d.conversation.buyer_phone));if(parts.length){buyerIdentity.style.display="block";buyerIdentityText.innerHTML=parts.join("<br>");}messages.innerHTML=(d.messages||[]).map(m=>'<div class="msg '+m.sender_type+'"><b>'+esc(m.sender_name||m.sender_type)+'</b>'+esc(m.message)+'<small>'+new Date(m.created_at).toLocaleString()+'</small></div>').join("");messages.scrollTop=messages.scrollHeight}
send.onclick=async()=>{if(!reply.value.trim())return;send.disabled=true;const d=await call({action:"reply",message:reply.value.trim()});send.disabled=false;if(d.error){status.textContent=d.error;status.className="bad";return}reply.value="";status.textContent="Reply sent.";await load()}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}load();setInterval(()=>{if(!document.hidden&&document.activeElement!==reply)load()},5000);</script></body></html>
