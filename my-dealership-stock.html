<script>
const SUPABASE_URL =
  "https://tuehtnezhdnkqbbhttgp.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_mrkBKDxEPVmdj2n7gPWsbg_l4CShtcK";

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


let currentUser = null;
let dealership = null;
let stock = [];
let summary = null;
let stockFoundation = null;
let deliveryProfile = null;


function esc(value){
  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(match){
        return {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#39;"
        }[match];
      }
    );
}


function money(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){
    return "—";
  }

  const n=Number(value);
  return Number.isFinite(n) ? "£"+n.toFixed(2) : "—";
}


function parseMoneyInput(value){

  const cleaned =
    String(value ?? "")
      .replace(/£/g,"")
      .replace(/,/g,"")
      .trim();

  if(cleaned === ""){
    return null;
  }

  const number =
    Number(cleaned);

  return Number.isFinite(number)
    ? number
    : null;
}


function formatMoneyInput(id){

  const input =
    document.getElementById(id);

  if(!input){
    return;
  }

  const number =
    parseMoneyInput(
      input.value
    );

  if(number === null){
    input.value = "";
    return;
  }

  input.value =
    number.toLocaleString(
      "en-GB",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );
}


function openDatePicker(input){

  if(
    input &&
    typeof input.showPicker === "function"
  ){
    try{
      input.showPicker();
    }catch(error){
      // Browser may block showPicker in some edge cases.
    }
  }
}


function badge(
  text,
  className
){
  return `
    <span class="badge ${className || "blue"}">
      ${esc(text)}
    </span>
  `;
}


function opportunityBadge(row){

  switch(row.opportunity_status){

    case "active":
      return badge(
        "Trade Price Active",
        "green"
      );

    case "scheduled":
      return badge(
        "Scheduled",
        "amber"
      );

    case "call_off_today":
      return badge(
        "Call-Off Today",
        "red"
      );

    case "call_off_overdue":
      return badge(
        "Call-Off Overdue",
        "red"
      );

    default:
      return badge(
        "Add Trade Price",
        "blue"
      );
  }
}


function callOffText(row){

  if(
    row.days_to_call_off === null ||
    row.days_to_call_off === undefined
  ){
    return "No call-off date";
  }

  const days =
    Number(row.days_to_call_off);

  if(days < 0){
    return (
      Math.abs(days) +
      " days overdue"
    );
  }

  if(days === 0){
    return "Call-off today";
  }

  if(days === 1){
    return "1 day until call-off";
  }

  return (
    days +
    " days until call-off"
  );
}


function getCustomerLoginUrl(){

  const returnUrl =
    window.location.pathname +
    window.location.search +
    window.location.hash;

  return (
    "customer-register.html?return=" +
    encodeURIComponent(
      returnUrl
    )
  );
}


function redirectToCustomerLogin(){
  window.location.replace(
    getCustomerLoginUrl()
  );
}


function showNotice(
  message,
  type
){

  const notice =
    document.getElementById("notice");

  if(!notice){
    return;
  }

  notice.innerHTML =
    `<div class="notice ${
      type === "bad"
        ? "bad"
        : "good"
    }">${esc(message)}</div>`;

  setTimeout(
    function(){
      if(notice){
        notice.innerHTML = "";
      }
    },
    5000
  );
}


function openModal(
  title,
  html
){
  document.getElementById(
    "modalTitle"
  ).textContent = title;

  document.getElementById(
    "modalBody"
  ).innerHTML = html;

  document.getElementById(
    "modal"
  ).classList.add("open");
}


function closeModal(){
  document.getElementById(
    "modal"
  ).classList.remove("open");
}


async function loadUser(){

  let user = null;

  try{

    const {
      data:sessionData
    } =
      await sb.auth.getSession();

    user =
      sessionData?.session?.user ||
      null;


    if(!user){

      const {
        data:userData
      } =
        await sb.auth.getUser();

      user =
        userData?.user ||
        null;
    }

  }catch(error){

    console.error(
      "Login check failed",
      error
    );
  }


  currentUser =
    user || null;


  if(!currentUser){

    redirectToCustomerLogin();

    return false;
  }


  return true;
}


async function loadDealership(){

  const {
    data,
    error
  } =
    await sb.rpc(
      "dealer_get_my_dealership"
    );


  if(error){
    throw error;
  }


  const row =
    Array.isArray(data)
      ? data[0]
      : data;


  if(!row){

    throw new Error(
      "This AnyBike account is not linked to a verified dealership yet."
    );
  }


  dealership =
    row;


  const dealerName =
    document.getElementById(
      "dealerName"
    );

  const dealerLogo =
    document.getElementById(
      "dealerLogo"
    );


  dealerName.textContent =
    row.dealer_name;


  const logoUrl =
    String(
      row.dealer_logo_url || ""
    ).trim();


  if(logoUrl){

    dealerLogo.alt =
      row.dealer_name + " logo";

    dealerLogo.onload =
      function(){

        dealerLogo.classList.add(
          "is-visible"
        );

        dealerName.classList.add(
          "is-hidden"
        );
      };

    dealerLogo.onerror =
      function(){

        dealerLogo.classList.remove(
          "is-visible"
        );

        dealerName.classList.remove(
          "is-hidden"
        );
      };

    dealerLogo.src =
      logoUrl;

  }else{

    dealerLogo.removeAttribute(
      "src"
    );

    dealerLogo.classList.remove(
      "is-visible"
    );

    dealerName.classList.remove(
      "is-hidden"
    );
  }


  return row;
}

  deliveryProfile=Array.isArray(data)?(data[0]||null):data;

  const args={
    p_delivery_contact_name:document.getElementById("dpContactName").value.trim(),

  const saveBtn=document.querySelector('#modalContent .btn.red');
  if(saveBtn){saveBtn.disabled=true;saveBtn.textContent="Saving…";}

async function requestStockConnection(){
  const method=String(document.getElementById("stockConnectMethod")?.value||"").trim()||null;
  const provider=String(document.getElementById("stockConnectProvider")?.value||"").trim()||null;
  const notes=String(document.getElementById("stockConnectNotes")?.value||"").trim()||null;
  try{
    const {data,error}=await sb.rpc("dealer_request_stock_integration_v1",{
      p_provider_name:provider,
      p_connection_method:method,
      p_notes:notes
    });
    if(error)throw error;
    closeModal();
    showNotice("Stock connection request sent to AnyBike.","good");
    await loadStockFoundation();
  }catch(error){
    showNotice(error.message||"Stock connection request could not be sent.","bad");
  }
}

async function confirmRemainingManualStock(){
  const needs=stock.filter(function(row){
    return row.availability_method==="manual" && row.availability_status==="needs_confirmation";
  });
  if(!needs.length){
    showNotice("There is no manual stock waiting for confirmation.","good");
    return;
  }
  if(!window.confirm("Confirm all "+needs.length+" remaining manually managed motorcycles as still available? Mark sold/removed bikes individually first."))return;
  try{
    const ids=needs.map(function(row){return Number(row.dealer_stock_id);});
    const {data,error}=await sb.rpc("dealer_confirm_my_manual_stock_v1",{p_stock_ids:ids});
    if(error)throw error;
    showNotice(String(data?.confirmed_count||ids.length)+" motorcycles confirmed available.","good");
    await Promise.all([loadStock(),loadStockFoundation()]);
  }catch(error){
    showNotice(error.message||"Manual stock could not be confirmed.","bad");
  }
}

async function markDealerStockUnavailable(dealerStockId){
  const row=stock.find(function(x){return Number(x.dealer_stock_id)===Number(dealerStockId);});
  if(!row)return;
  if(!window.confirm("Mark "+[row.registration,row.make,row.model].filter(Boolean).join(" ")+" as sold / no longer available?"))return;
  try{
    const {error}=await sb.rpc("dealer_mark_my_stock_unavailable_v1",{p_stock_id:Number(dealerStockId),p_reason:"sold"});
    if(error)throw error;
    showNotice("Motorcycle marked no longer available.","good");
    await Promise.all([loadStock(),loadStockFoundation(),loadSummary()]);
  }catch(error){
    showNotice(error.message||"The motorcycle could not be updated.","bad");
  }
}

async function loadDealerBuyingActivity(){

  if(!currentUser){
    return;
  }

  const {
    data,
    error
  } =
    await sb.rpc(
      "get_my_buyer_match_dashboard_v3"
    );

  if(error){
    console.warn(
      "Dealer buying activity unavailable",
      error.message
    );
    return;
  }

  const rows =
    data || [];

  const offers =
    rows.filter(
      function(row){

        if(
          String(row?.match_status || "") !==
          "Confirmed Offer Sent"
        ){
          return false;
        }

        if(!row.confirmed_offer_expires_at){
          return true;
        }

        const expiry =
          new Date(
            row.confirmed_offer_expires_at
          ).getTime();

        return (
          !Number.isFinite(expiry) ||
          expiry > Date.now()
        );
      }
    );

  const purchases =
    rows.filter(
      function(row){

        const status =
          String(
            row?.match_status || ""
          );

        const decision =
          String(
            row?.customer_offer_decision || ""
          );

        return (
          status ===
            "Customer Accepted Offer" ||
          decision === "Accepted"
        );
      }
    );

  const offersEl =
    document.getElementById(
      "dealerOpenOffers"
    );

  const purchasesEl =
    document.getElementById(
      "dealerPurchases"
    );

  if(offersEl){
    offersEl.textContent =
      offers.length;
  }

  if(purchasesEl){
    purchasesEl.textContent =
      purchases.length;
  }
}

function renderStock(){

  const search =
    String(
      document.getElementById(
        "searchBox"
      )?.value || ""
    )
    .trim()
    .toLowerCase();


  const filter =
    document.getElementById(
      "filterBox"
    )?.value || "";


  let rows =
    stock.filter(
      function(row){

        const haystack =
          [
            row.registration,
            row.make,
            row.model,
            row.variant
          ]
          .join(" ")
          .toLowerCase();

        return haystack.includes(
          search
        );
      }
    );


  if(filter === "no_bottom_line"){

    rows =
      rows.filter(
        function(row){
          return (
            row.confidential_bottom_line_gbp ===
            null
          );
        }
      );
  }


  if(filter === "due_soon"){

    rows =
      rows.filter(
        function(row){

          if(
            row.days_to_call_off === null ||
            row.days_to_call_off === undefined
          ){
            return false;
          }

          const days =
            Number(
              row.days_to_call_off
            );

          return (
            days >= 0 &&
            days <= 14
          );
        }
      );
  }

  if(filter === "needs_confirmation"){
    rows=rows.filter(function(row){
      return row.intake_method==="manual" && row.availability_status==="needs_confirmation";
    });
  }


  const grid =
    document.getElementById(
      "stockGrid"
    );


  if(!rows.length){

    grid.innerHTML =
      '<div class="empty">No motorcycles match this view.</div>';

    return;
  }


  grid.innerHTML =
    rows.map(
      function(row){

        const vat =
          row.bottom_line_vat_treatment
            ? String(
                row.bottom_line_vat_treatment
              )
              .replaceAll(
                "_",
                " "
              )
            : "Not set";


        const urgencyClass =
          row.days_to_call_off !== null &&
          row.days_to_call_off !== undefined &&
          Number(
            row.days_to_call_off

            : "amber";


        return `
          <article class="stock-card">

            <div>
              <div class="stock-title">
                ${esc(row.make)}
                ${esc(row.model)}
              </div>

              <div class="stock-sub">
                ${esc(row.registration || "No registration")}
                ${row.year ? " • " + esc(row.year) : ""}
              </div>
            </div>

            <div style="display:flex;gap:7px;flex-wrap:wrap">
              ${opportunityBadge(row)}
              ${badge(row.intake_method==="feed"?"Feed":row.intake_method==="manual"?"Manual":"Source: "+String(row.intake_method||"other"),row.intake_method==="feed"?"green":"blue")}
              ${badge(row.availability_status==="needs_confirmation"?"Needs Availability Check":String(row.availability_status||"unknown").replaceAll("_"," "),row.availability_status==="available"?"green":row.availability_status==="needs_confirmation"?"amber":"red")}
            </div>

            <div class="price-row">

              <div class="data-box">
                <div class="k">Retail Price</div>
                <div class="v">
                  ${money(row.current_asking_price_gbp)}
                </div>
              </div>

              <div class="data-box">
                <div class="k">Confidential Trade Price</div>
                <div class="v">
                  ${money(row.confidential_bottom_line_gbp)}
                </div>
              </div>

            </div>

            <div class="price-row">

              <div class="data-box">
                <div class="k">Mileage</div>
                <div class="v">
                  ${
                    row.current_mileage !== null &&
                    row.current_mileage !== undefined
                      ? Number(row.current_mileage).toLocaleString("en-GB")
                      : "—"
                  }
                </div>
              </div>

              <div class="data-box">
                <div class="k">Trade Price VAT</div>
                <div class="v">
                  ${esc(vat)}
                </div>
              </div>

            </div>

            ${
              row.stocking_plan_call_off_date
                ? `
                  <div>
                    ${badge(
                      callOffText(row),
                      urgencyClass
                    )}
                  </div>
                `
                : ""
            }

            ${
              row.vat_confirmation_required
                ? `
                  <div class="badge red">
                    VAT confirmation required
                  </div>
                `
                : ""
            }

            <div class="stock-actions">
              <button
                class="btn red"
                onclick="editOpportunity(${Number(row.dealer_stock_id)})">
                ${
                  row.confidential_bottom_line_gbp === null
                    ? "Add Trade Price"
                    : "Update Trade Price"
                }
              </button>

              <button
                class="btn outline"
                onclick="editNote(${Number(row.dealer_stock_id)})">
                ${
                  String(row.opportunity_notes || "").trim()
                    ? "View / Edit Note"
                    : "Add Note"
                }
              </button>
              ${row.availability_method==="manual" && !["sold","removed"].includes(String(row.availability_status||"")) ? `
                <button class="btn outline" type="button" onclick="markDealerStockUnavailable(${Number(row.dealer_stock_id)})">
                  Sold / Remove
                </button>
              ` : ""}
            </div>

          </article>
        `;
      }
    ).join("");
}

async function saveNote(
  dealerStockId
){

  const row =
    stock.find(
      function(item){
        return (
          Number(item.dealer_stock_id) ===
          Number(dealerStockId)
        );
      }
    );


  if(!row){
    showNotice(
      "Motorcycle record could not be found.",
      "bad"
    );
    return;
  }


  const noteInput =
    document.getElementById(
      "mStockNote"
    );


  const note =
    String(
      noteInput?.value || ""
    ).trim() || null;


  const {
    error
  } =
    await sb.rpc(
      "dealer_update_my_stock_opportunity",
      {

        p_dealer_stock_id:
          dealerStockId,

        p_confidential_bottom_line_gbp:
          row.confidential_bottom_line_gbp ?? null,

        p_bottom_line_vat_treatment:
          row.bottom_line_vat_treatment || null,

        p_bottom_line_price_includes_vat:
          row.bottom_line_price_includes_vat === true
            ? true
            : row.bottom_line_price_includes_vat === false
              ? false
              : null,

        p_bottom_line_effective_from:
          row.bottom_line_effective_from || null,

        p_stocking_plan_call_off_date:
          row.stocking_plan_call_off_date || null,

        p_opportunity_reason:
          row.opportunity_reason || null,

        p_opportunity_notes:
          note,

        p_anybike_may_make_offers:
          true
      }
    );


  if(error){

    showNotice(
      error.message,
      "bad"
    );

    return;
  }


  closeModal();


  showNotice(
    note
      ? "Motorcycle note saved."
      : "Motorcycle note cleared.",
    "good"
  );


  await loadStock();
}


function updateVatEntryMode(){

  const vatSelect =
    document.getElementById("mVat");

  const wrap =
    document.getElementById("vatEntryModeWrap");

  const includedSelect =
    document.getElementById("mVatIncluded");

  if(!vatSelect || !wrap || !includedSelect){
    return;
  }

  const isFullVat =
    vatSelect.value === "full_vat";

  wrap.classList.toggle(
    "hidden",
    !isFullVat
  );

  if(!isFullVat){
    includedSelect.value = "";
  }
}

            ? null

  closeModal();

    "Confidential stock opportunity saved.",

async function waitForPublicHeader(){

  for(
    let i = 0;
    i < 50;
    i++
  ){

    if(
      document.querySelector(
        ".public-header"
      ) ||
      document.getElementById(
        "phUserArea"
      )
    ){
      return;
    }

    await new Promise(
      function(resolve){
        setTimeout(
          resolve,
          100
        );
      }
    );
  }
}


(async function init(){

  try{

    const ok =
      await loadUser();


    if(!ok){
      return;
    }


    await loadDealership();


    document.documentElement
      .classList.remove(
        "customer-auth-pending"
      );


    await Promise.all([
      loadStock(),
      loadSummary(),
      loadSavedSearchTotal(),
      loadDealerBuyingActivity(),
      loadStockFoundation(),
      loadDeliveryProfile()
    ]);


  }catch(error){

    console.error(
      "My Dealership failed",
      error
    );


    document.documentElement
      .classList.remove(
        "customer-auth-pending"
      );


    const notice =
      document.getElementById(
        "notice"
      );


    if(notice){

      notice.innerHTML =
        `<div class="notice bad">${esc(
          error.message ||
          "My Dealership could not be loaded."
        )}</div>`;
    }


    const grid =
      document.getElementById(
        "stockGrid"
      );


    if(grid){

      grid.innerHTML =
        '<div class="empty">Your dealership stock could not be loaded.</div>';
    }

  }

})();
</script>
