<body>
<div id="publicHeader"></div>
<div class="trade-gallery-viewer" id="tradeGalleryViewer" role="dialog" aria-modal="true" aria-label="Motorcycle photograph viewer"><div class="trade-viewer-header"><strong id="tradeViewerHeading">AnyBike</strong><button type="button" onclick="hideGalleryPhoto()">✕ Close</button></div><div class="trade-viewer-photo"><img id="galleryViewerImage" alt="Enlarged motorcycle photograph"></div><div id="galleryViewerCount" aria-live="polite"></div><div class="trade-viewer-actions"><button type="button" onclick="stepGalleryPhoto(-1)">← Previous</button><button type="button" onclick="stepGalleryPhoto(1)">Next →</button></div></div><main class="wrap">
  <section class="hero">
    <div class="eyebrow">AnyBike · UK Trade</div>
    <h1>Motorcycles to Underwrite</h1>
    
  </section>
  <div id="confirmations"></div><div id="mineDetailOverlay" class="mine-detail-overlay" hidden role="dialog" aria-modal="true" aria-label="Motorcycle details"></div>
  <nav class="offer-tabs" aria-label="Underwriting views">
    <button type="button" id="allOffersTab" class="active" onclick="showOfferView('all')">Available motorcycles</button>
    <button type="button" id="myOffersTab" onclick="showOfferView('mine')">My Trade Offers <span id="myBidCount"></span></button>
  </nav>
  
  <section id="opportunityFilters" class="notice" style="display:none" aria-label="Filter motorcycles">
  <strong style="display:block;color:#fff;margin-bottom:12px">Find a motorcycle</strong>
  <div class="filter-grid">
    <label>Make<select id="filterMake" onchange="updateTradeFilters(true)"><option value="">All makes</option></select></label>
    <label>Model<select id="filterModel" onchange="updateTradeFilters(false)"><option value="">All models</option></select></label>
    <label>Year<select id="filterYear" onchange="applyTradeFilters()"><option value="">All years</option></select></label>
    <label>Search<input id="opportunitySearch" type="search" oninput="applyTradeFilters()" placeholder="Keywords or reference…" aria-label="Search underwriting motorcycles"></label>
  </div>
  <div class="filter-bottom"><span id="filterCount" aria-live="polite"></span><button type="button" onclick="resetTradeFilters()">Clear filters</button></div>
</section>
  <div id="grid" class="grid"><div class="empty">Loading…</div></div>
</main>

<script>
const SUPABASE_URL="https://tuehtnezhdnkqbbhttgp.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_mrkBKDxEPVmdj2n7gPWsbg_l4CShtcK";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const money=v=>v===null||v===undefined?"—":"£"+Number(v).toLocaleString("en-GB",{maximumFractionDigits:0});
const moneyPrecise=v=>v===null||v===undefined?"—":"£"+Number(v).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});
function countdown(v){if(!v)return"—";const ms=new Date(v)-Date.now();if(ms<=0)return"Closed";const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000);return h+"h "+m+"m";}

let offerView=new URLSearchParams(location.search).get("view")==="mine"?"mine":"all";
let currentOpportunities=[];
function showOfferView(view){
  offerView=view==="mine"?"mine":"all";
  document.body.classList.toggle('my-trade-offers-view',offerView==='mine');
  document.getElementById("allOffersTab").classList.toggle("active",offerView==="all");
  document.getElementById("myOffersTab").classList.toggle("active",offerView==="mine");

  history.replaceState(null,"",location.pathname+(offerView==="mine"?"?view=mine":""));
  renderOpportunities(currentOpportunities);
  document.querySelector(".offer-tabs").scrollIntoView({behavior:"smooth",block:"start"});
}
function renderOpportunities(rows){
 const host=document.getElementById("grid");
 const own=rows.filter(r=>r.my_bid_gbp!==null&&r.my_bid_gbp!==undefined&&Number(r.my_bid_gbp)>0);
 document.getElementById("myBidCount").textContent="("+own.length+")";
 const display=offerView==="mine"?own:rows;
 const filter=document.getElementById("opportunityFilters");
 if(filter)filter.style.display=offerView==="all"&&display.length?"block":"none";
 if(!display.length){
   host.innerHTML='<div class="empty">'+(offerView==="mine"?"You have no active underwriting offers. Select Available motorcycles to browse and make an offer.":"No private trade opportunities are currently available to your dealership.")+'</div>';
   return;
 }
 host.classList.toggle('mine-grid',offerView==='mine');
 if(offerView==='mine')renderMyTradeOffers(display);else renderBikeCards(display);
 const target=new URLSearchParams(location.search).get("opportunity");
 if(target && /^\d+$/.test(target) && offerView==="all"){
  const card=Array.from(host.querySelectorAll("[data-opportunity-id]")).find(el=>el.dataset.opportunityId===target);
  if(card){
   card.style.border="2px solid #ed1c24";
   card.style.boxShadow="0 0 0 3px rgba(237,28,36,.14)";
   card.insertAdjacentHTML("afterbegin",'<div class="notice" style="margin:12px;background:#261213;border-color:#ed1c24"><strong>Your invitation — review this motorcycle and place your confidential bid below.</strong></div>');
   requestAnimationFrame(()=>card.scrollIntoView({behavior:"smooth",block:"start"}));
  } else {
   const note=document.createElement("p");
   note.className="notice";
   note.textContent="This motorcycle is not currently available to this dealership. Please contact AnyBike if you believe you were invited.";
   host.prepend(note);
  }
 }
 if(offerView==="all") updateTradeFilters(false);
}
async function load(){
  const {data:session}=await sb.auth.getSession();
  if(!session?.session){location.replace("/customer-register.html?return="+encodeURIComponent(location.pathname+location.search));return;}
  const inviteToken=new URLSearchParams(location.search).get("invite");
  if(inviteToken){
    const {data:claim,error:claimError}=await sb.rpc("trade_claim_seller_dealer_invite_v1",{p_token:inviteToken});
    const notice=document.getElementById("dealerInviteNotice")||document.createElement("div");
    notice.id="dealerInviteNotice";notice.className="notice";notice.setAttribute("role","status");
    notice.textContent=claimError?"Private dealer invitation: "+claimError.message:(claim?.message||"Invitation checked.");
    const grid=document.getElementById("grid");grid.parentNode.insertBefore(notice,grid);
  }
  const [{data,error},{data:confirmations,error:confirmationError}]=await Promise.all([
    sb.rpc("trade_get_my_underwrite_opportunities_v3"),
    sb.rpc("trade_get_my_bid_confirmations_v1")
  ]);
  renderConfirmations(confirmations||[],confirmationError);
  const host=document.getElementById("grid");
  if(error){
    if(/Verified trade account required/i.test(String(error.message||""))){
      host.innerHTML='<section class="empty status-panel"><div class="eyebrow">Your underwriting access</div><h2>There are no motorcycles to bid on here yet</h2><p>Your Level 2 account is approved. AnyBike is completing the dealership connection needed to show your private opportunities. Once that is ready, you can browse bikes and make your offers here.</p><div class="status-actions"><a class="btn red" href="/my-dealership.html">← My Dealership</a></div></section>';
    }else{
      host.innerHTML='<div class="empty">Unable to load opportunities right now. '+esc(error.message)+'</div>';
    }
    return;
  }
  currentOpportunities=data||[];
  document.body.classList.toggle('my-trade-offers-view',offerView==='mine');
  document.getElementById("allOffersTab").classList.toggle("active",offerView==="all");
  document.getElementById("myOffersTab").classList.toggle("active",offerView==="mine");

  renderOpportunities(currentOpportunities);
  try{await loadApprovedGalleries(currentOpportunities);renderOpportunities(currentOpportunities);}catch(e){console.error('Gallery details unavailable',e);}
}
let approvedGalleries={},dealerDescriptions={};
async function loadApprovedGalleries(rows){
 const results=await Promise.all(rows.map(async r=>{const {data,error}=await sb.rpc("trade_get_my_underwrite_gallery_v1",{p_opportunity_id:Number(r.opportunity_id)});return [r.opportunity_id,error?[]:(data||[])];}));
 approvedGalleries=Object.fromEntries(results);
 const descriptions=await Promise.all(rows.map(async r=>{const {data,error}=await sb.rpc("trade_get_my_underwrite_description_v1",{p_opportunity_id:Number(r.opportunity_id)});return [r.opportunity_id,error?"":(data||"")];}));
 dealerDescriptions=Object.fromEntries(descriptions);
}
function showGalleryPhoto(id,index){
 const list=approvedGalleries[id]||[];if(!list[index])return;
 const dialog=document.getElementById("tradeGalleryViewer");dialog.dataset.id=id;dialog.dataset.index=index;
 const bike=currentOpportunities.find(r=>Number(r.opportunity_id)===Number(id));
 document.getElementById("tradeViewerHeading").textContent=bike?"AnyBike · "+[bike.bike_year,bike.make,bike.model,bike.variant].filter(Boolean).join(" "):"AnyBike";
 document.getElementById("galleryViewerImage").src=list[index].photo_url;
 document.getElementById("galleryViewerCount").textContent="Photo "+(index+1)+" of "+list.length;
 dialog.classList.add("open");
}
function stepGalleryPhoto(step){const el=document.getElementById("tradeGalleryViewer"),list=approvedGalleries[el.dataset.id]||[];if(list.length)showGalleryPhoto(el.dataset.id,(Number(el.dataset.index)+step+list.length)%list.length);}
function hideGalleryPhoto(){document.getElementById("tradeGalleryViewer").classList.remove("open");}
function renderMyTradeOffers(rows){
 document.getElementById('grid').innerHTML=rows.map(r=>{
 const id=Number(r.opportunity_id),photos=approvedGalleries[id]||[],bike=[r.make,r.model,r.variant].filter(Boolean).join(' '),url=photos[0]?.photo_url||r.image_url||'/anybike-image-coming-soon.png';
 const open=r.closes_at?new Date(r.closes_at).getTime()>Date.now():true;
 return '<article class="mine-card" data-opportunity-id="'+id+'"><div class="mine-image"><img src="'+esc(url)+'" alt="'+esc(bike)+'" loading="lazy" onclick="showGalleryPhoto('+id+',0)" onerror="this.src=\'/anybike-image-coming-soon.png\'"><span>'+photos.length+' photos</span></div><div class="mine-body"><div class="mine-heading"><h2>'+esc(bike)+'</h2><b>'+(open?'Live':'Closed')+'</b></div><p class="mine-meta">'+esc(r.reference)+' · '+esc(r.bike_year||'Year TBC')+' · '+(r.mileage==null?'Mileage TBC':Number(r.mileage).toLocaleString('en-GB')+' miles')+'</p><div class="mine-bottom"><div class="mine-offer-amount"><small>Your confidential offer</small><strong>'+moneyPrecise(r.my_bid_gbp)+'</strong></div><div class="mine-time"><strong>'+(open?'Closes in '+esc(countdown(r.closes_at)):'Bidding closed')+'</strong></div></div><div class="mine-actions">'+(open?'<button type="button" class="mine-change" onclick="toggleMineEditor('+id+')">Change my offer →</button><button type="button" onclick="withdrawBid('+id+')">Withdraw</button>':'<small>Awaiting AnyBike review</small>')+'</div>'+(open?'<div id="mine-editor-'+id+'" class="mine-editor" hidden><div class="mine-editor-top"><strong>Change your confidential offer</strong><button type="button" class="mine-editor-close" aria-label="Close offer editor" onclick="toggleMineEditor('+id+',false)">✕ Close</button></div><label>Maximum offer (£)<input id="bid-'+id+'" type="number" min="1" step="1" value="'+esc(r.my_bid_gbp)+'"></label><label>Private note to AnyBike<textarea id="note-'+id+'" placeholder="Optional conditions"></textarea></label><button class="red" onclick="submitBid('+id+')">Save updated offer</button></div>':'')+'<button class="mine-detail" type="button" onclick="openMineDetails('+id+')">View motorcycle and photographs →</button></div></article>';
 }).join('');
}
function toggleMineEditor(id,show){const el=document.getElementById('mine-editor-'+id);if(el){el.hidden=typeof show==='boolean'?!show:!el.hidden;}}


let mineDetailIndex=0,mineDetailId=null;
function openMineDetails(id){
 const r=currentOpportunities.find(x=>Number(x.opportunity_id)===Number(id));
 if(!r)return;
 mineDetailId=Number(id);mineDetailIndex=0;
 const images=approvedGalleries[id]||[];
 const bike=[r.make,r.model,r.variant].filter(Boolean).join(' ');
 const photo=images[0]?.photo_url||r.image_url||'/anybike-image-coming-soon.png';
 const canUpdate=r.closes_at?new Date(r.closes_at).getTime()>Date.now():true;
 const overlay=document.getElementById('mineDetailOverlay');
 overlay.innerHTML='<div class="mine-detail-shell"><div class="mine-detail-bar"><span>'+esc(r.reference)+' · UK Trade Underwrite</span><button type="button" onclick="closeMineDetails()" aria-label="Close motorcycle details">✕ Close</button></div>'+
 '<div class="mine-detail-columns"><section class="mine-detail-photos" aria-label="Approved motorcycle photographs"><div class="mine-detail-stage"><img id="mineDetailPhoto" src="'+esc(photo)+'" alt="'+esc(bike)+'"><button type="button" class="mine-prev" onclick="stepMineDetails(-1)" aria-label="Previous photograph">‹</button><button type="button" class="mine-next" onclick="stepMineDetails(1)" aria-label="Next photograph">›</button><span id="minePhotoCount">'+(images.length?'1 of '+images.length+' photographs':'No approved photographs')+'</span></div><div class="mine-detail-thumbs">'+images.map((p,i)=>'<button type="button" class="'+(i===0?'active':'')+'" aria-label="Photograph '+(i+1)+'" onclick="showMinePhoto('+i+')"><img src="'+esc(p.photo_url)+'" alt="Motorcycle photograph '+(i+1)+'" loading="lazy"></button>').join('')+'</div></section>'+
 '<section class="mine-detail-info"><h2>'+esc(bike)+'</h2><p class="mine-detail-subtitle">'+esc(r.bike_year||'Year TBC')+' · '+(r.mileage==null?'Mileage to confirm':Number(r.mileage).toLocaleString('en-GB')+' miles')+'</p>'+
 '<div class="mine-detail-price"><strong>'+money(r.my_bid_gbp)+'</strong><span>Your confidential trade offer</span></div>'+
 '<p class="mine-detail-terms">Your offer includes agreed UK delivery to your dealership. All offers remain confidential and subject to AnyBike’s final checks.</p>'+
 '<dl class="mine-detail-fields"><div><dt>Make</dt><dd>'+esc(r.make||'—')+'</dd></div><div><dt>Model</dt><dd>'+esc(r.model||'—')+'</dd></div><div><dt>Mileage</dt><dd>'+(r.mileage==null?'To confirm':Number(r.mileage).toLocaleString('en-GB')+' miles')+'</dd></div><div><dt>Year</dt><dd>'+esc(r.bike_year||'—')+'</dd></div><div><dt>Registration</dt><dd>'+esc(images[0]?.registration||'To confirm')+'</dd></div></dl>'+
 '<div class="mine-detail-actions"><p class="mine-detail-deadline"><strong>'+(r.closes_at?(canUpdate?'Closes in '+esc(countdown(r.closes_at)):'Bidding closed'):'Closing time to confirm')+'</strong></p></div></section></div>'+
 '<section class="mine-detail-below"><h3>Description</h3><p>'+esc(dealerDescriptions[id]||'Motorcycle details are being prepared by AnyBike.')+'</p><h3>History and checks</h3><p class="mine-check-note">'+(r.hpi_clear===true?'Seller declares HPI clear — independent verification pending.':'HPI check pending — not yet independently verified.')+'</p><p class="mine-detail-small">AnyBike will confirm the motorcycle history, condition and sale arrangements before any transaction proceeds.</p></section></div>';
 overlay.hidden=false;overlay.scrollTop=0;document.body.classList.add('mine-detail-open');
}
function closeMineDetails(){document.getElementById('mineDetailOverlay').hidden=true;document.body.classList.remove('mine-detail-open');mineDetailId=null;}
function showMinePhoto(index){
 const images=approvedGalleries[mineDetailId]||[];if(!images.length)return;
 mineDetailIndex=(index+images.length)%images.length;
 document.getElementById('mineDetailPhoto').src=images[mineDetailIndex].photo_url;
 document.getElementById('minePhotoCount').textContent=(mineDetailIndex+1)+' of '+images.length+' photographs';
 document.querySelectorAll('.mine-detail-thumbs button').forEach((el,i)=>el.classList.toggle('active',i===mineDetailIndex));
}
function stepMineDetails(step){showMinePhoto(mineDetailIndex+step);}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mineDetailId!==null)closeMineDetails();else if(mineDetailId!==null&&e.key==='ArrowLeft')stepMineDetails(-1);else if(mineDetailId!==null&&e.key==='ArrowRight')stepMineDetails(1);});

function renderBikeCards(rows){
  const host=document.getElementById("grid");
  host.innerHTML=rows.map(r=>'<article class="card" data-opportunity-id="'+esc(r.opportunity_id)+'">'+
    '<div class="opportunity-main"><div class="photo-column"><div class="img"><img src="'+esc((approvedGalleries[r.opportunity_id]||[])[0]?.photo_url||r.image_url||"/anybike-image-coming-soon.png")+'" alt="Motorcycle photograph" onclick="showGalleryPhoto('+r.opportunity_id+',0)" style="cursor:zoom-in" onerror="this.src=\'/anybike-image-coming-soon.png\'"></div>'+
    '<div class="gallery-thumbnails">'+(approvedGalleries[r.opportunity_id]||[]).map((p,i)=>'<button type="button" title="Enlarge photo '+(i+1)+'" onclick="showGalleryPhoto('+r.opportunity_id+','+i+')"><img loading="lazy" src="'+esc(p.photo_url)+'" alt="Photo '+(i+1)+'"></button>').join("")+'</div>'+
    '</div>'+ 
    '<div class="body">'+
      '<div class="meta">'+esc(r.reference)+' · closes in '+esc(countdown(r.closes_at))+'</div>'+
      '<div class="bike">'+esc([r.make,r.model,r.variant].filter(Boolean).join(" "))+'</div>'+
      '<div class="data"><div class="box"><span>Make</span><strong>'+esc(r.make||"—")+'</strong></div><div class="box"><span>Model</span><strong>'+esc(r.model||"—")+'</strong></div><div class="box"><span>Year</span><strong>'+esc(r.bike_year||"To confirm")+'</strong></div><div class="box"><span>Registration</span><strong>'+esc((approvedGalleries[r.opportunity_id]||[])[0]?.registration||"To confirm")+'</strong></div><div class="box"><span>Mileage</span><strong>'+(r.mileage===null?"—":Number(r.mileage).toLocaleString("en-GB"))+'</strong></div></div>'+
      '<section class="dealer-description"><strong>Motorcycle description</strong><p>'+esc(dealerDescriptions[r.opportunity_id]||'Motorcycle details are being prepared by AnyBike. Please review the approved photographs and specifications.')+'</p><div class="delivered-note">✓ Your trade offer includes delivery to your dealership, subject to agreed UK delivery arrangements.</div></section>'+
      '<div class="hpi-status '+(r.hpi_clear===true?'clear':'pending')+'">'+(r.hpi_clear===true?'✓ Seller declares HPI clear — verification pending':'HPI check pending')+'</div>'+
      
      '</div></div><div class="bid-panel">'+
       '<label>Your confidential bid (£)<input id="bid-'+r.opportunity_id+'" type="number" min="1" step="1" value="'+esc(r.my_bid_gbp??"")+'" placeholder="Enter amount"></label>'+
      '<label>Notes to AnyBike only<textarea id="note-'+r.opportunity_id+'" placeholder="Optional conditions or notes"></textarea></label>'+
      '<div class="actions"><button class="red" onclick="submitBid('+r.opportunity_id+')">'+(r.my_bid_gbp?"Update My Bid":"Submit Bid")+'</button>'+
      (r.my_bid_gbp?'<button onclick="withdrawBid('+r.opportunity_id+')">Withdraw My Bid</button>':'')+
      '</div>'+
      (r.my_bid_gbp?'<div class="bid-status">Your active offer: '+money(r.my_bid_gbp)+' · Awaiting AnyBike review</div>':'')+
      '<div class="next-action"><strong>Your Next Action →</strong><p style="margin:6px 0;font-size:13px">'+(r.my_bid_gbp?'Your bid has been saved. Please enter your best and maximum offer before bidding closes — we want to give you the best opportunity to buy this motorcycle. Once bidding finishes, AnyBike reviews the offers and completes the necessary seller, history and condition checks. If your offer is successful, we will notify you by email, confirm the purchase and issue your invoice. Your motorcycle will then be delivered to your dealership with the available keys and documents, in line with the agreed delivery arrangements.':'Review the motorcycle and submit your confidential offer before the countdown ends. Final seller and HPI checks are required before any buyer is chosen.')+'</p>'+(r.my_bid_gbp?'<button type="button" onclick="showOfferView(\'mine\')">View My Trade Offers →</button>':'')+'</div>'+

    '</div></article>').join("");

}

function filterSource(){return offerView==="mine"?currentOpportunities.filter(r=>Number(r.my_bid_gbp)>0):currentOpportunities;}
function setFilterOptions(el,values,label){
 const previous=el.value;
 el.innerHTML='<option value="">'+label+'</option>'+values.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join("");
 el.value=values.includes(previous)?previous:"";
}
function updateTradeFilters(makeChanged){
 const rows=filterSource();
 const make=document.getElementById("filterMake");
 const model=document.getElementById("filterModel");
 const year=document.getElementById("filterYear");
 // Preserve the chosen make before rebuilding its options.
 const chosenMake=make.value;
 const chosenModel=makeChanged?"":model.value;
 const chosenYear=year.value;
 const makeNames=[...new Set(rows.map(r=>String(r.make||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
 setFilterOptions(make,makeNames,"All makes");
 make.value=makeNames.includes(chosenMake)?chosenMake:"";
 const matchingMake=rows.filter(r=>!make.value||String(r.make||"").trim().toLowerCase()===make.value.toLowerCase());
 const models=[...new Set(matchingMake.map(r=>String(r.model||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
 setFilterOptions(model,models,make.value?"All "+make.value+" models":"All models");
 model.value=models.includes(chosenModel)?chosenModel:"";
 const matchingModel=matchingMake.filter(r=>!model.value||String(r.model||"").trim()===model.value);
 const years=[...new Set(matchingModel.map(r=>String(r.bike_year||"").trim()).filter(Boolean))].sort((a,b)=>Number(b)-Number(a));
 setFilterOptions(year,years,"All years");
 year.value=years.includes(chosenYear)?chosenYear:"";
 applyTradeFilters();
}
function applyTradeFilters(){
 const make=document.getElementById("filterMake").value;
 const model=document.getElementById("filterModel").value;
 const year=document.getElementById("filterYear").value;
 const query=document.getElementById("opportunitySearch").value.toLowerCase().trim();
 let shown=0;
 document.querySelectorAll("#grid article.card").forEach(card=>{
   const r=currentOpportunities.find(o=>String(o.opportunity_id)===card.dataset.opportunityId);
   if(!r)return;
   const match=(!make||String(r.make||"").trim()===make)&&(!model||String(r.model||"").trim()===model)&&(!year||String(r.bike_year||"").trim()===year)&&(!query||[r.make,r.model,r.variant,r.bike_year,r.reference].join(" ").toLowerCase().includes(query));
   card.style.display=match?"":"none";
   if(match)shown++;
 });
 document.getElementById("filterCount").textContent=shown+" motorcycle"+(shown===1?"":"s")+" found";
}
function resetTradeFilters(){
 for(const id of ["filterMake","filterModel","filterYear","opportunitySearch"])document.getElementById(id).value="";
 updateTradeFilters(false);
}
function deliveryText(c){
  if(c.delivery_treatment==="included_by_anybike")return "Delivery to your confirmed dealership address is included by AnyBike.";
  if(c.delivery_treatment==="buyer_contribution")return "AnyBike will arrange delivery. Your delivery contribution is "+money(c.buyer_delivery_contribution_gbp)+".";
  return "AnyBike will arrange delivery. Delivery charge is "+money(c.buyer_delivery_contribution_gbp)+".";
}
function renderConfirmations(rows,error){
  const host=document.getElementById("confirmations");
  if(error){if(/Verified trade account required/i.test(String(error.message||""))){host.innerHTML="";return;}host.innerHTML='<div class="notice">Bid confirmation details could not be loaded: '+esc(error.message)+'</div>';return;}
  if(!rows.length){host.innerHTML="";return;}
  host.innerHTML='<section class="hero" style="padding:18px"><div class="eyebrow">Action Required</div><h2 style="margin:5px 0 10px">Confirm Your Bid</h2><p>AnyBike has selected one of your bids to progress. Please reconfirm your bid and confirm that the saved dealership delivery details below are still correct.</p></section>'+
  rows.map(c=>{
    const requested=c.confirmation_status==="requested";
    const address=[c.delivery_address_1,c.delivery_address_2,c.delivery_city,c.delivery_county,c.delivery_postcode,c.delivery_country].filter(Boolean).join(", ");
    return '<article class="card" style="margin-bottom:14px"><div class="body">'+
      '<div class="meta">'+esc(c.underwrite_reference)+' · '+esc(String(c.confirmation_type).replaceAll("_"," "))+'.</div>'+
      '<div class="bike">'+esc([c.make,c.model,c.variant].filter(Boolean).join(" "))+'.</div>'+
      '<div class="data"><div class="box"><span>Your bid</span><strong>'+money(c.bid_amount_gbp)+'</strong></div><div class="box"><span>Status</span><strong>'+esc(c.confirmation_status)+'</strong></div></div>'+
      '<p><strong>'+esc(deliveryText(c))+'</strong></p>'+
      (requested?'<div id="confirm-form-'+c.confirmation_id+'">'+
        '<div class="notice"><strong>Saved delivery details</strong><br>'+esc(c.delivery_company_name||"")+'<br>'+esc(c.delivery_contact_name||"")+' · '+esc(c.delivery_contact_phone||"")+' · '+esc(c.delivery_contact_email||"")+'<br>'+esc(address)+'<br><br><a class="btn" href="/my-dealership-stock.html">Update Delivery Details</a></div>'+
        '<label>Delivery reference<input id="reference-'+c.confirmation_id+'" value="'+esc(c.delivery_reference||"")+'" placeholder="Optional PO / branch reference"></label>'+
        '<label style="display:block;margin-top:8px">One-off delivery note<textarea id="delivery-notes-'+c.confirmation_id+'" placeholder="Optional note for this delivery only"></textarea></label>'+
        '<div class="actions"><button class="red" onclick="respondConfirmation('+c.confirmation_id+',\'confirm\')">Confirm Bid & Saved Delivery Details</button><button onclick="respondConfirmation('+c.confirmation_id+',\'decline\')">No Longer Available</button></div>'+
      '</div>':'<div class="notice">Your bid and saved dealership delivery details are confirmed. AnyBike will contact you if the transaction progresses.</div>')+
    '</div></article>';
  }).join("");
}
async function respondConfirmation(id,action){
  if(action==="decline"&&!confirm("Tell AnyBike you no longer wish to proceed at this bid?"))return;
  const args={p_confirmation_id:Number(id),p_action:action,p_delivery_reference:null,p_delivery_notes:null};
  if(action==="confirm"){
    args.p_delivery_reference=document.getElementById("reference-"+id).value.trim()||null;
    args.p_delivery_notes=document.getElementById("delivery-notes-"+id).value.trim()||null;
  }
  const {error}=await sb.rpc("trade_respond_bid_confirmation_v2",args);
  if(error){alert(error.message);return;}
  alert(action==="confirm"?"Your bid and saved delivery details are confirmed.":"AnyBike has been told you no longer wish to proceed.");
  await load();
}
async function submitBid(id){
  const amount=Number(document.getElementById("bid-"+id).value);
  const notes=document.getElementById("note-"+id).value.trim()||null;
  if(!amount||amount<=0){alert("Enter your bid amount.");return;}
  const {error}=await sb.rpc("trade_submit_underwrite_bid_v2",{p_opportunity_id:id,p_amount_gbp:amount,p_notes:notes});
  if(error){alert(error.message);return;} alert("Your confidential bid has been recorded by AnyBike."); await load();
}
async function withdrawBid(id){
  if(!confirm("Withdraw your current bid?"))return;
  const {error}=await sb.rpc("trade_withdraw_underwrite_bid_v2",{p_opportunity_id:id});
  if(error){alert(error.message);return;} await load();
}
load();
setInterval(()=>{document.querySelectorAll(".meta").forEach(()=>{});},60000);
</script>
