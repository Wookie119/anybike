<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | AnyBike</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#090909;color:#fff;font:17px Arial}main{max-width:520px;margin:8vh auto;padding:24px}section{background:#191919;border:1px solid #444;border-radius:16px;padding:26px}h1{margin-top:0}input,button{box-sizing:border-box;width:100%;padding:17px;margin:10px 0;border-radius:9px;font:inherit}input{background:#fff;color:#111;border:0}button{background:#ed1c24;color:white;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.5}a{color:#fff}#msg{line-height:1.5;min-height:24px}</style></head><body><main><section><h1 id="heading">Reset your password</h1><p id="intro">Enter the email address registered with AnyBike. We'll email you a secure reset link.</p><form id="resetForm"><label for="email">Registered email address</label><input id="email" type="email" autocomplete="email" required><button id="send" type="submit">Email password reset link</button></form><form id="newForm" hidden><label for="newPassword">New password (8 characters minimum)</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required><button id="save" type="submit">Save new password</button></form><p id="msg" role="status"></p><a href="/customer-login.html">Back to AnyBike login</a></section></main><script>
const sb=supabase.createClient("https://tuehtnezhdnkqbbhttgp.supabase.co","sb_publishable_mrkBKDxEPVmdj2n7gPWsbg_l4CShtcK",{auth:{detectSessionInUrl:true}});
const msg=document.getElementById("msg");
const urlParams=new URLSearchParams(location.search);
const emailHint=(urlParams.get("email")||"").trim();
if(emailHint)document.getElementById("email").value=emailHint;
const requestedReturn=urlParams.get("return")||"";
const safeReturn=requestedReturn.startsWith("/")&&!requestedReturn.startsWith("//")&&!requestedReturn.toLowerCase().includes("admin-")?requestedReturn:"/customer-dashboard.html";
const loginLink=document.querySelector('a[href="/customer-login.html"]');
loginLink.href="/customer-login.html?"+new URLSearchParams({return:safeReturn}).toString();
const recoveryRedirect="https://www.anybike.co.uk/customer-forgot-password.html?"+new URLSearchParams({return:safeReturn}).toString();
async function showRecovery(){document.getElementById("resetForm").hidden=true;document.getElementById("newForm").hidden=false;document.getElementById("heading").textContent="Choose a new password";document.getElementById("intro").textContent="Enter your new AnyBike password.";}
sb.auth.onAuthStateChange((event)=>{if(event==="PASSWORD_RECOVERY")showRecovery();});
(async()=>{const p=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.slice(1));if(p.get("type")==="recovery"&&p.get("token_hash")){const r=await sb.auth.verifyOtp({token_hash:p.get("token_hash"),type:"recovery"});if(r.error)msg.textContent=r.error.message;else await showRecovery();}else if(h.get("type")==="recovery"){const {data}=await sb.auth.getSession();if(data?.session)await showRecovery();}})();
document.getElementById("resetForm").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("send");b.disabled=true;msg.textContent="Requesting secure reset email…";try{const {error}=await sb.auth.resetPasswordForEmail(document.getElementById("email").value.trim(),{redirectTo:recoveryRedirect});msg.textContent=error?error.message:"If that address is registered, a password-reset email will arrive shortly. Please check junk mail too.";}catch(e){msg.textContent="Could not connect to the reset service. Please retry."}finally{b.disabled=false;}};
document.getElementById("newForm").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("save");b.disabled=true;msg.textContent="Saving new password…";try{const {data:sessionResult,error:sessionError}=await sb.auth.getSession();if(sessionError||!sessionResult?.session){msg.textContent="This reset link has expired or is invalid. Please request a new password reset email.";document.getElementById("newForm").hidden=true;document.getElementById("resetForm").hidden=false;return;}const {error}=await sb.auth.updateUser({password:document.getElementById("newPassword").value});if(error){msg.textContent=error.message;return;}await sb.auth.signOut();document.getElementById("newForm").hidden=true;msg.textContent="Password changed successfully. Select Back to AnyBike login to sign in with your new password.";}catch(error){msg.textContent="Could not save your password. Check your connection and try again.";}finally{b.disabled=false;}};
</script><script src="/visitor-tracker.js?v=auto"></script>
</body></html>
