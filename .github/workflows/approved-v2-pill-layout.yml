name: Approved V2 pill layout and model routes
on:
  push:
    paths:
      - 'model-template/approved-v2-preview-style.css'
      - 'motorcycle-v2-master.html'
      - 'motorcycle-model-guide.html'
      - 'data/universal-v2-model-routes.json'
      - 'sitemap-motorcycle-models.xml'
      - 'models/**'
      - 'scripts/check-approved-universal-pill-layout.mjs'
      - '.github/workflows/approved-v2-pill-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approved-pill-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-approved-universal-pill-layout.mjs
