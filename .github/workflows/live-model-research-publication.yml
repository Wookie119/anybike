name: Live approved model research publication
on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'
permissions:
  contents: read
jobs:
  public-model-research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify seven live approved motorcycle research feeds and BMW routes
        run: node scripts/check-live-model-research-publication.mjs
