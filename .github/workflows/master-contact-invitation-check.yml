name: Master contact invitation quick actions
on:
  push:
    branches: [main]
    paths:
      - 'admin-contact-directory.html'
      - 'scripts/check-admin-contact-quick-invites.mjs'
      - '.github/workflows/master-contact-invitation-check.yml'
  pull_request:
    paths:
      - 'admin-contact-directory.html'
      - 'scripts/check-admin-contact-quick-invites.mjs'
      - '.github/workflows/master-contact-invitation-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invitations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-admin-contact-quick-invites.mjs
