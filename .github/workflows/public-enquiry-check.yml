name: AnyBike guest lead form regression checks
on:
  push:
    branches: [main]
    paths:
      - 'anybike-connect.html'
      - 'vmoto.html'
      - 'bulk-buying-request.html'
      - 'bike-details.html'
      - 'partners-integrations.html'
      - 'uk-motorcycle-selling.js'
      - 'sell-your-motorcycle.html'
      - 'bmw-s1000rr.html'
      - 'international-vq-motorcycle.html'
      - 'scripts/check-public-enquiry-flows.mjs'
      - '.github/workflows/public-enquiry-check.yml'
  pull_request:
    paths:
      - 'anybike-connect.html'
      - 'vmoto.html'
      - 'bulk-buying-request.html'
      - 'bike-details.html'
      - 'partners-integrations.html'
      - 'uk-motorcycle-selling.js'
      - 'sell-your-motorcycle.html'
      - 'bmw-s1000rr.html'
      - 'international-vq-motorcycle.html'
      - 'scripts/check-public-enquiry-flows.mjs'
      - '.github/workflows/public-enquiry-check.yml'
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check that public lead routes remain connected
        run: node scripts/check-public-enquiry-flows.mjs
