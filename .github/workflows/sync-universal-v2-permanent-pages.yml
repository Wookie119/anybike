name: Synchronise permanent model pages with universal V2
on:
  push:
    paths:
      - 'scripts/refresh-universal-v2-permanent-pages.mjs'
      - '.github/workflows/sync-universal-v2-permanent-pages.yml'
      - 'motorcycle-v2-master.html'
      - 'motorcycle-brand.html'
      - 'motorcycle-model-library.html'
      - 'motorcycle-complete-catalogue-navigation.js'
      - 'scripts/check-universal-v2-rollout.mjs'
      - 'scripts/check-universal-v2-public-page-scripts.mjs'
      - 'model-template/approved-v2-universal-preview.mjs'
      - 'model-template/approved-v2-dynamic-navigation.mjs'
      - 'model-template/approved-v2-preview-style.css'
      - 'model-template/universal-page-section-contract.mjs'
      - 'model-template/universal-page-data.mjs'
      - 'model-template/universal-page-renderer.mjs'
      - 'model-template/public-verified-model-facts.mjs'
      - 'data/universal-v2-model-routes.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: universal-v2-permanent-pages
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate safe bulk updater
        run: node --check scripts/refresh-universal-v2-permanent-pages.mjs
      - name: Validate shared universal model modules
        run: |
          node --check model-template/approved-v2-universal-preview.mjs
          node --check model-template/approved-v2-dynamic-navigation.mjs
          node --check model-template/universal-page-section-contract.mjs
          node --check model-template/universal-page-data.mjs
          node --check model-template/universal-page-renderer.mjs
          node --check model-template/public-verified-model-facts.mjs
          node --check scripts/check-universal-v2-rollout.mjs
          node --check motorcycle-complete-catalogue-navigation.js
      - name: Validate manufacturer and model-library browser scripts
        run: node scripts/check-universal-v2-public-page-scripts.mjs
      - name: Synchronise all permanent model pages
        run: node scripts/refresh-universal-v2-permanent-pages.mjs
      - name: Verify generated routes are stable after synchronisation
        run: |
          git diff -- models/ > /tmp/anybike-v2-first-pass.diff
          node scripts/refresh-universal-v2-permanent-pages.mjs
          git diff -- models/ > /tmp/anybike-v2-second-pass.diff
          cmp /tmp/anybike-v2-first-pass.diff /tmp/anybike-v2-second-pass.diff
      - name: Check universal model page integrity
        run: node scripts/check-approved-universal-pill-layout.mjs
      - name: Verify universal model publication and route contracts
        run: node scripts/check-universal-v2-rollout.mjs
      - name: Commit only generated permanent model pages
        if: github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- models/; then
            git config user.name "AnyBike Universal V2 Bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add models/
            git commit -m "Synchronise all permanent model URLs with approved universal V2 assets"
            git push origin HEAD:main
          fi
