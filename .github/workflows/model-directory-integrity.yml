name: Model guide directory integrity
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'anybike-global.html'
      - 'international-markets.html'
      - 'how-anybike-export-works.html'
      - 'motorcycle-brand.html'
      - 'motorcycle-manufacturers.html'
      - 'motorcycle-types.html'
      - 'motorcycle-type-*.html'
      - 'motorcycle-models.html'
      - 'sitemap.xml'
      - 'data/universal-v2-model-routes.json'
      - 'models/**'
      - 'scripts/build-manufacturer-model-directory.mjs'
      - '.github/workflows/model-directory-integrity.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'anybike-global.html'
      - 'international-markets.html'
      - 'how-anybike-export-works.html'
      - 'motorcycle-brand.html'
      - 'motorcycle-manufacturers.html'
      - 'motorcycle-types.html'
      - 'motorcycle-type-*.html'
      - 'motorcycle-models.html'
      - 'sitemap.xml'
      - 'data/universal-v2-model-routes.json'
      - 'models/**'
      - 'scripts/build-manufacturer-model-directory.mjs'
      - '.github/workflows/model-directory-integrity.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-manufacturer-model-directory.mjs --check
