name: Protect BMW and Harley model research
on:
  push:
    paths:
      - 'bmw-*.html'
      - 'harley-davidson-*.html'
      - 'data/approved-dedicated-model-routes.json'
      - 'scripts/check-dedicated-bmw-harley-content-preservation.mjs'
      - '.github/workflows/protect-bmw-harley-research.yml'
  pull_request:
    paths:
      - 'bmw-*.html'
      - 'harley-davidson-*.html'
      - 'data/approved-dedicated-model-routes.json'
      - 'scripts/check-dedicated-bmw-harley-content-preservation.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protect-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-dedicated-bmw-harley-content-preservation.mjs
