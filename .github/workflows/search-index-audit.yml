name: AnyBike search indexing audit
on:
  push:
    branches: [main]
    paths:
      - 'sitemap.xml'
      - 'robots.txt'
      - 'motorcycle-brand.html'
      - 'motorcycle-model-guide.html'
      - 'markets/**'
      - 'scripts/check-search-index-coverage.mjs'
      - 'scripts/check-model-guide-indexing-gate.mjs'
      - '.github/workflows/search-index-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  index-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate manufacturer, model and country sitemap
        run: node scripts/check-search-index-coverage.mjs
      - name: Validate index and canonical gates
        run: node scripts/check-model-guide-indexing-gate.mjs
