name: AnyBike search indexing audit
on:
  push:
    branches: [main]
    paths:
      - 'sitemap.xml'
      - 'data/motorcycle-index-identities.json'
      - 'data/model-rollout-coverage-*.json'
      - 'data/indian-heritage-research.json'
      - 'global/burt-munro-worlds-fastest-indian.html'
      - 'global/indian-scout-chief-and-springfield-history.html'
      - 'global/victory-polaris-indian-motorcycle-revival.html'
      - 'model-template/public-verified-model-facts.mjs'
      - 'model-template/public-approved-model-hero.mjs'
      - 'model-template/public-approved-model-gallery.mjs'
      - 'shared-model-catalogue.js'
      - 'robots.txt'
      - 'motorcycle-brand.html'
      - 'indian-motorcycles.html'
      - 'motorcycle-model-guide.html'
      - 'markets/**'
      - 'scripts/check-search-index-coverage.mjs'
      - 'scripts/build-model-sitemap.mjs'
      - 'scripts/check-model-history-preservation.mjs'
      - 'scripts/test-model-generation-identity.mjs'
      - 'scripts/check-model-guide-indexing-gate.mjs'
      - 'scripts/build-model-rollout-coverage.mjs'
      - 'scripts/check-public-model-research-rpc.mjs'
      - '.github/workflows/search-index-audit.yml'
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  index-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test reintroduced model generations remain distinct
        run: node scripts/test-model-generation-identity.mjs
      - name: Guard historical model identities and review exclusions
        run: node scripts/check-model-history-preservation.mjs
      - name: Confirm model sitemap matches published Supabase identities
        run: node scripts/build-model-sitemap.mjs --check
      - name: Validate manufacturer, model and country sitemap
        run: node scripts/check-search-index-coverage.mjs
      - name: Check manufacturer-by-manufacturer model rollout coverage
        run: node scripts/build-model-rollout-coverage.mjs --check
      - name: Verify public Supabase research delivery and model isolation
        run: node scripts/check-public-model-research-rpc.mjs
      - name: Check universal model renderer JavaScript syntax
        run: node --check model-template/public-verified-model-facts.mjs
      - name: Validate index and canonical gates
        run: node scripts/check-model-guide-indexing-gate.mjs
