name: Public SEO sitemap integrity
on:
  push:
    branches: [main]
    paths:
      - 'sitemap.xml'
      - 'markets/**'
      - 'global/**'
      - 'motorcycle-*.html'
      - 'bmw-*.html'
      - 'harley-davidson-*.html'
      - 'scripts/check-public-seo-sitemap.mjs'
      - 'scripts/check-public-seo-quality.mjs'
      - 'scripts/build-public-seo-inventory.mjs'
      - 'scripts/check-shared-manufacturer-seo.mjs'
      - 'motorcycle-manufacturers.html'
      - 'motorcycle-brand.html'
      - 'model-template/**'
      - 'data/motorcycle-model-guides.json'
      - 'data/motorcycle-catalogue-base.json'
      - 'scripts/check-bmw-shared-model-data.mjs'
      - 'scripts/check-bmw-db-navigation.test.mjs'
      - 'scripts/check-bmw-database-live-stock-guards.test.mjs'
      - 'scripts/check-existing-bmw-approved-shell.test.mjs'
      - 'scripts/check-universal-page-data.mjs'
      - 'public-international-model-stock.js'
      - '.github/workflows/public-seo-audit.yml'
  pull_request:
    paths:
      - 'sitemap.xml'
      - 'markets/**'
      - 'global/**'
      - 'motorcycle-*.html'
      - 'bmw-*.html'
      - 'harley-davidson-*.html'
      - 'scripts/check-public-seo-*.mjs'
      - '.github/workflows/public-seo-audit.yml'
  schedule:
    - cron: '20 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check sitemap does not contain private, missing or noindex pages
        run: node scripts/check-public-seo-sitemap.mjs
      - name: Audit all indexable public pages and market coverage
        run: node scripts/check-public-seo-quality.mjs
      - name: Check approved manufacturer A-Z sitemap URLs
        run: node scripts/check-shared-manufacturer-seo.mjs
      - name: Check locked BMW models use the same safe editorial contract
        run: node scripts/check-bmw-shared-model-data.mjs
      - name: Verify BMW database navigation has no self or duplicate links
        run: node --test scripts/check-bmw-db-navigation.test.mjs
      - name: Check live stock and approved BMW research safeguards
        run: node --test scripts/check-bmw-database-live-stock-guards.test.mjs scripts/check-existing-bmw-approved-shell.test.mjs
      - name: Reject unapproved universal page content and promotional model identities
        run: node scripts/check-universal-page-data.mjs
      - name: Report omitted public pages for review
        run: node scripts/build-public-seo-inventory.mjs
