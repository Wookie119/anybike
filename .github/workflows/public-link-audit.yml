name: AnyBike public link audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * 1"

permissions:
  contents: read

jobs:
  static-public-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test central editorial link graph
        run: node --test scripts/public-editorial-link-graph.test.mjs scripts/catalogue-link-adapter.test.mjs scripts/build-editorial-url-inventory.test.mjs scripts/assemble-public-editorial-graph.test.mjs scripts/render-editorial-related-links.test.mjs scripts/stage-editorial-navigation.test.mjs scripts/stage-real-catalogue-pilot.test.mjs scripts/match-catalogue-guides.test.mjs scripts/stage-matched-catalogue.test.mjs scripts/verified-editorial-route-identities.test.mjs scripts/check-registered-editorial-indexability.test.mjs scripts/audit-country-indexability.test.mjs scripts/build-country-route-candidates.test.mjs scripts/regional-market-navigation.test.mjs scripts/stage-country-regional-navigation.test.mjs scripts/audit-country-code-crosswalk.test.mjs scripts/build-verified-editorial-navigation.test.mjs scripts/editorial-release-gate.test.mjs scripts/export-private-editorial-from-postgres.test.mjs scripts/extract-approved-model-hero.test.mjs scripts/stage-approved-model-source-extracts.test.mjs scripts/extract-approved-model-photo-references.test.mjs scripts/stage-approved-model-photo-references.test.mjs scripts/audit-manufacturer-directory.test.mjs scripts/audit-catalogue-manufacturer-resolution.test.mjs scripts/extract-model-section-candidates.test.mjs scripts/stage-model-content-evidence.test.mjs model-template/universal-motorcycle-v2.test.mjs
      - name: Guard exact-model stock above independent research
        run: node --check public-header.js && node scripts/check-international-model-stock-exact.mjs && node scripts/check-all-international-model-pages.mjs
      - name: Scan all source HTML links
        run: node scripts/audit-public-links.mjs --json > anybike-link-audit.json
      - name: Inventory editorial source URLs
        run: node scripts/build-editorial-url-inventory.mjs > anybike-editorial-url-inventory.json
      - name: Strict indexability source audit for 47 registered routes
        run: node scripts/check-registered-editorial-indexability.mjs > anybike-indexability-audit-summary.json
      - name: Audit all international country indexing signals
        run: node scripts/audit-country-indexability.mjs > anybike-country-indexability.json
      - name: Prepare safe private country-route candidates
        run: node scripts/build-country-route-candidates.mjs anybike-country-indexability.json > anybike-country-route-candidates.json
      - name: Stage 217-country regional navigation preview (never deploy)
        run: node scripts/stage-country-regional-navigation.mjs > anybike-regional-navigation-preview.json
      - name: Check 217 country names, 216 verified country codes and Kosovo exception
        run: node scripts/check-country-code-sources.mjs > anybike-country-codes-summary.json
      - name: Audit the full 50-manufacturer A-Z catalogue and links
        run: node scripts/audit-manufacturer-directory.mjs > anybike-manufacturer-directory-summary.json
      - name: Check live pilot public pages
        run: node scripts/audit-live-public-pages.mjs > anybike-live-public-audit.json
      - name: Stage real BMW and Harley catalogue navigation (non-deploying)
        run: node scripts/stage-real-catalogue-pilot.mjs > anybike-catalogue-pilot.json
      - name: Stage expanded BMW Harley catalogue guides (non-deploying)
        run: node scripts/stage-matched-catalogue.mjs > anybike-expanded-catalogue-preview.json
      - name: Publish summary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync('anybike-link-audit.json', 'utf8'));
          const editorial = JSON.parse(fs.readFileSync('anybike-editorial-url-inventory.json', 'utf8'));
          const live = JSON.parse(fs.readFileSync('anybike-live-public-audit.json', 'utf8'));
          const googleAudit = JSON.parse(fs.readFileSync('reports/editorial-indexability-audit.json','utf8'));
          const countryAudit = JSON.parse(fs.readFileSync('anybike-country-indexability.json','utf8'));
          const countryCandidates = JSON.parse(fs.readFileSync('anybike-country-route-candidates.json','utf8'));
          const regional = JSON.parse(fs.readFileSync('anybike-regional-navigation-preview.json','utf8'));
          const crosswalk = JSON.parse(fs.readFileSync('reports/country-code-crosswalk-audit.json','utf8'));
          const pilot = JSON.parse(fs.readFileSync('anybike-catalogue-pilot.json', 'utf8'));
          const expanded = JSON.parse(fs.readFileSync('anybike-expanded-catalogue-preview.json', 'utf8'));
          const manufacturersAudit = JSON.parse(fs.readFileSync('reports/manufacturer-directory-audit.json','utf8'));

          const output = [
            '## AnyBike source HTML link audit',
            '',
            '| Metric | Result |',
            '| --- | ---: |',
            '| HTML files scanned | ' + r.htmlPages + ' |',
            '| Missing local links | ' + r.missingLinkCount + ' |',
            '| Country pages scanned | ' + r.countryPagesScanned + ' |',
            '| Country structural issues | ' + r.marketNavigationIssues.length + ' |',
            '| Editorial source URL candidates | ' + editorial.counts.total + ' |',
            '| Editorial source candidates needing review | ' + editorial.counts.flagged + ' |',
            '| Live pilot pages passing HTTP smoke checks | ' + live.passed + '/' + live.results.length + ' |',
            '| Registered guide source pages eligible for Google | ' + googleAudit.sourceEligibleCount + '/' + googleAudit.checkedCount + ' |',
            '| Google source-indexability issues | ' + googleAudit.issues.length + ' |',
            '| International market pages source-eligible | ' + countryAudit.counts.sourceEligible + '/' + countryAudit.counts.marketHtmlFiles + ' |',
            '| International market SEO issues | ' + countryAudit.issues.length + ' |',
            '| Private country route candidates prepared | ' + countryCandidates.counts.candidates + ' |',
            '| Regional navigation preview pages | ' + regional.stagedPages + ' |',
            '| Regional country links generated in preview | ' + regional.generatedCountryLinks + ' |',
            '| Verified standard country codes | ' + crosswalk.counts.verifiedUniqueCodes + ' |',
            '| Country territories without an assigned ISO alpha-2 code | ' + crosswalk.counts.unresolvedNames + ' |',
            '| BMW/Harley staging preview pages | ' + pilot.staging.staged.length + ' |',
            '| Reciprocal preview links | ' + pilot.links + ' |',
            '| Expanded catalogue models compared | ' + expanded.catalogueModels + ' |',
            '| Matched expanded guide sources | ' + expanded.matchedPublicGuideSources + ' |',
            '| Expanded preview links | ' + expanded.reciprocalPreviewLinks + ' |',
            '| Manufacturer A-Z cards matching the catalogue | ' + manufacturersAudit.counts.directoryCards + '/' + manufacturersAudit.counts.catalogueManufacturers + ' |',
            '| Manufacturer A-Z links to approved dedicated guides | ' + manufacturersAudit.counts.linksToApprovedGuides + ' |',
            '| Manufacturer A-Z links to existing sourcing workflow | ' + manufacturersAudit.counts.linksToSourcing + ' |',
            '| Selected public pages with no incoming static HTML links | ' + r.selectedPublicPagesWithNoIncomingStaticLinks.length + ' |',
            '',
            'This scan is **informational** and does not assert that live 123-reg pages, JavaScript-generated links, database content, or responsive designs passed.',
            'Open the uploaded JSON report for individual findings.'
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, output + '\n');
          if (manufacturersAudit.issues.length || manufacturersAudit.counts.directoryCards !== 50 || manufacturersAudit.counts.linksToSourcing !== 48 || crosswalk.issues.length || crosswalk.counts.verifiedUniqueCodes !== 216 || crosswalk.counts.unresolvedNames !== 1 || regional.errors.length || regional.stagedPages !== 217 || countryAudit.issues.length || countryAudit.counts.marketHtmlFiles !== 217 || countryAudit.counts.sourceEligible !== 217) {
            console.error('Country SEO audit regression: see anybike-country-indexability.json for affected pages');
            process.exitCode = 1;
          }
          NODE
      - name: Save detailed audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anybike-static-link-audit
          path: |
            anybike-link-audit.json
            anybike-editorial-url-inventory.json
            anybike-live-public-audit.json
            anybike-indexability-audit-summary.json
            reports/editorial-indexability-audit.json
            anybike-country-indexability.json
            anybike-country-route-candidates.json
            anybike-regional-navigation-preview.json
            reports/regional-market-navigation-preview.json
            reports/regional-market-navigation-preview/
            anybike-country-codes-summary.json
            reports/country-code-crosswalk-audit.json
            anybike-manufacturer-directory-summary.json
            reports/manufacturer-directory-audit.json
            anybike-catalogue-pilot.json
            reports/editorial-catalogue-pilot-report.json
            reports/editorial-navigation-preview/
            anybike-expanded-catalogue-preview.json
            reports/matched-catalogue-preview-report.json
            reports/matched-catalogue-preview/
          retention-days: 30
