name: Verify all 978 live V2 model pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/check-all-978-live-v2.mjs'
      - 'scripts/check-universal-v2-rollout.mjs'
      - 'data/universal-v2-model-routes.json'
      - 'models/**'
      - 'model-template/approved-v2-universal-preview.mjs'
      - 'model-template/universal-page-*.mjs'
      - 'motorcycle-v2-master.html'
      - 'motorcycle-model-guide.html'
      - 'motorcycle-complete-catalogue-navigation.js'
      - 'model-template/approved-v2-dynamic-navigation.mjs'
      - 'motorcycle-manufacturers.html'
      - 'bmw-motorcycles.html'
      - 'harley-davidson-motorcycles.html'
      - '.htaccess'
      - 'scripts/check-complete-manufacturer-model-pills.mjs'
      - '.github/workflows/universal-v2-978-live-audit.yml'
  schedule:
    - cron: '17 5 * * *'
concurrency:
  group: universal-v2-978-live-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check audit script syntax
        run: node --check scripts/check-all-978-live-v2.mjs
      - name: Verify source-level universal template contract across all routes
        run: node scripts/check-universal-v2-rollout.mjs
      - name: Check shared manufacturer navigation links
        run: node scripts/check-complete-manufacturer-model-pills.mjs
      - name: Audit every live permanent model URL
        if: success() || failure()
        run: node scripts/check-all-978-live-v2.mjs
      - name: Upload audit evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-v2-978-live-audit
          path: artifacts/universal-v2-live-audit/report.json
          if-no-files-found: warn
