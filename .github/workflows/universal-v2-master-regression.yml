name: Universal V2 master regression
on:
  push:
    branches: [main]
    paths:
      - 'motorcycle-v2-master.html'
      - 'motorcycle-model-guide.html'
      - 'model-template/**'
      - 'data/motorcycle-catalogue-master.json'
      - 'scripts/check-universal-v2-contract.mjs'
      - 'scripts/check-v2-master-contract.mjs'
      - 'scripts/check-universal-page-section-contract.mjs'
      - 'scripts/check-universal-page-data.mjs'
      - 'scripts/check-universal-page-stage-integration.mjs'
      - 'scripts/check-universal-24-view-model-matrix.mjs'
      - 'scripts/check-universal-20-section-four-model-fixtures.mjs'
      - 'scripts/check-universal-model-release-readiness.mjs'
      - 'scripts/check-approved-r1300gs-design-guard.mjs'
      - 'scripts/check-canonical-stock-identity.mjs'
      - 'scripts/check-universal-v2-browser.mjs'
      - 'scripts/check-universal-v2-live-browser.mjs'
      - '.github/workflows/universal-v2-master-regression.yml'
  pull_request:
    paths:
      - 'motorcycle-v2-master.html'
      - 'motorcycle-model-guide.html'
      - 'model-template/**'
      - 'data/motorcycle-catalogue-master.json'
      - 'scripts/check-universal-v2-contract.mjs'
      - 'scripts/check-v2-master-contract.mjs'
      - 'scripts/check-universal-page-section-contract.mjs'
      - 'scripts/check-universal-page-data.mjs'
      - 'scripts/check-universal-page-stage-integration.mjs'
      - 'scripts/check-universal-24-view-model-matrix.mjs'
      - 'scripts/check-universal-20-section-four-model-fixtures.mjs'
      - 'scripts/check-universal-model-release-readiness.mjs'
      - 'scripts/check-approved-r1300gs-design-guard.mjs'
      - 'scripts/check-canonical-stock-identity.mjs'
      - 'scripts/check-universal-v2-browser.mjs'
      - 'scripts/check-universal-v2-live-browser.mjs'
      - '.github/workflows/universal-v2-master-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  universal-v2-contract:
    name: Approved universal model, publication and stock contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out website source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify model renderer JavaScript syntax
        run: |
          node --check model-template/approved-v2-universal-preview.mjs
          node --check model-template/approved-v2-dynamic-navigation.mjs
          node --check model-template/public-verified-model-facts.mjs
          node --check model-template/universal-page-data.mjs
          node --check model-template/universal-page-renderer.mjs
      - name: Check catalogue-wide universal master contracts
        run: node scripts/check-universal-v2-contract.mjs
      - name: Verify protected BMW design, canonical data, 20 slots and 24 audience views
        run: |
          node scripts/check-approved-r1300gs-design-guard.mjs
          node scripts/check-v2-master-contract.mjs
          node scripts/check-universal-page-section-contract.mjs
          node scripts/check-universal-page-data.mjs
          node scripts/check-universal-page-stage-integration.mjs
          node scripts/check-universal-20-section-four-model-fixtures.mjs
          node scripts/check-universal-24-view-model-matrix.mjs
          node scripts/check-universal-model-release-readiness.mjs
          node scripts/check-canonical-stock-identity.mjs
      - name: Install isolated browser test runner
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify master on desktop and mobile with mocked public data
        run: node scripts/check-universal-v2-browser.mjs
      - name: Check public master and renderer deployment without submitting data
        id: live_source
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --max-time 20 --retry 2 --retry-delay 3 \
            'https://www.anybike.co.uk/motorcycle-v2-master.html?make=Suzuki&model=RM250' \
            --output "$RUNNER_TEMP/anybike-live-master.html"
          grep -q 'name="robots" content="index,follow"' "$RUNNER_TEMP/anybike-live-master.html"
          grep -q 'approved-v2-universal-preview.mjs?v=20261113-universal-chronospec4' "$RUNNER_TEMP/anybike-live-master.html"
          curl --fail --show-error --silent --location --max-time 20 --retry 2 --retry-delay 3 \
            'https://www.anybike.co.uk/motorcycle-model-guide.html?make=Honda&model=CB650R' \
            --output "$RUNNER_TEMP/anybike-live-generic-model.html"
          grep -q 'name="robots" content="index,follow"' "$RUNNER_TEMP/anybike-live-generic-model.html"
          grep -q 'approved-v2-universal-preview.mjs?v=20261113-universal-chronospec4' "$RUNNER_TEMP/anybike-live-generic-model.html"
          curl --fail --show-error --silent --location --max-time 20 --retry 2 --retry-delay 3 \
            'https://www.anybike.co.uk/model-template/approved-v2-universal-preview.mjs?v=20261113-universal-chronospec4' \
            --output "$RUNNER_TEMP/anybike-live-renderer.mjs"
          cmp model-template/approved-v2-universal-preview.mjs "$RUNNER_TEMP/anybike-live-renderer.mjs"
          echo 'LIVE MASTER AND RENDERER MATCH GITHUB SOURCE'
      - name: Check deployed public master in read-only browser
        id: live_browser
        continue-on-error: true
        run: node scripts/check-universal-v2-live-browser.mjs
      - name: Report live deployment separately from source regression
        if: always()
        shell: bash
        run: |
          echo "## AnyBike V2: source versus live" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live source retrieval and renderer comparison: ${{ steps.live_source.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live browser verification: ${{ steps.live_browser.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.live_source.outcome }}" != "success" ||
                "${{ steps.live_browser.outcome }}" != "success" ]]; then
            echo "::warning::AnyBike V2 LIVE deployment is not independently verified; source CI must not be reported as live success."
            echo "- LIVE DEPLOYMENT: NOT VERIFIED (or failed); inspect live steps and screenshots." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- LIVE DEPLOYMENT: both independent checks passed for this run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve live public rendering screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-v2-live-public-screenshots
          path: artifacts/universal-v2-live-browser/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve visual verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-v2-desktop-mobile-screenshots
          path: artifacts/universal-v2-browser/*.png
          if-no-files-found: ignore
          retention-days: 7
