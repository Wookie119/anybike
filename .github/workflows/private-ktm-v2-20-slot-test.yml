name: Private KTM V2 20-section test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/check-private-ktm-20-section-rendering.mjs'
      - '.github/workflows/private-ktm-v2-20-slot-test.yml'
permissions:
  contents: read
jobs:
  local-browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Check script syntax
        run: node --check scripts/check-private-ktm-20-section-rendering.mjs
      - name: Render all private test slots with shared published loader and universal renderer
        run: node scripts/check-private-ktm-20-section-rendering.mjs
      - name: Save private local screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-ktm-20-slot-evidence
          path: artifacts/private-ktm-v2/
          if-no-files-found: warn
          retention-days: 7
