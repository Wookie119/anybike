name: Universal catalogue integrity
on:
  push:
    paths:
      - 'model-template/universal-page-section-contract.mjs'
      - 'model-template/catalogue-intake-contract.mjs'
      - 'model-template/catalogue-research-batches.mjs'
      - 'model-template/catalogue-evidence-review-batches.mjs'
      - 'model-template/catalogue-evidence-publication-preflight.mjs'
      - 'model-template/universal-model-release-readiness.mjs'
      - 'scripts/check-universal-model-release-readiness.mjs'
      - 'scripts/check-catalogue-evidence-publication-preflight.mjs'
      - 'scripts/check-catalogue-evidence-review-batches.mjs'
      - 'model-template/legacy-guide-identity-audit.mjs'
      - 'scripts/check-legacy-guide-identity-audit.mjs'
      - 'data/motorcycle-model-guides.json'
      - 'scripts/check-all-manufacturer-research-batches.mjs'
      - 'scripts/check-all-manufacturer-intake.mjs'
      - 'model-template/canonical-public-stock-identity.mjs'
      - 'model-template/universal-page-renderer.mjs'
      - 'model-template/universal-page-data.mjs'
      - 'model-template/universal-page-stage-integration.mjs'
      - 'public-header.js'
      - 'bmw-*.html'
      - 'harley-davidson-*.html'
      - 'motorcycle-model-guide.html'
      - 'motorcycle-brand.html'
      - 'scripts/check-manufacturer-brand-model-rendering.mjs'
      - 'scripts/check-public-catalogue-identity-snapshot.mjs'
      - 'scripts/check-generic-model-guide-fallback.mjs'
      - 'data/motorcycle-catalogue-master.json'
      - 'data/motorcycle-model-guides.json'
      - 'model-template/bmw-db-research-sections.mjs'
      - 'model-template/approved-bmw-page-shell.mjs'
      - 'scripts/check-bmw-approved-model-route-parity.mjs'
      - 'scripts/check-existing-bmw-approved-shell.test.mjs'
      - 'public-international-model-stock.js'
      - 'scripts/check-universal-page-section-contract.mjs'
      - 'scripts/check-canonical-stock-identity.mjs'
      - 'scripts/check-universal-page-renderer.mjs'
      - 'scripts/check-universal-bmw-research-shape.mjs'
      - 'scripts/check-universal-page-data.mjs'
      - 'scripts/check-universal-page-stage-integration.mjs'
      - 'scripts/check-international-model-stock-exact.mjs'
      - 'scripts/check-shared-model-guide-routes.mjs'
      - 'scripts/check-all-international-model-pages.mjs'
      - 'scripts/check-harley-source-intake.mjs'
      - 'scripts/extract-model-section-candidates.mjs'
      - 'model-template/public-country-market-navigation.mjs'
      - 'scripts/check-country-navigation-integrity.mjs'
      - 'shared-editorial-photo-bank.js'
      - 'scripts/check-shared-editorial-photo-bank.test.mjs'
      - '.github/workflows/universal-catalogue-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-universal-page-section-contract.mjs
      - run: node scripts/check-all-manufacturer-intake.mjs
      - run: node scripts/check-all-manufacturer-research-batches.mjs
      - run: node scripts/check-catalogue-evidence-review-batches.mjs
      - run: node scripts/check-catalogue-evidence-publication-preflight.mjs
      - run: node scripts/check-universal-model-release-readiness.mjs
      - run: node scripts/check-legacy-guide-identity-audit.mjs
      - run: node scripts/check-canonical-stock-identity.mjs
      - run: node scripts/check-universal-page-renderer.mjs
      - run: node scripts/check-universal-bmw-research-shape.mjs
      - run: node scripts/check-universal-page-data.mjs
      - run: node scripts/check-universal-page-stage-integration.mjs
      - run: node scripts/check-international-model-stock-exact.mjs
      - run: node scripts/check-shared-model-guide-routes.mjs
      - run: node scripts/check-all-international-model-pages.mjs
      - run: node scripts/check-manufacturer-brand-model-rendering.mjs
      - run: node scripts/check-public-catalogue-identity-snapshot.mjs
      - run: node scripts/check-generic-model-guide-fallback.mjs
      - run: node scripts/check-harley-source-intake.mjs
      - run: node scripts/check-bmw-approved-model-route-parity.mjs
      - run: node --test scripts/check-existing-bmw-approved-shell.test.mjs
      - run: node scripts/check-country-navigation-integrity.mjs
      - run: node --test scripts/check-shared-editorial-photo-bank.test.mjs
