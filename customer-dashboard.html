
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Register Free | AnyBike</title>
<meta name="description" content="Create a free AnyBike account to save motorcycles, manage your watchlist, receive messages and access your customer dashboard.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="/public-header.css?v=20260712-4">

<style>
:root{
  --red:#ed1c24;
  --black:#050505;
  --line:rgba(255,255,255,.14);
  --muted:#b8b8b8;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top left,rgba(237,28,36,.16),transparent 30%),
    linear-gradient(135deg,#050505,#111);
  color:#fff;
}

.wrap{
  max-width:760px;
  margin:55px auto;
  padding:0 18px 70px;
}

.card{
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  border-radius:24px;
  padding:28px;
  box-shadow:0 24px 70px rgba(0,0,0,.45);
}

h1{
  margin:0 0 10px;
  font-size:42px;
  letter-spacing:-.04em;
}

h2{
  margin:0 0 10px;
}

p{
  color:#d0d0d0;
  line-height:1.6;
}

label{
  display:block;
  font-weight:900;
  margin:14px 0 6px;
}

input,
select{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:16px;
  outline:none;
}

input:focus,
select:focus{
  border-color:rgba(237,28,36,.8);
  box-shadow:0 0 0 3px rgba(237,28,36,.12);
}

select option{
  color:#111;
}

.card button{
  width:100%;
  margin-top:18px;
  padding:14px;
  border:0;
  border-radius:999px;
  background:var(--red);
  color:#fff;
  font-weight:900;
  font-size:16px;
  cursor:pointer;
}

.card button:hover{
  background:#c9161d;
}

.card button.secondary{
  background:#fff;
  color:#111;
}

.card button.secondary:hover{
  background:#e8e8e8;
}

.msg{
  margin-top:14px;
  font-weight:800;
  white-space:pre-wrap;
}

.ok{color:#36d37e}
.bad{color:#ff7676}
.hidden{display:none}

.account-ready{
  padding:8px 0 2px;
}

.account-ready-actions{
  display:grid;
  gap:10px;
  margin-top:18px;
}

@media(max-width:600px){
  .wrap{margin:34px auto}
  .card{padding:22px}
  h1{font-size:34px}
}
</style>
</head>

<body>

<div id="publicHeader"></div>

<main class="wrap">
  <section class="card">
    <h1>Register Free</h1>
    <p>Create your AnyBike account to save motorcycles, build a watchlist, receive messages and manage your buying requests from one place.</p>

    <div id="registerBox">
      <label for="fullName">Full name</label>
      <input id="fullName" placeholder="Your name" autocomplete="name">

      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email">

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Create a password" autocomplete="current-password">

      <label for="country">Country</label>
      <select id="country">
        <option value="">Select country</option>
        <option>United Kingdom</option>
        <option>Singapore</option>
        <option>Malaysia</option>
        <option>Indonesia</option>
        <option>Thailand</option>
        <option>Vietnam</option>
        <option>Philippines</option>
        <option>Japan</option>
        <option>South Korea</option>
        <option>Hong Kong</option>
        <option>Taiwan</option>
        <option>United Arab Emirates</option>
        <option>Saudi Arabia</option>
        <option>Qatar</option>
        <option>Kuwait</option>
        <option>Bahrain</option>
        <option>Oman</option>
        <option>Jordan</option>
        <option>Australia</option>
        <option>New Zealand</option>
        <option>South Africa</option>
        <option>Kenya</option>
        <option>Tanzania</option>
        <option>Uganda</option>
        <option>Nigeria</option>
        <option>Ghana</option>
        <option>Botswana</option>
        <option>Namibia</option>
        <option>Zimbabwe</option>
        <option>Germany</option>
        <option>France</option>
        <option>Spain</option>
        <option>Portugal</option>
        <option>Netherlands</option>
        <option>Ireland</option>
        <option>United States</option>
        <option>Canada</option>
        <option>Chile</option>
        <option>Peru</option>
        <option>Other</option>
      </select>

      <label for="currency">Preferred currency</label>
      <select id="currency">
        <option value="GBP">GBP £</option>
        <option value="EUR">EUR €</option>
        <option value="USD">USD $</option>
        <option value="AUD">AUD A$</option>
        <option value="NZD">NZD NZ$</option>
        <option value="CAD">CAD C$</option>
        <option value="AED">AED د.إ</option>
      </select>

      <label for="language">Preferred language</label>
      <select id="language">
        <option value="en">🇬🇧 English</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="es">🇪🇸 Español</option>
        <option value="ar">🇸🇦 العربية</option>
        <option value="id">🇮🇩 Bahasa Indonesia</option>
        <option value="ms">🇲🇾 Bahasa Melayu</option>
        <option value="zh">🇨🇳 中文</option>
      </select>

      <button type="button" onclick="register()">Create Free Account</button>
      <button type="button" class="secondary" onclick="login()">Already registered? Login</button>
    </div>

    <div id="loggedInBox" class="hidden account-ready">
      <h2>Account ready</h2>
      <p>You are logged in and can now access your dashboard, watchlist, messages and available motorcycles.</p>

      <div class="account-ready-actions">
        <button type="button" onclick="location.href='/customer-dashboard.html'">Open My Dashboard</button>
        <button type="button" class="secondary" onclick="location.href='/available-stock.html'">View Available Stock</button>
        <button type="button" class="secondary" onclick="logout()">Logout</button>
      </div>
    </div>

    <div id="msg" class="msg"></div>
  </section>
</main>

<script>
const SUPABASE_URL = "https://tuehtnezhdnkqbbhttgp.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_mrkBKDxEPVmdj2n7gPWsbg_l4CShtcK";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function showMsg(text, ok=true){
  const el = document.getElementById("msg");
  el.textContent = text;
  el.className = "msg " + (ok ? "ok" : "bad");
}

function syncPreferencesToHeader(){
  const currency = document.getElementById("currency").value || "GBP";
  const language = document.getElementById("language").value || "en";

  localStorage.setItem("anybikeCurrency", currency);
  localStorage.setItem("anybikeLanguage", language);

  window.dispatchEvent(new CustomEvent("anybikeCurrencyChanged", {
    detail:{ currency }
  }));

  window.dispatchEvent(new CustomEvent("anybikeLanguageChanged", {
    detail:{ language }
  }));
}

async function checkSession(){
  const { data: { user } } = await sb.auth.getUser();

  const registerBox = document.getElementById("registerBox");
  const loggedInBox = document.getElementById("loggedInBox");

  if(user){
    registerBox.classList.add("hidden");
    loggedInBox.classList.remove("hidden");
  }else{
    registerBox.classList.remove("hidden");
    loggedInBox.classList.add("hidden");
  }
}

async function register(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const full_name = document.getElementById("fullName").value.trim();
  const country = document.getElementById("country").value;
  const preferred_currency = document.getElementById("currency").value;
  const preferred_language = document.getElementById("language").value;

  if(!email || !password || !full_name){
    showMsg("Please enter name, email and password.", false);
    return;
  }

  showMsg("Creating account...");

  const { data, error } = await sb.auth.signUp({
    email,
    password
  });

  if(error){
    showMsg(error.message, false);
    return;
  }

  const user = data.user;

  if(!user){
    showMsg("Account created. Please check your email to confirm registration.");
    return;
  }

  const { error: profileError } = await sb
    .from("customer_profiles")
    .upsert({
      id:user.id,
      email,
      full_name,
      country,
      preferred_currency,
      preferred_language
    }, {
      onConflict:"id"
    });

  if(profileError){
    showMsg("Account created, but profile could not be saved: " + profileError.message, false);
    return;
  }

  syncPreferencesToHeader();
  showMsg("Account created successfully.");
  await checkSession();
}

async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!email || !password){
    showMsg("Enter email and password to login.", false);
    return;
  }

  const { error } = await sb.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    showMsg(error.message, false);
    return;
  }

  showMsg("Logged in successfully.");
  await checkSession();
}

async function logout(){
  await sb.auth.signOut();
  window.location.href = "/customer-register.html";
}

window.addEventListener("anybikeCurrencyChanged", function(e){
  const currency = e.detail.currency || "GBP";
  localStorage.setItem("anybikeCurrency", currency);

  const select = document.getElementById("currency");
  if(select) select.value = currency;
});

window.addEventListener("anybikeLanguageChanged", function(e){
  const language = e.detail.language || "en";
  localStorage.setItem("anybikeLanguage", language);

  const select = document.getElementById("language");
  if(select) select.value = language;
});

document.getElementById("currency").addEventListener("change", syncPreferencesToHeader);
document.getElementById("language").addEventListener("change", syncPreferencesToHeader);

sb.auth.onAuthStateChange(() => {
  checkSession();
});

(function init(){
  const savedCurrency = localStorage.getItem("anybikeCurrency");
  const savedLanguage = localStorage.getItem("anybikeLanguage");

  if(savedCurrency){
    document.getElementById("currency").value = savedCurrency;
  }

  if(savedLanguage){
    document.getElementById("language").value = savedLanguage;
  }

  checkSession();
})();
</script>

<script src="/public-header.js?v=20260712-4"></script>
</body>
</html>
