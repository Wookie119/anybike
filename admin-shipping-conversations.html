<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shipping Conversations | AnyBike Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="/admin-shell.css?v=202609261125"><style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:Arial,Helvetica,sans-serif}.admin-page-content{padding:24px}.wrap{max-width:1500px;margin:auto}.hero{background:#111;border:1px solid #292929;border-radius:16px;padding:20px;margin-bottom:14px}.hero h1{margin:0 0 6px}.hero p{margin:0;color:#aaa}.layout{display:grid;grid-template-columns:390px 1fr;gap:14px}.card{background:#111;border:1px solid #292929;border-radius:16px;padding:16px}.conversation{padding:13px;border:1px solid #2b2b2b;border-radius:10px;margin-bottom:8px;cursor:pointer}.conversation.active{border-color:#ed1c24}.conversation small{display:block;color:#999;margin-top:4px}.messages{min-height:390px;max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:10px}.msg{max-width:78%;padding:12px 14px;border-radius:12px;background:#222}.msg.Customer{align-self:flex-end;background:#371114}.msg.Shipper{align-self:flex-start;background:#202020}.msg.AnyBike{align-self:center;border:1px solid #ed1c24;background:#171717}.msg b,.msg small{display:block}.msg small{color:#999;margin-top:5px}.composer{display:flex;gap:8px;margin-top:12px}.composer textarea{flex:1;min-height:85px;background:#080808;color:#fff;border:1px solid #333;border-radius:10px;padding:10px}.btn{background:#ed1c24;color:#fff;border:0;border-radius:999px;padding:10px 16px;font-weight:900;cursor:pointer}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{background:#080808;color:#fff;border:1px solid #333;border-radius:10px;padding:10px}.detail{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.detail div{background:#0b0b0b;border:1px solid #222;border-radius:10px;padding:10px}.detail strong{display:block;font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.08em}.status{color:#aaa;margin-top:8px}@media(max-width:900px){.layout{grid-template-columns:1fr}.detail{grid-template-columns:1fr 1fr}}
</style></head><body><div class="admin-shell"><div id="adminSidebar"></div><div class="admin-main"><div id="adminTopbar"></div><main class="admin-page-content"><div class="wrap">
<section class="hero"><h1>Shipping Conversations</h1><p>Buyer ↔ Shipper ↔ AnyBike. Review every shipper introduction and step in as AnyBike when useful.</p></section>
<div class="toolbar"><input id="search" placeholder="Search buyer, shipper or destination"><select id="statusFilter"><option value="">All statuses</option><option>Sent</option><option>Replied</option><option>AnyBike Following Up</option><option>Closed</option><option>Send Failed</option></select><button class="btn" id="refresh">Refresh</button></div>
<div class="layout"><div class="card"><div id="list"></div></div><div class="card"><h2 id="title">Select a shipping conversation</h2><div class="detail" id="detail"></div><div class="messages" id="messages"></div><div class="composer"><textarea id="reply" placeholder="Reply as AnyBike…"></textarea><button class="btn" id="send">Send as AnyBike</button></div><div style="margin-top:12px"><select id="conversationStatus" style="background:#080808;color:#fff;border:1px solid #333;border-radius:10px;padding:10px"><option>Sent</option><option>Replied</option><option>AnyBike Following Up</option><option>Closed</option></select> <button class="btn" id="saveStatus">Save Status</button></div><div class="status" id="msg"></div></div></div>
</div></main></div></div><script src="/admin.js?v=20261004"></script><script>
const sb=getAdminSupabaseClient();let rows=[],current=null;
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderList(){const q=search.value.trim().toLowerCase(),sf=statusFilter.value;const filtered=rows.filter(x=>(!sf||x.status===sf)&&(!q||[x.shipper_name,x.buyer_name,x.business_name,x.destination_country,x.destination_port].join(" ").toLowerCase().includes(q)));list.innerHTML=filtered.map(x=>'<div class="conversation '+(current===x.id?"active":"")+'" data-id="'+x.id+'"><b>'+esc(x.shipper_name)+'</b><small>'+esc(x.business_name||x.buyer_name||"Buyer")+' → '+esc(x.destination_country)+'</small><small>'+esc(x.status)+' · '+new Date(x.last_message_at||x.created_at).toLocaleString()+'</small></div>').join("")||'<p>No shipping conversations found.</p>';list.querySelectorAll(".conversation").forEach(el=>el.onclick=()=>open(Number(el.dataset.id)))}
async function load(){
  const {data,error}=await sb.rpc("admin_get_shipping_conversations_v1");
  if(error){list.innerHTML='<p>'+esc(error.message)+'</p>';return}
  rows=data||[];
  renderList();
  if(current && rows.some(r=>Number(r.id)===Number(current))){
    await open(Number(current));
  }else if(rows.length){
    await open(Number(rows[0].id));
  }else{
    title.textContent="Select a shipping conversation";
    detail.innerHTML="";
    messages.innerHTML='<p style="color:#999">No shipping conversations found.</p>';
  }
}
async function open(id){
  current=id;
  renderList();
  const x=rows.find(r=>Number(r.id)===Number(id));
  if(!x)return;

  const buyer=String(x.business_name||x.buyer_name||"Buyer").trim()||"Buyer";
  const destination=String(x.destination_country||"").trim()||"Not set";
  title.textContent=x.shipper_name+" ↔ "+buyer;
  detail.innerHTML=
    '<div><strong>Buyer</strong>'+esc(buyer)+'</div>'+
    '<div><strong>Destination</strong>'+esc(destination)+'</div>'+
    '<div><strong>Port</strong>'+esc(x.destination_port||"Not set")+'</div>'+
    '<div><strong>Status</strong>'+esc(x.status||"")+'</div>';

  conversationStatus.value=["Sent","Replied","AnyBike Following Up","Closed"].includes(x.status)?x.status:"Sent";
  messages.innerHTML='<p style="color:#999">Loading conversation…</p>';
  msg.textContent="";

  const {data,error}=await sb.rpc("admin_get_shipping_messages_v1",{p_enquiry_id:Number(id)});
  if(error){
    messages.innerHTML='<p style="color:#ff8a8f">Conversation could not be loaded.</p>';
    msg.textContent=error.message||"Conversation could not be loaded.";
    return;
  }

  messages.innerHTML=(data||[]).length
    ? (data||[]).map(m=>'<div class="msg '+m.sender_type+'"><b>'+esc(m.sender_name||m.sender_type)+'</b>'+esc(m.message)+'<small>'+new Date(m.created_at).toLocaleString()+'</small></div>').join("")
    : '<p style="color:#999">No messages have been added yet.</p>';
  messages.scrollTop=messages.scrollHeight;
}
send.onclick=async()=>{if(!current||!reply.value.trim())return;send.disabled=true;const {data,error}=await sb.functions.invoke("send-shipping-conversation-message",{body:{enquiry_id:current,message:reply.value.trim(),mode:"admin"}});send.disabled=false;if(error||data?.error){msg.textContent=data?.error||error.message;return}reply.value="";msg.textContent="Sent as AnyBike.";await load();await open(current)}
saveStatus.onclick=async()=>{if(!current)return;const {error}=await sb.rpc("admin_update_shipper_enquiry_v1",{p_enquiry_id:current,p_status:conversationStatus.value,p_admin_notes:null});msg.textContent=error?error.message:"Status saved.";await load();await open(current)}
search.oninput=renderList;statusFilter.onchange=renderList;refresh.onclick=load;(async()=>{const ok=await requireAdminSession();if(!ok)return;loadAdminShell();await load()})();</script></body></html>
