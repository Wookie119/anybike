<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shipping Conversations | AnyBike Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="/admin-shell.css?v=202609261125"><style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:Arial,Helvetica,sans-serif}.admin-page-content{padding:24px}.wrap{max-width:1500px;margin:auto}.hero{background:#111;border:1px solid #292929;border-radius:16px;padding:20px;margin-bottom:14px}.hero h1{margin:0 0 6px}.hero p{margin:0;color:#aaa}.layout{display:grid;grid-template-columns:390px 1fr;gap:14px}.card{background:#111;border:1px solid #292929;border-radius:16px;padding:16px}.conversation{padding:13px;border:1px solid #2b2b2b;border-radius:10px;margin-bottom:8px;cursor:pointer}.conversation.active{border-color:#ed1c24}.conversation small{display:block;color:#999;margin-top:4px}.messages{min-height:390px;max-height:none;overflow:visible;display:flex;flex-direction:column;gap:10px}.msg{max-width:78%;padding:12px 14px;border-radius:12px;background:#222}.msg.Customer{align-self:flex-start;background:#fff;color:#111;border:1px solid #ddd} .msg.Customer small{color:#666}.msg.Shipper{align-self:flex-start;background:#050505;color:#fff;border:1px solid #444}.msg.AnyBike{align-self:flex-start;background:#ed1c24;color:#fff;border:1px solid #ed1c24}.msg b,.msg small{display:block}.msg small{color:#999;margin-top:5px}.composer{display:flex;gap:8px;margin-top:12px}.composer textarea{flex:1;min-height:85px;background:#080808;color:#fff;border:1px solid #333;border-radius:10px;padding:10px}.btn{background:#ed1c24;color:#fff;border:0;border-radius:999px;padding:10px 16px;font-weight:900;cursor:pointer}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{background:#080808;color:#fff;border:1px solid #333;border-radius:10px;padding:10px}.detail{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.detail div{background:#0b0b0b;border:1px solid #222;border-radius:10px;padding:10px}.detail strong{display:block;font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.08em}.status{color:#aaa;margin-top:8px}@media(max-width:900px){.layout{grid-template-columns:1fr}.detail{grid-template-columns:1fr 1fr}}
.messages .msg{align-self:flex-start;max-width:min(100%,900px);width:fit-content;min-width:200px;overflow-wrap:anywhere} .messages{align-items:flex-start}.composer textarea{min-width:0}.composer #send{flex-shrink:0;min-width:96px;border-radius:10px;white-space:nowrap}#reply{font-family:Arial,Helvetica,sans-serif}</style></head><body><div class="admin-shell"><div id="adminSidebar"></div><div class="admin-main"><div id="adminTopbar"></div><main class="admin-page-content"><div class="wrap">
<section class="hero"><h1>Shipping Conversations</h1><p>Buyer ↔ Shipper ↔ AnyBike. Review every shipper introduction and step in as AnyBike when useful.</p></section>
<div class="toolbar"><input id="search" placeholder="Search buyer, shipper or destination"><select id="statusFilter"><option value="">All statuses</option><option>Sent</option><option>Replied</option><option>AnyBike Following Up</option><option>Closed</option><option>Send Failed</option></select><button class="btn" id="refresh">Refresh</button></div>
<div class="layout"><div class="card"><div id="list"></div></div><div class="card"><h2 id="title">Select a shipping conversation</h2><div style="margin-bottom:12px;display:flex;gap:10px;align-items:center"><small id="liveState" style="color:#aaa">Checking replies…</small><button type="button" class="btn" id="refreshMessages" style="background:#333">Refresh messages</button></div><div class="detail" id="detail"></div><div id="linkedPurchases" style="display:none;margin:0 0 12px;padding:12px;border:1px solid #333;border-radius:10px;background:#0b0b0b"></div><div id="quotePanel" style="display:none;background:#1b1b1b;border:1px solid #444;border-left:4px solid #ed1c24;border-radius:12px;padding:16px;margin:0 0 15px"></div><div class="messages" id="messages"></div><div class="composer"><textarea id="reply" placeholder="Reply as AnyBike…" title="Write a message as AnyBike. The customer and shipper can read it." aria-label="Write a message as AnyBike. The customer and shipper can read it."></textarea><button class="btn" id="send" title="Send this reply to the shipping conversation" aria-label="Send this reply to the shipping conversation">Send as AnyBike</button></div><div style="margin-top:12px"><select id="conversationStatus" style="background:#080808;color:#fff;border:1px solid #333;border-radius:10px;padding:10px"><option>Sent</option><option>Replied</option><option>AnyBike Following Up</option><option>Closed</option></select> <button class="btn" id="saveStatus">Save Status</button></div><div class="status" id="msg"></div></div></div>
</div></main></div></div><script src="/admin.js?v=20261004"></script><script>
const sb=getAdminSupabaseClient();let rows=[],current=null;
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderList(){
  const q=search.value.trim().toLowerCase(),sf=statusFilter.value;
  const filtered=rows.filter(x=>(!sf||x.status===sf)&&(!q||[
    x.shipper_name,x.shipper_country,x.buyer_name,x.business_name,x.business_country,x.destination_country,x.destination_port
  ].join(" ").toLowerCase().includes(q)));
  list.innerHTML=filtered.map(x=>{
    const buyerLabel=(x.business_name||x.buyer_name||"Buyer").trim()||"Buyer";
    const buyerCountry=(x.business_country||"Country not supplied").trim();
    const shipperCountry=(x.shipper_country||"Country not supplied").trim();
    return '<div class="conversation '+(current===x.id?"active":"")+'" data-id="'+x.id+'">'+
      '<b>'+esc(buyerLabel)+' ↔ '+esc(x.shipper_name)+'</b>'+
      '<small>Buyer: '+esc(buyerCountry)+' · Shipper: '+esc(shipperCountry)+'</small>'+
      '<small>Destination: '+esc(x.destination_country||"Not set")+' · '+esc(x.status)+' · '+new Date(x.last_message_at||x.created_at).toLocaleString()+'</small>'+
    '</div>';
  }).join("")||'<p>No shipping conversations found.</p>';
  list.querySelectorAll(".conversation").forEach(el=>el.onclick=()=>open(Number(el.dataset.id)));
}
async function load(){
  const {data,error}=await sb.rpc("admin_get_shipping_conversations_v1");
  if(error){list.innerHTML='<p>'+esc(error.message)+'</p>';return}
  rows=data||[];
  renderList();
  const requested=Number(new URLSearchParams(location.search).get("conversation")||0);
  if(!current && requested && rows.some(r=>Number(r.id)===requested)){await open(requested);}
  else if(current && rows.some(r=>Number(r.id)===Number(current))){
    await open(Number(current));
  }else if(rows.length){
    await open(Number(rows[0].id));
  }else{
    title.textContent="Select a shipping conversation";
    detail.innerHTML="";
    messages.innerHTML='<p style="color:#999">No shipping conversations found.</p>';
  }
}
async function open(id,quiet=false){
  current=id;
  renderList();
  const x=rows.find(r=>Number(r.id)===Number(id));
  if(!x)return;

  const buyer=String(x.business_name||x.buyer_name||"Buyer").trim()||"Buyer";
  const destination=String(x.destination_country||"").trim()||"Not set";
  title.textContent=buyer+" ↔ "+x.shipper_name;
  detail.innerHTML=
    '<div><strong>Buyer business</strong>'+esc(x.business_name||"Not supplied")+'</div>'+
    '<div><strong>Buyer contact</strong>'+esc(x.buyer_name||"Not supplied")+'</div>'+
    '<div><strong>Buyer country</strong>'+esc(x.business_country||"Not supplied")+'</div>'+
    '<div><strong>Buyer email</strong>'+esc(x.buyer_email||"Not supplied")+'</div>'+
    '<div><strong>Shipper</strong>'+esc(x.shipper_name||"Not supplied")+'</div>'+
    '<div><strong>Shipper country</strong>'+esc(x.shipper_country||"Not supplied")+'</div>'+
    '<div><strong>Destination</strong>'+esc(destination)+'</div>'+
    '<div><strong>Port</strong>'+esc(x.destination_port||"Not set")+'</div>'+
    '<div><strong>Status</strong>'+esc(x.status||"")+'</div>';
  if(Array.isArray(x.linked_purchases)&&x.linked_purchases.length){
    linkedPurchases.style.display="block";
    linkedPurchases.innerHTML='<strong style="display:block;margin-bottom:6px;color:#999;text-transform:uppercase;font-size:11px">Linked AnyBike purchases</strong>'+x.linked_purchases.map(p=>'<div style="margin-top:5px"><strong>'+esc(p.deal_number)+'</strong> — '+esc(p.motorcycle)+' — Reg: '+esc(p.registration||"not recorded")+'</div>').join("");
  }else{linkedPurchases.style.display="none";linkedPurchases.innerHTML="";}

  conversationStatus.value=["Sent","Replied","AnyBike Following Up","Closed"].includes(x.status)?x.status:"Sent";
  if(!quiet) messages.innerHTML='<p style="color:#999">Loading conversation…</p>';
  if(!quiet) msg.textContent="";

  const {data,error}=await sb.rpc("admin_get_shipping_messages_v1",{p_enquiry_id:Number(id)});
  if(error){
    messages.innerHTML='<p style="color:#ff8a8f">Conversation could not be loaded.</p>';
    msg.textContent=error.message||"Conversation could not be loaded.";
    return;
  }

  const {data:quotes,error:quoteError}=await sb.from("shipping_partner_quotes").select("id,currency,quote_amount,transit_time,inclusions,exclusions,receiving_company,receiving_address,notes,pdf_storage_path,pdf_filename,created_at").eq("enquiry_id",Number(id)).order("created_at",{ascending:false});
  if(!quoteError&&quotes?.length){
    quotePanel.style.display="block";
    quotePanel.innerHTML='<strong style="display:block;color:#fff;font-size:20px;margin-bottom:12px">Shipping quotations · Not a booking</strong>'+
      quotes.map(q=>'<div style="border-top:1px solid #444;padding:13px 0">'+
        '<strong style="display:block;font-size:22px;color:#fff">'+esc(q.currency||"GBP")+' '+Number(q.quote_amount).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2})+'</strong>'+
        '<p>Transit: '+esc(q.transit_time||"To be confirmed")+'</p>'+
        (q.inclusions?'<p><b>Included:</b> '+esc(q.inclusions)+'</p>':"")+
        (q.exclusions?'<p><b>Excluded:</b> '+esc(q.exclusions)+'</p>':"")+
        (q.receiving_company?'<p><b>UK receiver:</b> '+esc(q.receiving_company)+'</p>':"")+
        (q.receiving_address?'<p><b>UK handover address:</b> '+esc(q.receiving_address)+'</p>':"")+
        (q.notes?'<p><b>Terms:</b> '+esc(q.notes)+'</p>':"")+
        (q.pdf_storage_path?'<button class="btn admin-quote-pdf" type="button" data-quote-id="'+Number(q.id)+'" style="border-radius:8px">View formal PDF quotation</button>':"")+
      '</div>').join("");
    quotePanel.querySelectorAll(".admin-quote-pdf").forEach(button=>button.onclick=async()=>{
      const tab=window.open("about:blank","_blank");
      const {data:doc,error:docError}=await sb.functions.invoke("open-shipping-quote-pdf",{body:{quote_id:Number(button.dataset.quoteId)}});
      if(docError||doc?.error||!doc?.url){if(tab)tab.close();msg.textContent="Could not open PDF: "+(doc?.error||docError?.message||"Access denied");return}
      if(tab)tab.location.replace(doc.url);else location.href=doc.url;
    });
  }else{quotePanel.style.display="none";quotePanel.innerHTML="";if(quoteError)console.warn("Admin quotation retrieval",quoteError.message)}
  liveState.textContent="Last checked "+new Date().toLocaleTimeString()+" · "+(data||[]).length+" messages";
  messages.innerHTML=(data||[]).length
    ? (data||[]).map(m=>'<div class="msg '+m.sender_type+'"><b>'+esc(m.sender_name||m.sender_type)+'</b>'+esc(m.message)+'<small>'+new Date(m.created_at).toLocaleString()+'</small></div>').join("")
    : '<p style="color:#999">No messages have been added yet.</p>';
  if(!quiet) messages.scrollTop=messages.scrollHeight;
}
send.onclick=async()=>{if(!current||!reply.value.trim())return;send.disabled=true;const {data,error}=await sb.functions.invoke("send-shipping-conversation-message",{body:{enquiry_id:current,message:reply.value.trim(),mode:"admin"}});send.disabled=false;if(error||data?.error){msg.textContent=data?.error||error.message;return}reply.value="";msg.textContent="Sent as AnyBike.";await load();await open(current)}
saveStatus.onclick=async()=>{if(!current)return;const {error}=await sb.rpc("admin_update_shipper_enquiry_v1",{p_enquiry_id:current,p_status:conversationStatus.value,p_admin_notes:null});msg.textContent=error?error.message:"Status saved.";await load();await open(current)}
search.oninput=renderList;statusFilter.onchange=renderList;refresh.onclick=load;refreshMessages.onclick=load;(async()=>{const ok=await requireAdminSession();if(!ok)return;loadAdminShell();await load();setInterval(()=>{if(current&&!document.hidden)load()},5000)})();</script></body></html>
