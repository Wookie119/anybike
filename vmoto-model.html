function openVmotoLightbox(url,label){
  const box=document.getElementById("vmotoLightbox");
  const img=document.getElementById("vmotoLightboxImage");
  const cap=document.getElementById("vmotoLightboxCaption");
  if(!box||!img)return;
  img.src=url;
  img.alt=label||"VMoto image";
  if(cap)cap.textContent=label||"";
  box.classList.add("open");
  box.setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";
}
function closeVmotoLightbox(){
  const box=document.getElementById("vmotoLightbox");
  if(!box)return;
  box.classList.remove("open");
  box.setAttribute("aria-hidden","true");
  document.body.style.overflow="";
}
document.addEventListener("keydown",event=>{if(event.key==="Escape")closeVmotoLightbox()});
function setVmotoHeroImage(url,label,button){
  const hero=document.getElementById("vmotoHeroImage");
  const gallery=document.getElementById("vmotoGalleryMainImage");
  if(hero){hero.src=url;hero.alt=label||hero.alt}
  if(gallery){gallery.src=url;gallery.alt=label||gallery.alt}
  document.querySelectorAll(".gallery-thumb").forEach(x=>x.classList.toggle("active",x.dataset.url===url));
  document.querySelectorAll(".colour").forEach(x=>x.classList.remove("active"));
  if(button)button.classList.add("active");
}
function vmotoGalleryHtml(model){
  const urls=[model.hero_image_url,lifestyleImages[slug],...(galleryExtras[slug]||[])].filter(Boolean);
  const unique=[...new Set(urls)];
  if(!unique.length)return "";
  const first=unique[0];
  return '<section class="model-gallery"><div class="wrap"><h2>Gallery.</h2><p class="intro">Select a thumbnail to change the main image, then click the main image to open it full size.</p><div class="gallery-main" onclick="openVmotoLightbox(document.getElementById(\'vmotoGalleryMainImage\').src,'+JSON.stringify(model.model_name)+')"><img id="vmotoGalleryMainImage" src="'+esc(first)+'" alt="'+esc(model.model_name)+'"></div><div class="gallery-thumbs">'+unique.map((url,i)=>'<button class="gallery-thumb '+(i===0?'active':'')+'" type="button" data-url="'+esc(url)+'" onclick="setVmotoHeroImage(this.dataset.url,'+JSON.stringify(model.model_name)+',this)"><img src="'+esc(url)+'" alt="'+esc(model.model_name)+' image '+(i+1)+'" loading="lazy"></button>').join("")+'</div><div class="gallery-caption">Official VMoto imagery. Colour and specification availability can vary by production batch and UK stock.</div></div></section>';
}
function technicalNote(modelSlug){
  const notes={
    "stash":"* VMoto quotes the 112-mile autonomy figure from controlled testing at an average 28 mph with a 75 kg rider. Real-world range varies with speed, rider weight, temperature, terrain and riding style.",
    "tc-max":"* VMoto quotes the 57-mile autonomy figure from controlled testing at an average 28 mph with a 75 kg rider.",
    "ts-street-hunter-pro":"* VMoto quotes the range from testing at an average 45 km/h with a 75 kg rider and the model's maximum battery capacity.",
    "tc-wanderer-pro":"* VMoto quotes the range from testing at an average 45 km/h with a 75 kg rider and the model's maximum battery capacity.",
    "tc":"* VMoto quotes 44 miles with one battery and up to 78 miles with dual batteries, tested at an average 45 km/h with a 75 kg rider.",
    "cux-pro":"* VMoto quotes the 50-mile range from testing at an average 45 km/h with a 75 kg rider and the model's maximum battery capacity.",
    "cpx":"* VMoto quotes up to 130 km using the stated maximum battery capacity.",
    "cpx-pro":"* VMoto quotes the 80-mile range from testing at an average 45 km/h with a 75 kg rider and the model's maximum battery capacity.",
    "cpx-explorer":"* VMoto quotes 106 km under WMTC Stage 3. UK specification is confirmed before order.",
    "vs1":"* VMoto quotes the 72-mile range with dual batteries, tested at an average 45 km/h with a 75 kg rider.",
    "vs2-citi":"* VMoto quotes 127 km for L1 and 107 km for L3, tested at an average 45 km/h with a 75 kg rider and maximum battery capacity.",
    "vs3":"* VMoto quotes the 62-mile range from testing at an average 45 km/h with a 75 kg rider and maximum battery capacity.",
    "cpx-fleet":"* VMoto quotes 106 miles for L1e and 85 miles for L3e with dual batteries, tested at an average 45 km/h with a 75 kg rider."
  };
  return (notes[modelSlug]||"Quoted range is manufacturer/dealer test data.")+" Real-world range varies with speed, rider weight, load, temperature, terrain and riding style.";
}
async function load(){
  if(!slug){document.getElementById("page").innerHTML='<section class="hero"><div class="wrap"><div class="empty">No VMoto model selected.</div></div></section>';return}
  const [modelRes,faqRes]=await Promise.all([
    sb.rpc("public_get_vmoto_model_v1",{p_slug:slug}),
    sb.rpc("public_get_vmoto_faqs_v1",{p_model_slug:slug,p_territory_slug:null})
  ]);
  if(modelRes.error)throw modelRes.error;
  const m=modelRes.data||{};
  if(!m.id){document.getElementById("page").innerHTML='<section class="hero"><div class="wrap"><div class="empty">This VMoto model is not currently published.</div></div></section>';return}
  document.title=(m.model_name||"VMoto")+" | AnyBike UK Retail";
  const variants=Array.isArray(m.variants)?m.variants:[];
  const faqs=Array.isArray(faqRes.data)?faqRes.data:[];
  const img=m.hero_image_url?'<img id="vmotoHeroImage" src="'+esc(m.hero_image_url)+'" alt="'+esc(m.model_name)+'">':'⚡';
  const variantHtml=variants.length?variants.map(v=>{
    const colours=Array.isArray(v.colours)?v.colours:[];
    const stock=Array.isArray(v.stock)?v.stock:[];
    const liveStock=stock.filter(s=>["In Stock","Low Stock","Incoming"].includes(s.availability_status));
    const status=liveStock.length?liveStock.map(s=>s.availability_status+(s.stock_location?' · '+s.stock_location:'')).join(" | "):"Availability to be confirmed";
    return '<article class="variant"><h3>'+esc(v.variant_name)+'</h3><p>'+esc(v.battery_description||"")+'</p><div class="specs">'+
      '<div class="spec"><span>Battery</span><strong>'+esc(v.battery_capacity||"To be confirmed")+'</strong></div>'+
      '<div class="spec"><span>Quoted range</span><strong>'+esc(v.quoted_range||"To be confirmed")+'</strong></div>'+
      '<div class="spec"><span>Charging</span><strong>'+esc(v.charging_information||"To be confirmed")+'</strong></div>'+
      '<div class="spec"><span>Retail price</span><strong>'+money(v.retail_price_gbp)+'</strong></div>'+
      '</div><div class="colours">'+(colours.length?colours.map(colour=>{
        const hasImage=!!String(colour.image_url||"").trim();
        return hasImage
          ? '<button class="colour clickable" type="button" data-colour-image="'+esc(colour.image_url)+'" data-colour-label="'+esc((m.model_name||"VMoto")+" "+(colour.colour_name||""))+'" onclick="setVmotoHeroImage(this.dataset.colourImage,this.dataset.colourLabel,this)"><span class="colour-swatch" style="--swatch:'+esc(colour.colour_code||"#ddd")+'"></span>'+esc(colour.colour_name)+'</button>'
          : '<span class="colour unavailable"><span class="colour-swatch" style="--swatch:'+esc(colour.colour_code||"#ddd")+'"></span>'+esc(colour.colour_name)+'</span>';
      }).join(""):'<span class="colour unavailable">Colours to be confirmed</span>')+'</div>'+
      '<div class="stock '+(liveStock.length?'':'unknown')+'">'+esc(status)+'</div>'+
      '<div class="cta"><a class="btn" href="/vmoto.html#vmoto-enquiry" onclick="sessionStorage.setItem(\'vmotoSelectedModel\','+JSON.stringify(m.model_name)+');sessionStorage.setItem(\'vmotoSelectedVariant\','+JSON.stringify(v.variant_name)+')">Enquire About This Version</a></div></article>'
  }).join(""):'<div class="empty">Ask AnyBike about the available versions, battery options and colours for this model.</div>';
  const faqHtml=faqs.length?faqs.map(f=>'<details class="faq"><summary>'+esc(f.question)+'</summary><div class="answer">'+esc(f.answer)+'</div></details>').join(""):'<div class="empty">Have a question about this model? Start an enquiry and AnyBike will help.</div>';
  document.getElementById("page").innerHTML=
    '<section class="hero"><div class="wrap hero-grid"><div><div class="kicker">VMOTO • UK RETAIL</div><h1>'+esc(m.model_name)+'</h1><p class="lead">'+esc(m.short_description||"Contact AnyBike for current specification, availability and pricing.")+'</p><div class="price">'+money(m.base_retail_price_gbp)+'<small>Recommended retail price. Final on-the-road and delivery total confirmed before order.</small></div><div class="cta"><a class="btn" href="/vmoto.html#vmoto-enquiry" onclick="sessionStorage.setItem(\'vmotoSelectedModel\','+JSON.stringify(m.model_name)+')">Start an Enquiry</a><a class="btn alt" href="/vmoto.html">Back to VMoto World</a></div></div><div class="hero-img">'+img+'</div></div></section>'+
    vmotoGalleryHtml(m)+
    (lifestyleImages[slug]?'<section class="lifestyle"><div class="wrap"><div class="lifestyle-card"><img src="'+esc(lifestyleImages[slug])+'" alt="'+esc(m.model_name)+' lifestyle image" loading="lazy"><div class="lifestyle-copy"><h2>'+esc(m.model_name)+' in the real world.</h2><p>Explore the design, detail and everyday character of this VMoto model, then ask AnyBike to confirm current UK availability and your delivered-to-door price.</p></div></div></div></section>':'')+
    '<section class="section"><div class="wrap"><h2>Technical specification.</h2><p class="intro">Current UK specification compiled from VMoto and current UK dealer information. Specification can vary by production batch and homologation, so AnyBike confirms the exact bike before order.</p><div class="tech-grid">'+Object.entries(technicalSpecs[slug]||{}).map(([k,v])=>'<div class="tech-item"><span>'+esc(k)+'</span><strong>'+esc(v)+'</strong></div>').join("")+'</div><div class="tech-note">'+esc(technicalNote(slug))+'</div></div></section>'+
    '<section class="section light"><div class="wrap"><h2>Battery options & colours.</h2><p class="intro">See the current UK battery configuration, charging information and colour range for this model. Availability of individual colours can change, and AnyBike confirms the exact specification before you proceed.</p><div class="variant-grid">'+variantHtml+'</div></div></section>'+
    '<section class="section"><div class="wrap"><h2>'+esc(m.model_name)+' FAQs.</h2><p class="intro">General VMoto answers plus model-specific answers approved for this model.</p><div class="faq-list">'+faqHtml+'</div></div></section>';
}
load().catch(error=>{console.error(error);document.getElementById("page").innerHTML='<section class="hero"><div class="wrap"><div class="empty">The VMoto model page could not be loaded right now.</div></div></section>'});
</script>
</body>
</html>
