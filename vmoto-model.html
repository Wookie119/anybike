<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VMoto Model | AnyBike UK Retail</title>
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#050505">
<link rel="icon" href="/anybike-logo-new.jpg" type="image/jpeg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#a8f0fc;--bg:#060606;--line:rgba(255,255,255,.12);--muted:#aaa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,Helvetica,sans-serif;line-height:1.5}a{color:inherit;text-decoration:none}.wrap{width:min(1280px,calc(100% - 40px));margin:auto}
.hero{padding:64px 0;background:radial-gradient(circle at 85% 5%,rgba(168,240,252,.30),transparent 34%),linear-gradient(135deg,#050505,#151515)}.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:34px;align-items:center}.kicker{color:#a8f0fc;font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}h1{margin:8px 0 16px;font-size:clamp(48px,7vw,86px);line-height:.94;letter-spacing:-.055em}h1 span{color:var(--blue)}.lead{color:#d2d2d2;font-size:20px;max-width:760px}.hero-img{min-height:360px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,#151515,#2d2d2d);display:flex;align-items:center;justify-content:center;overflow:hidden}.hero-img img{width:100%;height:100%;object-fit:cover}.price{font-size:34px;font-weight:900;color:#fff;margin-top:18px}.price small{display:block;font-size:12px;color:#aaa;font-weight:700}
.section{padding:56px 0}.section.light{background:#f4f4f4;color:#111}.section h2{margin:0 0 12px;font-size:clamp(34px,4vw,52px);line-height:1;letter-spacing:-.04em}.intro{color:#aaa;max-width:800px}.light .intro{color:#555}
.variant-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.variant{border:1px solid #ddd;border-radius:20px;background:#fff;padding:20px}.variant h3{margin:0 0 8px;font-size:24px}.variant p{color:#666}.specs{display:grid;gap:8px;margin:16px 0}.spec{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid #eee;padding-bottom:7px}.spec span:first-child{color:#777}.colours{display:flex;gap:8px;flex-wrap:wrap}.colour{padding:7px 10px;border-radius:999px;border:1px solid #ddd;background:#fafafa;font-size:12px;font-weight:900}
.stock{margin-top:12px;padding:10px 12px;border-radius:12px;background:#f0f7f2;color:#145c32;font-weight:900;font-size:13px}.stock.unknown{background:#f3f3f3;color:#666}
.faq-list{display:grid;gap:10px}.faq{border:1px solid var(--line);border-radius:16px;background:#111;overflow:hidden}.faq summary{cursor:pointer;padding:16px 18px;font-weight:900}.faq .answer{padding:0 18px 18px;color:#bbb;white-space:pre-line}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.btn{color:#000;display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:999px;background:var(--blue);border:1px solid var(--blue);font-weight:900}.btn.alt{background:transparent;border-color:rgba(255,255,255,.25)}
.empty{padding:20px;border:1px dashed rgba(255,255,255,.2);border-radius:16px;color:#aaa}
footer{padding:24px;text-align:center;color:#999;border-top:1px solid var(--line)}
@media(max-width:850px){.hero-grid{grid-template-columns:1fr}.hero-img{min-height:260px}}

.vmoto-site-header{position:sticky;top:0;z-index:80;background:#000;border-bottom:1px solid rgba(168,240,252,.32)}
.vmoto-site-header .inner{width:min(1500px,calc(100% - 36px));margin:auto;min-height:92px;display:flex;align-items:center;gap:22px}
.vmoto-site-header .anybike-logo{width:155px;height:70px;object-fit:contain}
.vmoto-site-header .brand-rule{width:1px;height:48px;background:rgba(255,255,255,.28)}
.vmoto-site-header .vmoto-logo{width:235px;max-height:58px;object-fit:contain}
.vmoto-site-nav{margin-left:auto;display:flex;align-items:center;gap:24px;font-weight:800}
.vmoto-site-nav a{color:#fff}
.vmoto-site-nav a:hover{color:var(--blue)}
.vmoto-site-nav .enquire{background:var(--blue);color:#000;padding:10px 16px;border-radius:999px}
.vmoto-site-nav .enquire:hover{background:#fff;color:#000}
.vmoto-brand-strip{background:var(--blue);color:#000;text-align:center;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:8px 16px;font-size:12px}
@media(max-width:900px){.vmoto-site-header .inner{min-height:78px;gap:12px}.vmoto-site-header .anybike-logo{width:118px;height:56px}.vmoto-site-header .vmoto-logo{width:165px}.vmoto-site-nav{display:none}}

.btn{background:var(--blue)!important;border-color:var(--blue)!important;color:#000!important}.btn:hover{background:#fff!important;border-color:#fff!important}
.btn.alt{background:transparent!important;color:#fff!important;border-color:rgba(168,240,252,.45)!important}.btn.alt:hover{background:var(--blue)!important;color:#000!important}
.kicker{color:var(--blue)!important}
.stock{border-color:rgba(168,240,252,.38)!important}
</style>
</head>
<body>
<header class="vmoto-site-header">
  <div class="inner">
    <a href="/" aria-label="AnyBike home"><img class="anybike-logo" src="/anybike-logo-new.jpg" alt="AnyBike"></a>
    <span class="brand-rule" aria-hidden="true"></span>
    <a href="/vmoto.html" aria-label="VMoto at AnyBike"><img class="vmoto-logo" src="https://vmoto.co.uk/app/uploads/2024/07/vmoto-logo.svg" alt="VMoto Electric Vehicles"></a>
    <nav class="vmoto-site-nav" aria-label="VMoto">
      <a href="/vmoto.html#range">Models</a>
      <a href="/vmoto.html#vmoto-faq">FAQ</a>
      <a href="/vmoto.html#vmoto-enquiry">Delivery &amp; Enquiry</a>
      <a href="/">AnyBike Home</a>
      <a class="enquire" href="/vmoto.html#vmoto-enquiry">Enquire</a>
    </nav>
  </div>
</header>
<div class="vmoto-brand-strip">VMoto electric motorcycles &amp; scooters — supplied by AnyBike with specialist UK delivery</div>
<main id="page">
<section class="hero"><div class="wrap"><div class="empty">Loading VMoto model…</div></div></section>
</main>
<footer>AnyBike • New VMoto Retail • Nationwide delivery from £99</footer>
<script>
const sb=supabase.createClient("https://tuehtnezhdnkqbbhttgp.supabase.co","sb_publishable_mrkBKDxEPVmdj2n7gPWsbg_l4CShtcK");
const slug=new URLSearchParams(location.search).get("model")||"";
const esc=v=>String(v??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const money=v=>{const n=Number(v);return Number.isFinite(n)&&n>0?n.toLocaleString("en-GB",{style:"currency",currency:"GBP",maximumFractionDigits:0}):"Price on request"};

async function load(){
  if(!slug){document.getElementById("page").innerHTML='<section class="hero"><div class="wrap"><div class="empty">No VMoto model selected.</div></div></section>';return}
  const [modelRes,faqRes]=await Promise.all([
    sb.rpc("public_get_vmoto_model_v1",{p_slug:slug}),
    sb.rpc("public_get_vmoto_faqs_v1",{p_model_slug:slug,p_territory_slug:null})
  ]);
  if(modelRes.error)throw modelRes.error;
  const m=modelRes.data||{};
  if(!m.id){document.getElementById("page").innerHTML='<section class="hero"><div class="wrap"><div class="empty">This VMoto model is not currently published.</div></div></section>';return}
  document.title=(m.model_name||"VMoto")+" | AnyBike UK Retail";
  const variants=Array.isArray(m.variants)?m.variants:[];
  const faqs=Array.isArray(faqRes.data)?faqRes.data:[];
  const img=m.hero_image_url?'<img src="'+esc(m.hero_image_url)+'" alt="'+esc(m.model_name)+'">':'⚡';
  const variantHtml=variants.length?variants.map(v=>{
    const colours=Array.isArray(v.colours)?v.colours:[];
    const stock=Array.isArray(v.stock)?v.stock:[];
    const liveStock=stock.filter(s=>["In Stock","Low Stock","Incoming"].includes(s.availability_status));
    const status=liveStock.length?liveStock.map(s=>s.availability_status+(s.stock_location?' · '+s.stock_location:'')).join(" | "):"Availability to be confirmed";
    return '<article class="variant"><h3>'+esc(v.variant_name)+'</h3><p>'+esc(v.battery_description||"")+'</p><div class="specs">'+
      '<div class="spec"><span>Battery</span><strong>'+esc(v.battery_capacity||"To be confirmed")+'</strong></div>'+
      '<div class="spec"><span>Quoted range</span><strong>'+esc(v.quoted_range||"To be confirmed")+'</strong></div>'+
      '<div class="spec"><span>Charging</span><strong>'+esc(v.charging_information||"To be confirmed")+'</strong></div>'+
      '<div class="spec"><span>Retail price</span><strong>'+money(v.retail_price_gbp)+'</strong></div>'+
      '</div><div class="colours">'+(colours.length?colours.map(c=>'<span class="colour">'+esc(c.colour_name)+'</span>').join(""):'<span class="colour">Colours to be confirmed</span>')+'</div>'+
      '<div class="stock '+(liveStock.length?'':'unknown')+'">'+esc(status)+'</div>'+
      '<div class="cta"><a class="btn" href="/vmoto.html#vmoto-enquiry" onclick="sessionStorage.setItem(\'vmotoSelectedModel\','+JSON.stringify(m.model_name)+');sessionStorage.setItem(\'vmotoSelectedVariant\','+JSON.stringify(v.variant_name)+')">Enquire About This Version</a></div></article>'
  }).join(""):'<div class="empty">Ask AnyBike about the available versions, battery options and colours for this model.</div>';
  const faqHtml=faqs.length?faqs.map(f=>'<details class="faq"><summary>'+esc(f.question)+'</summary><div class="answer">'+esc(f.answer)+'</div></details>').join(""):'<div class="empty">Have a question about this model? Start an enquiry and AnyBike will help.</div>';
  document.getElementById("page").innerHTML=
    '<section class="hero"><div class="wrap hero-grid"><div><div class="kicker">VMOTO • UK RETAIL</div><h1>'+esc(m.model_name)+'</h1><p class="lead">'+esc(m.short_description||"Contact AnyBike for current specification, availability and pricing.")+'</p><div class="price">'+money(m.base_retail_price_gbp)+'<small>Final on-the-road and delivery total confirmed before order.</small></div><div class="cta"><a class="btn" href="/vmoto.html#vmoto-enquiry" onclick="sessionStorage.setItem(\'vmotoSelectedModel\','+JSON.stringify(m.model_name)+')">Start an Enquiry</a><a class="btn alt" href="/vmoto.html">Back to VMoto World</a></div></div><div class="hero-img">'+img+'</div></div></section>'+
    '<section class="section light"><div class="wrap"><h2>Versions & battery choices.</h2><p class="intro">Choose the version that suits you. Availability and the final delivered price are confirmed by AnyBike before you proceed.</p><div class="variant-grid">'+variantHtml+'</div></div></section>'+
    '<section class="section"><div class="wrap"><h2>'+esc(m.model_name)+' FAQs.</h2><p class="intro">General VMoto answers plus model-specific answers approved for this model.</p><div class="faq-list">'+faqHtml+'</div></div></section>';
}
load().catch(error=>{console.error(error);document.getElementById("page").innerHTML='<section class="hero"><div class="wrap"><div class="empty">The VMoto model page could not be loaded right now.</div></div></section>'});
</script>
</body>
</html>
