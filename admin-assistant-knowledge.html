<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assistant Knowledge | AnyBike Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin.js?v=12001"></script><link rel="stylesheet" href="/admin-shell.css?v=12001"><style>body{background:#090909;color:#fff;font:14px Arial}main{width:100%;max-width:none;padding:22px}h1{font-size:26px}input,textarea{display:block;width:100%;background:#222;color:#fff;border:1px solid #666;border-radius:8px;padding:10px;margin:6px 0 12px}textarea{min-height:100px}button{background:#ed1c24;color:#fff;border:0;border-radius:7px;padding:11px 17px;cursor:pointer;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.item{border:1px solid #444;border-radius:10px;padding:15px;margin:12px 0;background:#181818}.muted{color:#aaa}a{color:#ed1c24}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="admin-page-content"><h1>Assistant · Approved Website Knowledge</h1><p>Only approved, customer-safe summaries are available to the assistant. It does not crawl private website pages or automatically publish site content. Check every answer before publishing.</p><p><a href="/admin-assistant-questions.html">← Assistant Questions</a></p><div id="status">Loading…</div><div class="item"><h2 id="formTitle">Add reviewed website knowledge</h2><div class="grid"><label>Customer-safe title<input id="title" placeholder="Buying a motorcycle"></label><label>Public page path<input id="url" placeholder="/motorcycle-export.html"></label></div><label>Approved customer-facing information<textarea id="summary" maxlength="4000" placeholder="Summarise only verified public information from this page."></textarea></label><label>Matching words or phrases<input id="keywords" placeholder="buying, export, international buyer"></label><label><input id="published" type="checkbox" style="display:inline;width:auto"> Approved for customer use</label><button id="save">Save reviewed knowledge</button> <button id="clear" style="background:#333">New entry</button><p id="feedback"></p></div><div id="items"></div></main><script>
const db=supabase.createClient('https://tuehtnezhdnkqbbhttgp.supabase.co','sb_publishable_mrkBKDxEPVmdj2n7gPWsbg_l4CShtcK');let items=[],editId=null;const el=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));function clear(){editId=null;for(const k of ['title','url','summary','keywords'])el(k).value='';el('published').checked=false;el('formTitle').textContent='Add reviewed website knowledge';}el('clear').onclick=clear;async function load(){const {data,error}=await db.rpc('admin_assistant_knowledge_list_v1');el('status').textContent=error?'Unable to load: '+error.message:(data.length+' reviewed entries');if(error)return;items=data;el('items').innerHTML=data.map(x=>'<div class="item"><strong>'+esc(x.title)+'</strong> · '+(x.published?'Published':'Draft')+'<p class="muted">'+esc(x.public_url)+'</p><p>'+esc(x.summary)+'</p><button data-id="'+x.id+'">Edit</button></div>').join('');el('items').querySelectorAll('button').forEach(b=>b.onclick=()=>{const x=items.find(t=>t.id===Number(b.dataset.id));editId=x.id;for(const k of ['title','summary','keywords'])el(k).value=x[k];el('url').value=x.public_url;el('published').checked=x.published;el('formTitle').textContent='Edit approved knowledge #'+x.id;window.scrollTo({top:0,behavior:'smooth'})})}el('save').onclick=async()=>{if(el('published').checked&&!confirm('Confirm this text is customer-safe, verified and approved for publication?'))return;const {error}=await db.rpc('admin_assistant_knowledge_manage_v1',{p_id:editId,p_title:el('title').value,p_url:el('url').value,p_summary:el('summary').value,p_keywords:el('keywords').value,p_published:el('published').checked});el('feedback').textContent=error?error.message:'Saved';if(!error){clear();await load()}};load();
</script></body></html>
