
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lead Status Pipeline | AnyBike Admin</title>
<meta name="robots" content="noindex,nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --red:#ed1c24;
  --bg:#050505;
  --panel:#111;
  --panel2:#181818;
  --line:rgba(255,255,255,.12);
  --muted:#aaa;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:#050505!important;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  background-image:none!important;
}
body::before,body::after{display:none!important;content:none!important}
body{overflow-x:hidden}
.admin-layout{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:100vh;background:#050505}
#adminSidebar{width:190px;min-height:100vh;background:#070707;border-right:1px solid var(--line);position:sticky;top:0;align-self:start;overflow:auto;z-index:5}
.main{min-width:0;width:100%;padding:22px;background:#050505}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:18px}
h1{margin:0;font-size:30px;line-height:1.1}.sub{margin-top:6px;color:var(--muted);font-size:13px}
button{border:none;border-radius:12px;background:var(--red);color:#fff;padding:11px 16px;font-weight:900;cursor:pointer}button.secondary{background:#292929}button.green{background:#007a35}button.amber{background:#9a6900}button:hover{filter:brightness(1.08)}
input,select,textarea{width:100%;border-radius:10px;border:1px solid var(--line);background:#0b0b0b;color:#fff;padding:10px;font-size:14px;outline:none}textarea{resize:vertical}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:12px;margin-bottom:16px}.kpi{background:#111;border:1px solid var(--line);border-radius:16px;padding:14px;min-height:82px}.kpi span{color:#ddd;font-size:13px;font-weight:800}.kpi strong{display:block;font-size:28px;margin-top:8px}
.pipeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:16px}.stage-card{background:#111;border:1px solid var(--line);border-radius:16px;padding:12px;min-height:96px;cursor:pointer}.stage-card:hover{border-color:rgba(237,28,36,.55)}.stage-card.active{border:2px solid var(--red);background:#170708}.stage-card .num{color:var(--muted);font-size:12px;font-weight:900}.stage-card .name{margin-top:6px;font-weight:900;line-height:1.15;min-height:34px}.stage-card .count{margin-top:8px;font-size:26px;font-weight:900}
.controls{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1fr;gap:10px;margin-bottom:14px}.panel{background:#111;border:1px solid var(--line);border-radius:18px;overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:#141414}.panel-head strong{font-size:18px}
.lead-row{
  display:grid;
  grid-template-columns:2fr 1.1fr 1fr 100px;
  gap:16px;
  align-items:center;
  padding:16px;
  border-bottom:1px solid var(--line);
}
.drawer-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:20}.drawer-backdrop.open{display:block}.drawer{position:fixed;right:0;top:0;height:100vh;width:min(680px,94vw);background:#090909;border-left:1px solid var(--line);z-index:25;transform:translateX(105%);transition:.2s ease;overflow:auto}.drawer.open{transform:translateX(0)}.drawer-head{position:sticky;top:0;background:#111;border-bottom:1px solid var(--line);padding:16px;z-index:2}.drawer-head-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.drawer h2{margin:0;font-size:22px}.drawer-body{padding:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:12px}.section{background:#161616;border:1px solid var(--line);border-radius:14px;padding:14px}.section h3{margin:0 0 12px;font-size:16px}label{display:block;color:#ddd;font-size:13px;margin:10px 0 6px}.check-label{display:flex;align-items:center;gap:8px;margin:8px 0}.check-label input{width:auto}.action-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.module-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.timeline{margin-top:8px;border-left:3px solid var(--red);padding-left:12px}.timeline-item{margin-bottom:12px;color:#ddd;font-size:13px}.timeline-item small{display:block;color:var(--muted);margin-bottom:3px}.empty{padding:18px;color:#bbb}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}.lead-row{grid-template-columns:1.4fr 1fr 1fr 1fr 100px}.hide-med{display:none}}
@media(max-width:850px){.admin-layout{grid-template-columns:1fr}#adminSidebar{display:none}.main{padding:16px}.page-head,.controls,.kpis,.grid,.lead-row{display:grid;grid-template-columns:1fr}.module-grid,.action-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="admin-layout">
  <aside id="adminSidebar"></aside>
  <main class="main">
    <div class="page-head"><div><h1>Lead Status Pipeline</h1><div class="sub">One clean status pipeline for all AnyBike Connect leads and messages. CRM and other pages stay as the working areas.</div></div><button type="button" onclick="openNewLead()">+ Manual Lead</button></div>
    <div class="kpis"><div class="kpi"><span>Total Active</span><strong id="kpiActive">0</strong></div><div class="kpi"><span>New Leads</span><strong id="kpiNew">0</strong></div><div class="kpi"><span>Assigned</span><strong id="kpiAssigned">0</strong></div><div class="kpi"><span>Waiting Customer</span><strong id="kpiWaiting">0</strong></div><div class="kpi"><span>Operations</span><strong id="kpiOperations">0</strong></div><div class="kpi"><span>Completed</span><strong id="kpiCompleted">0</strong></div></div>
    <div id="pipelineCards" class="pipeline"></div>
    <div class="controls"><input id="searchBox" placeholder="Search lead, customer, country..." oninput="renderLeadRows()"><select id="subjectFilter" onchange="renderLeadRows()"><option value="">All AnyBike Connect Subjects</option></select><select id="departmentFilter" onchange="renderLeadRows()"><option value="">All Departments</option><option>Bike Sales</option><option>Buying Team</option><option>Business Development</option><option>Global Sales</option><option>Logistics</option><option>Finance</option><option>Marketing</option><option>Website Support</option><option>Message Centre</option></select><select id="managerFilter" onchange="renderLeadRows()"><option value="">All Lead Managers</option></select><select id="priorityFilter" onchange="renderLeadRows()"><option value="">All Priorities</option><option>Normal</option><option>High</option><option>Urgent</option></select></div>
    <section class="panel"><div class="panel-head"><strong id="listTitle">Latest Active Leads</strong><span class="lead-small" id="listCount">0 leads</span></div><div id="leadRows"></div></section>
  </main>
</div>
<div id="drawerBackdrop" class="drawer-backdrop" onclick="closeDrawer()"></div><aside id="leadDrawer" class="drawer"><div id="drawerContent"></div></aside>
<script>
const SUPABASE_URL="https://tuehtnezhdnkqbbhttgp.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_mrkBKDxEPVmdj2n7gPWsbg_l4CShtcK";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const STAFF=["Sean Byrne","Andy Gifford","Sophie Gifford","Cat Byrne"];
const LEAD_STATUSES=["New Lead","Assigned","Contact Made","Information Needed","Research / Availability","Proposal / Offer Sent","Negotiating","Waiting Customer","Confirmed","Payment / Deposit","Operations","Shipping / Delivery","Completed","Closed","Lost","Save For Later"];
const CONNECT_SUBJECTS=[{emoji:"👤",name:"Private Buyer",desc:"Looking to buy a motorcycle from AnyBike.",department:"Bike Sales",manager:"Sean Byrne"},{emoji:"🏍",name:"Private Seller",desc:"Looking to sell your motorcycle.",department:"Buying Team",manager:"Andy Gifford"},{emoji:"🏢",name:"Motorcycle Dealer",desc:"Dealership enquiries, trade buying and stock sourcing.",department:"Bike Sales",manager:"Sean Byrne"},{emoji:"💼",name:"Motorcycle Trader",desc:"Buying and selling motorcycles independently or as a trade business.",department:"Business Development",manager:"Sean Byrne"},{emoji:"🌍",name:"Motorcycle Importer",desc:"Import motorcycles into your country.",department:"Global Sales",manager:"Sean Byrne"},{emoji:"🚚",name:"Motorcycle Exporter",desc:"Export motorcycles worldwide or partner with AnyBike.",department:"Global Sales",manager:"Sean Byrne"},{emoji:"💰",name:"Finance Company",desc:"Offer motorcycle finance or become an AnyBike finance partner.",department:"Finance",manager:"Cat Byrne"},{emoji:"🚢",name:"Shipping / Logistics Company",desc:"Freight, transport, customs, crating and export services.",department:"Logistics",manager:"Sophie Gifford"},{emoji:"🌐",name:"Marketplace / Auction",desc:"Stock feeds, advertising, auctions or marketplace partnerships.",department:"Business Development",manager:"Andy Gifford"},{emoji:"🤝",name:"Trade Partner",desc:"Commercial partnership opportunities with AnyBike.",department:"Business Development",manager:"Andy Gifford"},{emoji:"🏭",name:"Industry Supplier",desc:"Parts, accessories, warranty, inspection, software, advertising or other services.",department:"Buying Team",manager:"Andy Gifford"},{emoji:"🏁",name:"Manufacturer / Brand Representative",desc:"Brand, manufacturer or official representative enquiries.",department:"Business Development",manager:"Andy Gifford"},{emoji:"📰",name:"Press & Media",desc:"Media, interview, content and press enquiries.",department:"Marketing",manager:"Sophie Gifford"},{emoji:"💻",name:"Website Support",desc:"Report a website issue or technical problem.",department:"Website Support",manager:"Andy Gifford"},{emoji:"❓",name:"General Enquiry",desc:"Not sure where your enquiry fits? Choose this option.",department:"Message Centre",manager:"Sean Byrne"}];
let allLeads=[],timelineMap={},selectedStatus="";
function esc(v){return String(v||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c];});}
function getSubject(name){return CONNECT_SUBJECTS.find(x=>x.name===name)||CONNECT_SUBJECTS[CONNECT_SUBJECTS.length-1];}
function subjectLabel(name){const s=getSubject(name);return s.emoji+" "+s.name;}
function setupFilters(){const sf=document.getElementById("subjectFilter");CONNECT_SUBJECTS.forEach(s=>{let o=document.createElement("option");o.value=s.name;o.textContent=s.emoji+" "+s.name;sf.appendChild(o);});const mf=document.getElementById("managerFilter");STAFF.forEach(s=>{let o=document.createElement("option");o.value=s;o.textContent=s;mf.appendChild(o);});}
async function loadAdminShell(){try{const res=await fetch("admin-sidebar.html?v=5000");const html=await res.text();const sidebar=document.getElementById("adminSidebar");if(sidebar)sidebar.innerHTML=html;if(typeof setupAdminFolders==="function")setupAdminFolders();}catch(e){console.warn("Admin sidebar could not be loaded",e);}}
async function loadLeads(){const {data,error}=await sb.from("anybike_leads").select("*").order("updated_at",{ascending:false});if(error){document.getElementById("leadRows").innerHTML='<div class="empty">Error loading leads: '+esc(error.message)+'</div>';return;}allLeads=data||[];await loadTimelines();renderKpis();renderPipelineCards();renderLeadRows();}
async function loadTimelines(){timelineMap={};if(!allLeads.length)return;const ids=allLeads.map(l=>l.id);const {data,error}=await sb.from("anybike_lead_timeline").select("*").in("lead_id",ids).order("created_at",{ascending:false});if(!error&&data){data.forEach(t=>{if(!timelineMap[t.lead_id])timelineMap[t.lead_id]=[];timelineMap[t.lead_id].push(t);});}}
function activeLead(l){return !["Completed","Closed","Lost","Save For Later"].includes(l.status);}
function renderKpis(){document.getElementById("kpiActive").textContent=allLeads.filter(activeLead).length;document.getElementById("kpiNew").textContent=allLeads.filter(l=>l.status==="New Lead").length;document.getElementById("kpiAssigned").textContent=allLeads.filter(l=>l.status==="Assigned").length;document.getElementById("kpiWaiting").textContent=allLeads.filter(l=>l.status==="Waiting Customer").length;document.getElementById("kpiOperations").textContent=allLeads.filter(l=>l.status==="Operations").length;document.getElementById("kpiCompleted").textContent=allLeads.filter(l=>l.status==="Completed").length;}
function renderPipelineCards(){const box=document.getElementById("pipelineCards");const cards=LEAD_STATUSES.map((status,index)=>{const count=allLeads.filter(l=>l.status===status).length;const active=selectedStatus===status?" active":"";return '<div class="stage-card'+active+'" onclick="selectStatus(\''+esc(status)+'\')"><div class="num">'+(index+1)+'</div><div class="name">'+esc(status)+'</div><div class="count">'+count+'</div></div>';}).join("");const allActive=selectedStatus===""?" active":"";box.innerHTML=cards+'<div class="stage-card'+allActive+'" onclick="selectStatus(\'\')"><div class="num">All</div><div class="name">All Leads</div><div class="count">'+allLeads.length+'</div></div>';}
function selectStatus(status){selectedStatus=status;renderPipelineCards();renderLeadRows();}
function renderLeadRows(){const q=document.getElementById("searchBox").value.toLowerCase().trim();const subject=document.getElementById("subjectFilter").value;const department=document.getElementById("departmentFilter").value;const manager=document.getElementById("managerFilter").value;const priority=document.getElementById("priorityFilter").value;let leads=allLeads.filter(l=>{const leadSubject=l.lead_type||l.subject||"General Enquiry";const blob=[leadSubject,l.subject,l.customer_name,l.customer_email,l.country,l.city,l.region,l.department,l.lead_manager,l.status,l.priority].join(" ").toLowerCase();if(selectedStatus&&l.status!==selectedStatus)return false;if(q&&!blob.includes(q))return false;if(subject&&leadSubject!==subject)return false;if(department&&l.department!==department)return false;if(manager&&l.lead_manager!==manager)return false;if(priority&&(l.priority||"Normal")!==priority)return false;return true;});document.getElementById("listTitle").textContent=selectedStatus?selectedStatus+" Leads":"Latest Active Leads";document.getElementById("listCount").textContent=leads.length+(leads.length===1?" lead":" leads");const box=document.getElementById("leadRows");if(!leads.length){box.innerHTML='<div class="empty">No leads found.</div>';return;}box.innerHTML=leads.map(rowHtml).join("");}
function rowHtml(l){const leadSubject=l.lead_type||l.subject||"General Enquiry";const customer=l.customer_name||l.customer_email||"No customer attached";const priority=l.priority||"Normal";const priorityClass=priority==="Urgent"?"red":priority==="High"?"amber":"";const country=l.country||"-";const manager=l.lead_manager||"Unassigned";const department=l.department||getSubject(leadSubject).department||"Message Centre";return '<div class="lead-row"><div><div class="lead-title">'+esc(subjectLabel(leadSubject))+'</div><div class="lead-small">'+esc(customer)+'</div></div><div><span class="badge red">'+esc(department)+'</span></div><div class="hide-med"><div class="lead-title">'+esc(manager)+'</div><div class="lead-small">Lead Manager</div></div><div><span class="badge">'+esc(l.status||"New Lead")+'</span></div><div class="hide-med"><span class="badge '+priorityClass+'">'+esc(priority)+'</span></div><div class="hide-med">'+esc(country)+'</div><button type="button" class="secondary" onclick="openDrawer('+l.id+')">Open</button></div>';}
function getLead(id){return allLeads.find(l=>Number(l.id)===Number(id));}
function openDrawer(id){const l=getLead(id);if(!l)return;const leadSubject=l.lead_type||l.subject||"General Enquiry";const subjectInfo=getSubject(leadSubject);const timelines=timelineMap[l.id]||[];const support=l.supporting_staff||[];const priority=l.priority||"Normal";document.getElementById("drawerContent").innerHTML='<div class="drawer-head"><div class="drawer-head-top"><div><h2>'+esc(subjectLabel(leadSubject))+'</h2><div class="lead-small">'+esc(subjectInfo.desc)+'</div></div><button type="button" class="secondary" onclick="closeDrawer()">Close</button></div></div><div class="drawer-body"><div class="grid"><div class="section"><h3>Lead Details</h3><p><strong>Customer</strong><br>'+esc(l.customer_name||"-")+'</p><p><strong>Email</strong><br>'+esc(l.customer_email||"-")+'</p><p><strong>Phone</strong><br>'+esc(l.customer_phone||"-")+'</p><p><strong>Location</strong><br>'+esc([l.city,l.region,l.country].filter(Boolean).join(", ")||"-")+'</p></div><div class="section"><h3>Status</h3><label>Current Status</label><select id="drawerStatus-'+l.id+'">'+LEAD_STATUSES.map(s=>'<option '+(l.status===s?"selected":"")+'>'+esc(s)+'</option>').join("")+'</select><label>Priority</label><select id="drawerPriority-'+l.id+'">'+["Normal","High","Urgent"].map(p=>'<option '+(priority===p?"selected":"")+'>'+esc(p)+'</option>').join("")+'</select><button type="button" style="margin-top:10px;" onclick="saveDrawerStatus('+l.id+')">Save Status</button><div class="action-grid"><button type="button" class="green" onclick="completeStage('+l.id+')">Complete</button><button type="button" class="amber" onclick="skipStage('+l.id+')">Skip</button><button type="button" class="secondary" onclick="moveBack('+l.id+')">Back</button></div></div><div class="section"><h3>Ownership</h3><label>Lead Manager</label><select id="drawerManager-'+l.id+'">'+STAFF.map(s=>'<option '+(l.lead_manager===s?"selected":"")+'>'+esc(s)+'</option>').join("")+'</select><label>Supporting Staff</label>'+STAFF.map(s=>'<label class="check-label"><input type="checkbox" id="support-'+l.id+'-'+s.replaceAll(" ","-")+'" '+(support.includes(s)?"checked":"")+'> '+esc(s)+'</label>').join("")+'<button type="button" style="margin-top:10px;" onclick="saveOwnership('+l.id+')">Save Ownership</button></div><div class="section"><h3>Open Existing Workspaces</h3><div class="module-grid"><button type="button" class="secondary" onclick="openCrm('+l.id+')">Open CRM</button><button type="button" class="secondary" onclick="openMessage('+l.id+')">Open Message</button><button type="button" class="secondary" onclick="openCustomer('+l.id+')">Customer 360</button><button type="button" class="secondary" onclick="openLogistics('+l.id+')">Logistics</button></div><p class="lead-small">These buttons route to existing pages. They do not replace the CRM.</p></div><div class="section" style="grid-column:1/-1;"><h3>Quick Notes</h3><textarea id="drawerNotes-'+l.id+'" rows="5">'+esc(l.internal_notes||"")+'</textarea><button type="button" style="margin-top:10px;" onclick="saveNotes('+l.id+')">Save Notes</button></div><div class="section" style="grid-column:1/-1;"><h3>Timeline</h3><div class="timeline">'+(timelines.length?timelines.map(t=>'<div class="timeline-item"><small>'+new Date(t.created_at).toLocaleString()+'</small><strong>'+esc(t.event_type||"Update")+'</strong><br>'+esc(t.event_text||"")+(t.created_by?'<br><span class="lead-small">By '+esc(t.created_by)+'</span>':"")+'</div>').join(""):'<div class="lead-small">No timeline yet.</div>')+'</div></div></div></div>';document.getElementById("drawerBackdrop").classList.add("open");document.getElementById("leadDrawer").classList.add("open");}
function closeDrawer(){document.getElementById("drawerBackdrop").classList.remove("open");document.getElementById("leadDrawer").classList.remove("open");}
async function addTimeline(leadId,type,text,by){await sb.from("anybike_lead_timeline").insert({lead_id:leadId,event_type:type,event_text:text,created_by:by||"Admin"});}
async function saveDrawerStatus(id){const lead=getLead(id);const oldStatus=lead?lead.status:"";const newStatus=document.getElementById("drawerStatus-"+id).value;const priority=document.getElementById("drawerPriority-"+id).value;const {error}=await sb.from("anybike_leads").update({status:newStatus,priority:priority,updated_at:new Date().toISOString()}).eq("id",id);if(error){alert(error.message);return;}await addTimeline(id,"Status Updated",oldStatus+" → "+newStatus+". Priority: "+priority,"Admin");await loadLeads();openDrawer(id);}
async function saveOwnership(id){const manager=document.getElementById("drawerManager-"+id).value;const support=STAFF.filter(s=>{const box=document.getElementById("support-"+id+"-"+s.replaceAll(" ","-"));return box&&box.checked;});const {error}=await sb.from("anybike_leads").update({lead_manager:manager,supporting_staff:support,status:"Assigned",updated_at:new Date().toISOString()}).eq("id",id);if(error){alert(error.message);return;}await addTimeline(id,"Ownership Updated","Lead Manager set to "+manager+". Supporting Staff: "+(support.join(", ")||"None"),"Admin");await loadLeads();openDrawer(id);}
async function completeStage(id){const lead=getLead(id);if(!lead)return;const current=LEAD_STATUSES.indexOf(lead.status);const next=LEAD_STATUSES[Math.min(current+1,LEAD_STATUSES.length-1)];const {error}=await sb.from("anybike_leads").update({status:next,updated_at:new Date().toISOString()}).eq("id",id);if(error){alert(error.message);return;}await addTimeline(id,"Stage Completed",lead.status+" completed. Moved to "+next,"Admin");await loadLeads();openDrawer(id);}
async function skipStage(id){const lead=getLead(id);if(!lead)return;const current=LEAD_STATUSES.indexOf(lead.status);const skipped=lead.status;const next=LEAD_STATUSES[Math.min(current+1,LEAD_STATUSES.length-1)];const skippedStages=lead.skipped_stages||[];if(!skippedStages.includes(skipped))skippedStages.push(skipped);const {error}=await sb.from("anybike_leads").update({status:next,skipped_stages:skippedStages,updated_at:new Date().toISOString()}).eq("id",id);if(error){alert(error.message);return;}await addTimeline(id,"Stage Skipped",skipped+" skipped. Moved to "+next,"Admin");await loadLeads();openDrawer(id);}
async function moveBack(id){const lead=getLead(id);if(!lead)return;const current=LEAD_STATUSES.indexOf(lead.status);const prev=LEAD_STATUSES[Math.max(current-1,0)];const {error}=await sb.from("anybike_leads").update({status:prev,updated_at:new Date().toISOString()}).eq("id",id);if(error){alert(error.message);return;}await addTimeline(id,"Moved Back",lead.status+" → "+prev,"Admin");await loadLeads();openDrawer(id);}
async function saveNotes(id){const notes=document.getElementById("drawerNotes-"+id).value;const {error}=await sb.from("anybike_leads").update({internal_notes:notes,updated_at:new Date().toISOString()}).eq("id",id);if(error){alert(error.message);return;}await addTimeline(id,"Notes Updated","Quick notes updated.","Admin");await loadLeads();openDrawer(id);}
function openCrm(id){const l=getLead(id);if(l&&l.related_enquiry_id)window.location.href="admin-enquiries.html?enquiry="+encodeURIComponent(l.related_enquiry_id);else alert("This lead is not linked to a CRM enquiry yet.");}
function openMessage(id){const l=getLead(id);if(l&&l.related_thread_id)window.location.href="admin-message-centre.html?thread="+encodeURIComponent(l.related_thread_id);else alert("This lead is not linked to a message thread yet.");}
function openCustomer(id){const l=getLead(id);if(l&&l.customer_id)window.location.href="admin-customers.html?customer="+encodeURIComponent(l.customer_id);else alert("This lead is not linked to Customer 360 yet.");}
function openLogistics(id){const l=getLead(id);if(l)window.location.href="admin-logistics.html?lead="+encodeURIComponent(l.id);}
async function openNewLead(){const subjectName=prompt("AnyBike Connect subject:\n\n"+CONNECT_SUBJECTS.map((s,i)=>(i+1)+". "+s.name).join("\n")+"\n\nType the exact subject name:");if(!subjectName)return;const subject=getSubject(subjectName);const customerName=prompt("Customer / company name?")||"";const customerEmail=prompt("Customer email?")||"";const {data,error}=await sb.from("anybike_leads").insert({subject:subject.name,lead_type:subject.name,department:subject.department,status:"New Lead",lead_manager:null,customer_name:customerName,customer_email:customerEmail,priority:"Normal",updated_at:new Date().toISOString()}).select().single();if(error){alert(error.message);return;}await addTimeline(data.id,"Lead Created","Lead created from AnyBike Connect subject: "+subject.name,"System");await addTimeline(data.id,"Department Routed","Routed to "+subject.department+". Suggested manager: "+subject.manager,"System");await loadLeads();openDrawer(data.id);}
setupFilters();loadAdminShell();loadLeads();
</script>
<script src="admin.js?v=5000"></script>
</body>
</html>
