<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>My Purchases | AnyBike</title>
<link rel="icon" href="/anybike-logo-new.jpg" type="image/jpeg">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="/public-header.css?v=12006">

<style>
:root{
  --red:#ed1c24;
  --bg:#050505;
  --panel:#101010;
  --panel2:#171717;
  --text:#fff;
  --muted:#aaa;
  --green:#36d37e;
  --amber:#ffbf47;
  --orange:#ff9f1c;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:
    radial-gradient(
      circle at 90% 0%,
      rgba(237,28,36,.13),
      transparent 32%
    ),
    #050505;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

main{
  width:min(1420px,94vw);
  margin:28px auto 70px;
}

.hero{
  border:1px solid rgba(255,255,255,.14);
  border-radius:22px;
  padding:25px;
  background:#101010;
  margin-bottom:20px;
}

.eyebrow{
  color:var(--red);
  font-size:12px;
  font-weight:900;
  letter-spacing:.18em;
}

.hero h1{
  font-size:38px;
  margin:7px 0;
}

.hero p{
  color:#bbb;
  margin:0;
  line-height:1.5;
}

.top-actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:42px;
  padding:0 16px;
  border-radius:10px;
  text-decoration:none;
  font-weight:900;
  border:1px solid rgba(255,255,255,.16);
  color:#fff;
  background:#171717;
}

.panel{
  border:1px solid rgba(255,255,255,.12);
  border-radius:20px;
  background:
    radial-gradient(
      circle at 95% 0%,
      rgba(237,28,36,.07),
      transparent 30%
    ),
    #101010;
  padding:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}

.card{
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  overflow:hidden;
  background:#141414;
}

.card.secured{
  border-color:rgba(255,255,255,.16);
}

.image{
  height:250px;
  background:#090909;
  display:flex;
  align-items:center;
  justify-content:center;
}

.image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.body{
  padding:18px;
}

.top{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.top h2{
  margin:0;
  font-size:24px;
}

.variant{
  color:#aaa;
  margin-top:4px;
}

.badges{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  justify-content:flex-end;
  align-items:flex-start;
}

.badge{
  height:max-content;
  padding:6px 10px;
  border-radius:999px;
  border:1px solid rgba(54,211,126,.45);
  background:rgba(54,211,126,.13);
  color:#d9ffe8;
  font-size:11px;
  font-weight:900;
  white-space:nowrap;
}

.badge.secured{
  border-color:var(--green);
  background:rgba(54,211,126,.18);
  color:#8cffb7;
}

.badge.payment-due{
  border-color:rgba(255,191,71,.55);
  background:rgba(255,191,71,.11);
  color:#ffd98b;
}

.status{
  margin:16px 0;
  padding:15px;
  border:1px solid rgba(255,255,255,.1);
  background:#0d0d0d;
  border-radius:13px;
}

.status strong{
  display:block;
  color:#d9ffe8;
  font-size:19px;
}

.status span{
  display:block;
  color:#aaa;
  margin-top:5px;
  font-size:13px;
  line-height:1.45;
}

.status.payment-due{
  border-color:rgba(255,191,71,.35);
  background:rgba(255,191,71,.06);
}

.status.payment-due strong{
  color:#ffd98b;
}

.status.payment-due span{
  color:#dcc89d;
}

.price{
  padding:15px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:13px;
  margin-bottom:12px;
}

.price strong{
  display:block;
  font-size:24px;
}

.price span{
  font-size:12px;
  color:#999;
}

.payment-summary{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  margin-bottom:12px;
}

.payment-box{
  border:1px solid rgba(255,255,255,.1);
  border-radius:11px;
  padding:11px;
  background:#0d0d0d;
}

.payment-box span{
  display:block;
  color:#888;
  font-size:9px;
  font-weight:900;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:5px;
}

.payment-box strong{
  font-size:15px;
}

.payment-box.good strong{
  color:var(--green);
}

.payment-box.due strong{
  color:#ffd27a;
}

.details{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}

.detail{
  border:1px solid rgba(255,255,255,.1);
  border-radius:11px;
  padding:11px;
  background:#0d0d0d;
}

.detail span{
  display:block;
  color:#888;
  font-size:9px;
  font-weight:900;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:5px;
}

.good-text{
  color:var(--green);
  font-weight:900;
}

.due-text{
  color:#ffd27a;
  font-weight:900;
}

.journey{
  margin-top:14px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:13px;
  padding:14px;
  background:#0d0d0d;
}

.journey-title{
  font-size:11px;
  color:#999;
  text-transform:uppercase;
  font-weight:900;
  letter-spacing:.08em;
  margin-bottom:11px;
}

.steps{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
}

.step{
  position:relative;
  padding:8px 11px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.12);
  background:#111;
  color:#aaa;
  font-size:10px;
  font-weight:900;
  line-height:1.1;
}

.step.done{
  border-color:rgba(54,211,126,.58);
  background:rgba(54,211,126,.12);
  color:#9fffc3;
}

.step.current,
.step.current-payment{
  border-color:rgba(255,159,28,.72);
  background:rgba(255,159,28,.14);
  color:#ffc46e;
}

.step.todo{
  border-color:rgba(255,255,255,.12);
  background:#111;
  color:#747474;
}

.step.done::before,
.step.current::before,
.step.current-payment::before,
.step.todo::before{
  display:inline-block;
  margin-right:5px;
  font-size:9px;
}

.step.done::before{
  content:"✓";
}

.step.current::before,
.step.current-payment::before{
  content:"●";
}

.step.todo::before{
  content:"○";
}

.journey-next{
  margin-top:12px;
  padding:12px 13px;
  border:1px solid rgba(237,28,36,.35);
  border-radius:11px;
  background:#121212;
}
.journey-next span{
  display:block;
  color:#999;
  font-size:11px;
  text-transform:uppercase;
  font-weight:900;
  letter-spacing:.07em;
}
.journey-next strong{
  display:block;
  margin-top:4px;
  color:#fff;
  font-size:14px;
}
.journey-next p{
  margin:4px 0 0;
  color:#aaa;
  font-size:12px;
  line-height:1.45;
}

.notice{
  margin-top:14px;
  color:#aaa;
  font-size:12px;
  line-height:1.5;
}

.notice strong{
  color:#fff;
}

.empty{
  padding:34px;
  text-align:center;
  border:1px dashed rgba(255,255,255,.18);
  border-radius:14px;
  color:#bbb;
}

@media(max-width:900px){

@media(max-width:700px){

  .image{
    height:210px;
  }

    flex-direction:column;
  }

  .badges{
    justify-content:flex-start;
  }
}

<script src="/public-header.js?v=12006"></script>

<script>

const SUPABASE_URL =
  "https://tuehtnezhdnkqbbhttgp.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_mrkBKDxEPVmdj2n7gPWsbg_l4CShtcK";

const sb = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const safe = value =>
  String(value ?? "").replace(
    /[&<>"']/g,
    character => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[character])
  );

const money = value => {
  const n=Number(value);
  return Number.isFinite(n) ? "£"+n.toFixed(2) : "-";
};

function deliveryLabel(value){

  const delivery =
    String(value || "").trim();

  if(delivery === "Buyer Arranged / Collection"){
    return "Buyer arranged / collection";
  }

  if(delivery === "Delivery to UK Address"){
    return "Delivery to UK address";
  }

  if(delivery === "Delivery to UK Port"){
    return "Delivery to UK port";
  }

  if(delivery === "Other Agreed Delivery"){
    return "Other agreed delivery";
  }

  return delivery || "To be agreed";
}

function purchaseState(purchase){

  const depositRequired=!!purchase.deposit_required;
  const depositDue=Number(purchase.deposit_due_gbp||0);
  const depositAllocated=Number(purchase.deposit_allocated_gbp||0);
  const depositOutstanding=Number(purchase.deposit_outstanding_gbp||0);
  const moneyReceived=Number(purchase.customer_money_received_deal_gbp||0);
  const allocated=Number(purchase.customer_allocated_motorcycle_gbp||0);
  const balance=Number(purchase.customer_balance_motorcycle_gbp||0);
  const secured=!!purchase.motorcycle_secured;
  const collected=String(purchase.collection_status||"").toLowerCase()==="collected" ||
    String(purchase.deal_status||"").toLowerCase()==="collected";
  const deliveryStage=String(purchase.delivery_handover_status||"").toLowerCase();
  const delivered=!!purchase.delivered_to_shipper_at || deliveryStage==="delivered";
  const outForDelivery=["driver_link_ready","driver_opened","arrived"].includes(deliveryStage);
  const completed=String(purchase.deal_status||"").toLowerCase()==="completed" ||
    String(purchase.deal_stage||"").toLowerCase()==="completed" ||
    !!purchase.operations_complete;
  const depositSatisfied=!depositRequired || depositDue<=0 || depositOutstanding<=0;
  const fullyPaid=balance<=0;

  let heading="Purchase in Progress";
  let message="Your AnyBike purchase is progressing.";

  if(completed){
    heading="Completed";
    message="Your AnyBike purchase and UK handover are complete.";
  }else if(delivered){
    heading="Delivered to Shipper";
    message="Your motorcycle has been handed over to the confirmed shipping company.";
  }else if(outForDelivery){
    heading="Out for Delivery";
    message="Move Motorcycles is completing the agreed handover to your confirmed shipping company.";
  }else if(collected){
    heading="Collected";
    message="Your motorcycle has been collected and is now moving through the secure UK custody / shipping stage.";
  }else if(secured && fullyPaid){
    heading="Motorcycle Secured";
    message="Your motorcycle is secured and paid in full. AnyBike is preparing the collection and UK handover.";
  }else if(secured){
    heading="Motorcycle Secured";
    message="Your motorcycle has been secured. Any outstanding payment and collection arrangements can now continue.";
  }else if(!depositSatisfied){
    heading="Payment Required";
    message="Your AnyBike offer has been accepted. The required payment is still outstanding.";
  }else{
    heading="Purchase Confirmed";
    message="Your offer is accepted and AnyBike is completing the purchase arrangements.";
  }

  let paymentStatus=String(purchase.customer_payment_status||"").trim();
  if(fullyPaid) paymentStatus="Paid in Full";
  else if(!depositSatisfied) paymentStatus="Deposit Due";
  else if(allocated>0) paymentStatus="Part Paid";
  else paymentStatus="Balance Due";

  return {
    depositRequired,depositDue,depositAllocated,depositOutstanding,depositSatisfied,
    moneyReceived,allocated,balance,secured,collected,delivered,outForDelivery,completed,fullyPaid,
    heading,message,paymentStatus
  };
}

function journeyHtml(purchase,state){

  let current="deposit";
  let nextTitle="Pay / report your deposit";
  let nextText="Open Accounts & Documents to view your Proforma and report the bank transfer.";

  if(state.depositSatisfied && !state.secured){
    current="seller";
    nextTitle="AnyBike completes the final seller check";
    nextText="No action is required from you. AnyBike will reconfirm the motorcycle and seller position before securing it.";
  }else if(state.secured && !state.fullyPaid){
    current="balance";
    nextTitle="Complete the remaining balance / documents";
    nextText="AnyBike will show the amount and documents required before collection can proceed.";
  }else if(state.secured && state.fullyPaid && !state.collected){
    current="collection";
    nextTitle="AnyBike arranges collection";
    nextText="Move Motorcycles will collect the motorcycle and the collection progress will appear here.";
  }else if(state.collected && !state.delivered && !state.completed){
    current="invoice";
    nextTitle="Final invoice and UK handover";
    nextText="AnyBike will finalise the invoice and arrange the confirmed delivery / handover to your shipper.";
  }else if(state.delivered && !state.completed){
    current="complete";
    nextTitle="Complete the purchase";
    nextText="The UK handover is complete. AnyBike will close the remaining transaction steps.";
  }else if(state.completed){
    current="complete";
    nextTitle="Purchase complete";
    nextText="No further action is required for this motorcycle.";
  }

  const steps=[
    ["offer","Offer Accepted",true],
    ["deposit","Deposit / Proforma",state.depositSatisfied],
    ["seller","Seller Check",state.secured],
    ["secured","Motorcycle Secured",state.secured],
    ["balance","Balance & Documents",state.fullyPaid],
    ["collection","Collection",state.collected],
    ["invoice","Final Invoice",state.delivered||state.completed],
    ["delivery","Delivery / Handover",state.delivered||state.completed],
    ["complete","Complete",state.completed]
  ];

  const stepHtml=steps.map(function(step){
    const key=step[0],label=step[1],done=step[2];
    const isCurrent=key===current && !done;
    return '<span class="step '+(done?"done":isCurrent?"current-shipping":"todo")+'">'+safe(label)+'</span>';
  }).join("");

  return `
    <div class="journey">
      <div class="journey-title">Your motorcycle journey</div>
      <div class="steps">${stepHtml}</div>
      <div class="journey-next">
        <span>What happens next?</span>
        <strong>${safe(nextTitle)}</strong>
        <p>${safe(nextText)}</p>
      </div>
    </div>
  `;
}

function collectionJobCustomerLabel(status){
  const value=String(status||"").toLowerCase();
  if(value==="new")return "Collection being arranged";
  if(value==="driver_link_ready")return "Driver assigned";
  if(value==="driver_opened")return "Driver has collection details";
  if(value==="arrived")return "Driver arrived";
  if(value==="discrepancy")return "Collection check in progress";
  if(value==="ready_to_load")return "Ready to collect";
  if(value==="collected")return "Collected";
  return value ? value.replaceAll("_"," ") : "";
}


function buyerStorageHtml(purchase,state){
  if(!state.collected || !purchase.storage_status)return "";
  const waived=!!purchase.storage_charge_waived;
  const status=String(purchase.storage_status||"");
  const charge=Number(purchase.storage_current_charge_gbp||0);
  const rate=Number(purchase.storage_daily_rate_gbp||0);
  const chargeable=purchase.storage_chargeable_from
    ? new Date(purchase.storage_chargeable_from).toLocaleString("en-GB")
    : "";
  const released=!!purchase.storage_released_at || status==="stopped";

  let message="Your motorcycle is in secure UK custody while onward handover is arranged.";
  if(released)message="Secure UK storage has ended because the motorcycle has moved to its onward handover stage.";
  else if(waived)message="AnyBike has waived the current storage charge.";
  else if(status==="paused")message="The storage charging clock is currently paused.";
  else if(chargeable && rate>0)message="Storage is free until "+chargeable+". Charges after that time are shown below.";

  return '<div class="storage-card '+(waived?"waived":"")+'">'+
    '<div class="storage-card-head">'+
      '<div><strong>Secure UK Storage</strong><span>'+safe(message)+'</span>'+
      ((!released&&!waived&&rate>0&&chargeable)?'<span>Rate after free period: '+money(rate)+' per day</span>':"")+
      '</div>'+
      '<div class="storage-charge">'+
        '<small>Current storage charge</small>'+
        '<b>'+(waived?"Waived":money(charge))+'</b>'+
      '</div>'+
    '</div>'+
  '</div>';
}

async function loadShipperAuthorisation(purchase){
  const dmId=Number(purchase.deal_motorcycle_id);
  const dealId=Number(purchase.deal_id);
  const box=document.getElementById("shipper-auth-"+dmId);
  if(!box||!dealId) return;

  try{
    const [authResult,docsResult]=await Promise.all([
      sb.rpc("get_my_shipper_authorisation_v1",{p_deal_id:dealId}),
      sb.rpc("get_my_shipper_documents_v1",{p_deal_id:dealId})
    ]);
    if(authResult.error) throw authResult.error;
    if(docsResult.error) throw docsResult.error;

    const a=authResult.data||{};
    const docs=Array.isArray(docsResult.data)?docsResult.data:[];
    const status=String(a.status||"Not Authorised");
    const shipper=String(purchase.freight_forwarder_name||a.shipper_name||"the nominated shipper");
    const locked=["Buyer Authorised","Email Sent","Shipper Confirmed"].includes(status);
    const ref=String(purchase.freight_forwarder_reference||"");
    const docsHtml=docs.length
      ? docs.map(function(doc){
          return '<div class="shipper-doc-row"><span>'+safe(doc.file_name)+' <small>'+Math.max(1,Math.round(Number(doc.file_size||0)/1024))+' KB</small></span>'+
            (locked?'':'<button type="button" onclick="deleteShipperDocument('+Number(doc.id)+','+dealId+','+dmId+');return false;">Remove</button>')+
          '</div>';
        }).join("")
      : '<small>No documents attached. You can add up to 3 PDF/JPG/PNG files, max 4 MB each.</small>';

    let statusHtml="";
    if(status==="Shipper Confirmed"){
      statusHtml='<div class="shipper-authorisation-status good"><div><strong>✓ Shipper confirmed acceptance</strong><small>'+safe(shipper)+' has confirmed they can accept this motorcycle from AnyBike / Move Motorcycles.</small></div></div>';
    }else if(status==="Shipper Declined"){
      statusHtml='<div class="shipper-authorisation-status bad"><div><strong>Shipper cannot currently accept</strong><small>AnyBike has been notified and will contact you before delivery is arranged.</small></div></div>';
    }else if(status==="Email Sent"||status==="Buyer Authorised"){
      statusHtml='<div class="shipper-authorisation-status good"><div><strong>✓ You authorised '+safe(shipper)+'</strong><small>'+(status==="Email Sent"?'The shipper email has been sent with your reference and attached documents. Waiting for their confirmation.':'Your authorisation has been recorded.')+'</small></div></div>';
    }else{
      statusHtml='<div class="shipper-authorisation-status"><div><strong>Shipper authorisation required</strong><small>Check the shipper reference and documents below, then authorise '+safe(shipper)+' to accept this motorcycle on your behalf.</small></div><button type="button" onclick="authoriseShipper('+dmId+','+dealId+');return false;">Authorise Shipper</button></div>';
    }

    box.innerHTML=
      '<div><span>Reference for shipper</span>'+
      '<div class="shipper-prep"><input id="shipper-ref-'+dmId+'" value="'+safe(ref)+'" placeholder="Booking / customer / container reference" '+(locked?'disabled':'')+'>'+
      (locked?'':'<button type="button" onclick="saveShipperReference('+dealId+','+dmId+');return false;">Save Reference</button>')+
      '</div></div>'+
      '<div><span>Documents to email to shipper</span><div id="shipper-docs-'+dmId+'" class="shipper-docs">'+docsHtml+'</div>'+
      (locked?'':'<div class="shipper-file"><input id="shipper-file-'+dmId+'" type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png"><button type="button" onclick="uploadShipperDocument('+dealId+','+dmId+');return false;">Upload Document</button></div>')+
      '</div><div id="shipper-feedback-'+dmId+'" style="display:none;margin-top:8px;font-size:12px"></div><div style="margin-top:12px">'+statusHtml+'</div>';

  }catch(error){
    box.innerHTML='<div class="shipper-authorisation-status bad"><div><strong>Shipper authorisation status unavailable</strong><small>'+safe(error.message||error)+'</small></div></div>';
  }
}

async function saveShipperReference(dealId,dealMotorcycleId){
  const dmId=Number(dealMotorcycleId);
  const purchase=shipperPurchase(dmId);
  const input=document.getElementById("shipper-ref-"+dmId);
  if(!input||!purchase) return;
  shipperUiMessage(dmId,"Saving reference…","info");
  const value=String(input.value||"").trim();
  const result=await sb.rpc("save_my_shipper_reference_v1",{p_deal_id:Number(dealId),p_reference:value||null});
  if(result.error){shipperUiMessage(dmId,result.error.message,"error");return;}
  purchase.freight_forwarder_reference=value;
  shipperUiMessage(dmId,"Reference saved.","success");
  await loadShipperAuthorisation(purchase);
}

async function uploadShipperDocument(dealId,dealMotorcycleId){
  const dmId=Number(dealMotorcycleId),id=Number(dealId);
  const purchase=shipperPurchase(dmId);
  const input=document.getElementById("shipper-file-"+dmId);
  const file=input?.files?.[0];
  if(!purchase||!file){shipperUiMessage(dmId,"Choose a document first.","error");return;}
  if(!["application/pdf","image/jpeg","image/png"].includes(file.type)){shipperUiMessage(dmId,"Only PDF, JPG and PNG files can be sent to the shipper.","error");return;}
  if(file.size>4194304){shipperUiMessage(dmId,"Each document must be 4 MB or smaller.","error");return;}

  shipperUiMessage(dmId,"Uploading "+file.name+"…","info");
  const session=(await sb.auth.getSession()).data.session;
  if(!session){location.href="login.html";return;}
  const clean=file.name.replace(/[^a-zA-Z0-9._-]+/g,"_").slice(-120);
  const storagePath="customers/"+session.user.id+"/shipping/"+id+"/"+Date.now()+"-"+clean;
  const upload=await sb.storage.from("deal-files").upload(storagePath,file,{contentType:file.type,upsert:false});
  if(upload.error){shipperUiMessage(dmId,upload.error.message,"error");return;}
  const reg=await sb.rpc("register_my_shipper_document_v1",{
    p_deal_id:id,p_deal_motorcycle_id:dmId,p_file_name:file.name,p_storage_path:storagePath,p_mime_type:file.type,p_file_size:file.size
  });
  if(reg.error){
    await sb.storage.from("deal-files").remove([storagePath]);
    shipperUiMessage(dmId,reg.error.message,"error");
    return;
  }
  shipperUiMessage(dmId,"Document uploaded. It will be attached to the shipper email.","success");
  await loadShipperAuthorisation(purchase);
}

async function deleteShipperDocument(documentId,dealId,dealMotorcycleId){
  const dmId=Number(dealMotorcycleId);
  const purchase=shipperPurchase(dmId);
  if(!purchase||!confirm("Remove this document from the shipper email?")) return;
  const del=await sb.rpc("delete_my_shipper_document_v1",{p_document_id:Number(documentId)});
  if(del.error){shipperUiMessage(dmId,del.error.message,"error");return;}
  if(del.data?.storage_path) await sb.storage.from("deal-files").remove([del.data.storage_path]);
  shipperUiMessage(dmId,"Document removed.","success");
  await loadShipperAuthorisation(purchase);
}

window.saveShipperReference=saveShipperReference;
window.uploadShipperDocument=uploadShipperDocument;
window.deleteShipperDocument=deleteShipperDocument;

async function authoriseShipper(dealMotorcycleId,dealId){
  const dmId=Number(dealMotorcycleId);
  const id=Number(dealId);
  const purchase=shipperPurchase(dmId);
  const shipper=String(purchase?.freight_forwarder_name||"the nominated shipper");
  const box=document.getElementById("shipper-auth-"+dmId);
  if(!box||!id||!purchase) return;

  try{
    const current=await sb.rpc("get_my_shipper_authorisation_v1",{p_deal_id:id});
    if(current.error) throw current.error;
    const status=String(current.data?.status||"");
    if(["Email Sent","Buyer Authorised","Shipper Confirmed"].includes(status)){
      await loadShipperAuthorisation(purchase);
      return;
    }
  }catch(_ignore){}

  if(!window.confirm(
    "Authorise "+shipper+" to accept this motorcycle from AnyBike / Move Motorcycles on your behalf?\n\n"+
    "AnyBike will email the shipper and ask them to confirm they can accept the motorcycle before delivery."
  )) return;

  box.innerHTML='<div class="shipper-authorisation-status"><strong>Sending authorisation to shipper…</strong></div>';

  try{
    const result=await sb.functions.invoke("customer-authorise-shipper",{
      body:{deal_id:id,deal_motorcycle_id:dmId}
    });
    if(result.error){
      let message=result.error.message||"The shipper could not be authorised.";
      try{
        if(result.error.context){
          const response=typeof result.error.context.clone==="function"?result.error.context.clone():result.error.context;
          const detail=await response.json();
          if(detail?.error) message=detail.error;
        }
      }catch(_detail){}
      throw new Error(message);
    }
    if(result.data?.error) throw new Error(result.data.error);
    await loadShipperAuthorisation(purchase);
  }catch(error){
    box.innerHTML='<div class="shipper-authorisation-status bad"><div><strong>Could not send shipper authorisation</strong><small>'+safe(error.message||error)+'</small></div><button type="button" onclick="authoriseShipper('+dmId+','+id+');return false;">Try Again</button></div>';
  }
}

window.focusShipperAuthorisation=focusShipperAuthorisation;
window.authoriseShipper=authoriseShipper;

async function loadPurchases(){

  const purchasesBox =
    document.getElementById(
      "purchases"
    );

  const {
    data:{
      session
    },
    error:sessionError
  } = await sb.auth.getSession();

  if(sessionError){

    console.error(
      "Customer session check failed:",
      sessionError
    );

  }

  if(!session){

    location.href =
      "login.html";

    return;

  }

  const [purchaseResult,collectionJobsResult]=await Promise.all([
    sb.rpc("get_my_purchases_v6"),
    sb.rpc("get_my_collection_jobs_v1")
  ]);
  const data=purchaseResult.data;
  const error=purchaseResult.error;

  if(error){

    console.error(
      "My Purchases could not be loaded:",
      error
    );

    purchasesBox.innerHTML = `

      <div class="empty">

        We could not load your purchases:

        ${safe(error.message)}

      </div>

    `;

    return;

  }

  const purchases =
    Array.isArray(data)

      ? data

      : (
          data
            ? [data]
            : []
        );

  const collectionJobsByMotorcycle={};
  if(!collectionJobsResult.error){
    (collectionJobsResult.data||[]).forEach(function(job){
      collectionJobsByMotorcycle[String(job.deal_motorcycle_id)]=job;
    });
    purchases.forEach(function(purchase){
      const job=collectionJobsByMotorcycle[String(purchase.deal_motorcycle_id)];
      if(job){
        purchase.collection_job_id=job.move_job_id;
        purchase.collection_job_number=job.move_job_number;
        purchase.collection_job_status=job.status;
        purchase.collection_job_date=job.collection_date;
        purchase.collection_job_arrived_at=job.driver_arrived_at;
        purchase.collection_job_photos_at=job.condition_photos_confirmed_at;
        purchase.collection_job_collected_at=job.collected_at;
      }
    });
  }else{
    console.warn("Collection job progress could not be loaded:",collectionJobsResult.error.message);
  }

  if(!purchases.length){

    purchasesBox.innerHTML = `

      <div class="empty">

        You do not have any AnyBike purchases
        in progress at the moment.

      </div>

    `;

    return;

  }

  const purchaseParams =
    new URLSearchParams(
      location.search
    );

  const requestedPurchase =
    purchaseParams.get(
      "purchase"
    );

  const requestedDeal =
    purchaseParams.get(
      "deal"
    );

  const orderedPurchases =
    [...purchases];

  if(requestedPurchase || requestedDeal){

    orderedPurchases.sort(
      (a,b) => {

        const aMatches =
          requestedDeal
            ? String(a.deal_id) === String(requestedDeal)
            : String(a.buyer_match_id) === String(requestedPurchase);

        const bMatches =
          requestedDeal
            ? String(b.deal_id) === String(requestedDeal)
            : String(b.buyer_match_id) === String(requestedPurchase);

        if(aMatches && !bMatches){
          return -1;
        }

        if(bMatches && !aMatches){
          return 1;
        }

        return 0;

      }
    );

  }

  purchasesBox.innerHTML = `

    <div class="grid">

      ${
        orderedPurchases
          .map(purchaseCard)
          .join("")
      }

    </div>

  `;

  shipperPurchaseLookup.clear();
  orderedPurchases.forEach(function(purchase){
    shipperPurchaseLookup.set(Number(purchase.deal_motorcycle_id),purchase);
    if(purchase.freight_forwarder_name || purchase.uk_handover_port){
      loadShipperAuthorisation(purchase);
    }
  });

}

loadPurchases();

</script>
