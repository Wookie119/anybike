<style>
:root{
  --red:#ed1c24;
  --red-soft:#ff5a61;
  --bg:#050505;
  --panel:#101010;
  --panel2:#171717;
  --text:#ffffff;
  --muted:#a8a8a8;
  --line:rgba(255,255,255,.12);
  --line-strong:rgba(255,255,255,.18);
  --green:#36d37e;
  --amber:#ffbf47;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:
    radial-gradient(
      circle at 90% 0%,
      rgba(237,28,36,.14),
      transparent 34%
    ),
    #050505;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

main{
  width:min(1420px,94vw);
  margin:28px auto 70px;
}

.hero{
  border:1px solid rgba(237,28,36,.28);
  border-radius:22px;
  padding:25px;
  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(237,28,36,.10),
      transparent 35%
    ),
    #101010;
  margin-bottom:20px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.03) inset,
    0 14px 40px rgba(0,0,0,.22);
}

.eyebrow{
  color:var(--red);
  font-size:12px;
  font-weight:900;
  letter-spacing:.18em;
}

.hero h1{
  font-size:38px;
  margin:7px 0;
}

.hero p{
  color:#bbb;
  margin:0;
  line-height:1.5;
}

.top-actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:42px;
  padding:0 16px;
  border-radius:10px;
  text-decoration:none;
  font-weight:900;
  border:1px solid rgba(237,28,36,.32);
  color:#fff;
  background:#171717;
  box-shadow:
    0 1px 0 rgba(255,255,255,.05) inset,
    0 6px 18px rgba(0,0,0,.16);
}

.panel{
  border:1px solid rgba(237,28,36,.24);
  border-radius:20px;
  background:
    radial-gradient(
      circle at 95% 0%,
      rgba(237,28,36,.08),
      transparent 30%
    ),
    #101010;
  padding:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}

.card{
  border:1px solid rgba(237,28,36,.26);
  border-radius:18px;
  overflow:hidden;
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.01),
      rgba(255,255,255,0)
    ),
    #141414;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.02) inset,
    0 16px 34px rgba(0,0,0,.20);
}

.card.secured{
  border-color:rgba(237,28,36,.34);
}

.image{
  height:250px;
  background:#090909;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid rgba(237,28,36,.18);
}

.image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.body{
  padding:18px;
}

.top{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.top h2{
  margin:0;
  font-size:24px;
}

.variant{
  color:#aaa;
  margin-top:4px;
}

.badges{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  justify-content:flex-end;
  align-items:flex-start;
}

.badge{
  height:max-content;
  padding:7px 11px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.12);
  background:#171717;
  color:#ddd;
  font-size:11px;
  font-weight:900;
  white-space:nowrap;
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset;
}

.badge.offer{
  border-color:rgba(237,28,36,.45);
  background:rgba(237,28,36,.11);
  color:#ffb2b5;
}

.badge.secured{
  border-color:rgba(54,211,126,.55);
  background:rgba(54,211,126,.12);
  color:#98ffc0;
}

.badge.payment-due{
  border-color:rgba(255,191,71,.55);
  background:rgba(255,191,71,.10);
  color:#ffd98b;
}

.status{
  margin:16px 0;
  padding:15px;
  border-radius:13px;
}

.status.pending{
  border:1px solid rgba(237,28,36,.26);
  background:rgba(237,28,36,.05);
}

.status.secured{
  border:1px solid rgba(237,28,36,.26);
  background:
    linear-gradient(
      90deg,
      rgba(237,28,36,.07),
      rgba(237,28,36,.02)
    );
}

.status.complete{
  border:1px solid rgba(54,211,126,.30);
  background:rgba(54,211,126,.07);
}

.status.payment-due{
  border:1px solid rgba(255,191,71,.35);
  background:rgba(255,191,71,.06);
}

.status strong{
  display:block;
  font-size:19px;
}

.status.pending strong,
.status.secured strong{
  color:#fff;
}

.status.complete strong{
  color:#cffff0;
}

.status.payment-due strong{
  color:#ffd98b;
}

.status span{
  display:block;
  margin-top:5px;
  font-size:13px;
  line-height:1.45;
}

.status.pending span,
.status.secured span{
  color:#c9c9c9;
}

.status.complete span{
  color:#c8e7d7;
}

.status.payment-due span{
  color:#dcc89d;
}

.price{
  padding:15px;
  border:1px solid rgba(237,28,36,.22);
  border-radius:13px;
  margin-bottom:12px;
  background:#0d0d0d;
}

.price strong{
  display:block;
  font-size:24px;
}

.price span{
  font-size:12px;
  color:#bbb;
}

.payment-summary{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  margin-bottom:12px;
}

.payment-box{
  border:1px solid rgba(255,255,255,.1);
  border-radius:11px;
  padding:11px;
  background:#0d0d0d;
}

.payment-box span{
  display:block;
  color:#888;
  font-size:9px;
  font-weight:900;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:5px;
}

.payment-box strong{
  font-size:15px;
  color:#fff;
}

.payment-box.good{
  border-color:rgba(54,211,126,.22);
}

.payment-box.good strong{
  color:var(--green);
}

.payment-box.due{
  border-color:rgba(255,191,71,.22);
}

.payment-box.due strong{
  color:#ffd27a;
}

.details{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}

.detail{
  border:1px solid rgba(255,255,255,.1);
  border-radius:11px;
  padding:11px;
  background:#0d0d0d;
}

.detail span{
  display:block;
  color:#888;
  font-size:9px;
  font-weight:900;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:5px;
}

.good-text{
  color:var(--green);
  font-weight:900;
}

.due-text{
  color:#ffd27a;
  font-weight:900;
}


/* ===========================
   PREMIUM PURCHASE JOURNEY
   =========================== */

.journey{
  margin-top:16px;
  border:1px solid rgba(237,28,36,.22);
  border-radius:15px;
  padding:16px;
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.025),
      rgba(255,255,255,0)
    ),
    #0b0b0b;
  box-shadow:
    0 1px 0 rgba(255,255,255,.04) inset,
    0 8px 24px rgba(0,0,0,.16);
}

.journey-title{
  font-size:11px;
  color:#b5b5b5;
  text-transform:uppercase;
  font-weight:900;
  letter-spacing:.12em;
  margin-bottom:13px;
}

.steps{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.step{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  padding:9px 14px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.13);
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.035),
      rgba(255,255,255,.005)
    ),
    #111;
  color:#aaa;
  font-size:10px;
  font-weight:900;
  letter-spacing:.015em;
  line-height:1;
  white-space:nowrap;
  box-shadow:
    0 1px 0 rgba(255,255,255,.07) inset,
    0 4px 12px rgba(0,0,0,.20);
}

.step::before{
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  width:17px;
  height:17px;
  margin-right:7px;
  border-radius:50%;
  font-size:10px;
  font-weight:900;
}

.step.done{
  border-color:rgba(54,211,126,.58);
  background:
    linear-gradient(
      180deg,
      rgba(54,211,126,.17),
      rgba(54,211,126,.08)
    ),
    #101712;
  color:#b9ffd2;
  box-shadow:
    0 1px 0 rgba(255,255,255,.06) inset,
    0 0 14px rgba(54,211,126,.05);
}

.step.done::before{
  content:"✓";
  color:#07160d;
  background:var(--green);
  box-shadow:0 0 0 2px rgba(54,211,126,.14);
}

.step.current{
  border-color:rgba(255,191,71,.72);
  background:
    linear-gradient(
      180deg,
      rgba(255,191,71,.18),
      rgba(255,191,71,.08)
    ),
    #18140b;
  color:#ffe2a7;
  box-shadow:
    0 1px 0 rgba(255,255,255,.06) inset,
    0 0 16px rgba(255,191,71,.06);
}

.step.current::before{
  content:"";
  background:var(--amber);
  box-shadow:
    0 0 0 4px rgba(255,191,71,.10),
    0 0 10px rgba(255,191,71,.18);
}

.step.todo{
  border-color:rgba(237,28,36,.48);
  background:
    linear-gradient(
      180deg,
      rgba(237,28,36,.12),
      rgba(237,28,36,.05)
    ),
    #160d0e;
  color:#ff9ca0;
  box-shadow:
    0 1px 0 rgba(255,255,255,.04) inset,
    0 4px 12px rgba(0,0,0,.15);
}

.step.todo::before{
  content:"";
  background:#241012;
  border:2px solid var(--red);
  box-shadow:0 0 0 3px rgba(237,28,36,.07);
}

.notice{
  margin-top:14px;
  color:#bbb;
  font-size:12px;
  line-height:1.5;
}

.notice strong{
  color:#fff;
}

.empty{
  padding:34px;
  text-align:center;
  border:1px dashed rgba(237,28,36,.25);
  border-radius:14px;
  color:#bbb;
}

@media(max-width:900px){

  .grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:700px){

  .payment-summary{
    grid-template-columns:1fr;
  }

}

@media(max-width:620px){

  main{
    width:min(96vw,1420px);
  }

  .hero h1{
    font-size:30px;
  }

  .details{
    grid-template-columns:1fr;
  }

  .image{
    height:210px;
  }

  .top{
    flex-direction:column;
  }

  .badges{
    justify-content:flex-start;
  }

  .journey{
    padding:14px;
  }

  .steps{
    gap:7px;
  }

  .step{
    min-height:32px;
    padding:8px 11px;
    font-size:9px;
  }

  .step::before{
    width:15px;
    height:15px;
    margin-right:6px;
  }

}
</style>
