<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Sign In | AnyBike</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/anybike-logo-new.jpg" type="image/jpeg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --red:#ed1c24;
  --line:rgba(255,255,255,.14);
  --muted:#aaa;
}
*{box-sizing:border-box}
body{
  min-height:100vh;
  margin:0;
  display:grid;
  place-items:center;
  padding:24px;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 15% 0%,rgba(237,28,36,.22),transparent 30%),
    linear-gradient(135deg,#050505,#111);
}
.login-card{
  width:min(460px,100%);
  padding:28px;
  border:1px solid var(--line);
  border-radius:24px;
  background:rgba(15,15,15,.97);
  box-shadow:0 28px 90px rgba(0,0,0,.55);
}
.logo-wrap{
  display:flex;
  justify-content:center;
  margin-bottom:22px;
}
.logo-wrap img{
  width:190px;
  padding:12px;
  border-radius:16px;
  background:#fff;
}
h1{margin:0 0 8px;font-size:34px}
p{color:var(--muted);line-height:1.5}
label{
  display:block;
  margin:15px 0 6px;
  font-size:12px;
  font-weight:900;
}
input{
  width:100%;
  padding:13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#191919;
  color:#fff;
  outline:none;
}
input:focus{
  border-color:var(--red);
  box-shadow:0 0 0 3px rgba(237,28,36,.13);
}
button{
  width:100%;
  margin-top:18px;
  padding:13px;
  border:0;
  border-radius:999px;
  background:var(--red);
  color:#fff;
  font-weight:900;
  cursor:pointer;
}
button:disabled{opacity:.6;cursor:not-allowed}
.status{
  min-height:22px;
  margin-top:13px;
  font-size:13px;
  line-height:1.45;
}
.bad{color:#ff7b80}
.ok{color:#49d98a}
.help{
  margin-top:18px;
  padding-top:16px;
  border-top:1px solid var(--line);
  color:#888;
  font-size:12px;
  line-height:1.45;
}
</style>
</head>

<body>
<main class="login-card">
  <div class="logo-wrap">
    <img src="/anybike-logo-new.jpg" alt="AnyBike">
  </div>

  <h1>Admin Sign In</h1>
  <p>Secure access to the AnyBike administration platform.</p>

  <form id="adminLoginForm">
    <label for="adminEmail">Admin email</label>
    <input
      id="adminEmail"
      type="email"
      autocomplete="username"
      required
    >

    <label for="adminPassword">Password</label>
    <input
      id="adminPassword"
      type="password"
      autocomplete="current-password"
      required
    >

    <button id="adminLoginButton" type="submit">Sign In</button>
    <div id="adminLoginStatus" class="status"></div>
  </form>

  <div class="help">
    Access is restricted to active AnyBike administrator accounts.
  </div>
</main>

<script>
const SUPABASE_URL = "https://tuehtnezhdnkqbbhttgp.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_mrkBKDxEPVmdj2n7gPWsbg_l4CShtcK";
const sb = supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const ADMIN_RETURN_STORAGE_KEY = "anybike_admin_return_url";

function setLoginStatus(message,type=""){
  const status = document.getElementById("adminLoginStatus");
  status.textContent = message;
  status.className = "status" + (type ? " " + type : "");
}

function isSafeAdminReturnUrl(value){
  const requested = String(value || "").trim();

  if(!requested.startsWith("/") || requested.startsWith("//")){
    return false;
  }

  if(!requested.toLowerCase().startsWith("/admin-")){
    return false;
  }

  if(requested.toLowerCase().startsWith("/admin-login")){
    return false;
  }

  return true;
}

function captureRequestedReturnUrl(){
  const params = new URLSearchParams(window.location.search);
  const requested = params.get("return");

  if(isSafeAdminReturnUrl(requested)){
    try{
      sessionStorage.setItem(ADMIN_RETURN_STORAGE_KEY,requested);
    }catch(error){
      console.warn("Could not store admin return URL",error);
    }

    return requested;
  }

  return null;
}

function getReturnUrl(){
  const queryReturn = captureRequestedReturnUrl();

  if(queryReturn){
    return queryReturn;
  }

  try{
    const storedReturn = sessionStorage.getItem(ADMIN_RETURN_STORAGE_KEY);

    if(isSafeAdminReturnUrl(storedReturn)){
      return storedReturn;
    }
  }catch(error){
    console.warn("Could not read admin return URL",error);
  }

  return "/admin-dashboard.html";
}

function clearReturnUrl(){
  try{
    sessionStorage.removeItem(ADMIN_RETURN_STORAGE_KEY);
  }catch(error){
    console.warn("Could not clear admin return URL",error);
  }
}

function openReturnUrl(){
  const destination = getReturnUrl();
  clearReturnUrl();
  window.location.replace(destination);
}

async function getActiveAdminRecord(user){
  if(!user?.id){
    return null;
  }

  const {
    data,
    error
  } = await sb
    .from("admin_users")
    .select("user_id,full_name,role,department,active")
    .eq("user_id",user.id)
    .eq("active",true)
    .maybeSingle();

  if(error){
    throw error;
  }

  return data || null;
}

async function rejectUnauthorisedAccount(message){
  try{
    await sb.auth.signOut({scope:"local"});
  }catch(error){
    console.warn("Could not sign out unauthorised account",error);
  }

  setLoginStatus(
    message || "This account is not authorised for AnyBike Admin.",
    "bad"
  );
}

async function checkExistingSession(){
  const {data,error} = await sb.auth.getSession();

  if(error){
    console.warn("Existing admin session check failed",error);
    return;
  }

  const user = data?.session?.user || null;

  if(!user){
    return;
  }

  try{
    const adminRecord = await getActiveAdminRecord(user);

    if(adminRecord){
      openReturnUrl();
      return;
    }

    await rejectUnauthorisedAccount();
  }catch(error){
    console.warn("Existing admin authorisation check failed",error);
    await rejectUnauthorisedAccount(
      "Admin access could not be verified. Please try again."
    );
  }
}

document
  .getElementById("adminLoginForm")
  .addEventListener("submit",async function(event){
    event.preventDefault();

    const email = document
      .getElementById("adminEmail")
      .value
      .trim()
      .toLowerCase();

    const password = document
      .getElementById("adminPassword")
      .value;

    const button = document.getElementById("adminLoginButton");

    button.disabled = true;
    setLoginStatus("Signing in...");

    try{
      const {data,error} = await sb.auth.signInWithPassword({
        email:email,
        password:password
      });

      if(error){
        setLoginStatus("Sign in failed: " + error.message,"bad");
        return;
      }

      const user = data?.user || data?.session?.user || null;
      const adminRecord = await getActiveAdminRecord(user);

      if(!adminRecord){
        await rejectUnauthorisedAccount();
        return;
      }

      setLoginStatus(
        "Signed in. Opening Admin...",
        "ok"
      );

      openReturnUrl();

    }catch(error){
      console.error("Admin login failed",error);

      await rejectUnauthorisedAccount(
        "Admin access could not be verified: " +
        (error?.message || "Unknown error")
      );
    }finally{
      button.disabled = false;
    }
  });

const params = new URLSearchParams(window.location.search);
const errorCode = params.get("error");

if(errorCode === "not-authorized"){
  setLoginStatus(
    "That account is not authorised for AnyBike Admin.",
    "bad"
  );
}else if(errorCode === "supabase"){
  setLoginStatus(
    "The login service could not be loaded.",
    "bad"
  );
}else if(errorCode === "admin-check"){
  setLoginStatus(
    "Admin access could not be verified. Please sign in again.",
    "bad"
  );
}

captureRequestedReturnUrl();
checkExistingSession();
</script>
</body>
</html>
