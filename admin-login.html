
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Sign In | AnyBike</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/anybike-logo-new.jpg" type="image/jpeg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --red:#ed1c24;
  --line:rgba(255,255,255,.14);
  --muted:#aaa;
}
*{box-sizing:border-box}
body{
  min-height:100vh;
  margin:0;
  display:grid;
  place-items:center;
  padding:24px;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 15% 0%,rgba(237,28,36,.22),transparent 30%),
    linear-gradient(135deg,#050505,#111);
}
.login-card{
  width:min(460px,100%);
  padding:28px;
  border:1px solid var(--line);
  border-radius:24px;
  background:rgba(15,15,15,.97);
  box-shadow:0 28px 90px rgba(0,0,0,.55);
}
.logo-wrap{
  display:flex;
  justify-content:center;
  margin-bottom:22px;
}
.logo-wrap img{
  width:190px;
  padding:12px;
  border-radius:16px;
  background:#fff;
}
h1{margin:0 0 8px;font-size:34px}
p{color:var(--muted);line-height:1.5}
label{
  display:block;
  margin:15px 0 6px;
  font-size:12px;
  font-weight:900;
}
input{
  width:100%;
  padding:13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#191919;
  color:#fff;
}
button{
  width:100%;
  margin-top:18px;
  padding:13px;
  border:0;
  border-radius:999px;
  background:var(--red);
  color:#fff;
  font-weight:900;
  cursor:pointer;
}
button:disabled{opacity:.6;cursor:not-allowed}
.status{
  min-height:22px;
  margin-top:13px;
  font-size:13px;
}
.bad{color:#ff7b80}
.ok{color:#49d98a}
.help{
  margin-top:18px;
  padding-top:16px;
  border-top:1px solid var(--line);
  color:#888;
  font-size:12px;
}
</style>
</head>

<body>
<main class="login-card">
  <div class="logo-wrap">
    <img src="/anybike-logo-new.jpg" alt="AnyBike">
  </div>

  <h1>Admin Sign In</h1>
  <p>Secure access to the AnyBike administration platform.</p>

  <form id="adminLoginForm">
    <label for="adminEmail">Admin email</label>
    <input
      id="adminEmail"
      type="email"
      value="sales@anybike.co.uk"
      autocomplete="username"
      required
    >

    <label for="adminPassword">Password</label>
    <input
      id="adminPassword"
      type="password"
      autocomplete="current-password"
      required
    >

    <button id="adminLoginButton" type="submit">Sign In</button>
    <div id="adminLoginStatus" class="status"></div>
  </form>

  <div class="help">
    Authorised admin account: <strong>sales@anybike.co.uk</strong>
  </div>
</main>

<script>
const SUPABASE_URL = "https://tuehtnezhdnkqbbhttgp.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_mrkBKDxEPVmdj2n7gPWsbg_l4CShtcK";
const sb = supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const ALLOWED_ADMIN_EMAILS = [
  "sales@anybike.co.uk"
];

function isAllowedAdminEmail(email){
  const value=String(email||"").trim().toLowerCase();

  return ALLOWED_ADMIN_EMAILS.some(function(adminEmail){
    return adminEmail.toLowerCase()===value;
  });
}

function getReturnUrl(){
  const params=new URLSearchParams(window.location.search);
  const requested=params.get("return") || "/admin-dashboard.html";

  if(
    requested.startsWith("/") &&
    !requested.startsWith("//")
  ){
    return requested;
  }

  return "/admin-dashboard.html";
}

async function checkExistingSession(){
  const {data}=await sb.auth.getSession();
  const user=data?.session?.user || null;

  if(user && isAllowedAdminEmail(user.email)){
    window.location.replace(getReturnUrl());
  }else if(user){
    await sb.auth.signOut();
  }
}

document
  .getElementById("adminLoginForm")
  .addEventListener("submit",async function(event){
    event.preventDefault();

    const email=document
      .getElementById("adminEmail")
      .value
      .trim()
      .toLowerCase();

    const password=document
      .getElementById("adminPassword")
      .value;

    const button=document.getElementById("adminLoginButton");
    const status=document.getElementById("adminLoginStatus");

    if(!isAllowedAdminEmail(email)){
      status.textContent="This email is not authorised for AnyBike Admin.";
      status.className="status bad";
      return;
    }

    button.disabled=true;
    status.textContent="Signing in...";
    status.className="status";

    const {data,error}=await sb.auth.signInWithPassword({
      email:email,
      password:password
    });

    if(error){
      status.textContent="Sign in failed: "+error.message;
      status.className="status bad";
      button.disabled=false;
      return;
    }

    if(!isAllowedAdminEmail(data?.user?.email)){
      await sb.auth.signOut();
      status.textContent="This account is not authorised for AnyBike Admin.";
      status.className="status bad";
      button.disabled=false;
      return;
    }

    status.textContent="Signed in. Opening Admin...";
    status.className="status ok";
    window.location.replace(getReturnUrl());
  });

const params=new URLSearchParams(window.location.search);
const error=params.get("error");
const status=document.getElementById("adminLoginStatus");

if(error==="not-authorized"){
  status.textContent="That account is not authorised for AnyBike Admin.";
  status.className="status bad";
}else if(error==="supabase"){
  status.textContent="The login service could not be loaded.";
  status.className="status bad";
}

checkExistingSession();
</script>
</body>
</html>
