<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Réunion Island volcanic mountain road</title>
<desc id="desc">Illustrated tropical mountain road inspired by the volcanic landscapes of Réunion Island.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#77b8e8"/>
    <stop offset=".52" stop-color="#b9dcf2"/>
    <stop offset="1" stop-color="#e9d6b5"/>
  </linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3b9dc2"/>
    <stop offset="1" stop-color="#23677f"/>
  </linearGradient>
  <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#557f6d"/>
    <stop offset="1" stop-color="#284b3e"/>
  </linearGradient>
  <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3d7046"/>
    <stop offset="1" stop-color="#13291e"/>
  </linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6e6f70"/>
    <stop offset="1" stop-color="#2b2c2d"/>
  </linearGradient>
  <radialGradient id="sun">
    <stop offset="0" stop-color="#fff3c1" stop-opacity=".9"/>
    <stop offset="1" stop-color="#fff3c1" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>

<rect width="1600" height="900" fill="url(#sky)"/>
<circle cx="1280" cy="145" r="170" fill="url(#sun)" filter="url(#soft)"/>
<path d="M760 290 C970 240 1240 245 1600 300 L1600 520 C1270 470 1060 450 825 485 Z" fill="url(#sea)" opacity=".95"/>

<!-- distant volcanic ridges -->
<path d="M0 390 L130 330 235 355 330 295 435 350 540 278 655 345 760 300 865 360 970 318 1115 378 1260 335 1390 380 1510 355 1600 390 1600 610 0 610Z" fill="#6f8c79" opacity=".55"/>
<path d="M0 460 L150 365 250 410 355 320 475 420 590 300 720 405 860 330 1010 430 1150 350 1290 420 1415 365 1600 450 1600 675 0 675Z" fill="url(#far)"/>

<!-- foreground valley -->
<path d="M0 565 C210 505 390 520 575 590 C760 660 980 645 1160 560 C1335 477 1480 468 1600 505 L1600 900 0 900Z" fill="url(#near)"/>
<path d="M0 675 C235 595 420 620 590 715 C710 782 820 824 970 790 C1115 757 1270 645 1600 620 L1600 900 0 900Z" fill="#173622"/>

<!-- road -->
<path d="M1220 900 C1190 810 1115 760 1010 724 C910 690 836 652 850 606 C864 560 948 531 1050 515 C1150 498 1210 472 1242 430" fill="none" stroke="#222426" stroke-width="150" stroke-linecap="round"/>
<path d="M1220 900 C1190 810 1115 760 1010 724 C910 690 836 652 850 606 C864 560 948 531 1050 515 C1150 498 1210 472 1242 430" fill="none" stroke="url(#road)" stroke-width="126" stroke-linecap="round"/>
<path d="M1214 900 C1184 816 1110 766 1008 732 C918 701 853 666 866 612 C878 571 953 544 1054 529 C1158 513 1219 486 1251 438" fill="none" stroke="#e9e2b5" stroke-width="6" stroke-dasharray="42 34" stroke-linecap="round" opacity=".9"/>

<!-- stone wall -->
<path d="M790 628 C904 594 1013 579 1110 560 C1194 544 1264 512 1300 470" fill="none" stroke="#3e3b34" stroke-width="32" opacity=".9"/>
<path d="M790 620 C904 587 1014 572 1112 553 C1196 537 1265 504 1300 462" fill="none" stroke="#867d68" stroke-width="16"/>

<!-- tropical vegetation clusters -->
<g fill="#235a2d">
  <circle cx="130" cy="660" r="95"/><circle cx="250" cy="705" r="120"/><circle cx="375" cy="690" r="90"/>
  <circle cx="1440" cy="610" r="120"/><circle cx="1530" cy="670" r="110"/><circle cx="1350" cy="700" r="95"/>
</g>
<g fill="#36783c">
  <ellipse cx="190" cy="620" rx="120" ry="42" transform="rotate(-20 190 620)"/>
  <ellipse cx="315" cy="655" rx="125" ry="40" transform="rotate(18 315 655)"/>
  <ellipse cx="1400" cy="560" rx="135" ry="42" transform="rotate(-14 1400 560)"/>
  <ellipse cx="1500" cy="630" rx="120" ry="38" transform="rotate(20 1500 630)"/>
</g>
<g stroke="#2f6e38" stroke-width="16" stroke-linecap="round" opacity=".95">
  <path d="M85 720 l-45 -130 M85 720 l10 -145 M85 720 l58 -126 M85 720 l94 -70"/>
  <path d="M1490 720 l-30 -145 M1490 720 l22 -150 M1490 720 l72 -118 M1490 720 l92 -62"/>
</g>

<!-- atmospheric haze -->
<rect width="1600" height="900" fill="url(#sun)" opacity=".08"/>
</svg>