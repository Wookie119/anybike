<script>
const SUPABASE_URL="https://tuehtnezhdnkqbbhttgp.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_mrkBKDxEPVmdj2n7gPWsbg_l4CShtcK";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

let currentBike=null;
let motorcycleDocuments=[];

const DOCUMENT_TYPES=[
  "Supplier VAT Invoice",
  "Purchase Invoice",
  "Purchase Document",
  "Self Billing Document",
  "V5C",
  "HPI Report",
  "Inspection",
  "Payment Evidence",
  "Seller Correspondence",
  "Buyer Document",
  "Export Document",
  "Shipping Document",
  "Registration Document",
  "Proof of Ownership",
  "Photo of Document",
  "Other"
];

function safe(v){
  return String(v ?? "").replace(/[&<>'"]/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    "'":"&#39;",
    '"':"&quot;"
  }[c]));
}

function first(){
  for(const value of arguments){
    if(value !== null && value !== undefined && String(value).trim() !== ""){
      return value;
    }
  }
  return null;
}

function money(v){
  if(v===null || v===undefined || v==="") return "-";
  const n=Number(v);
  if(!Number.isFinite(n)) return safe(v);
  return "£"+n.toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});
}

function numberText(v,suffix){
  if(v===null || v===undefined || v==="") return "-";
  const n=Number(v);
  if(!Number.isFinite(n)) return safe(v);
  return n.toLocaleString("en-GB")+(suffix||"");
}

function dateText(v){
  if(!v) return "-";
  const d=new Date(v);
  return Number.isNaN(d.getTime()) ? safe(v) : d.toLocaleString("en-GB");
}

function valueText(v){
  if(v===null || v===undefined || v==="") return "-";
  if(typeof v==="boolean") return v ? "Yes" : "No";
  return safe(v);
}

function row(label,value,formatter){
  const shown=formatter ? formatter(value) : valueText(value);
  return '<div class="row"><div class="k">'+safe(label)+'</div><div class="v">'+shown+'</div></div>';
}

function statusClass(status){
  const s=String(status||"").trim().toLowerCase();
  if(["active","available","live"].includes(s)) return "live";
  if(["removed","sold","expired","inactive"].includes(s)) return "red";
  return "warn";
}

function linkValue(url,label){
  if(!url) return "-";
  const text=safe(label || url);
  const href=safe(url);
  return '<a href="'+href+'" target="_blank" rel="noopener" style="color:#fff;text-decoration:underline">'+text+'</a>';
}

function prettyRaw(raw){
  if(raw===null || raw===undefined || raw==="") return "No raw source data stored.";
  try{
    if(typeof raw==="string"){
      const parsed=JSON.parse(raw);
      return JSON.stringify(parsed,null,2);
    }
    return JSON.stringify(raw,null,2);
  }catch(e){
    return String(raw);
  }
}

function selected(actual,expected){
  return String(actual ?? "")===String(expected) ? " selected" : "";
}

function checked(value){
  return value===true ? " checked" : "";
}

function setFeedback(id,message,ok){
  const el=document.getElementById(id);
  if(!el) return;
  el.textContent=message || "";
  el.className="feedback show "+(ok ? "ok" : "bad");
}

function clearFeedback(id){
  const el=document.getElementById(id);
  if(!el) return;
  el.textContent="";
  el.className="feedback";
}

function vatQualifyingInternal(b){
  return String(b.vat_treatment||"")==="Full VAT" &&
         String(b.vat_treatment_status||"")==="Verified";
}

function buyerVatLabel(b){
  return vatQualifyingInternal(b) ? "VAT Qualifying" : "";
}

function documentTypeOptions(value){
  return DOCUMENT_TYPES.map(type=>
    '<option value="'+safe(type)+'"'+selected(value,type)+'>'+safe(type)+'</option>'
  ).join("");
}

function safeStorageFileName(name){
  const original=String(name||"file").trim();
  const dot=original.lastIndexOf(".");
  const base=(dot>0 ? original.slice(0,dot) : original)
    .toLowerCase()
    .replace(/[^a-z0-9_-]+/g,"-")
    .replace(/^-+|-+$/g,"")
    .slice(0,80) || "document";
  const ext=dot>0
    ? original.slice(dot).toLowerCase().replace(/[^a-z0-9.]/g,"").slice(0,12)
    : "";
  return base+ext;
}

function renderDocuments(){
  const target=document.getElementById("motorcycleDocumentsList");
  if(!target) return;

  const active=(motorcycleDocuments||[]).filter(d=>String(d.document_status||"Active")!=="Deleted");

  if(!active.length){
    target.innerHTML='<div class="empty" style="padding:18px">No documents uploaded. Uploading documents is optional.</div>';
    return;
  }

  target.innerHTML=active.map(function(d){
    const title=first(d.document_title,d.original_file_name,"Document");
    const evidenceFlags=[
      d.is_vat_evidence ? '<span class="doc-flag">VAT Evidence</span>' : "",
      d.is_purchase_evidence ? '<span class="doc-flag">Purchase Evidence</span>' : "",
      d.is_accounting_evidence ? '<span class="doc-flag">Accounting Evidence</span>' : ""
    ].filter(Boolean).join("");

    return `
      <div class="doc-item">
        <div class="doc-head">
          <div>
            <div class="doc-title">${safe(title)}</div>
            <div class="doc-meta">
              ${safe(d.document_type || "Other")} •
              ${safe(d.original_file_name || "")} •
              ${dateText(d.created_at)}
            </div>
          </div>
          <span class="doc-flag ${d.buyer_visible ? "buyer" : "internal"}">
            ${d.buyer_visible ? "Buyer Visible" : "Internal Only"}
          </span>
        </div>

        ${d.description ? '<div class="doc-meta" style="margin-top:8px">'+safe(d.description)+'</div>' : ""}
        ${d.evidence_reference ? '<div class="doc-meta">Evidence ref: '+safe(d.evidence_reference)+'</div>' : ""}
        <div class="doc-flags">${evidenceFlags}</div>

        <div class="doc-actions">
          <button class="btn small" type="button" onclick="viewMotorcycleDocument(${Number(d.id)})">View</button>
          <button class="btn small" type="button" onclick="toggleMotorcycleDocumentBuyerVisibility(${Number(d.id)},${d.buyer_visible ? "false" : "true"})">
            ${d.buyer_visible ? "Make Internal Only" : "Mark Buyer Visible"}
          </button>
          <button class="btn small danger" type="button" onclick="deleteMotorcycleDocument(${Number(d.id)})">Delete</button>
        </div>
      </div>
    `;
  }).join("");
}

async function loadMotorcycleDocuments(stockId){
  const {data,error}=await sb.rpc("admin_get_motorcycle_documents",{
    p_stock_id:Number(stockId),
    p_deal_id:null,
    p_include_deleted:false
  });

  if(error){
    motorcycleDocuments=[];
    const target=document.getElementById("motorcycleDocumentsList");
    if(target){
      target.innerHTML='<div class="error" style="padding:18px">Could not load documents: '+safe(error.message)+'</div>';
    }
    return;
  }

  motorcycleDocuments=data || [];
  renderDocuments();
}

function syncVatRecoveryControl(){
  const treatment=document.getElementById("vatTreatment");
  const wrap=document.getElementById("vatRecoveryWrap");
  const checkbox=document.getElementById("vatInputRecoverable");
  if(!treatment || !wrap || !checkbox) return;

  const full=treatment.value==="Full VAT";
  wrap.style.display=full ? "flex" : "none";

  if(!full){
    checkbox.checked=false;
  }
}

async function saveStockVat(){
  if(!currentBike) return;

  clearFeedback("vatFeedback");

  const treatment=document.getElementById("vatTreatment").value;
  const treatmentStatus=document.getElementById("vatTreatmentStatus").value;
  const rate=Number(document.getElementById("vatRate").value || 20);
  const classificationSource=document.getElementById("vatClassificationSource").value.trim() || null;
  const evidenceReference=document.getElementById("vatEvidenceReference").value.trim() || null;
  const notes=document.getElementById("vatTreatmentNotes").value.trim() || null;

  let inputRecoverable=null;
  if(treatment==="Full VAT"){
    inputRecoverable=document.getElementById("vatInputRecoverable").checked;
  }else if(treatment==="Margin Scheme"){
    inputRecoverable=false;
  }

  const button=document.getElementById("saveVatBtn");
  if(button){
    button.disabled=true;
    button.textContent="Saving...";
  }

  try{
    const {data,error}=await sb.rpc("admin_set_stock_vat_treatment",{
      p_stock_id:Number(currentBike.id),
      p_vat_treatment:treatment,
      p_vat_treatment_status:treatmentStatus,
      p_vat_rate_percent:rate,
      p_purchase_input_vat_recoverable:inputRecoverable,
      p_classification_source:classificationSource,
      p_evidence_reference:evidenceReference,
      p_notes:notes
    });

    if(error){
      setFeedback("vatFeedback","VAT classification could not be saved: "+error.message,false);
      return;
    }

    setFeedback("vatFeedback",
      treatment==="Full VAT" && treatmentStatus==="Verified"
        ? "Saved. This motorcycle is now internally verified as VAT Qualifying."
        : "VAT classification saved.",
      true
    );

    await loadMotorcycle(true);
  }finally{
    if(button){
      button.disabled=false;
      button.textContent="Save VAT Classification";
    }
  }
}

async function uploadMotorcycleDocument(){
  if(!currentBike) return;

  clearFeedback("documentFeedback");

  const fileInput=document.getElementById("documentFile");
  const file=fileInput?.files?.[0];

  if(!file){
    setFeedback("documentFeedback","Choose a file first.",false);
    return;
  }

  if(file.size>50*1024*1024){
    setFeedback("documentFeedback","The file is larger than the 50 MB private document limit.",false);
    return;
  }

  const documentType=document.getElementById("documentType").value || "Other";
  const documentTitle=document.getElementById("documentTitle").value.trim() || null;
  const description=document.getElementById("documentDescription").value.trim() || null;
  const evidenceReference=document.getElementById("documentEvidenceReference").value.trim() || null;
  const internalNotes=document.getElementById("documentInternalNotes").value.trim() || null;
  const vatEvidence=document.getElementById("documentVatEvidence").checked;
  const purchaseEvidence=document.getElementById("documentPurchaseEvidence").checked;
  const accountingEvidence=document.getElementById("documentAccountingEvidence").checked;

  const button=document.getElementById("uploadDocumentBtn");
  if(button){
    button.disabled=true;
    button.textContent="Uploading...";
  }

  const unique=Date.now()+"-"+Math.random().toString(36).slice(2,9);
  const storagePath="motorcycles/"+Number(currentBike.id)+"/"+unique+"-"+safeStorageFileName(file.name);

  try{
    const upload=await sb.storage
      .from("deal-files")
      .upload(storagePath,file,{
        cacheControl:"3600",
        upsert:false,
        contentType:file.type || undefined
      });

    if(upload.error){
      setFeedback("documentFeedback","Private file upload failed: "+upload.error.message,false);
      return;
    }

    const registration=await sb.rpc("admin_register_motorcycle_document",{
      p_stock_id:Number(currentBike.id),
      p_storage_path:storagePath,
      p_original_file_name:file.name,
      p_document_type:documentType,
      p_document_title:documentTitle,
      p_description:description,
      p_mime_type:file.type || null,
      p_file_size:Number(file.size || 0),
      p_deal_id:null,
      p_deal_motorcycle_id:null,
      p_buyer_match_id:null,
      p_is_vat_evidence:vatEvidence,
      p_is_purchase_evidence:purchaseEvidence,
      p_is_accounting_evidence:accountingEvidence,
      p_evidence_reference:evidenceReference,
      p_internal_notes:internalNotes
    });

    if(registration.error){
      await sb.storage.from("deal-files").remove([storagePath]);
      setFeedback("documentFeedback","File uploaded but the document record could not be registered, so the upload was rolled back: "+registration.error.message,false);
      return;
    }

    fileInput.value="";
    document.getElementById("documentTitle").value="";
    document.getElementById("documentDescription").value="";
    document.getElementById("documentEvidenceReference").value="";
    document.getElementById("documentInternalNotes").value="";
    document.getElementById("documentVatEvidence").checked=false;
    document.getElementById("documentPurchaseEvidence").checked=false;
    document.getElementById("documentAccountingEvidence").checked=false;

    setFeedback("documentFeedback","Document uploaded privately.",true);
    await loadMotorcycleDocuments(currentBike.id);
  }finally{
    if(button){
      button.disabled=false;
      button.textContent="Upload Private Document";
    }
  }
}

function findDocumentById(id){
  return (motorcycleDocuments||[]).find(d=>Number(d.id)===Number(id)) || null;
}

async function viewMotorcycleDocument(id){
  const doc=findDocumentById(id);
  if(!doc){
    alert("Document record not found.");
    return;
  }

  const {data,error}=await sb.storage
    .from(doc.storage_bucket || "deal-files")
    .createSignedUrl(doc.storage_path,300);

  if(error || !data?.signedUrl){
    alert("Could not open private document: "+(error?.message || "No signed URL returned."));
    return;
  }

  window.open(data.signedUrl,"_blank","noopener");
}

async function toggleMotorcycleDocumentBuyerVisibility(id,makeVisible){
  const doc=findDocumentById(id);
  if(!doc) return;

  if(makeVisible){
    const ok=confirm(
      "Mark this document as Buyer Visible?\n\n"+
      "This records the visibility choice in Motorcycle 360. "+
      "The file remains in private storage and is not publicly accessible."
    );
    if(!ok) return;
  }

  const {error}=await sb.rpc("admin_set_motorcycle_document_buyer_visibility",{
    p_document_id:Number(id),
    p_buyer_visible:Boolean(makeVisible)
  });

  if(error){
    alert("Could not change document visibility: "+error.message);
    return;
  }

  await loadMotorcycleDocuments(currentBike.id);
}

async function deleteMotorcycleDocument(id){
  const doc=findDocumentById(id);
  if(!doc) return;

  const ok=confirm(
    "Delete this private document?\n\n"+
    "The file will be removed from private storage and the document record will be retained as deleted for audit history."
  );
  if(!ok) return;

  const storageDelete=await sb.storage
    .from(doc.storage_bucket || "deal-files")
    .remove([doc.storage_path]);

  if(storageDelete.error){
    alert("The private file could not be deleted from storage, so the document record was left unchanged: "+storageDelete.error.message);
    return;
  }

  const metadataDelete=await sb.rpc("admin_delete_motorcycle_document",{
    p_document_id:Number(id),
    p_reason:"Deleted from Motorcycle 360"
  });

  if(metadataDelete.error){
    alert(
      "The file was removed from storage, but the document record could not be marked deleted: "+
      metadataDelete.error.message
    );
    await loadMotorcycleDocuments(currentBike.id);
    return;
  }

  await loadMotorcycleDocuments(currentBike.id);
}

  document.getElementById("motorcycleView").innerHTML=html;
  document.getElementById("motorcycleView").style.display="block";

async function loadMotorcycle(preserveState){
  const params=new URLSearchParams(window.location.search);
  const id=params.get("id");
  const state=document.getElementById("pageState");

  if(!id){
    state.className="error";
    state.innerHTML='No motorcycle ID was supplied. Open this page using <strong>?id=...</strong>.';
    return;
  }

  if(!preserveState){
    state.style.display="block";
    state.className="loading";
    state.textContent="Loading motorcycle "+id+"...";
  }

  const {data,error}=await sb
    .from("available_stock")
    .select("*")
    .eq("id",id)
    .maybeSingle();

  if(error){
    state.style.display="block";
    state.className="error";
    state.textContent="Could not load motorcycle: "+error.message;
    return;
  }

  if(!data){
    state.style.display="block";
    state.className="empty";
    state.textContent="Motorcycle not found.";
    return;
  }

  state.style.display="none";
  renderBike(data);
}

(async function startMotorcycle360(){
  const allowed=await requireAdminSession();

  if(!allowed){
    return;
  }

  document.documentElement.classList.remove("admin-auth-pending");
  await loadMotorcycle(false);
})();
