<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>AnyBike Contact Directory</title><script>document.documentElement.classList.add('admin-auth-pending')</script><style>html.admin-auth-pending body{visibility:hidden}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin.js?v=12001"></script><link rel="stylesheet" href="/admin-shell.css?v=12001"><style>body{background:#090909;color:white;font:14px Arial}main{padding:20px;width:100%;max-width:none!important}input,button,select{padding:9px;background:#222;border:1px solid #555;color:white;border-radius:5px;margin:4px}button{cursor:pointer}table{border-collapse:collapse;width:100%;min-width:1200px}td,th{border-bottom:1px solid #444;padding:9px;text-align:left}th{position:sticky;top:0;background:#292929;cursor:pointer}.scroll{height:65vh;overflow:auto}.panel{padding:15px;background:#171717;border:1px solid #444;border-radius:10px;margin-bottom:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row input[type=text]{flex:1}.edit label{display:inline-grid;width:23%;min-width:200px} .edit input{width:95%}td,th{padding:5px 9px!important;line-height:1.15;white-space:nowrap}tbody tr{height:34px}td button{padding:4px 10px;margin:0;font-size:12px;background:#742027;border-color:#a33}.scroll{height:78vh}.fixed{position:sticky;left:0;z-index:3;background:#191919}.fixed-edit{position:sticky;left:50px;z-index:3;background:#191919;border-right:2px solid #555}th.fixed,th.fixed-edit{z-index:6;background:#292929}.edit{display:flex;flex-wrap:wrap;gap:8px}.edit label{width:calc(25% - 8px)}#editor{position:sticky;top:0;z-index:8;box-shadow:0 10px 28px #000;border-color:#c51b24}tbody tr:hover td.fixed,tbody tr:hover td.fixed-edit{background:#292929}#anybikeSharedNextAction{display:none!important}.panel:first-of-type{padding:10px 14px}.panel:first-of-type h1{font-size:21px;margin:4px 0}.panel:first-of-type p{margin:4px 0;font-size:12px}.panel:first-of-type .row{margin-top:4px}.scroll{height:70vh}table{min-width:0;width:100%}td{max-width:300px;overflow:hidden;text-overflow:ellipsis}th{white-space:nowrap}#editor{scroll-margin-top:15px}.panel{background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;padding:8px 2px!important;margin:7px 0!important}.scroll{border:0!important}#dealerSearch,#tagSearch{min-width:210px;flex:1}#q{min-width:190px;flex:1}main.admin-page-content{padding-top:6px!important}</style></head><body><div class="admin-shell"><div id="adminSidebar"></div><div class="admin-main"><div id="adminTopbar"></div><main class="admin-page-content"><section class="panel"><h1>AnyBike Master Contact Directory</h1><p>Import your original CSV; every column is searchable and sortable. No invitations are sent automatically. <a href="/admin-invitations.html">Invitation tools</a></p><div class="row"><input id="file" type="file" accept=".csv"><button id="import">Import CSV</button><button id="reload">Refresh</button><span id="status"></span></div></section><section class="panel"><div class="row"><input id="dealerSearch" type="text" placeholder="Dealer name or email (e.g. lind)"><input id="tagSearch" type="text" placeholder="Search tags (e.g. BMW, Harley, Trade)"><input id="q" type="text" placeholder="Search all other fields"><label style="display:inline-flex;align-items:center;gap:6px;white-space:nowrap"><input id="hideUnknown" type="checkbox" style="margin:0"> Hide unknown@ emails</label><button id="select">Select visible</button><button id="clear">Clear selection</button><label>Columns <select id="columnMode"><option value="compact">Essential — wide view</option><option value="all">All CSV columns</option></select></label><label>Rows per page <select id="pageSize"><option value="100">100</option><option value="250" selected>250</option><option value="500">500</option><option value="1000">1000</option></select></label><span id="count"></span></div><div class="scroll"><table><thead id="head"></thead><tbody id="body"></tbody></table></div><div class="row"><button id="prev">Previous</button><span id="pages"></span><button id="next">Next</button></div></section><section id="editor" class="panel" hidden><h2 id="editTitle"></h2><div id="fields" class="edit"></div><label><input id="approved" type="checkbox">Permission reviewed and approved for invitations</label><label><input id="personal" type="checkbox">Personal intro from Andy</label><button id="save">Save selected contact</button><button id="cancel">Cancel</button><span id="editMsg"></span></section><section class="panel"><h2>Selected invitations</h2><p>Only contacts individually approved for invitations may be prepared. Email and SMS are drafts, not automatically sent.</p><button id="review">Review selected</button><button id="draft" disabled>Next email draft</button><span id="queue"></span></section></main></div></div><script>
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),db=window.supabase.createClient('https://tuehtnezhdnkqbbhttgp.supabase.co','sb_publishable_mrkBKDxEPVmdj2n7gPWsbg_l4CShtcK');
let items=[],chosen=new Set(),sort='company',asc=true,page=0,editId=null,queue=[],pos=0;const pageSize=()=>Number($('pageSize').value);
const cols=['company','first_name','last_name','email','phone','segment','priority','tags','marketing_permission','approved_for_invitation','personal_intro'];
function parse(s){let rows=[],row=[],cell='',quote=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quote&&s[i+1]==='"'){cell+='"';i++}else quote=!quote;}else if(c===','&&!quote){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&s[i+1]==='\n')i++;row.push(cell);if(row.some(Boolean))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(Boolean))rows.push(row);let head=rows.shift();return rows.map((v,i)=>({line:i+2,d:Object.fromEntries(head.map((k,j)=>[k.trim(),v[j]||'']))}));}
$('import').onclick=async()=>{let f=$('file').files[0];if(!f)return;if(!confirm('Import CSV without automatically sending invitations?'))return;let src=parse(await f.text()),rows=src.map(({d,line})=>({source_key:'csv:'+(d.euid||d.Leid||d['Unnamed: 0']||'row-'+line).toLowerCase(),email:d['']||d['Unnamed: 0']||'',first_name:d['First Name']||'',last_name:d['Last Name']||'',company:d.Company||'',phone:d['Phone Number']||'',segment:d['AnyBike Suggested Segment']||'',priority:d['AnyBike Priority']||'',tags:d.tags||'',marketing_permission:d['Marketing Permission']||'',source_data:d}));$('import').disabled=true;try{for(let i=0;i<rows.length;i+=100){let {error}=await db.rpc('admin_import_master_contacts_v1',{p_rows:rows.slice(i,i+100)});if(error)throw error;$('status').textContent='Imported '+Math.min(i+100,rows.length)+'/'+rows.length;}await load();$('status').textContent='Import complete. '+rows.length+' rows processed. No messages sent.';}catch(e){$('status').textContent='Import stopped: '+e.message}finally{$('import').disabled=false}};
async function load(){let all=[];for(let n=0;;n+=750){let {data,error}=await db.from('anybike_master_contacts').select('*').order('id').range(n,n+749);if(error){$('status').textContent=error.message;return}all.push(...data);if(data.length<750)break}items=all;page=0;render()}
function view(){let q=$('q').value.toLowerCase().trim(),dealer=$('dealerSearch').value.toLowerCase().trim(),tag=$('tagSearch').value.toLowerCase().trim();return items.filter(r=>(!$('hideUnknown').checked||!String(r.email||'').toLowerCase().startsWith('unknown@'))&&(!q||JSON.stringify(r).toLowerCase().includes(q))&&(!dealer||[r.company,r.source_data?.Company,r.email,r.source_data?.[''],r.first_name,r.last_name].some(v=>String(v||'').toLowerCase().includes(dealer)))&&(!tag||String(r.tags||r.source_data?.tags||'').toLowerCase().includes(tag))).sort((a,b)=>(asc?1:-1)*String(a[sort]??a.source_data?.[sort]??'').localeCompare(String(b[sort]??b.source_data?.[sort]??''),undefined,{numeric:true,sensitivity:'base'}))}
function render(){
 let v=view(),keys=$('columnMode').value==='all'?[...new Set([...cols,...items.flatMap(x=>Object.keys(x.source_data||{}))])].filter(k=>!['approved_for_invitation','personal_intro'].includes(k)):['company','first_name','last_name','email','phone','segment','priority'],shown=v.slice(page*pageSize(),page*pageSize()+pageSize());
 $('head').innerHTML='<tr><th class="fixed">Select</th><th class="fixed-edit">Edit row</th><th>Permission approved</th><th>Personal intro from Andy</th>'+keys.map(k=>'<th data-key="'+esc(k)+'">'+esc(k)+(sort===k?(asc?' ▲':' ▼'):'')+'</th>').join('')+'</tr>';
 $('head').querySelectorAll('[data-key]').forEach(x=>x.onclick=()=>{if(sort===x.dataset.key)asc=!asc;else{sort=x.dataset.key;asc=true}page=0;render()});
 $('body').innerHTML=shown.map(r=>'<tr><td class="fixed"><input type="checkbox" data-pick="'+r.id+'" '+(chosen.has(r.id)?'checked':'')+'></td><td class="fixed-edit"><button type="button" data-edit="'+r.id+'">Edit</button></td><td><input type="checkbox" aria-label="Approve invitation permission for '+esc(r.company||r.email)+'" data-flag="approved_for_invitation" data-id="'+r.id+'" '+(r.approved_for_invitation?'checked':'')+'></td><td><input type="checkbox" aria-label="Personal intro from Andy for '+esc(r.company||r.email)+'" data-flag="personal_intro" data-id="'+r.id+'" '+(r.personal_intro?'checked':'')+'></td>'+keys.map(k=>'<td>'+esc(r[k]??r.source_data?.[k]??'').slice(0,130)+'</td>').join('')+'</tr>').join('');
 $('body').querySelectorAll('[data-pick]').forEach(x=>x.onchange=()=>{let id=+x.dataset.pick;x.checked?chosen.add(id):chosen.delete(id);$('count').textContent=v.length+' matching · '+chosen.size+' selected'});
 $('body').querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>edit(+x.dataset.edit));
 $('body').querySelectorAll('[data-flag]').forEach(x=>x.onchange=async()=>{
   const id=Number(x.dataset.id),field=x.dataset.flag,value=x.checked,r=items.find(t=>t.id===id);
   if(field==='approved_for_invitation'&&value&&!confirm('Confirm lawful invitation permission for this contact?')){x.checked=false;return;}
   x.disabled=true;const {data,error}=await db.from('anybike_master_contacts').update({[field]:value}).eq('id',id).select().single();
   if(error){x.checked=!value;alert('Could not save: '+error.message);}else{Object.assign(r,data);if(editId===id&&$('editor')&&!$('editor').hidden){$('approved').checked=!!r.approved_for_invitation;$('personal').checked=!!r.personal_intro;}}
   x.disabled=false;
 });
 $('count').textContent=v.length+' matching · '+chosen.size+' selected';$('pages').textContent='Page '+(page+1)+' of '+Math.max(1,Math.ceil(v.length/pageSize()));
}
['q','dealerSearch','tagSearch'].forEach(id=>$(id).oninput=()=>{page=0;render()});$('hideUnknown').onchange=()=>{page=0;render()};$('pageSize').onchange=()=>{page=0;render()};$('columnMode').onchange=()=>{page=0;render()};$('prev').onclick=()=>{page=Math.max(0,page-1);render()};$('next').onclick=()=>{page=Math.min(Math.ceil(view().length/pageSize())-1,page+1);render()};$('reload').onclick=load;$('select').onclick=()=>{view().slice(page*pageSize(),page*pageSize()+pageSize()).forEach(r=>chosen.add(r.id));render()};$('clear').onclick=()=>{chosen.clear();render()};
const editFields=['company','first_name','last_name','email','phone','segment','priority','tags','marketing_permission'];
function edit(id){const r=items.find(x=>x.id===id);if(!r)return;editId=id;$('editor').hidden=false;$('editTitle').textContent='Editing contact ID '+id;$('fields').innerHTML=editFields.map(k=>'<label>'+k+'<input data-field="'+k+'" value="'+esc(r[k])+'"></label>').join('');$('approved').checked=r.approved_for_invitation;$('personal').checked=r.personal_intro;$('editor').scrollIntoView({behavior:'smooth'})}
$('cancel').onclick=()=>$('editor').hidden=true;
$('save').onclick=async()=>{let p={approved_for_invitation:$('approved').checked,personal_intro:$('personal').checked};$('fields').querySelectorAll('[data-field]').forEach(x=>p[x.dataset.field]=x.value);if(p.approved_for_invitation&&!confirm('Confirm lawful invitation permission for this contact?'))return;let {data,error}=await db.from('anybike_master_contacts').update(p).eq('id',editId).select().single();$('editMsg').textContent=error?error.message:'Saved';if(!error){Object.assign(items.find(x=>x.id===editId),data);render()}};
$('review').onclick=()=>{queue=items.filter(r=>chosen.has(r.id)&&r.approved_for_invitation&&r.email);pos=0;$('draft').disabled=!queue.length;$('queue').textContent=queue.length+' approved recipients; '+(chosen.size-queue.length)+' excluded.'};
$('draft').onclick=()=>{if(pos>=queue.length)return;const r=queue[pos++],link='https://www.anybike.co.uk/uk-dealer-welcome.html',intro=r.personal_intro?'You have been invited to AnyBike because Andy Gifford from Move Motorcycles thought AnyBike would help you sell more bikes.\n\n':'',body='Hi '+(r.first_name||'there')+',\n\n'+intro+'We invite '+(r.company||'you')+' to join AnyBike and bid on used motorcycles offered by UK dealers.\n\n'+link+'\n\nAnyBike';window.location.href='mailto:'+encodeURIComponent(r.email)+'?subject='+encodeURIComponent('Invitation to AnyBike')+'&body='+encodeURIComponent(body);let mobile=String(r.phone||'').replace(/\D/g,'');$('queue').innerHTML='Email draft '+pos+'/'+queue.length+' opened. '+(/^07\d{9}$/.test(mobile)?'<a href="sms:'+mobile+'?body='+encodeURIComponent('AnyBike dealer invitation: '+link)+'">Open matching SMS draft</a>':'No UK 07 mobile.');$('draft').disabled=pos===queue.length};
(async()=>{try{if(!await requireAdminSession())return;document.documentElement.classList.remove('admin-auth-pending');await load()}catch(e){document.documentElement.classList.remove('admin-auth-pending');$('status').textContent=e.message}})();
</script></body></html>
