  const {data,error}=await db.from('anybike_invitation_sms_log').select('id,contact_id,recipient,status,requested_at,sent_at,provider_message_id,error_message').in('contact_id',ids.slice(i,i+200)).order('requested_at',{ascending:false}).limit(1000);
  if(error)throw error;
  for(const record of data||[])if(!smsHistory.has(record.contact_id))smsHistory.set(record.contact_id,record);
 }
}
async function reviewInvitations(){
 try{await refreshSmsHistory()}catch(e){$('queue').textContent='SMS history unavailable: '+e.message+'. No invitations can be sent until this is resolved.';$('invitePreviews').innerHTML='';return;}

 const approved=items.filter(r=>r.approved_for_invitation);
 queue=approved.filter(r=>chosen.has(r.id)&&r.email&&!String(r.email).toLowerCase().startsWith('unknown@'));
 smsQueue=approved.filter(r=>r.sms_invite_selected&&/^07\d{9}$/.test(String(r.phone||'').replace(/\s/g,'')));
 pos=0;smsPos=0;$('draft').disabled=true;$('smsDraft').disabled=true;
 $('queue').textContent=queue.length+' email and '+smsQueue.length+' SMS drafts ready to preview. No messages have been sent.';
 const recipients=[...new Map([...queue,...smsQueue].map(r=>[r.id,r])).values()];
 $('invitePreviews').innerHTML=recipients.map(r=>{
 const canEmail=queue.some(t=>t.id===r.id),canSms=smsQueue.some(t=>t.id===r.id),alreadyEmail=!!r.email_invite_sent_at;
 return '<article style="border:1px solid #555;border-radius:9px;padding:14px;background:#191919"><h3>'+esc(r.company||'Dealership')+' — '+esc([r.first_name,r.last_name].filter(Boolean).join(' ')||'Contact')+'</h3>'+
 (canEmail?'<div style="margin:12px 0"><b>Email to: '+esc(r.email)+'</b>'+(alreadyEmail?'<p style="color:#a7e7ab">✓ Sent in Outlook (manually confirmed): '+esc(new Date(r.email_invite_sent_at).toLocaleString('en-GB'))+'</p>':'<p>Not recorded as sent.</p>')+'<p><b>Subject:</b> Invitation to join the AnyBike motorcycle trade network</p><div style="background:#fff;color:#222;padding:14px;border-radius:6px">'+richInvitationHtml(r)+'</div><button data-copy-rich="'+r.id+'">Copy formatted email (with button)</button><button data-confirm-email="'+r.id+'" '+(alreadyEmail?'disabled':'')+' style="background:#20582f;border-color:#328447">'+(alreadyEmail?'✓ Email sent recorded':'Confirm sent in Outlook')+'</button><button data-open-email="'+r.id+'" style="background:#9c2630;color:white;border:1px solid #b44">Prepare Outlook draft with button</button></div>':'')+
 (canSms?'<div style="margin:12px 0"><b>SMS to: '+esc(r.phone)+'</b>'+(smsHistory.has(r.id)?'<p style="color:#a7e7ab">Previous SMS: '+esc(smsHistory.get(r.id).status)+' · '+esc(smsHistory.get(r.id).sent_at||smsHistory.get(r.id).requested_at||'')+' · Ref '+esc(smsHistory.get(r.id).provider_message_id||smsHistory.get(r.id).id)+'</p>':'<p>No ClickSend invitation recorded.</p>')+'<pre style="white-space:pre-wrap;overflow-wrap:anywhere;font:13px Arial;background:#fff;color:#222;padding:12px;border-radius:6px">'+esc(smsMessage(r))+'</pre><button data-send-sms="'+r.id+'" '+(smsHistory.has(r.id)&&['sending','submitted','delivered'].includes(smsHistory.get(r.id).status)?'disabled title="Previous SMS recorded — check status before resending"':'')+' style="background:#ad252d;color:white;border-color:#d54049">'+(smsHistory.has(r.id)&&['sending','submitted','delivered'].includes(smsHistory.get(r.id).status)?'SMS already submitted — check history':'Send SMS from AnyBike')+'</button><button data-open-sms="'+r.id+'">Open SMS draft</button><button data-copy-sms="'+r.id+'">Copy SMS text</button></div>':'')+
 '</article>';
 }).join('');
 $('invitePreviews').querySelectorAll('[data-confirm-email]').forEach(btn=>btn.onclick=async()=>{
 const r=queue.find(x=>x.id===Number(btn.dataset.confirmEmail));if(!r||r.email_invite_sent_at)return;
 if(!confirm('Only confirm if this email appears in Outlook Sent Items. Record sent to '+r.email+'?'))return;
 btn.disabled=true;const now=new Date().toISOString();
 const {data,error}=await db.from('anybike_master_contacts').update({email_invite_sent_at:now,email_invite_confirmation:'Outlook Sent Items manually confirmed'}).eq('id',r.id).is('email_invite_sent_at',null).select().maybeSingle();
 if(error||!data){btn.disabled=false;$('queue').textContent='Cannot record: '+(error?.message||'Already recorded elsewhere; refresh.');return;}
 Object.assign(r,data);btn.textContent='✓ Email sent recorded';$('queue').textContent='Outlook sending manually confirmed for '+r.email+'. Receipt/delivery not verified.';render();
 });
 $('invitePreviews').querySelectorAll('[data-copy-rich]').forEach(btn=>btn.onclick=async()=>{const r=queue.find(x=>x.id===Number(btn.dataset.copyRich));const html=richInvitationHtml(r);try{if(!window.ClipboardItem||!navigator.clipboard?.write)throw Error('Rich clipboard unsupported');await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([emailBody(r)],{type:'text/plain'})})]);$('queue').textContent='Formatted email copied for '+r.email+'. Open a new message FROM sales@anybike.co.uk, address it to '+r.email+', and paste with Ctrl+V. The red button should be included. Your Outlook signature can stay underneath.'}catch(e){$('queue').textContent='Could not copy formatted HTML. Please try Edge or Chrome over HTTPS. Nothing sent.'}});
 $('invitePreviews').querySelectorAll('[data-open-email]').forEach(btn=>btn.onclick=async()=>{
 const r=queue.find(x=>x.id===Number(btn.dataset.openEmail));if(!r)return;if(r.email_invite_sent_at&&!confirm('This contact already has a confirmed sent email. Prepare another draft?'))return;
 const html=richInvitationHtml(r);
 const subject='Invitation to join the AnyBike motorcycle trade network';
 const compose='mailto:'+encodeURIComponent(r.email)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(emailBody(r));
 btn.disabled=true;
 try{
  if(!window.ClipboardItem||!navigator.clipboard?.write)throw Error('Formatted clipboard unavailable');
  await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([emailBody(r)],{type:'text/plain'})})]);
  $('queue').textContent='Formatted invitation with the red button copied. Outlook will open with the complete plain-text invitation and working registration URL. To use the styled button instead, select the drafted body above your signature and press Ctrl+V to replace it with the formatted invitation. Check From: sales@anybike.co.uk.';
  window.location.href=compose;
 }catch(e){
  $('queue').textContent='Could not copy the formatted email. Use Copy formatted email (with button), then open Outlook and paste. No draft opened.';
 }
 btn.disabled=false;
 });
 $('invitePreviews').querySelectorAll('[data-send-sms]').forEach(btn=>btn.onclick=async()=>{
 const r=smsQueue.find(x=>x.id===Number(btn.dataset.sendSms));
 if(!r||!confirm('Send this SMS now to '+r.phone+' for '+(r.company||r.first_name)+' via AnyBike? This is a REAL chargeable SMS.'))return;
 btn.disabled=true;btn.textContent='Sending SMS…';
 try{
 const {data,error}=await db.functions.invoke('anybike-send-dealer-invitation-sms',{body:{contact_id:r.id,confirm_send:true}});
 if(error)throw Error(data?.error||error.message||'SMS sending failed');
 if(!data?.success)throw Error(data?.error||'SMS not accepted by provider');
 smsHistory.set(r.id,{status:'submitted',sent_at:new Date().toISOString(),provider_message_id:data.message_id,id:data.log_id});btn.textContent='SMS submitted ✓';$('queue').textContent='ClickSend accepted the SMS to '+r.phone+'. Provider reference: '+(data.message_id||data.log_id)+'. This confirms submission, not handset delivery.';
 }catch(e){btn.disabled=false;btn.textContent='Retry Send SMS';$('queue').textContent='SMS NOT confirmed as sent: '+e.message+' Check any previous attempt before retrying.';}
 });
 $('invitePreviews').querySelectorAll('[data-open-sms]').forEach(btn=>btn.onclick=()=>{
 const r=smsQueue.find(x=>x.id===Number(btn.dataset.openSms));
 window.location.href='sms:'+String(r.phone).replace(/\s/g,'')+'?body='+encodeURIComponent(smsMessage(r));
 $('queue').textContent='SMS draft requested for '+r.phone+'. Send using your messaging app; if no app opens, use Copy SMS text.';
 });
 $('invitePreviews').querySelectorAll('[data-copy-sms]').forEach(btn=>btn.onclick=async()=>{
 const r=smsQueue.find(x=>x.id===Number(btn.dataset.copySms));
 try{await navigator.clipboard.writeText(smsMessage(r));$('queue').textContent='SMS copied for '+r.phone+'. Paste into your phone or SMS service to send.'}catch(e){$('queue').textContent='Copy unavailable; select the SMS message text above and copy manually.'}
 });
}
$('review').onclick=reviewInvitations;
$('savedSms').onclick=()=>{smsChosen=new Set(items.filter(r=>r.sms_invite_selected).map(r=>r.id));chosen.clear();reviewInvitations();$('invitePreviews').scrollIntoView({behavior:'smooth',block:'start'});};
function inviteIntro(r){return r.personal_intro?'Andy Gifford at Move Motorcycles personally thought AnyBike might help your dealership reach more motorcycle buyers.\n\n':''}
function smsMessage(r){const name=String(r.first_name||'there').trim().slice(0,14)||'there',link='https://www.anybike.co.uk/uk-dealer-welcome.html';return $('smsTemplate').value==='personal' ? 'Hi '+name+', Text from Andy at Move Motorcycles. We collect/deliver for AnyBike. UK dealer sign-up: '+link : 'Hi '+name+', Text from AnyBike. Join our UK motorcycle trade network. Dealer registration is free: '+link;}

$('recruitmentFilter').onchange=()=>{page=0;render()};
$('smsDraft').onclick=()=>{if(smsPos>=smsQueue.length)return;const r=smsQueue[smsPos],number=String(r.phone||'').replace(/\s/g,'');if(!/^07\d{9}$/.test(number)){alert('A valid UK mobile is required.');return;}const msg=smsMessage(r);if(msg.length>160){alert('Message too long for one SMS');return;}if(!confirm('SMS preview:\\n\\n'+msg+'\\n\\nOpen an SMS draft for '+(r.first_name||r.email)+' at '+number+'? You will review and send it in your messaging app.'))return;smsPos++;$('queue').textContent='SMS draft '+smsPos+'/'+smsQueue.length+' opened for '+number+'. Review and send it in your SMS app; sending is not tracked automatically.';window.location.href='sms:'+number+'?body='+encodeURIComponent(msg);$('smsDraft').disabled=smsPos===smsQueue.length};
$('draft').onclick=()=>{if(pos>=queue.length)return;const r=queue[pos],link='https://www.anybike.co.uk/uk-dealer-welcome.html',body='Hello '+(r.first_name||'there')+',\n\n'+inviteIntro(r)+'We would like to invite '+(r.company||'your dealership')+' to join AnyBike, a UK motorcycle trade network. Registered and approved dealers can explore suitable trade opportunities and submit confidential offers on motorcycles.\n\nYou can learn more and register here:\n'+link+'\n\nRegistration is free. Access to restricted trade services is subject to AnyBike verification and approval.\n\nKind regards,\nThe AnyBike Team';const subject='Invitation to join the AnyBike motorcycle trade network';window.location.href='mailto:'+encodeURIComponent(r.email)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);pos++;$('queue').textContent='Desktop email draft requested for '+r.email+'. Verify From is sales@anybike.co.uk before sending. If Outlook does not open, set the Windows MAILTO default app to Outlook.';$('draft').disabled=pos===queue.length};
