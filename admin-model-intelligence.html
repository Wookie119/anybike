<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Model Intelligence | AnyBike Admin</title><script>document.documentElement.classList.add('admin-auth-pending')</script><style>html.admin-auth-pending body{visibility:hidden}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js?v=12000"></script><link rel="stylesheet" href="admin-shell.css?v=12001"><style>body:has(.shell) .anybike-next-action,body:has(.shell) #anybikeNextAction,body:has(.shell) [data-next-action],body:has(.shell) .next-action-banner{display:none!important}body{background:#080808;color:white;font-family:Arial,sans-serif;margin:0}.shell{max-width:1200px;margin:12px auto;padding:0 16px}.box{background:#141414;border:1px solid #444;border-left:4px solid #ed1c24;border-radius:15px;padding:16px;margin:12px 0}h1{font-size:26px}p,small{color:#bbb;line-height:1.5}a{color:#ff5d65}.pill,button,select{background:#252525;color:#fff;border:1px solid #8c3135;border-radius:25px;padding:9px 14px;cursor:pointer;margin:4px}.items{display:grid;gap:12px}.item{background:#202020;border:1px solid #743034;border-left:4px solid #ed1c24;border-radius:12px;padding:18px}.item h3{margin:0 0 8px}.meta{font-size:13px;color:#bbb}button:focus-visible{outline:2px solid white}@media(max-width:650px){.shell{margin:14px auto}.box{padding:16px}h1{font-size:25px}}</style></head><body><div id="adminSidebar"></div><div id="adminTopbar"></div><main class="shell"><a href="admin-dashboard.html">← Admin Dashboard</a><section class="box"><small style="color:#ed1c24;font-weight:bold">ANYBIKE · RESEARCH & APPROVAL</small><h1>Motorcycle Model Intelligence</h1><p>Review manufacturer discoveries before updating model pages. Approval never publishes automatically.</p><button id="refresh">Refresh findings</button><span id="count" class="pill">Loading…</span></section><section class="box"><h2>Discoveries awaiting review</h2><div id="items" class="items"><p>Checking securely…</p></div></section></main><script>
(async()=>{
const items=document.getElementById('items'),count=document.getElementById('count');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function client(){for(let i=0;i<35;i++){let c=null;try{if(typeof getAdminSupabaseClient==='function')c=getAdminSupabaseClient();if(!c&&window.supabase&&typeof window.supabase.createClient==='function')c=window.supabase.createClient('https://tuehtnezhdnkqbbhttgp.supabase.co','sb_publishable_mrkBKDxEPVmdj2n7gPWsbg_l4CShtcK',{auth:{storageKey:'anybike-admin-auth',persistSession:true,autoRefreshToken:true}});if(c&&c.auth&&typeof c.auth.getSession==='function')return c;}catch(e){console.warn('Admin auth initialising',e)}await new Promise(r=>setTimeout(r,200))}throw Error('Admin sign-in is not ready — refresh this page or sign in again');}
let sb;try{sb=await client()}catch(e){items.textContent=e.message;return}
async function call(method,body){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('Please sign in to AnyBike Admin');const res=await fetch('https://tuehtnezhdnkqbbhttgp.supabase.co/functions/v1/model-intelligence-admin',{method,headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',apikey:sb.supabaseKey||''},body:body?JSON.stringify(body):undefined});const json=await res.json();if(!res.ok)throw Error(json.error||'Request failed');return json}
async function load(){items.textContent='Loading…';try{const {findings}=await call('GET');count.textContent=findings.length+' findings';if(!findings.length){items.innerHTML='<p>No findings recorded yet. Research collection is not enabled; this review queue is ready for verified discoveries.</p>';return}items.innerHTML=findings.map(f=>'<article class="item"><h3>'+esc(f.manufacturer)+' '+esc(f.model)+'</h3><div class="meta">'+esc(f.finding_type)+' · '+esc(f.model_year||'Model year not specified')+' · '+esc(f.market)+' · '+esc(f.source_date||'Source date unknown')+'</div><p>'+esc(f.summary)+'</p><a href="'+(String(f.source_url).startsWith('https://')?esc(f.source_url):'#')+'" target="_blank" rel="noopener noreferrer">Official source ↗</a><div><label for="status-'+f.id+'">Decision: </label><select id="status-'+f.id+'" data-id="'+f.id+'">'+['review','investigate','approved','ignored'].map(x=>'<option value="'+x+'" '+(f.status===x?'selected':'')+'>'+x+'</option>').join('')+'</select><button data-save="'+f.id+'">Save decision</button></div></article>').join('')}catch(e){items.textContent='Unable to load findings: '+e.message}}
items.addEventListener('click',async e=>{const id=Number(e.target.dataset.save);if(!id)return;const status=items.querySelector('#status-'+id)?.value;e.target.disabled=true;try{await call('POST',{id,status});await load()}catch(err){alert(err.message);e.target.disabled=false}});
document.getElementById('refresh').addEventListener('click',load);load();
})();
</script></body></html>
