<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Purchase Order | AnyBike</title><style>*{box-sizing:border-box}body{margin:0;background:#e8e8e8;color:#111;font:15px Arial,sans-serif}.bar{display:flex;gap:12px;justify-content:center;padding:15px;background:#111}.bar a,.bar button{background:#ed1c24;border:0;border-radius:7px;padding:10px 18px;color:#fff;text-decoration:none;font-weight:800;cursor:pointer}.paper{max-width:880px;margin:22px auto;background:#fff;padding:42px;box-shadow:0 6px 30px #bbb}.head{display:flex;justify-content:space-between;border-bottom:4px solid #ed1c24;padding-bottom:20px}.brand{font-size:29px;font-weight:950}.brand span{color:#ed1c24}.meta{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:25px}.field{padding:14px;border:1px solid #ddd;border-radius:7px}.field small{display:block;color:#777;text-transform:uppercase;font-size:11px;margin-bottom:8px}.amount{margin-top:30px;background:#f4f4f4;padding:22px;display:flex;justify-content:space-between;font-size:23px;font-weight:bold}.foot{margin-top:30px;color:#555;font-size:12px;line-height:1.6}.error{padding:24px;color:#ab1920}@media print{body{background:#fff}.bar{display:none}.paper{margin:0;max-width:none;box-shadow:none;padding:15mm}}@media(max-width:600px){.paper{margin:0;padding:18px}.meta{grid-template-columns:1fr}.brand{font-size:22px}}</style></head><body><div class="bar"><a href="/admin-accounting.html">← Accounting HQ</a><button onclick="window.print()" id="print" disabled>Print / Save PDF</button></div><main class="paper" id="paper">Loading secure purchase order…</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin.js?v=20261016-accounting"></script><script>(async function(){const root=document.getElementById("paper");const clean=v=>String(v??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));const money=n=>"£"+Number(n||0).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});try{if(!await requireAdminSession())return;const id=Number(new URLSearchParams(location.search).get("id"));if(!Number.isSafeInteger(id)||id<1)throw Error("Valid purchase order ID required.");const sb=getAdminSupabaseClient();const all=await sb.rpc("admin_get_deal_purchase_orders_v1",{p_deal_id:null});if(all.error)throw all.error;const p=(all.data||[]).find(x=>Number(x.purchase_order_id)===id);if(!p)throw Error("Purchase order unavailable to this admin account.");root.innerHTML='<div class="head"><div class="brand">Any<span>Bike</span></div><div><h1>Purchase Order</h1><strong>'+clean(p.purchase_order_number)+'</strong></div></div><div class="meta"><div class="field"><small>Buyer</small><strong>Giffords Empire Ltd trading as AnyBike</strong></div><div class="field"><small>Supplier / Seller</small><strong>'+clean(p.supplier_name)+'</strong></div><div class="field"><small>Motorcycle</small>'+clean([p.year,p.make,p.model,p.variant].filter(Boolean).join(" "))+'</div><div class="field"><small>Registration / VIN</small>'+clean(p.registration||"Not recorded")+' / '+clean(p.vin||"Not recorded")+'</div><div class="field"><small>Deal</small>'+clean(p.deal_id)+'</div><div class="field"><small>Status / Issue date</small>'+clean(p.purchase_order_status)+' · '+clean(p.issued_at?new Date(p.issued_at).toLocaleDateString("en-GB"):"Not issued")+'</div></div><div class="amount"><span>Agreed purchase amount</span><strong>'+money(p.purchase_gross_gbp)+'</strong></div><div class="meta"><div class="field"><small>Supplier payments recorded</small><strong>'+money(p.supplier_paid_gbp)+'</strong></div><div class="field"><small>Outstanding supplier balance</small><strong>'+money(p.supplier_balance_due_gbp)+'</strong></div></div><p class="foot">This purchase order documents an agreed purchase amount. It is NOT bank evidence, a supplier VAT invoice or proof that the purchase was paid. Check the original supplier invoice and verified bank payments in AnyBike Accounting HQ. VAT treatment: '+clean(p.vat_treatment_snapshot||"Review required")+'.</p>';document.getElementById("print").disabled=false;}catch(e){root.innerHTML='<p class="error">'+clean(e.message||"Unable to load purchase order")+'</p>';}})();</script></body></html>
